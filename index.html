ish": "tear (drop)"}, {"german": "wissen", "english": "to know"}, {"german": "küssen", "english": "to kiss"}, {"german": "würde", "english": "would (subjunctive)"}, {"german": "haben", "english": "to have (subj.)"}, {"german": "haben", "english": "to have (subj.)"}, {"german": "zurückgeben", "english": "to give back"}, {"german": "der Rumäne", "english": "Romanian (person)"}, {"german": "lächeln", "english": "to smile"}, {"german": "nächste", "english": "next"}, {"german": "sich gewöhnen", "english": "to get used to"}, {"german": "sitzen", "english": "to sit"}, {"german": "die Großmutter", "english": "grandmother"}, {"german": "glänzen", "english": "to shine / gleam"}], "shadow": ["Business transfer German — formal register:", "Hiermit uebergebe ich Ihnen die Verantwortung fuer das Café Morgenlicht. — I hereby transfer to you the responsibility for Café Morgenlicht.", "Der Mietvertrag wird auf Ihren Namen umgeschrieben. — The lease will be transferred to your name.", "Ich vertraue Ihnen vollstaendig. — I trust you completely.", "Ich vertraue Ihnen vollstaendig uses the formal Sie. When Frau Schmidt says it, she means it — and the Sie is not distance. It is respect.", "---", "Review — Part Four: The First Year (Chapters 22-28)", "Part Four is done. Yves has survived the bad month. Matei has proposed. Frau Schmidt has handed over the café. The Ausbildung continues.", "What You Have Learned", "By now your German should feel less like translation and more like recognition. You are reading, not decoding.", "Vocabulary consolidated through Part Four: der Ausbildungsvertrag, die Probezeit, die Zwischenpruefung, der Rueckschritt, die Niederlage, trotzdem, weitermachen, der Mietvertrag, die Uebergabe.", "Grammar now natural from context: past tense (Praeteritum and Perfekt), subordinate clauses with dass/weil/wenn, reflexive verbs in professional context, passive constructions in formal documents.", "Full German Production Challenge", "Write entirely in German. No English. One paragraph of five sentences. Topic: describe a typical day in Yves's life at this point in the story. Morning, work, evening.", "Do not aim for perfection. Aim for completion. A finished imperfect paragraph is more useful than a perfect unfinished one.", "Formal German Mastery Check", "Translate these without help. These are real sentences from German professional life:", "1. Sehr geehrter Herr Koehler, anbei sende ich Ihnen den abgeschlossenen Bericht.", "2. Die Pruefung wurde erfolgreich bestanden.", "3. Ich bitte um Rueckmeldung bis Freitag.", "4. Hiermit bestatige ich den Erhalt Ihrer E-Mail.", "5. Fuer Rueckfragen stehe ich Ihnen gerne zur Verfuegung.", "Translations: 1. Dear Mr Koehler, please find attached the completed report. 2. The exam was passed successfully. 3. I request feedback by Friday. 4. I hereby confirm receipt of your email. 5. For any questions, I am happy to be of assistance.", "If all five were readable, your formal written German is at professional level. That is what the Ausbildung requires.", "The Proposal", "Matei proposes in Part Four. Write his proposal — in German, in his voice. Short sentences. No elaboration. Says exactly what he means and nothing more.", "There is no wrong answer. There is only: does it sound like Matei?", "Part Five is 95-98% German. The story is almost entirely in German now. You have been learning this language for twenty-eight chapters. You are ready.", "---"]}, {"id": 29, "title": "Die Hochzeit", "scenes": [{"prose": "Sehr klein. Fünf Menschen klein. Mich. Matei. Die Standesbeamtin. Ada. Andreea.\n\n\"Das ist keine Hochzeit,\" sagte Ada. \"Das ist ein Termin.\"\n\n\"Es ist eine Hochzeit,\" sagte ich. \"Eine kleine.\"\n\n\"Eine kleine Hochzeit ist keine Hochzeit. Eine Hochzeit braucht mindestens zwanzig Gäste und einen betrunkenen Onkel.\"\n\n\"Wir haben keinen betrunkenen Onkel.\"\n\n\"Dann bin ich der betrunkene Onkel. Ich habe Sekt getrunken. Im Zug.\"\n\n\"Es ist 10 Uhr morgens.\"\n\nDie Standesbeamtin hieß Frau Dr. Wagner.\n\nSie trug ein oranges Kleid. Orangenernsthaft orange. Die Sorte Orange, die man im Dunkeln sehen kann.\n\n\"Das Kleid ist laut,\" flüsterte Matei.\n\n\"Das Kleid ist eine Aussage,\" flüsterte ich zurück.\n\n\"Die Aussage ist: Ich bin hier und ich bin orange.\"\n\nFrau Dr. Wagner lächelte. Sie hatte ein freundliches Gesicht. Die Sorte Gesicht, die einen nicht verurteilt, wenn man vor Nervosität den Ring fallen lässt.\n\n\"Scheiße,\" sagte ich.\n\n\"Das ist nicht Teil der Zeremonie,\" sagte Frau Dr. Wagner.\n\n\"Es ist Teil meiner Persönlichkeit.\"\n\n\"Dann sind Sie hier richtig.\"\n\nMatei hob den Ring auf. Seine Hände zitterten nicht. Meine Hände zitterten wie ein Espresso mit zu viel Koffein.\n\n\"Bist du nervös?\" fragte er.\n\n\"Ich bin nicht nervös. Ich habe Angst.\"\n\n\"Das ist dasselbe.\"\n\n\"Nein. Nervös ist, wenn man denkt, man könnte etwas falsch machen. Angst ist, wenn man weiß, dass man etwas falsch machen wird.\"\n\n\"Du wirst nichts falsch machen.\"\n\n\"Ich habe gerade den Ring fallen lassen.\"\n\n\"Das war vor der Zeremonie. Das zählt nicht.\"\n\n\"Woher weißt du das?\"\n\n\"Ich habe gegoogelt. 'Ring fallen lassen vor der Hochzeit' — das ist kein Problem. Erst während der Zeremonie ist es peinlich.\"\n\n\"Du hast 'Ring fallen lassen vor der Hochzeit' gegoogelt?\"\n\n\"Ja. Ich war auch nervös.\"\n\nFrau Dr. Wagner sprach auf Deutsch. Schönes Deutsch. Klares Deutsch. Deutsch, das ich verstehen konnte.\n\n\"Liebe Gemeinde, wir sind heute hier zusammengekommen, um die Ehe zwischen Yves Arthur Grey und Matei zu schließen.\"\n\nMatei lächelte. Das echte Lächeln.\n\n\"Du verstehst,\" flüsterte er.\n\n\"Keine Ahnung. Aber jetzt.\"\n\nFrau Dr. Wagner fragte die üblichen Fragen.\n\nOb es Hindernisse gäbe. Ob wir freiwillig heirateten. Ob wir wüssten, was wir taten.\n\n\"Ja,\" sagte ich.\n\n\"Ja,\" sagte Matei.\n\n\"Wissen Sie wirklich, was Sie tun?\" fragte sie noch einmal.\n\n\"Nein,\" sagte ich.\n\n\"Das ist ehrlich,\" sagte sie. \"Das ist gut.\"\n\n\"Ist das nicht normal?\" fragte Matei.\n\n\"Normal ist langweilig. Sie sind nicht langweilig.\"\n\n\"Das ist das netteste Kompliment, das ich je bekommen habe.\"\n\n\"Dann ist heute Ihr Glückstag.\"\n\nDie Ringe wurden getauscht.\n\nDiesmal ließ ich nichts fallen. Matei auch nicht. Wir steckten uns die Ringe an. Silber. Einfach. Perfekt.\n\n\"Mit diesem Ring verbinde ich mein Leben mit deinem,\" sagte Matei.\n\n\"Das hast du aus einem Film.\"\n\n\"Ja. Aber ich meine es ernst.\"\n\n\"Dann ist es okay.\"\n\n\"Ist es romantisch?\"\n\n\"Es ist ehrlich. Dasselbe.\"", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}, {"prose": "Frau Dr. Wagner sprach die letzten Worte.\n\n\"Hiermit erkläre ich Sie rechtmäßig zu Ehemännern.\"\n\n\"Das war's?\" fragte Ada.\n\n\"Das war's,\" sagte Frau Dr. Wagner.\n\n\"Kein Kuss? Keine Konfetti? Keine Tauben?\"\n\n\"Tauben sind nicht erlaubt. Das Standesamt hat eine Tauben-verboten-Politik.\"\n\n\"Das ist die deutscheste Sache, die ich je gehört habe.\"\n\n\"Deshalb leben Sie in Berlin.\"\n\nEs war kein langer Kuss. Kein Filmkuss. Kein Kuss mit Feuerwerk und Streichern. Nur ein Kuss. Zwei Menschen. Ein Versprechen.\n\n\"Das war schön,\" sagte Ada.\n\n\"Das war kurz,\" sagte Andreea.\n\n\"Qualität vor Quantität,\" sagte Matei.\n\n\"Das sagt mein Friseur auch,\" sagte Andreea.\n\n\"Ihr seid alle komisch,\" sagte ich.\n\n\"Wir sind Familie,\" sagte Matei. \"Dasselbe.\"\n\nNach der Zeremonie gingen wir ins Café.\n\nFrau Schmidt hatte gedeckt. Weiße Tischdecke. Blumen. Kerzen. Und ein Kuchen. Ein riesiger Kuchen. Mit drei Stockwerken und einer kleinen Plastikente oben drauf.\n\n\"Ist das Friedrich?\" fragte ich.\n\n\"Das ist eine Plastikente,\" sagte Frau Schmidt. \"Friedrich ist nicht aus Plastik.\"\n\n\"Friedrich hätte kommen können.\"\n\n\"Enten gehören nicht in Cafés. Das ist Hygienevorschrift.\"\n\n\"Du bist unmöglich.\"\n\n\"Ich bin deine ehemalige Chefin. Dasselbe.\"\n\nSchwarzwälder Kirsch. Mit Sahne. Mit Kirschen. Mit so viel Schokolade, dass ich dachte, ich würde sterben. Ein guter Tod.\n\n\"Prost,\" sagte Ada. Sie hob ihr Sektglas.\n\n\"Prost,\" sagte Andreea.\n\n\"Prost,\" sagte Frau Schmidt.\n\n\"Prost,\" sagte Matei.\n\n\"Prost,\" sagte ich.\n\nWir prosteten. Die Gläser klingten. Der Kuchen war süß. Das Leben war süßer.\n\n\"Eine Rede,\" sagte Ada. \"Du hältst eine Rede.\"\n\n\"Ich halte keine Rede.\"\n\n\"Doch. Du bist der Bräutigam. Bräutigame halten Reden.\"\n\n\"Es gibt zwei Bräutigame.\"\n\n\"Dann haltet beide eine Rede.\"\n\nMatei sah mich an. \"Du zuerst.\"\n\n\"Weil du derjenige mit den Worten bist.\"\n\n\"Du hast auch Worte.\"\n\n\"Meine Worte sind kurz. Deine Worte sind lang. Das ist besser für Reden.\"\n\nMeine Hände zitterten. Mein Herz klopfte. Die Kerzen flackerten.\n\n\"Also,\" sagte Ada.\n\n\"Halt die Klappe.\"\n\n\"Das ist keine gute Einleitung.\"\n\n\"Das ist meine Einleitung.\"\n\n\"Vor einem Jahr wusste ich nicht, ob ich in Berlin bleiben würde. Ich wusste nicht, ob ich die Ausbildung schaffen würde. Ich wusste nicht, ob ich überleben würde. Aber ich wusste eines: Matei.\"\n\n\"Ich wusste, dass er Kaffee macht. Schwarz. Kein Zucker. Keine Milch. Perfekt. Ich wusste, dass er sich an alles erinnert. Auch an die peinlichen Sachen. Ich wusste, dass er Geduld hat. Mehr Geduld als jeder Mensch, den ich kenne.\"\n\n\"Das ist wahr,\" sagte Andreea.\n\n\"Halt die Klappe,\" sagte Matei.\n\n\"Das ist deine Familie,\" sagte ich.\n\n\"Das ist mein Problem.\"\n\nIch lachte. Dann wurde ich ernst.\n\n\"Matei. Ich wusste nicht, dass ich bleiben kann. Du hast es mir gezeigt. Nicht mit Worten. Mit Kaffee. Mit Pasteten. Mit einer kleinen Pflanze auf dem Fensterbrett. Mit siebenunddreißig Stufen jeden Tag. Mit dem Schlüssel, den du mir gegeben hast, bevor ich wusste, was er bedeutet.\"\n\n\"Er bedeutet, dass du hier wohnst.\"", "choices": ["Notice the silence between them", "Focus on what is being said"]}, {"prose": "\"Nein. Er bedeutet, dass ich hierher gehöre.\"\n\nIch holte den Schlüssel aus meiner Tasche.\n\nDenselben Schlüssel. Vom ersten Tag.\n\n\"Ich habe ihn immer noch.\"\n\n\"Von deiner Tasche.\"\n\n\"Meine Rede ist kürzer,\" sagte er.\n\n\"Yves. Ich habe nicht viel zu sagen. Aber ich habe eines: Du bist der Grund, warum ich morgens aufstehe. Nicht weil du mich weckst — das tust du nicht. Du schläfst wie ein Stein.\"\n\n\"Das ist nicht wahr.\"\n\n\"Doch. Letzte Woche hast du den Feueralarm verschlafen.\"\n\n\"Der Feueralarm war leise.\"\n\n\"Feueralarme sind nicht leise.\"\n\n\"Dieser war leise.\"\n\n\"Du bist unmöglich.\"\n\n\"Du liebst mich.\"\n\nEr lächelte. Dann wurde er ernst.\n\n\"Yves. Ich liebe dich. Ich liebe deine Art, Tassen fallen zu lassen und dich beim Boden zu entschuldigen. Ich liebe deine schlechte Laune am Morgen. Ich liebe deine guten Laune am Abend. Ich liebe, dass du mit Pflanzen sprichst und Enten Namen gibst.\"\n\n\"Friedrich heißt Friedrich.\"\n\n\"Friedrich heißt Friedrich, weil du verrückt bist.\"\n\n\"Ich will nicht mehr ohne dich sein. Das ist alles.\"\n\nAda weinte. Andreea weinte. Frau Schmidt weinte nicht. Sie lächelte.\n\n\"Das war schön,\" sagte Ada.\n\n\"Das war kitschig,\" sagte Andreea.\n\nWir redeten über nichts und alles.\n\n\"Yves.\" Ada zog mich zur Seite. \"Bist du glücklich?\"\n\n\"Ja. Zum ersten Mal.\"\n\n\"Das ist gut. Das ist sehr gut.\"\n\n\"Wie ist deine Mutter?\"\n\n\"Besser. Die Chemotherapie wirkt.\"\n\n\"Sie schickt dir einen Kuss.\"\n\n\"Ich schicke ihr auch einen Kuss.\"\n\n\"Dann bist du jetzt offiziell Teil der Familie.\"\n\n\"Ich bin schon offiziell Teil einer Familie. Mateis Familie.\"\n\n\"Jetzt bist du in zwei Familien. Das ist doppelt so viel Ärger.\"\n\n\"Dass du meinen Bruder glücklich machst. Das hat niemand geschafft. Nicht Sebastian. Nicht ich. Nicht unsere Eltern. Nur du.\"\n\n\"Das ist nicht wahr.\"\n\n\"Doch. Er lächelt jetzt. Echt. Nicht das Fast-Lächeln.\"\n\n\"Das Fast-Lächeln ist auch süß.\"\n\n\"Das Fast-Lächeln ist traurig. Das echte Lächeln ist schön.\"\n\n\"Dann bin ich froh, dass ich es ihm geben kann.\"\n\n\"Du gibst es ihm jeden Tag. Auch wenn du nervst.\"\n\n\"Besonders dann.\"\n\nAm Abend gingen wir nach Hause.\n\nDie Treppe war siebenunddreißig Stufen. Der Schlüssel klemmte. Die Tür öffnete sich.\n\nDie Wohnung war klein. Der Tisch war voll. Matei Jr. stand auf dem Fensterbrett.\n\n\"Wir sind verheiratet,\" sagte ich.\n\n\"Das fühlt sich nicht anders an.\"\n\n\"Das wird es auch nicht. Nicht sofort.\"\n\n\"Wann fühlt es sich anders an?\"\n\n\"Wenn du morgens aufwachst und deinen Ring siehst. Wenn du 'mein Mann' sagst. Wenn wir uns über Pasteten streiten und du nicht mehr gehen kannst, weil du jetzt rechtlich gebunden bist.\"\n\n\"Das ist eine schlechte Werbung für die Ehe.\"\n\n\"Das ist ehrliche Werbung. Dasselbe.\"\n\nWir setzten uns auf das Sofa.\n\nDie Lampe brannte. Die Heizung klickte. Matei Jr. stand auf dem Fensterbrett. Lebendig. Überlebendig. Urteilend.", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}, {"prose": "\"Ich habe heute alles verstanden. Was die Standesbeamtin gesagt hat. Jedes Wort.\"\n\n\"Weil du nicht gefragt hast, was sie gesagt hat.\"\n\n\"Das ist nicht dasselbe.\"\n\n\"Doch. Früher hast du immer gefragt. 'Was hat sie gesagt?' 'Was bedeutet das?' 'Ist das Deutsch oder ein anderer Planet?' Heute nicht.\"\n\n\"Ich habe 'anderer Planet' nie gesagt.\"\n\n\"Doch. Im zweiten Monat.\"\n\n\"Du erinnerst dich an alles.\"\n\n\"Ich erinnere mich an alles, was du sagst. Besonders die dummen Sachen.\"\n\n\"Das ist creepy.\"\n\n\"Das ist Liebe. Dasselbe.\"\n\nIch legte meinen Kopf auf seine Schulter.\n\n\"Ich bin froh, dass ich geblieben bin.\"\n\n\"Auch wenn es schwer war.\"\n\n\"Besonders dann.\"\n\n\"Was kommt jetzt?\"\n\n\"Jetzt? Jetzt schlafen wir. Morgen gehst du zur Arbeit. Ich gehe zur Arbeit. Wir kaufen ein. Wir kochen. Wir streiten. Wir lachen. Das ist das Leben.\"\n\n\"Das klingt langweilig.\"\n\n\"Das klingt perfekt.\"\n\nEr küsste mich. Sanft. Langsam.\n\n\"Gute Nacht, Ehemann.\"\n\n\"Gute Nacht, Ehemann.\"\n\n\"Das klingt komisch.\"\n\n\"Das klingt richtig.\"\n\nMit den Ringen an den Fingern. Mit dem Schlüssel in der Tasche. Mit der Ente an der Brücke. Mit der Zukunft vor uns.\n\ndie Hochzeit wedding feminine\n\nder Standesbeamte / die Standesbeamtin registrar masculine/feminine\n\ndie Zeremonie ceremony feminine\n\nder Sekt sparkling wine masculine\n\ndie Tischdecke tablecloth feminine\n\ndas Stockwerk floor/story (of building) neuter\n\ndie Hygienevorschrift hygiene regulation feminine\n\nder Schwarzwälder Kirsch Black Forest cherry cake masculine\n\nder Feueralarm fire alarm masculine\n\ndie Chemotherapie chemotherapy feminine\n\nrechtlich gebunden legally bound phrase\n\ndie Werbung advertisement/advertising feminine\n\nFrom this chapter: \"Wir prosteten\" (we clinked glasses) — not reflexive, but sich setzen, sich freuen, etc. appear.\n\nMany reflexive verbs use the dative reflexive pronoun (sich) in past tense with haben.\n\nCommon reflexive verbs in past tense:\n\nInfinitive Past (Perfekt) Meaning\n\nsich setzen er hat sich gesetzt he sat down\n\nsich freuen wir haben uns gefreut we were happy\n\nsich erinnern ich habe mich erinnert I remembered\n\nsich beeilen du hast dich beeilt you hurried\n\nsich kümmern sie hat sich gekümmert she took care\n\nExamples from this chapter (adapted):\n\nWe sat down at the table. Wir haben uns an den Tisch gesetzt.\n\nI remembered everything. Ich habe mich an alles erinnert.\n\nShe took care of the café. Sie hat sich um das Café gekümmert.\n\nWhy this matters: Reflexive verbs are extremely common in spoken German. Recognizing the reflexive pronoun (mich, dich, sich, uns, euch) helps you identify them even in past tense.\n\nTip from the method: The reflexive pronoun reflects the subject. Ich → mich, du → dich, er/sie/es → sich, wir → uns, ihr → euch.", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}], "gate": {"clue": "What is the German word for \"second year of apprenticeship\"?", "answer": "zweite lehrjahr", "hint": "das zweite Lehrjahr"}, "vocab": [{"german": "die Hochzeit", "english": "wedding"}, {"german": "der Standesbeamte", "english": "/ die Standesbeamtin registrar masculine/"}, {"german": "die Zeremonie", "english": "ceremony"}, {"german": "der Sekt", "english": "sparkling wine"}, {"german": "die Tischdecke", "english": "tablecloth"}, {"german": "das Stockwerk", "english": "floor/story (of building)"}, {"german": "die Hygienevorschrift", "english": "hygiene regulation"}, {"german": "der Schwarzwälder", "english": "Kirsch Black Forest cherry cake"}, {"german": "der Feueralarm", "english": "fire alarm"}, {"german": "die Chemotherapie", "english": "chemotherapy"}, {"german": "rechtlich", "english": "gebunden legally bound"}, {"german": "die Werbung", "english": "advertisement/advertising"}, {"german": "sehr", "english": "very"}, {"german": "klein", "english": "small"}, {"german": "wenn", "english": "when / if"}, {"german": "nervös", "english": "nervous"}, {"german": "auch", "english": "also / too"}, {"german": "heute", "english": "today"}, {"german": "aber", "english": "but"}, {"german": "jetzt", "english": "now"}, {"german": "die Frage", "english": "question"}, {"german": "wirklich", "english": "really"}, {"german": "noch", "english": "still / yet"}, {"german": "gut", "english": "good"}, {"german": "einfach", "english": "simple / just"}, {"german": "perfekt", "english": "perfect"}, {"german": "schön", "english": "beautiful / nice"}, {"german": "weil", "english": "because"}, {"german": "gut", "english": "good"}, {"german": "sich", "english": "(reflexive pronoun)"}, {"german": "der Schlüssel", "english": "key"}, {"german": "immer", "english": "always"}, {"german": "warum", "english": "why"}, {"german": "sich entschuldigen", "english": "to apologize"}, {"german": "der Morgen", "english": "morning"}, {"german": "gut", "english": "good"}, {"german": "die Wohnung", " Du bist unmöglich.\"\n\n\"Du liebst mich.\"\n\nDer zweite Jahr war anders als der erste.\n\nNicht leichter. Aber anders. Ich wusste jetzt, wo die Kaffeemaschine war. Ich wusste, welche Kollegen morgens redeten und welche schwiegen. Ich wusste, dass Herr Weber Dienstag immer schlechte Laune hatte — weil Dienstag der Tag war, an dem Gisela ihre Backups machte und das System langsam wurde.\n\n\"Du kennst Giselas Rhythmus,\" sagte Herr Weber.\n\n\"Gisela ist eine Tastatur.\"\n\n\"Gisela ist mehr als eine Tastatur. Gisela ist ein Lebensgefühl.\"\n\n\"Sie haben zu viel Kaffee getrunken.\"\n\n\"Ich habe genau richtig Kaffee getrunken. Jetzt hilf mir, den Drucker zu reparieren.\"\n\nDer Drucker war ein alter HP. Aus dem Jahr 2012. Er hatte Papierstau, Fehlermeldungen und eine seltsame Vorliebe für grüne Linien auf allen Ausdrucken.\n\n\"Das ist kein Drucker. Das ist ein Patient.\"\n\n\"Dann bist du der Arzt. Heile ihn.\"\n\n\"Ich bin ITler, kein Arzt.\"\n\n\"ITler sind Ärzte für Maschinen. Dasselbe.\"\n\nIch reparierte den Drucker. Es dauerte zwei Stunden. Meine Hände waren voller Toner. Meine Stirn war nass. Aber der Drucker funktionierte.\n\n\"Gut,\" sagte Herr Weber.\n\n\"Der Drucker funktioniert. Das ist sehr gut. Aber ich sage nicht 'sehr gut'. Das wäre unprofessionell.\"\n\n\"Sie sind unprofessionell.\"\n\n\"Ich bin authentisch. Dasselbe.\"\n\nMira war im zweiten Lehrjahr auch anders.\n\nSie hatte ihre Haare kurz geschnitten. Sehr kurz. Fast Glatze.\n\n\"Deine Haare,\" sagte ich.\n\n\"Meine Haare sind weg.\"\n\n\"Weil ich Bock hatte. Braucht man einen anderen Grund?\"\n\n\"Gut. Dann hilf mir bei VLANs. Ich checke es nicht.\"\n\n\"Du checkst nichts.\"\n\n\"Ich checke Kaffee. Und Menschen. Aber nicht VLANs.\"\n\nWir lernten zusammen. Sie war chaotisch, aber sie war gut. Besser als ich in manchen Dingen. Schlechter in anderen. Zusammen waren wir fast kompetent.\n\n\"Wir sind ein gutes Team,\" sagte sie.\n\n\"Wir sind ein okay Team.\"\n\n\"Okay ist genug.\"\n\nDie Berufsschule war anders.\n\nFatima war jetzt im dritten Lehrjahr. Sie trug immer noch denselben Pullover mit dem Loch. Aber sie lächelte mehr.\n\n\"Du lächelst mehr,\" sagte ich.\n\n\"Ich habe einen Freund.\"\n\n\"Das ist der Grund?\"\n\n\"Das ist der Grund. Liebe macht lächeln. Auch wenn der Freund komisch ist.\"\n\n\"Er sammelt Briefmarken. Das ist nicht komisch. Das ist speziell.\"\n\n\"Briefmarken sind nicht speziell.\"", "choices": ["Notice the silence between them", "Focus on what is being said"]}, {"prose": "\"Er hat eine Briefmarke mit einem Hund. Der Hund trägt eine Brille.\"\n\n\"Das ist speziell.\"\n\nKofi war auch da. Sein Deutsch war besser geworden. Fast akzentfrei.\n\n\"Du klingst wie ein Deutscher,\" sagte ich.\n\n\"Das ist eine Beleidigung.\"\n\n\"Das ist ein Kompliment.\"\n\nDer zweite Lehrjahr hatte neue Fächer.\n\nDatenbanken. SQL. Komplexe Abfragen. Ich hasste es am Anfang.\n\n\"Warum muss ich das lernen?\" fragte ich Herrn Weber.\n\n\"Weil Datenbanken das Rückgrat der IT sind.\"\n\n\"Das Rückgrat ist langweilig.\"\n\n\"Ohne Rückgrat kannst du nicht stehen.\"\n\n\"Ich will nicht stehen. Ich will sitzen. Am Schreibtisch. Mit Kaffee.\"\n\n\"Dann lern SQL. Oder du wirst für immer der Azubi sein, der keinen Kaffee verdient hat.\"\n\n\"Das ist nicht fair.\"\n\n\"Das ist Motivation. Dasselbe.\"\n\nMit Matei. Abends. Am Küchentisch.\n\n\"SELECT * FROM Kaffee WHERE Sorte = 'Aprikose',\" sagte Matei.\n\n\"Das ist kein SQL. Das ist Unsinn.\"\n\n\"Es ist SQL für Pasteten.\"\n\n\"SQL ist für Datenbanken. Nicht für Pasteten.\"\n\n\"Dann erfinde ich eine neue Sprache. Pasteten-SQL.\"\n\n\"Du erfindest zu viel.\"\n\n\"Ich erfinde genau richtig. Jetzt hilf mir.\"\n\nEr half mir. Nicht mit SQL. Mit Geduld. Mit Kaffee. Mit Pasteten, die er nicht versteckte.\n\n\"Warum versteckst du die Pasteten nicht?\" fragte ich.\n\n\"Weil du verheiratet bist. Verheiratete bekommen Pasteten ohne Versteck.\"\n\n\"Das ist nicht im Ehevertrag.\"\n\n\"Doch. Kleingedrucktes. Seite 47.\"\n\n\"Du bist unmöglich.\"\n\n\"Du liebst mich.\"\n\nIm zweiten Lehrjahr machte ich weniger Fehler.\n\nNicht keine Fehler. Aber weniger. Einmal löschte ich die falsche Datenbank. Nur eine Testdatenbank. Aber trotzdem.\n\n\"Das war dumm,\" sagte Herr Weber.\n\n\"Das war ein Unfall.\"\n\n\"Unfälle sind dumm. Dasselbe.\"\n\n\"Haben Sie früher auch Fehler gemacht?\"\n\n\"Ja. Viele. Ich habe einmal das gesamte Netzwerk gelöscht. An einem Freitag. Um 16 Uhr.\"\n\n\"Das ist schlimmer als meine Fehler.\"\n\n\"Ja. Aber ich habe daraus gelernt. Und du lernst auch.\"\n\n\"Jetzt. In diesem Moment. Die Lektion ist: Backups sind wichtig. Sehr wichtig. Wichtiger als Kaffee.\"\n\n\"Nichts ist wichtiger als Kaffee.\"\n\n\"Backups sind wichtiger.\"\n\n\"Sie sind kein guter Rumäne.\"\n\n\"Ich bin Deutscher. Rumänen sind meine Nachbarn.\"\n\n\"Sie sind komisch.\"\n\n\"Ich bin praktisch. Dasselbe.\"\n\nEines Abends im zweiten Lehrjahr saß ich auf der Brücke.\n\nFriedrich war da. Paddelte. Schwamm im Kreis.\n\n\"Ich glaube, ich werde gut in diesem Job.\"\n\n\"Nicht perfekt. Aber gut.\"\n\nFriedrich quakte ein drittes Mal.", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}, {"prose": "\"Du hast recht. Gut ist genug.\"\n\nKomm nach Hause. Ich habe Pasta gekocht.\n\nDeine. Die Großmutter hat mir das Rezept endlich richtig erklärt.\n\nPer E-Mail. Sie hat einen Computer.\n\nMeine Großmutter hat einen Computer?\n\nDas ist das Deutscheste, was ich je gehört habe.\n\nDie Treppe war siebenunddreißig Stufen. Der Schlüssel klemmte nicht mehr. Frau Schmidt hatte ihn ölen lassen. Heimlich.\n\n\"Der Schlüssel klemmt nicht mehr.\"\n\n\"Du hast ihn ölen lassen?\"\n\n\"Frau Schmidt hat ihn ölen lassen. Ich habe sie darum gebeten.\"\n\n\"Du hast meine Großmutter kontaktiert, um ein Rezept zu bekommen, und Frau Schmidt, um meinen Schlüssel zu ölen?\"\n\n\"Ja. Das nennt sich Netzwerken.\"\n\n\"Das nennt sich Einmischung.\"\n\nNicht perfekt wie meine. Aber perfekt auf seine Weise.\n\n\"Du wirst besser,\" sagte ich.\n\n\"Ich habe eine gute Lehrerin.\"\n\n\"Meine Großmutter ist keine gute Lehrerin. Sie schreit.\"\n\n\"Sie schreit nicht. Sie spricht laut. Das ist Leidenschaft.\"\n\n\"Das hat Herr Weber auch gesagt.\"\n\n\"Herr Weber ist ein weiser Mann.\"\n\n\"Herr Weber ist ein seltsamer Mann.\"\n\nNach dem Essen saßen wir auf dem Sofa.\n\nDie Lampe brannte. Die Heizung klickte. Matei Jr. war größer geworden. Er hatte neue Blätter. Kleine. Grüne.\n\n\"Die Pflanze wächst.\"\n\n\"Sie wächst, weil du sie nicht mehr anfasst.\"\n\n\"Ich habe sie nie angefasst.\"\n\n\"Doch. Jeden Tag. Du hast gesagt 'Guten Morgen, Matei Jr.' Du hast ihn gestreichelt.\"\n\n\"Pflanzen mögen Streicheln.\"\n\n\"Pflanzen mögen Wasser. Nicht Streicheln.\"\n\n\"Meine Pflanze mag Streicheln.\"\n\n\"Es ist meine Pflanze. Ich habe sie gekauft.\"\n\n\"Wir sind verheiratet. Deine Pflanze ist meine Pflanze.\"\n\n\"Das ist nicht im Ehevertrag.\"\n\n\"Doch. Kleingedrucktes. Seite 23.\"\n\n\"Du erfindest Seiten.\"\n\n\"Ich erfinde Fakten. Dasselbe.\"\n\nIn der zweiten Jahreshälfte bekam ich mehr Verantwortung.\n\nHerr Weber ließ mich allein am Kundensupport. Erste Ebene. Passwort zurücksetzen. Drucker neustarten. Die einfachen Dinge.\n\n\"Sie sind bereit,\" sagte er.\n\n\"Ich bin nicht bereit.\"\n\n\"Bereit sein ist eine Lüge. Sie sind so bereit wie nie zuvor.\"\n\n\"Das ist keine gute Antwort.\"\n\n\"Es ist die einzige Antwort, die ich habe.\"\n\nEin Kunde rief an. Seine E-Mail funktionierte nicht. Ich half ihm. Es dauerte fünf Minuten.\n\n\"Danke, junger Mann,\" sagte der Kunde.\n\n\"Sie sprechen gut Deutsch. Woher kommen Sie?\"\n\n\"Aus Lagos. Nigeria.\"\n\n\"Ah. Schönes Land. Ich war einmal dort. 1998.\"\n\n\"Heiß. Und chaotisch. Wie Berlin.\"\n\nEr lachte. Ich lachte. Herr Weber nickte.\n\n\"Sie haben gelächelt,\" sagte er nach dem Anruf.\n\n\"Kunden lächeln zurück, wenn man lächelt.\"", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}, {"prose": "\"Das ist nicht im Handbuch.\"\n\n\"Ich bin nicht im Handbuch. Ich bin ich.\"\n\n\"Das ist gut. Bleiben Sie so.\"\n\nAm Ende des zweiten Lehrjahres hatte ich eine Erkenntnis.\n\nIch saß auf dem Sofa. Matei las ein Buch. Matei Jr. stand auf dem Fensterbrett.\n\n\"Ich habe heute nicht ans Weglaufen gedacht.\"\n\n\"Ich habe auch nicht an Lagos gedacht.\"\n\n\"Das ist auch gut.\"\n\n\"Ich habe an morgen gedacht. An die Arbeit. An den Kaffee. An dich.\"\n\n\"Das ist sehr langweilig.\"\n\n\"Das ist normal. Normale Menschen denken an morgen.\"\n\n\"Du bist kein normaler Mensch.\"\n\n\"Doch. Jetzt schon.\"\n\nEr legte sein Buch weg. Sah mich an. Die grauen Augen waren warm.\n\n\"Bist du glücklich?\"\n\n\"Ja. Zum ersten Mal.\"\n\n\"Das ist genug.\"\n\nIn dieser Nacht träumte ich nicht von Lagos.\n\nIch träumte von Berlin. Von der Brücke. Von Friedrich. Vom Café. Von Matei.\n\nIch wachte auf. Der Ring war an meinem Finger. Der Schlüssel war in meiner Tasche. Matei atmete neben mir.\n\n\"Guten Morgen, Ehemann,\" flüsterte ich.\n\n\"Guten Morgen, Ehemann,\" flüsterte er zurück. Ohne die Augen zu öffnen.\n\n\"Ich träume. Von dir.\"\n\n\"Das ist kitschig.\"\n\n\"Ich bin kitschig. Das ist mein Charme.\"\n\n\"Du hast keinen Charme.\"\n\n\"Doch. Du siehst ihn nur nicht, weil du zu nah dran bist.\"\n\n\"Dann komm näher.\"\n\ndas Lehrjahr year of apprenticeship neuter\n\ndie Fanfare fanfare feminine\n\nder Papierstau paper jam masculine\n\ndie Fehlermeldung error message feminine\n\nauthentisch authentic adjective\n\ndie Briefmarke postage stamp feminine\n\ndie Datenbank database feminine\n\ndie Abfrage query feminine\n\ndas Rückgrat backbone/spine neuter\n\nder Ehevertrag marriage contract masculine\n\ndie Einmischung interference/meddling feminine\n\nstreicheln to pet/stroke verb\n\nFrom this chapter: \"Herr Weber ließ mich allein am Kundensupport\" (Herr Weber let me work customer support alone).\n\nLassen has multiple meanings: to let, to allow, to have something done (causative).\n\nMeaning Example Translation\n\nto let/allow Er ließ mich gehen. He let me go.\n\nto have something done (causative) Ich ließ den Schlüssel ölen. I had the key oiled.\n\nto leave (something somewhere) Ich ließ den Kaffee stehen. I left the coffee standing.\n\nExamples from this chapter (adapted):\n\nHe let me work alone. Er ließ mich allein arbeiten.\n\nI had the key oiled. Ich ließ den Schlüssel ölen.\n\nLeave the plant alone. Lass die Pflanze in Ruhe.\n\nWhy this matters: Lassen is extremely common in spoken German. Recognizing it helps you understand when someone is allowing, causing, or leaving something.\n\nTip from the method: Lassen + infinitive = causative (having something done). Lassen + object = letting/allowing.", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}], "gate": {"clue": "What is the German word for \"phone call (review)\"?", "answer": "anruf", "hint": "der Anruf"}, "vocab": [{"german": "das Lehrjahr", "english": "year of apprenticeship"}, {"german": "die Fanfare", "english": "fanfare"}, {"german": "der Papierstau", "english": "paper jam"}, {"german": "die Fehlermeldung", "english": "error message"}, {"german": "der Toner", "english": "toner"}, {"german": "authentisch", "english": "authentic"}, {"german": "die Briefmarke", "english": "postage stamp"}, {"german": "die Datenbank", "english": "database"}, {"german": "die Abfrage", "english": "query"}, {"german": "das Rückgrat", "english": "backbone/spine"}, {"german": "der Ehevertrag", "english": "marriage contract"}, {"german": "die Einmischung", "english": "interference/meddling"}, {"german": "ölen", "english": "to oil"}, {"german": "streicheln", "english": "to pet/stroke"}, {"german": "weil", "english": "because"}, {"german": "gut", "english": "good"}, {"german": "der Morgen", "english": "morning"}, {"german": "aber", "english": "but"}, {"german": "jetzt", "english": "now"}, {"german": "immer", "english": "always"}, {"german": "sehr", "english": "very"}, glish": "leaf / page"}, {"german": "wachsen", "english": "to grow"}, {"german": "schön", "english": "beautiful"}, {"german": "lächeln", "english": "to smile"}, {"german": "lächeln", "english": "to smile"}, {"german": "träumen", "english": "to dream"}, {"german": "flüstern", "english": "to whisper"}, {"german": "der Traum", "english": "dream"}, {"german": "nah", "english": "closer"}], "shadow": ["Second-year Ausbildung German — professional register:", "Ich habe inzwischen mehr Erfahrung mit diesem System. — I now have more experience with this system.", "Darf ich das selbststaendig bearbeiten? — May I handle that independently?", "Ich habe das bereits in der Praxis angewandt. — I have already applied this in practice.", "Selbststaendig — independently — is one of the key words of the second Lehrjahr. It means you no longer need to be watched to do good work. That is the goal."]}, {"id": 31, "title": "Der Anruf", "scenes": [{"prose": "Das Telefon klingelte an einem Dienstagabend.\n\nIch saß auf dem Sofa. Matei las ein Buch. Matei Jr. stand auf dem Fensterbrett. Die Lampe brannte. Die Heizung klickte. Alles war normal.\n\nLändercode Nigeria. Das Festnetz meiner Großmutter.\n\n\"Oh,\" sagte ich.\n\n\"Was ist 'oh'?\" fragte Matei.\n\n\"Meine Großmutter.\"\n\n\"Rufst du zurück?\"\n\n\"Sie hat angerufen. Sie ruft nie an. Ich rufe sie an.\"\n\n\"Das ist ein Unterschied.\"\n\n\"Willst du, dass ich gehe?\"\n\n\"Bist du sicher?\"\n\n\"Ja. Du bist mein Ehemann. Ehemänner bleiben bei schlechten Nachrichten.\"\n\n\"Das steht nicht im Ehevertrag.\"\n\n\"Doch. Seite 12.\"\n\n\"Du erfindest Seiten.\"\n\n\"Ich erfinde Trost. Dasselbe.\"\n\nIch drückte die grüne Taste.\n\nIhre Stimme war trocken. Alt. Aber anders als sonst. Leiser. Dünner.\n\n\"Hallo, Großmutter.\"\n\n\"Du hast nicht zurückgerufen.\"\n\n\"Ich hatte viel Arbeit.\"\n\n\"Arbeit ist keine Ausrede.\"\n\n\"Was ist eine Ausrede?\"\n\n\"Das Alter. Das ist die einzige gute Ausrede.\"\n\n\"Bist du... okay?\"\n\n\"Ich sterbe, Lucky.\"\n\nDie Wörter hingen in der Luft. Schwer. Dunkel.\n\n\"Ich sterbe. Nicht heute. Nicht morgen. Aber bald. Der Arzt sagt, vielleicht noch ein Jahr. Vielleicht weniger.\"\n\n\"Warum hast du nichts gesagt?\"\n\n\"Ich sage jetzt etwas.\"\n\n\"Das ist zu spät.\"\n\n\"Es ist nicht zu spät. Es ist genau richtig. Ich wollte nicht, dass du aus Mitleid kommst.\"\n\n\"Ich würde nicht aus Mitleid kommen.\"\n\n\"Doch. Du bist ein guter Mensch. Gute Menschen kommen aus Mitleid.\"\n\n\"Das ist nicht wahr.\"\n\n\"Doch. Ich kenne dich. Du bist mein Enkel.\"\n\n\"Dein Enkel heißt Yves.\"\n\n\"Mein Enkel heißt Lucky. Für mich. Das ist mein Recht.\"\n\n\"Das ist nicht —\"\n\n\"Lass mich ausreden.\"\n\n\"Ich habe Fehler gemacht,\" sagte sie.\n\n\"Ja. Viele. Ich war hart zu dir. Zu hart. Ich dachte, ich mache dich stark. Aber ich habe dich nur einsam gemacht.\"\n\n\"Das ist nicht —\"\n\n\"Lass mich ausreden.\"\n\nSie hustete. Trocken. Schmerzhaft.\n\n\"Ich liebe dich, Lucky. Das habe ich nie gesagt. Aber ich liebe dich. Seit dem ersten Tag. Seit du geschrien hast, als du aus mir rauskamst. Du warst laut. Sehr laut. Ich wusste, dass du besonders bist.\"\n\n\"Besonders laut.\"\n\n\"Besonders alles.\"\n\n\"Das ist kein Kompliment.\"\n\n\"Es ist ein Kompliment von mir. Das ist dasselbe.\"\n\n\"Was willst du?\" fragte ich.\n\n\"Jeder will etwas.\"\n\n\"Ich will, dass du weißt, dass ich stolz bin.\"\n\n\"Du warst noch nie stolz auf mich.\"\n\n\"Doch. Ich habe es nur nicht gesagt. Als du die Ausbildung bekommen hast. Als du Matei geheiratet hast. Als du geblieben bist. Ich war stolz. Ich habe nur geschwiegen.\"\n\n\"Weil ich nicht wusste, wie man es sagt. Meine Mutter hat es mir nie beigebracht. Und ihre Mutter hat es ihr nie beigebracht. Es ist eine Krankheit. Die Schweigekrankheit.\"\n\n\"Das gibt es nicht.\"\n\n\"Bei uns schon. In unserer Familie.\"\n\n\"Das ist traurig.\"\n\n\"Das ist Leben. Jetzt hör zu.\"\n\n\"Ich möchte, dass du nach Hause kommst. Einmal. Bevor ich gehe.\"\n\n\"Ich kann nicht.\"\n\n\"Du kannst. Du willst nicht.\"\n\n\"Das ist nicht fair.\"\n\n\"Das Leben ist nicht fair. Das weißt du.\"\n\n\"Ich habe eine Ausbildung. Ich habe einen Job. Ich habe einen Ehemann.\"", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}, {"prose": "\"Dann bring ihn mit. Der Rumäne. Ich will ihn kennenlernen. Bevor ich sterbe.\"\n\n\"Du hast gesagt, du stirbst nicht heute.\"\n\n\"Aber irgendwann. Vielleicht bald. Ich bin alt, Lucky. Alte Menschen sterben. Das ist normal.\"\n\n\"Das ist nicht normal. Das ist traurig.\"\n\n\"Traurig ist normal. Jetzt sag mir, ob du kommst.\"\n\n\"Ich komme. Nicht jetzt. Aber bald.\"\n\n\"Bald ist nicht gut.\"\n\n\"Bald ist das Beste, was ich geben kann.\"\n\n\"Dann ist es genug.\"\n\n\"Ich liebe dich auch.\"\n\n\"Das hast du noch nie gesagt.\"\n\n\"Ich wusste nicht, wie man es sagt. Die Schweigekrankheit.\"\n\n\"Du hast sie geerbt.\"\n\n\"Ich arbeite daran.\"\n\n\"Gut. Jetzt schick mir Geld. Ich brauche eine neue Brille.\"\n\n\"Das ist nicht —\"\n\n\"Ich bin deine Großmutter. Ich darf um Geld bitten. Das ist mein Recht.\"\n\n\"Du bist unmöglich.\"\n\n\"Ich bin alt. Dasselbe.\"\n\nIch starrte auf das Telefon.\n\n\"Yves.\" Mateis Stimme war leise.\n\n\"Das hat sie gesagt.\"\n\n\"Sie will, dass ich komme.\"\n\n\"Dann geh nicht.\"\n\n\"Aber sie ist meine Großmutter.\"\n\n\"Das ist keine Verpflichtung.\"\n\n\"Doch. Familie ist eine Verpflichtung.\"\n\n\"Familie ist eine Wahl. Du hast mich gewählt. Du kannst sie auch wählen. Oder nicht. Beides ist okay.\"\n\n\"Das ist nicht hilfreich.\"\n\n\"Ich bin nicht hilfreich. Ich bin ehrlich.\"\n\nIch legte mich auf das Sofa.\n\nMatei legte seinen Arm um mich.\n\n\"Was denkst du?\" fragte er.\n\n\"Ich denke, dass sie recht hat.\"\n\n\"Dass ich weggelaufen bin. Dass ich nicht zurückgeschaut habe. Dass ich sie allein gelassen habe.\"\n\n\"Du hast dich selbst gerettet. Das ist nicht dasselbe wie weglaufen.\"\n\n\"Es fühlt sich gleich an.\"\n\n\"Gefühle lügen.\"\n\n\"Woher weißt du das?\"\n\n\"Weil ich auch Schuldgefühle habe. Wegen Andreea. Wegen meiner Eltern. Wegen Sebastian.\"\n\n\"Du hast nichts falsch gemacht.\"\n\n\"Das weiß ich. Aber die Gefühle sind trotzdem da.\"\n\n\"Was machen wir damit?\"\n\n\"Wir fühlen sie. Und dann lassen wir sie gehen.\"\n\n\"Das ist sehr therapeutisch.\"\n\n\"Ich bin sehr therapeutisch. Ich bin Rumäne.\"\n\n\"Rumänen sind nicht therapeutisch.\"\n\n\"Dieser Rumäne schon.\"\n\nAm nächsten Morgen schickte ich Geld.\n\nNicht viel. Aber genug für eine Brille. Und für ein bisschen mehr.\n\n\"Du hast Geld geschickt,\" sagte Matei.\n\n\"Fühlst du dich besser?\"\n\n\"Fühlst du dich schlechter?\"\n\n\"Was fühlst du?\"\n\n\"Nichts. Und alles. Gleichzeitig.\"\n\n\"Das ist normal. Bei Familie.\"\n\n\"Familie ist komisch.\"\n\n\"Familie ist Familie. Dasselbe.\"\n\nEine Woche später rief meine Großmutter wieder an.\n\n\"Das Geld ist da.\"\n\n\"Die Brille ist gekauft.\"\n\n\"Sieht gut aus?\"\n\n\"Die Brille sieht gut aus. Mein Gesicht sieht alt aus. Das ist nicht die Schuld der Brille.\"\n\n\"Du siehst gut aus.\"\n\n\"Ich lerne von dir.\"\n\nSie lachte. Ein trockenes Lachen. Aber ein Lachen.", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}, {"prose": "\"Dass du nicht gekommen bist.\"\n\n\"Das ist eine seltsame Sache, wofür man dankt.\"\n\n\"Nein. Wenn du gekommen wärst, wärst du aus Mitleid gekommen. Das wollte ich nicht. Jetzt weiß ich, dass du bleibst, weil du bleiben willst. Nicht weil ich sterbe.\"\n\n\"Das ist sehr weise.\"\n\n\"Ich bin sehr weise. Ich bin alt.\"\n\n\"Das ist keine Qualifikation.\"\n\n\"Doch. Frag jeden alten Menschen.\"\n\n\"Wann kommst du wirklich?\" fragte sie.\n\n\"Nach der Ausbildung. In einem Jahr.\"\n\n\"Ein Jahr ist lang.\"\n\n\"Ein Jahr ist kurz.\"\n\n\"Für dich. Für mich ist es lang.\"\n\n\"Dann beeil dich nicht zu sterben.\"\n\n\"Das ist nicht lustig.\"\n\n\"Es ist ein bisschen lustig.\"\n\nSie lachte wieder. Dann hustete sie.\n\n\"Ich muss auflegen. Die Nachbarin kommt zum Tee.\"\n\n\"Die Nachbarin mit dem toten Hund?\"\n\n\"Eine neue Nachbarin. Mit einem lebendigen Hund. Der Hund heißt Schnitzel.\"\n\n\"Das ist der beste Name.\"\n\n\"Das ist ein deutscher Name.\"\n\n\"Berlin beeinflusst alles.\"\n\n\"Dann beeinfluss mich. Schick mir ein Foto von der Ente.\"\n\n\"Wie heißt die Ente?\"\n\n\"Das ist ein deutscher Name.\"\n\n\"Berlin beeinflusst alles.\"\n\nFriedrich war da. Paddelte. Schwamm im Kreis.\n\n\"Friedrich, meine Großmutter will ein Foto von dir.\"\n\n\"Ja, ich weiß. Es ist seltsam.\"\n\n\"Sie hat gesagt, du siehst deutsch aus.\"\n\nFriedrich quakte ein drittes Mal.\n\n\"Du hast recht. Das ist ein Kompliment.\"\n\nIch machte ein Foto. Schickte es ihr.\n\nEine Minute später kam ihre Antwort: Die Ente sieht klüger aus als die meisten Menschen, die ich kenne.\n\n\"Das war ein Kompliment,\" sagte ich zu Matei am Abend.\n\n\"Von deiner Großmutter?\"\n\n\"Dann bist du jetzt der Zweite. Nach der Ente.\"\n\n\"Das ist nicht lustig.\"\n\n\"Es ist ein bisschen lustig.\"\n\n\"Du bist unmöglich.\"\n\n\"Du liebst mich.\"\n\nIn der Nacht träumte ich von Lagos.\n\nVon dem alten Haus. Von dem Hof. Von der Großmutter, die in der Küche stand und Pasta kochte. Meine Großmutter kochte keine Pasta. Sie kochte Suppe. Aber im Traum kochte sie Pasta.\n\n\"Du musst lernen, Lucky,\" sagte sie im Traum.\n\n\"Was muss ich lernen?\"\n\n\"Dass Liebe nicht perfekt sein muss. Dass Familie nicht perfekt sein muss. Dass du nicht perfekt sein musst.\"\n\n\"Dann weißt du alles, was wichtig ist.\"\n\nSie lächelte. Ihr Lächeln war jung. Nicht alt. Jung.\n\nMatei schlief neben mir. Seine Hand lag auf meiner Brust. Sein Atem war ruhig.\n\n\"Ich liebe dich,\" flüsterte ich.\n\n\"Ich weiß,\" flüsterte er zurück. Im Schlaf.\n\nAm nächsten Morgen rief ich meine Großmutter nicht an.\n\nAber ich schickte ihr eine Nachricht. Über WhatsApp. Sie hatte WhatsApp. Die Nachbarin hatte es ihr eingerichtet.\n\nIhre Antwort kam eine Minute später: Ich denk auch an dich. Lucky.\n\n\"Sie hat 'Lucky' geschrieben,\" sagte ich zu Matei.\n\n\"Das ist dein Name. Für sie.\"\n\n\"Stört es dich?\"\n\n\"Gewöhn dich dran. Sie wird sich nicht ändern.\"\n\n\"Aber du kannst dich ändern. Du kannst akzeptieren, dass sie dich so nennt. Das ist kein Verrat.\"\n\n\"Das ist sehr weise.\"\n\n\"Ich bin sehr weise. Ich habe eine Freundin in Ohio.\"\n\n\"Du hast keine Freundin in Ohio.\"\n\n\"Doch. Sie heißt Gisela.\"\n\n\"Gisela ist eine Tastatur.\"\n\n\"Gisela ist eine Freundin. Dasselbe.\"\n\nIn den nächsten Wochen rief meine Großmutter öfter an.", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}, {"prose": "Nicht jeden Tag. Aber oft. Wir redeten über nichts. Über das Wetter. Über den Hund Schnitzel. Über die Nachbarin, die zu laut fernseh sah.\n\n\"Sie hat eine neue Nachbarin,\" sagte ich zu Matei.\n\n\"Die Nachbarin heißt Frau Dr. Wagner.\"\n\n\"Wie die Standesbeamtin?\"\n\n\"Oder Schicksal.\"\n\n\"Oder ein bisschen von beidem.\"\n\nEinmal sagte meine Großmutter etwas, das ich nicht vergessen werde.\n\n\"Ich bin froh, dass du nicht gekommen bist.\"\n\n\"Das hast du schon gesagt.\"\n\n\"Ich sage es noch einmal. Weil es wichtig ist. Wenn du gekommen wärst, hätte ich geweint. Und ich weine nie.\"\n\n\"Doch. Bei Beerdigungen.\"\n\n\"Das sind keine Tränen. Das ist Regen.\"\n\n\"Es war nicht regen.\"\n\n\"Dann war es Staub.\"\n\n\"Du bist unmöglich.\"\n\n\"Ich bin deine Großmutter. Dasselbe.\"\n\nAm Ende des Gesprächs sagte sie: \"Schick mir ein Foto von deinem Mann.\"\n\n\"Ja. Der Rumäne. Ich will sein Gesicht sehen.\"\n\n\"Weil ich wissen will, wer dich glücklich macht.\"\n\nIch schickte ein Foto. Das beste, das ich hatte. Matei lachend. Mit einem Pastetenkrümel im Bart.\n\n\"Er hat einen Krümel im Bart,\" schrieb sie zurück.\n\n\"Das ist sein Charme.\"\n\n\"Sein Charme ist chaotisch.\"\n\nIn der Nacht sagte Matei: \"Deine Großmutter mag mich nicht.\"\n\n\"Sie mag dich. Sie zeigt es nur nicht.\"\n\n\"Das ist deutsch.\"\n\n\"Das ist Großmutter.\"\n\n\"Dass du da warst. Bei dem Anruf.\"\n\n\"Ich bin immer da.\"\n\n\"Auch bei schlechten Nachrichten?\"\n\n\"Besonders dann.\"\n\n\"Das ist Liebe. Dasselbe.\"\n\nIch legte meinen Kopf auf seine Schulter.\n\nDie Lampe brannte. Die Heizung klickte. Matei Jr. stand auf dem Fensterbrett.\n\n\"Ich glaube, ich werde nicht nach Lagos fliegen.\"\n\n\"Nicht bald. Vielleicht irgendwann. Aber nicht jetzt.\"\n\n\"Ja. Du musst nichts erzwingen. Sie hat dich nicht erzwungen. Du schuldest ihr nichts.\"\n\n\"Sie ist meine Großmutter.\"\n\n\"Sie ist deine Großmutter. Aber du bist du. Du hast dein eigenes Leben. Deine eigene Familie. Deine eigene Ente.\"\n\n\"Friedrich ist nicht meine Ente.\"\n\n\"Friedrich ist deine Ente. Du hast ihn adoptiert.\"\n\n\"Enten kann man nicht adoptieren.\"\n\n\"Du hast es trotzdem getan.\"\n\n\"Das ist nicht legal.\"\n\n\"Das ist liebe. Dasselbe.\"\n\nUnd träumte nicht von Lagos.\n\ndas Festnetz landline neuter\n\ndie Schweigekrankheit silence illness feminine (Yves's invention)\n\ndie Brille glasses feminine\n\ndie Schuldgefühle guilt feelings plural\n\ntherapeutisch therapeutic adjective\n\nder Verrat betrayal masculine\n\nder Krümel crumb masculine\n\nchaotisch chaotic adjective\n\nerzwingen to force separable verb (erzwingt, erzwang, erzwungen)\n\nFrom this chapter: \"Bevor ich gehe\" (before I go) and \"Nachdem sie aufgelegt hatte\" (after she hung up).\n\nTemporal clauses tell you when something happens. Both bevor and nachdem send the verb to the end.\n\nConjunction Meaning Verb position Example\n\nbevor before end Bevor du kommst, ruf mich an.\n\nnachdem after end (often with perfect/plusquamperfect) Nachdem sie gegangen war, weinte ich.\n\nExamples from this chapter (adapted):\n\nBefore you come, call me. Bevor du kommst, ruf mich an.\n\nAfter she hung up, I sat in silence. Nachdem sie aufgelegt hatte, saß ich schweigend da.\n\nBefore I leave, I want to see you. Bevor ich gehe, will ich dich sehen.\n\nWhy this matters: You will use bevor and nachdem constantly when telling stories about past events — especially family phone calls.\n\nTip from the method: Nachdem is often used with the past perfect (hatte/waren + past participle) to show that one action happened completely before another. Your brain will absorb the sequence.", "choices": ["Notice the silence between them", "Focus on what is being said"]}], "gate": {"clue": "What is the German word for \"to change apartment\"?", "answer": "wohnung wechseln", "hint": "die Wohnung wechseln"}, "vocab": [{"german": "das Festnetz", "english": "landline"}, {"german": "das Mitleid", "english": "pity"}, {"german": "die Schweigekrankheit", "english": "silence illness"}, {"german": "die Brille", "english": "glasses"}, {"german": "die Schuldgefühle", "english": "guilt feelings"}, {"german": "therapeutisch", "english": "therapeutic"}, {"german": "der Verrat", "english": "betrayal"}, {"german": "das Schicksal", "english": "fate"}, {"german": "der Krümel", "english": "crumb"}, {"german": "chaotisch", "english": "chaotic"}, {"german": "erzwingen", "english": "to force"}, {"german": "adoptieren", "english": "to adopt"}, {"german": "das Sofa", "english": "sofa / couch"}, {"german": "die Lampe", "english": "lamp"}, {"german": "die Heizung", "english": "radiator / heating"}, {"german": "die Nachricht", "english": "message"}, {"german": "aber", "english": "but"}, {"german": "gut", "english": "good"}, {"german": "heute", "english": "today"}, {"german": "der Morgen", "english": "morning"}, {"german": "vielleicht", "english": "maybe / perhaps"}, {"german": "noch", "english": "still / yet"}, {"german": "warum", "english": "why"}, {"german": "jetzt", "english": "now"}, {"german": "sehr", "english": "very"}, {"german": "weil", "english": "because"}, {"german": "auch", "english": "also / too"}, {"german": "oder", "english": "or"}, {"german": "sich", "english": "(reflexive pronoun)"}, {"german": "die Lüge", "english": "lie (falsehood)"}, {"german": "wenn", "english": "when / if"}, {"german": "wirklich", "english": "really"}, {"german": "die Nacht", "english": "night"}, {"german": "perfekt", "english": "perfect"}, {"german": "ruhig", "english": "quiet / calm"}, {"german": "der Schlaf", "english": "sleep"}, {"german": "immer", "english": "always"}, {"german": "sitzen", "english": "to sit"}, {"german": "der Ländercode", "english": "country code"}, {"german": "die Großmutter", "english": "grandmother"}, {"german": "zurück", "english": "back"}, {"german": "der Ehemann", "english": "husband"}, {"german": "drücken", "english": "to press / squeeze"}, {"german": "grün", "english": "green"}, {"german": "dünn", "english": "thin"}, {"german": "zurückrufen", "english": "to call back"}, {"german": "das Wort", "english": "word"}, {"german": "spät", "english": "late"}, {"german": "würden", "english": "would (subjunctive)"}, {"german": "heißen", "english": "to be called"}, {"german": "für", "english": "for"}, {"german": "wissen", "english": "to know"}, {"german": "hören", "english": "to hear / listen"}, {"german": "möchten", "english": "would like to"}, {"german": "der Rumäne", "english": "Romanian (person)"}, {"german": "unmöglich", "english": "impossible"}, {"german": "wählen", "english": "to choose"}, {"german": "zurückschauen", "english": "to look back"}, {"german": "fühlen", "english": "to feel"}, {"german": "das Gefühl", "english": "feeling"}, {"german": "lügen", "english": "to lie"}, {"german": "wissen", "english": "to know"}, {"german": "der Rumäne", "english": "Romanian (person)"}, {"german": "nächste", "english": "next"}, {"german": "fühlen", "english": "to feel"}, {"german": "später", "english": "later"}, {"german": "wofür", "english": "what for"}, {"german": "sein", "english": "to be (subjunctive)"}, {"german": "klug", "english": "clever"}, {"german": "träumen", "english": "to dream"}, {"german": "die Küche", "english": "kitchen"}, {"german": "lächeln", "english": "to smile"}, {"german": "flüstern", "english": "to whisper"}, {"german": "über", "english": "over / about"}, {"german": "stören", "english": "to disturb / bother"}, {"german": "sich gewöhnen", "english": "to get used to"}, {"german": "ändern", "english": "to change"}, {"german": "öfter", "english": "more often"}, {"german": "haben", "english": "to have (subjunctive)"}, {"german": "die Träne", "english": "tear (drop)"}, {"german": "das Gespräch", "english": "conversation"}, {"german": "glücklich", "english": "happy / lucky"}, {"german": "der Pastetenkrümel", "english": "pastry crumb"}, {"german": "sitzen", "english": "to sit"}, {"german": "der Ehemann", "english": "husband"}, {"german": "drücken", "english": "to press / squeeze"}, {"german": "grün", "english": "green"}, {"german": "dünn", "english": "thin"}, {"german": "zurückrufen", "english": "to call back"}, {"german": "das Wort", "english": "word"}, {"german": "würde", "english": "would (subjunctive)"}, {"german": "heißen", "english": "to be called"}, {"german": "wissen", "english": "to know"}, {"german": "hören", "english": "to hear / listen"}, {"german": "möchten", "english": "would like to"}, {"german": "wählen", "english": "to choose"}, {"german": "zurückschauen", "english": "to look back"}, {"german": "fühlen", "english": "to feel"}, {"german": "das Gefühl", "english": "feeling"}, {"german": "wissen / weiß", "english": "to know / white"}, {"german": "der Rumäne", "english": "Romanian (person)"}, {"german": "nächste", "english": "next"}, {"german": "fühlen", "english": "to feel"}, {"german": "sein (subj.)", "english": "would be"}, {"german": "klug", "english": "clever"}, {"german": "träumen", "english": "to dream"}, {"german": "lächeln", "english": "to smile"}, {"german": "flüstern", "english": "to whisper"}, {"german": "stören", "english": "to disturb / bother"}, {"german": "sich gewöhnen", "english": "to get used to"}, {"german": "haben", "english": "to have (subj.)"}, {"german": "die Träne", "english": "tear (drop)"}, {"german": "das Gespräch", "english": "conversation"}], "shadow": ["Phone German for difficult conversations:", "Ich muss dir etwas sagen. — I need to tell you something.", "Es ist schwer zu erklaeren. — It's hard to explain.", "Kannst du mir etwas Zeit geben? — Can you give me a little time?", "Ich bin froh, dass du da bist. — I'm glad you're there.", "Ich bin froh, dass du da bist. Da — there / here. In German the distinction between there and here collapses when what you mean is: near me. That is what Yves means."]}, {"id": 32, "title": "Die Wohnung", "scenes": [{"prose": "Die Wohnungssuche begann an einem Samstagmorgen.\n\nMit einem Kaffee. Schwarz. Kein Zucker. Keine Milch. Perfekt.\n\n\"Wir brauchen mehr Platz,\" sagte Matei.\n\n\"Für Kinder. Für den Garten. Für deine wachsende Pastetensucht.\"\n\n\"Ich habe keine Pastetensucht.\"\n\n\"Doch. Letzte Woche hast du sechs Stück an einem Tag gegessen.\"\n\n\"Das war ein schwacher Moment.\"\n\n\"Das war Dienstag. Und Mittwoch. Und Donnerstag.\"\n\n\"Du zählst meine Pasteten?\"\n\n\"Ich zähle alles. Das weißt du.\"\n\nDie erste Wohnung war in Neukölln.\n\nDrei Zimmer. Balkon. Einbauküche. Und eine seltsame gelbe Farbe an den Wänden. Senfgelb. Die Sorte Gelb, die man sieht und sofort vergisst.\n\n\"Die Wände sind gelb,\" sagte ich.\n\n\"Senfgelb,\" sagte der Makler. Er hieß Herr Krause. Er trug einen Anzug, der zu eng war. \"Sehr modern. Sehr Berlin.\"\n\n\"Senf ist nicht modern. Senf ist für Würstchen.\"\n\n\"Das ist eine sehr kreative Perspektive.\"\n\n\"Das ist eine sehr ehrliche Perspektive.\"\n\nMatei zog mich zur Seite. \"Die Wohnung ist gut.\"\n\n\"Die Wände sind gelb.\"\n\n\"Wir können sie streichen.\"\n\n\"Senfgelb geht nicht weg. Senfgelb bleibt für immer. Senfgelb ist eine Lebenseinstellung.\"\n\n\"Du bist verrückt.\"\n\n\"Ich bin ehrlich. Dasselbe.\"\n\nWir nahmen die Wohnung nicht.\n\nDie zweite Wohnung war in Kreuzberg.\n\nVier Zimmer. Große Fenster. Ein Fahrstuhl, der funktionierte. Und ein Garten. Ein richtiger Garten. Mit Grass und einem Baum und einem kleinen Schuppen.\n\n\"Das ist ein Garten,\" sagte ich.\n\n\"Das ist ein Garten,\" sagte Matei.\n\n\"Ein richtiger Garten.\"\n\n\"Und einem Baum.\"\n\n\"Und einem Schuppen.\"\n\n\"Was macht man mit einem Schuppen?\"\n\n\"Man stellt Dinge rein. Fahrräder. Werkzeug. Deine überflüssigen Pasteten.\"\n\n\"Pasteten sind nie überflüssig.\"\n\n\"Doch. Die, die du nicht isst, sind überflüssig.\"\n\n\"Ich esse alle Pasteten.\"\n\n\"Das ist das Problem.\"\n\nDer Makler für die zweite Wohnung hieß Frau Schulz.\n\nSie trug einen Blazer mit Schulterpolstern. Die Schulterpolster waren größer als mein Kopf.\n\n\"Die Wohnung hat viel Potenzial,\" sagte sie.\n\n\"Potenzial ist Maklersprache für 'es ist hässlich, aber man kann es reparieren'.\"\n\n\"Das ist sehr direkt.\"\n\n\"Ich bin sehr direkt. Ich bin Nigerianer.\"\n\n\"Nigerianer sind nicht direkt.\"\n\n\"Dieser Nigerianer schon.\"\n\nMatei seufzte. \"Yves, lass mich reden.\"\n\n\"Du redest nie.\"\n\n\"Dann rede ich jetzt.\"\n\nEr redete mit Frau Schulz. Über Miete. Über Nebenkosten. Über die Kaution. Über den Garten. Über den Schuppen.\n\n\"Der Schuppen ist nicht im Mietvertrag,\" sagte Frau Schulz.\n\n\"Warum nicht?\" fragte Matei.\n\n\"Weil der Schuppen ein eigenes Wesen ist.\"\n\n\"Ein eigenes Wesen?\"\n\n\"Ja. Er hat eine Tür, die nicht schließt, und ein Fenster, das nicht aufgeht. Er ist... speziell.\"\n\n\"Speziell ist gut,\" sagte ich. \"Speziell hat Charakter.\"\n\n\"Speziell ist teuer,\" sagte Matei.\n\n\"Speziell ist kostenlos,\" sagte Frau Schulz. \"Der Schuppen gehört zum Garten. Aber niemand will ihn. Weil er speziell ist.\"\n\n\"Wir nehmen ihn,\" sagte ich.\n\n\"Du hast den Schuppen nicht gesehen.\"\n\n\"Ich muss ihn nicht sehen. Ich vertraue ihm.\"\n\n\"Du vertraust einem Schuppen?\"\n\n\"Schuppen sind ehrlich. Schuppen lügen nicht.\"\n\n\"Du bist unmöglich.\"\n\n\"Du liebst mich.\"\n\nNicht sofort. Aber nach einer Woche Bedenkzeit. Nach vielen Diskussionen. Nach einer Liste von Matei mit Pro und Contra.\n\n\"Du hast eine Liste gemacht,\" sagte ich.\n\n\"Ich mache Listen.\"\n\n\"Die Liste hat Unterpunkte.\"\n\n\"Listen brauchen Unterpunkte.\"\n\n\"Was ist das Contra?\"\n\n\"Der Garten braucht Arbeit.\"\n\n\"Das ist ein Pro.\"\n\n\"Arbeit ist kein Pro. Arbeit ist Arbeit.\"\n\n\"Aber es ist unsere Arbeit. Zusammen.\"", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}, {"prose": "\"Das ist sehr romantisch.\"\n\n\"Ich bin sehr romantisch. Ich bin Nigerianer.\"\n\n\"Nigerianer sind nicht romantisch.\"\n\n\"Dieser Nigerianer schon.\"\n\nNatürlich. Umzüge sind immer chaotisch. Besonders mit Matei, der jedes Buch einzeln in Zeitungspapier einwickelte.\n\n\"Das ist ein Buch. Keine Bombe.\"\n\n\"Bücher sind wichtig. Bücher haben Gefühle.\"\n\n\"Bücher haben keine Gefühle.\"\n\n\"Doch. Dieses Buch hat Gefühle. Es ist eine Erstausgabe.\"\n\n\"Die Verwandlung. Kafka.\"\n\n\"Du hast Kafka eingewickelt?\"\n\n\"Kafka verdient Respekt.\"\n\n\"Kafka ist tot.\"\n\n\"Tote Autoren verdienen mehr Respekt. Sie können sich nicht wehren.\"\n\n\"Du bist unmöglich.\"\n\n\"Ich bin vorsichtig. Dasselbe.\"\n\nSie trug Kisten. Sie fluchte. Sie trank Kaffee aus einer Tasse, die sie selbst mitgebracht hatte.\n\n\"Du hast deine eigene Tasse mitgebracht.\"\n\n\"Eure Tassen sind zu klein. Ich brauche große Tassen. Ich bin ein großer Mensch.\"\n\n\"Du bist kleiner als ich.\"\n\n\"Größe ist nicht wichtig. Volumen ist wichtig.\"\n\n\"Das ist nicht wahr.\"\n\n\"Doch. Frag jeden Kaffeetrinker.\"\n\nSie stellte die Tasse ab. Sah sich in der neuen Wohnung um.\n\n\"Es ist schön hier.\"\n\n\"Die Wände sind weiß.\"\n\n\"Weiß ist gut. Weiß kann man anmalen.\"\n\n\"Wir wollen nicht anmalen. Wir wollen weiß lassen.\"\n\n\"Weiß ist langweilig.\"\n\n\"Weiß ist friedlich.\"\n\nDer Garten war... ein Garten.\n\nGrass. Unkraut. Ein Baum, der schief war. Ein Schuppen, der noch schiefer war.\n\n\"Der Baum ist schief,\" sagte Ada.\n\n\"Der Baum ist charaktervoll.\"\n\n\"Der Schuppen ist auch schief.\"\n\n\"Der Schuppen hat Persönlichkeit.\"\n\n\"Der Schuppen hat Löcher im Dach.\"\n\n\"Löcher sind Fenster für die Seele.\"\n\n\"Du bist verrückt.\"\n\n\"Ich bin glücklich. Dasselbe.\"\n\nAm Abend des ersten Tages in der neuen Wohnung saßen wir im Garten.\n\nAuf klapprigen Stühlen. Mit Bier. Mit Pasteten. Mit dem Gefühl, dass etwas Neues begann.\n\n\"Was pflanzen wir?\"\n\n\"Tomaten sind einfach. Tomaten sind dankbar. Tomaten schreien nicht, wenn man sie vergisst.\"\n\n\"Pflanzen schreien nicht.\"\n\n\"Diese vielleicht. Ich kenne mich nicht aus.\"\n\n\"Du kennst dich mit nichts aus.\"\n\n\"Ich kenne mich mit dir aus. Das ist genug.\"\n\nIn der zweiten Woche hatten wir unseren ersten Streit über den Garten.\n\n\"Wir brauchen Rosmarin,\" sagte Matei.\n\n\"Rosmarin ist langweilig.\"\n\n\"Rosmarin ist nützlich.\"\n\n\"Basilikum ist besser.\"\n\n\"Basilikum stirbt sofort. Basilikum ist dramatisch.\"\n\n\"Basilikum ist lecker.\"\n\n\"Rosmarin ist auch lecker.\"\n\n\"Rosmarin schmeckt nach Weihnachten. Ich will nicht das ganze Jahr Weihnachten.\"\n\n\"Dann pflanzen wir beides.\"\n\n\"Der Topf ist zu klein.\"\n\n\"Dann kaufen wir einen größeren Topf.\"\n\n\"Das ist keine Lösung.\"\n\n\"Doch. Das ist eine Lösung. Du willst nur streiten.\"\n\n\"Ich will nicht streiten. Ich will gewinnen.\"\n\n\"Das ist dasselbe.\"\n\nWir stritten zehn Minuten.\n\n\"Das war dumm,\" sagte ich.\n\n\"Das war Beziehung.\"\n\n\"Nein. Beziehung ist, wenn man sich streitet und dann zusammen lacht. Das ist ein Unterschied.\"\n\n\"Gibt es einen?\"\n\n\"Ja. Und du weißt es.\"\n\nWir pflanzten beides. Rosmarin und Basilikum. In zwei Töpfen. Nebeneinander.\n\n\"Sie sind Nachbarn,\" sagte Matei.\n\n\"Hoffentlich streiten sie sich nicht.\"\n\n\"Sie werden sich streiten. Das ist normal.\"", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}, {"prose": "\"Dann sind sie wie wir.\"\n\nDrei Wochen später kam der Brief von der Großmutter.\n\nEin echter Brief. Mit Briefmarke. Mit Handschrift. Mit einem kleinen getrockneten Blatt drin.\n\nich habe gehört, du hast einen Garten. Schick mir ein Foto. Ich will sehen, ob du besser gärtnerst als dein Vater.\n\nDein Vater konnte nichts pflanzen. Nicht einmal einen Kaktus. Der Kaktus ist gestorben. Vor Mitleid.\n\nPflanze etwas Schönes. Etwas, das bleibt.\n\n\"Was sagt sie?\" fragte Matei.\n\n\"Dass mein Vater keinen Kaktus am Leben halten konnte.\"\n\n\"Das ist nicht schwer. Kakteen sind einfach.\"\n\n\"Mein Vater war nicht einfach.\"\n\n\"Dann pflanze etwas, das dein Vater nicht konnte.\"\n\n\"Tomaten. Und Rosmarin. Und Basilikum. Und vielleicht eine Ente.\"\n\n\"Enten pflanzt man nicht.\"\n\n\"Dann kauf eine Ente. Friedrich braucht Gesellschaft.\"\n\n\"Friedrich wohnt an der Brücke.\"\n\n\"Friedrich kann umziehen. Enten sind flexibel.\"\n\n\"Enten sind nicht flexibel. Enten sind Enten.\"\n\n\"Diese Ente schon. Sie hat eine Krone.\"\n\n\"Die Krone ist unsichtbar.\"\n\n\"Nicht für mich.\"\n\nAm Wochenende pflanzten wir Tomaten.\n\nFünf Pflanzen. In einer Reihe. Mit kleinen Stäben, damit sie nicht umfielen.\n\n\"Sie sehen traurig aus,\" sagte ich.\n\n\"Sie sehen jung aus. Das ist ein Unterschied.\"\n\n\"Sie sehen aus, als würden sie sterben.\"\n\n\"Du siehst auch manchmal so aus. Aber du stirbst nicht.\"\n\n\"Woher weißt du das?\"\n\n\"Weil du noch hier bist.\"\n\n\"Das ist kein Beweis.\"\n\n\"Es ist der einzige Beweis, den ich brauche.\"\n\nIm Juni blühten die Tomaten.\n\nKleine gelbe Blüten. Winzig. Fast unsichtbar.\n\n\"Sie blühen,\" sagte Matei.\n\n\"Bald gibt es Tomaten.\"\n\n\"Echte Tomaten?\"\n\n\"Echte Tomaten. Selbst gezogen. Von uns.\"\n\n\"Das ist aufregend.\"\n\n\"Das ist normal. Normale Gärtner freuen sich über Tomaten.\"\n\n\"Ich bin kein normaler Gärtner.\"\n\n\"Du bist mein Gärtner. Das ist besser.\"\n\nIm Juli aßen wir die ersten Tomaten.\n\nSie waren klein. Krumm. Nicht perfekt. Aber sie schmeckten wie nichts anderes.\n\n\"Die beste Tomate meines Lebens,\" sagte ich.\n\n\"Du übertreibst.\"\n\n\"Ich übertreibe nicht. Ich bin dankbar.\"\n\n\"Nein. Dankbar ist, wenn man weiß, dass man Glück hatte. Übertreiben ist, wenn man lügt. Ich lüge nicht.\"\n\n\"Dann ist es die beste Tomate deines Lebens.\"\n\n\"Besser als die Pasteten?\"\n\n\"Nichts ist besser als Pasteten. Aber die Tomate ist fast so gut.\"\n\n\"Das ist ein Kompliment.\"\n\n\"Für die Tomate. Nicht für dich.\"\n\nIm August entdeckten wir einen neuen Gast im Garten.\n\nEine Katze. Schwarz. Mit weißen Pfoten und einem krummen Schwanz.\n\n\"Das ist eine Katze,\" sagte ich.\n\n\"Das ist unsere Katze.\"\n\n\"Sie gehört uns nicht.\"\n\n\"Sie gehört jetzt uns. Sie hat uns ausgesucht.\"\n\n\"Katzen suchen sich keine Menschen aus.\"\n\n\"Doch. Katzen tun das. Es ist wissenschaftlich bewiesen.\"\n\n\"Von mir. Ich bin Wissenschaftler.\"\n\n\"Du bist Buchhändler.\"\n\n\"Buchhändler sind auch Wissenschaftler. Wir forschen. Nach guten Büchern.\"\n\n\"Das ist nicht dasselbe.\"\n\n\"Doch. Jetzt kauf Katzenfutter.\"\n\nDie Katze bekam einen Namen.\n\n\"Wie heißt sie?\" fragte Matei.\n\n\"Die weibliche Version von Friedrich.\"\n\n\"Enten und Katzen können nicht denselben Namen haben.\"\n\n\"Doch. Das ist meine Katze. Ich darf sie nennen, wie ich will.\"\n\n\"Es ist unsere Katze.\"\n\n\"Dann nenn du sie, wie du willst.\"\n\n\"Miez ist ein guter Name.\"\n\n\"Miez ist ein langweiliger Name.\"\n\n\"Miez ist klassisch.\"", "choices": ["Notice the silence between them", "Focus on what is being said"]}, {"prose": "\"Miez ist ein Name für eine Katze, die keine Persönlichkeit hat.\"\n\n\"Unsere Katze hat Persönlichkeit.\"\n\n\"Dann nenn sie Friedricha.\"\n\n\"Weil es dumm ist.\"\n\n\"Du liebst mich.\"\n\nWir nannten sie Miez. Aber ich nannte sie Friedricha, wenn Matei nicht hinhörte.\n\nIm September hatten wir unseren zweiten Streit über den Garten.\n\nDiesmal ging es um den Schuppen.\n\n\"Der Schuppen muss repariert werden,\" sagte Matei.\n\n\"Der Schuppen ist charmant.\"\n\n\"Der Schuppen hat Löcher im Dach.\"\n\n\"Löcher sind charaktervoll.\"\n\n\"Löcher sind nass. Wenn es regnet, wird alles im Schuppen nass.\"\n\n\"Dann stellen wir nichts rein, das nass werden kann.\"\n\n\"Wir haben Fahrräder. Fahrräder können rosten.\"\n\n\"Dann stellen wir die Fahrräder nicht in den Schuppen.\"\n\n\"Ins Wohnzimmer. Fahrräder sind auch Dekoration.\"\n\n\"Fahrräder sind keine Dekoration.\"\n\n\"Doch. In Berlin schon.\"\n\n\"Du bist unmöglich.\"\n\n\"Du liebst mich.\"\n\nWir reparierten den Schuppen nicht. Wir stellten die Fahrräder ins Wohnzimmer. Matei hasste es. Ich liebte es.\n\n\"Das ist hässlich,\" sagte er.\n\n\"Das ist praktisch.\"\n\nIm Oktober, als die Blätter fielen, saßen wir im Garten.\n\nMit Decken. Mit Tee. Mit der Katze Miez-Friedricha auf dem Schoß.\n\n\"Dass du den Garten wolltest.\"\n\n\"Du wolltest den Garten.\"\n\n\"Ich wollte den Garten. Du wolltest mich glücklich sehen.\"\n\n\"Das ist dasselbe.\"\n\n\"Nein. Einen Garten zu wollen ist egoistisch. Dich glücklich sehen zu wollen ist Liebe.\"\n\n\"Das ist sehr weise.\"\n\n\"Ich bin sehr weise. Ich habe einen Garten.\"\n\n\"Gärten machen nicht weise.\"\n\n\"Dieser Garten schon.\"\n\nDie Katze miaute. Die Tomaten waren alle gegessen. Der Rosmarin duftete. Der Basilikum war längst tot.\n\n\"Der Basilikum ist tot,\" sagte ich.\n\n\"Der Basilikum war schwach.\"\n\n\"Der Basilikum war dramatisch.\"\n\n\"Nächstes Jahr pflanzen wir mehr.\"\n\n\"Und mehr Rosmarin.\"\n\n\"Und mehr Tomaten.\"\n\n\"Und vielleicht eine Ente.\"\n\n\"Friedrich wohnt an der Brücke.\"\n\n\"Friedrich kann zu Besuch kommen.\"\n\n\"Enten können nicht zu Besuch kommen.\"\n\n\"Diese Ente schon. Sie hat eine Krone.\"\n\n\"Die Krone ist unsichtbar.\"\n\n\"Nicht für mich.\"\n\nDer Himmel war orange. Die Stadt war still. Der Garten war unser.\n\n\"Ich bin zu Hause.\"\n\n\"Wirklich zu Hause. Nicht nur hier. Sondern überall. Mit dir.\"\n\n\"Das ist genug.\"\n\ndie Wohnungssuche apartment search feminine\n\nder Makler / die Maklerin real estate agent masculine/feminine\n\nsenfgelb mustard-yellow adjective\n\nder Blazer blazer masculine\n\ndie Schulterpolster shoulder pads plural\n\ndie Kaution deposit feminine\n\nklapprig rickety adjective\n\nder Rosmarin rosemary masculine\n\ndas Basilikum basil neuter\n\ndie Blüte blossom feminine\n\nFrom this chapter: Not explicit, but useful for explaining arguments like the garden dispute.\n\nBoth weil and denn mean \"because,\" but they work differently.\n\nConjunction Word Order Example\n\nweil subordinate clause (verb at end) Ich bin glücklich, weil wir einen Garten haben.\n\ndenn main clause (verb in second position) Ich bin glücklich, denn wir haben einen Garten.\n\nExamples from this chapter (adapted):\n\nI'm happy because we have a garden. (subordinate) Ich bin glücklich, weil wir einen Garten haben.\n\nI'm happy because we have a garden. (main clause) Ich bin glücklich, denn wir haben einen Garten.\n\nWhy this matters: In spoken German, weil is more common. But denn is useful when you want a simpler word order (verb stays in second position, not at the end).\n\nTip from the method: If you're unsure about putting the verb at the end, use denn. It's always correct and the verb stays where you expect it.", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}], "gate": {"clue": "What is the German word for \"child\"?", "answer": "kind", "hint": "das Kind"}, "vocab": [{"german": "die Wohnungssuche", "english": "apartment search"}, {"german": "der Makler", "english": "/ die Maklerin real estate agent masculine/"}, {"german": "senfgelb", "english": "mustard-yellow"}, {"german": "der Blazer", "english": "blazer"}, {"german": "die Schulterpolster", "english": "shoulder pads"}, {"german": "die Kaution", "english": "deposit"}, {"german": "das Unkraut", "english": "weeds"}, {"german": "klapprig", "english": "rickety"}, {"german": "die Kräuter", "english": "herbs"}, {"german": "der Rosmarin", "english": "rosemary"}, {"german": "das Bas , "english": "garden"}, {"german": "nächste", "english": "next"}], "shadow": ["Home and domestic German — say aloud:", "Das ist jetzt unser Zuhause. — This is our home now.", "Wo sollen wir das hinstellen? — Where should we put this?", "Das Fenster geht nach Sueden. — The window faces south.", "Es ist klein, aber es ist genug. — It's small, but it's enough.", "Es ist klein, aber es ist genug. You have heard these words before. In Chapter One, about a different apartment. Say them. Notice what has changed."]}, {"id": 33, "title": "Das Kind", "scenes": [{"prose": "Die Adoption begann mit einem Formular.\n\nNatürlich. In Deutschland beginnen alle guten Dinge mit einem Formular. Sogar die Liebe. Besonders die Liebe.\n\n\"Das ist Seite eins,\" sagte Matei.\n\n\"Wie viele Seiten hat das Formular?\"\n\n\"Fünfundvierzig.\"\n\n\"Fünfundvierzig Seiten?\"\n\n\"Über ein Kind?\"\n\n\"Über uns. Ob wir gut genug für ein Kind sind.\"\n\n\"Das ist viel Druck.\"\n\n\"Das ist Deutschland. Dasselbe.\"\n\nDas Formular lag auf dem Küchentisch.\n\nZwischen dem Salzstreuer und Mateis Kaffeetasse. Es war weiß. Offiziell. Einschüchternd.\n\n\"Fangen wir an,\" sagte ich.\n\n\"Frage eins: 'Warum möchten Sie ein Kind adoptieren?'\"\n\n\"Weil wir keine eigenen Kinder bekommen können.\"\n\n\"Das ist nicht die richtige Antwort.\"\n\n\"Weil es negativ ist. 'Wir können keine eigenen Kinder bekommen' klingt wie ein zweite Wahl.\"\n\n\"Wir sind keine zweite Wahl.\"\n\n\"Das weiß ich. Aber das Amt weiß das nicht. Du musst positiv klingen.\"\n\n\"Wie 'Wir haben viel Liebe zu geben und möchten diese Liebe mit einem Kind teilen.'\"\n\n\"Das klingt wie ein Kalenderspruch.\"\n\n\"Kalendersprüche sind positiv. Dasselbe.\"\n\nWir haben viel Liebe zu geben und möchten diese Liebe mit einem Kind teilen.\n\n\"Das ist gut,\" sagte Matei.\n\n\"Das ist gelogen.\"\n\n\"Es ist nicht gelogen. Wir haben viel Liebe.\"\n\n\"Ja. Aber das klingt wie aus einem Film.\"\n\n\"Das Leben ist wie ein Film. Manchmal.\"\n\n\"Unser Leben ist wie eine Komödie.\"\n\n\"Dann adoptieren wir eine Komödie.\"\n\n\"Kinder sind keine Komödie.\"\n\n\"Kinder sind Chaos. Komödie auch. Dasselbe.\"\n\nFrage zwei: 'Wie stellen Sie sich Ihren Alltag mit einem Kind vor?'\n\n\"Chaotisch,\" sagte ich.\n\n\"Schreib nicht 'chaotisch'.\"\n\n\"Warum nicht? Chaos ist ehrlich.\"\n\n\"Chaos klingt unorganisiert. Das Amt mag organisierte Menschen.\"\n\n\"Wir sind nicht organisiert.\"\n\n\"Doch. Wir sind sehr organisiert. Wir haben einen Garten. Eine Katze. Eine Pflanze.\"\n\n\"Die Katze heißt Miez.\"\n\n\"Das Amt weiß nicht, dass Miez Friedricha heißt.\"\n\n\"Wie heißt sie offiziell?\"\n\n\"Miez. Nur Miez. Friedricha ist ihr Künstlername.\"\n\n\"Katzen haben keine Künstlernamen.\"\n\n\"Diese Katze schon. Sie ist besonders.\"\n\nUnser Alltag ist strukturiert, aber flexibel. Wir arbeiten beide. Aber wir haben flexible Arbeitszeiten. Wir haben einen Garten, in dem das Kind spielen kann. Wir haben Zeit für gemeinsame Mahlzeiten, Hausaufgaben und Familienaktivitäten.\n\n\"Das klingt, als hätten wir eine Putzfrau und einen Hund.\"\n\n\"Wir haben keine Putzfrau.\"\n\n\"Das Amt weiß das nicht.\"\n\n\"Du willst lügen?\"\n\n\"Ich will nicht lügen. Ich will optimistisch klingen.\"\n\n\"Das ist dasselbe.\"\n\n\"Nein. Optimistisch ist, wenn man die Wahrheit sagt, aber sie schöner macht. Lügen ist, wenn man etwas Falsches sagt. Ich sage nichts Falsches.\"\n\n\"Wir haben keine flexible Arbeitszeiten.\"\n\n\"Doch. Ich kann früher gehen. Du kannst später kommen. Das ist flexibel.\"\n\n\"Das ist nicht flexibel. Das ist chaotisch.\"\n\nFrage drei: 'Welche Erfahrungen haben Sie mit Kindern?'\n\n\"Keine,\" sagte ich.\n\n\"Das ist nicht wahr. Du hast mit Ada gespielt. Als Kind.\"\n\n\"Das zählt nicht.\"\n\n\"Doch. Erfahrung ist Erfahrung.\"\n\n\"Ich habe auch mit Matei Jr. gesprochen. Der Pflanze.\"\n\n\"Das zählt auch nicht.\"\n\n\"Warum nicht? Pflanzen sind wie Kinder. Sie brauchen Wasser, Licht und Liebe.\"\n\n\"Kinder brauchen mehr als Wasser.\"\n\n\"Schokolade. Und Trost. Und jemanden, der sie in den Schlaf singt.\"\n\n\"Du kannst nicht singen.\"\n\n\"Ich kann 'Gute Nacht, gute Nacht' summen. Das ist fast dasselbe.\"\n\n\"Das ist nicht dasselbe.\"\n\n\"Für ein Kind schon.\"\n\nWir haben Erfahrung mit der Betreuung von Neffen und Nichten (auf Abstand). Wir sind geduldig, einfühlsam und bereit zu lernen.\n\n\"Du hast keine Neffen und Nichten.\"\n\n\"Ada ist wie eine Schwester. Ihre Kinder sind wie Neffen.\"\n\n\"Ada hat keine Kinder.\"\n\n\"Noch nicht. Aber vielleicht irgendwann. Das ist nicht gelogen. Das ist optimistisch.\"\n\n\"Du bist unmöglich.\"\n\n\"Ich bin kreativ. Dasselbe.\"\n\nFrage vier: 'Wie stellen Sie sich Ihr Kind vor? (Alter, Geschlecht, Herkunft)'\n\n\"Das ist eine schwere Frage,\" sagte Matei.\n\n\"Zwei bis sechs Jahre. Egal welches Geschlecht. Egal welche Herkunft.\"\n\n\"Nur das. Ein Kind ist ein Kind.\"\n\n\"Das ist sehr offen.\"\n\n\"Das ist richtig.\"", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}, {"prose": "\"Manche Eltern wollen ein Baby.\"\n\n\"Babys sind laut. Und sie schlafen nicht. Ich brauche meinen Schlaf.\"\n\n\"Du schläfst wie ein Stein.\"\n\n\"Deshalb. Ein Baby würde mich wecken. Ein älteres Kind kann mir morgens Kaffee machen.\"\n\n\"Das ist nicht der Grund, ein Kind zu adoptieren.\"\n\n\"Doch. Das ist einer der Gründe.\"\n\n\"Du bist unmöglich.\"\n\n\"Du liebst mich.\"\n\nWir sind offen für jedes Kind, das zu uns passt. Das Alter ist weniger wichtig als die Persönlichkeit. Wir möchten einem Kind ein liebevolles Zuhause geben, unabhängig von seiner Herkunft.\n\n\"Das klingt gut.\"\n\n\"Das klingt wie vom Jugendamt.\"\n\n\"Das ist der Punkt.\"\n\nFrage fünf bis vierzig gingen schneller.\n\nNach zwei Stunden hatten wir die Hälfte geschafft. Meine Hand schmerzte. Mateis Geduld schwand.\n\n\"Pause,\" sagte er.\n\n\"Keine Pause. Wir machen weiter.\"\n\n\"Du bist wie ein Terminator.\"\n\n\"Ich bin ein Vater in Ausbildung. Dasselbe.\"\n\n\"Du bist noch kein Vater.\"\n\n\"Doch. In meinem Kopf schon.\"\n\n\"In deinem Kopf ist es chaotisch.\"\n\n\"Kinder lieben Chaos.\"\n\nKaffee. Pasteten. Die Katze kam in die Küche und setzte sich auf die Akten.\n\n\"Miez, das ist wichtig.\"\n\n\"Sie sagt, wir sollen weitermachen.\"\n\n\"Katzen sprechen nicht.\"\n\n\"Diese Katze spricht. Sie hat mir gestern Abend gesagt, dass du den Rosmarin vergessen hast zu gießen.\"\n\n\"Der Rosmarin lebt noch.\"\n\n\"Nur wegen mir.\"\n\n\"Du bist unmöglich.\"\n\n\"Du liebst mich.\"\n\nNach der Pause machten wir weiter.\n\nFragen über unsere Kindheit. Über unsere Eltern. Über unsere Beziehung. Über unsere Finanzen.\n\n\"Frage einunddreißig: 'Haben Sie Schulden?'\"\n\n\"Das ist nicht wahr. Wir haben den Kühlschrank auf Raten gekauft.\"\n\n\"Das sind keine Schulden. Das ist Finanzierung.\"\n\n\"Nein. Schulden sind schlecht. Finanzierung ist normal.\"\n\n\"Das Amt sieht das anders.\"\n\n\"Dann sagen wir keine Schulden.\"\n\n\"Das ist gelogen.\"\n\n\"Das ist optimistisch. Dasselbe.\"\n\nFrage zweiunddreißig: 'Wie ist Ihre Wohnsituation?'\n\n\"Vier Zimmer. Garten. Katze. Pflanze. Ente in der Nachbarschaft.\"\n\n\"Schreib nicht 'Ente in der Nachbarschaft'.\"\n\n\"Warum nicht? Friedrich ist wichtig.\"\n\n\"Friedrich ist nicht im Antrag.\"\n\n\"Friedrich sollte im Antrag sein. Er ist unser emotionaler Unterstützer.\"\n\n\"Enten sind keine emotionalen Unterstützer.\"\n\n\"Friedrich schon. Er hat eine Krone.\"\n\n\"Die Krone ist unsichtbar.\"\n\n\"Nicht für mich.\"\n\nIch schrieb nicht über Friedrich.\n\nFrage dreiunddreißig bis vierzig gingen schnell.\n\nDann kamen die letzten fünf Fragen. Die schweren.\n\nFrage einundvierzig: 'Was werden Sie tun, wenn das Kind traumatisiert ist?'\n\n\"Therapie,\" sagte Matei.\n\n\"Das ist eine gute Antwort.\"\n\n\"Dann schreib das.\"\n\nWir werden professionelle Hilfe suchen. Wir werden dem Kind Zeit und Raum geben, um zu heilen. Wir werden da sein. Jeden Tag. Ohne Bedingungen.\n\nFrage zweiundvierzig: 'Was werden Sie tun, wenn das Kind Sie ablehnt?'\n\n\"Weiterlieben,\" sagte ich.\n\n\"Das ist sehr idealistisch.\"\n\n\"Das ist die einzige Antwort.\"\n\n\"Manche Eltern geben auf.\"\n\n\"Wir geben nicht auf.\"\n\n\"Woher weißt du das?\"\n\n\"Weil ich nie aufgegeben habe. Bei dir. Bei der Ausbildung. Bei Berlin.\"\n\n\"Das ist nicht dasselbe.\"\n\n\"Doch. Liebe ist Liebe. Egal ob Kind oder Ehemann.\"\n\n\"Das ist sehr weise.\"\n\n\"Ich bin sehr weise. Ich habe eine Katze.\"\n\n\"Katzen machen nicht weise.\"\n\n\"Diese Katze schon.\"\n\nMiez miaute. Ich interpretierte das als er hat recht.\n\nFrage dreiundvierzig: 'Sind Sie bereit, ein Kind mit Behinderung zu adoptieren?'\n\n\"Ja,\" sagte ich.\n\n\"Bist du sicher?\" fragte Matei.\n\n\"Nein. Aber ich bin bereit zu lernen.\"\n\n\"Das ist die richtige Antwort.\"\n\n\"Dann schreib sie.\"\n\nJa. Wir sind bereit. Wir werden uns informieren. Wir werden Hilfe suchen. Wir werden nicht aufgeben.\n\nFrage vierundvierzig: 'Haben Sie ein bevorzugtes Herkunftsland für das Kind?'\n\n\"Deutschland ist einfacher. Aber jeder Ort ist okay.\"", "choices": ["Notice the silence between them", "Focus on what is being said"]}, {"prose": "\"Willst du ein Kind aus Nigeria?\"\n\n\"Ich will dich glücklich sehen. Wenn ein Kind aus dich glücklich macht, dann ja.\"\n\n\"Ein Kind aus Nigeria wäre wie ich. Mit dunkler Haut. Mit einer anderen Geschichte.\"\n\n\"Das wäre schön.\"\n\n\"Das wäre kompliziert.\"\n\n\"Das Leben ist kompliziert. Dasselbe.\"\n\nWir sind offen für jedes Herkunftsland. Hauptsache, das Kind passt zu uns und wir zu ihm.\n\nFrage fünfundvierzig. Die letzte.\n\n'Gibt es etwas, das Sie noch hinzufügen möchten?'\n\n\"Ja.\" Ich nahm den Stift.\n\n\"Was schreibst du?\"\n\nWir sind nicht perfekt. Wir streiten uns über Rosmarin und Basilikum. Wir haben eine Katze, die Miez heißt, aber ich nenne sie Friedricha, wenn mein Mann nicht hinhört. Wir haben eine Ente an der Brücke, der wir Namen gegeben haben. Wir haben eine Pflanze, die überlebt hat, obwohl wir beide vergesslich sind.\n\nAber wir lieben. Wir lieben jeden Tag. Wir lieben auch an den schweren Tagen. Und wir möchten diese Liebe mit einem Kind teilen.\n\nBitte geben Sie uns eine Chance.\n\n\"Das ist sehr emotional,\" sagte Matei.\n\n\"Das ist ehrlich.\"\n\nWir schickten den Antrag ab.\n\nPer Post. Mit einem echten Umschlag. Mit einer echten Briefmarke.\n\n\"Jetzt warten wir,\" sagte Matei.\n\n\"Monate. Vielleicht ein Jahr.\"\n\n\"Das ist normal.\"\n\n\"Ich hasse normal.\"\n\n\"Normal ist gut. Normal bedeutet, dass alles in Ordnung ist.\"\n\n\"Normal bedeutet langweilig.\"\n\n\"Langweilig ist sicher.\"\n\nIn der Nacht träumte ich von einem Kind.\n\nEinem kleinen Kind. Mit dunklen Locken und großen Augen. Es saß im Garten und spielte mit Miez.\n\n\"Wer bist du?\" fragte ich im Traum.\n\nDas Kind lächelte. Antwortete nicht.\n\n\"Du bist unser Kind?\"\n\n\"Es ist drei Uhr morgens.\"\n\n\"Ich habe von einem Kind geträumt.\"\n\n\"Hat es geschrien?\"\n\n\"Dann war es ein Traum. Echte Kinder schreien.\"\n\n\"Du bist zynisch.\"\n\n\"Ich bin realistisch. Dasselbe.\"\n\nEr drehte sich um. Legte seinen Arm um mich.\n\n\"Wir werden ein Kind bekommen.\"\n\n\"Woher weißt du das?\"\n\n\"Weil du es willst. Und weil du nie aufgibst.\"\n\n\"Das ist keine Garantie.\"\n\n\"Es ist die einzige Garantie, die zählt.\"\n\nAm nächsten Morgen rief ich meine Großmutter an.\n\n\"Lucky. Es ist früh.\"\n\n\"Wir haben den Adoptionsantrag abgeschickt.\"\n\n\"Ihr wollt ein Kind?\"\n\n\"Vielleicht. Vielleicht nicht. Wir sind offen.\"\n\n\"Dann hoffe ich, dass ihr ein Kind aus Nigeria bekommt. Eines, das so aussieht wie du.\"\n\n\"Weil ich dann einen Teil von dir hier habe. Auch wenn du nicht kommst.\"\n\n\"Das ist traurig.\"\n\n\"Das ist Leben. Jetzt schick mir ein Foto von dem Antrag. Ich will sehen, ob ihr alles richtig gemacht habt.\"\n\n\"Du sprichst Deutsch?\"\n\n\"Nein. Aber die Nachbarin spricht Deutsch. Sie hilft mir.\"\n\n\"Die Nachbarin mit dem Hund Schnitzel?\"\n\n\"Schnitzel ist letzte Woche weggelaufen. Sie hat eine neue Katze. Die Katze heißt Mieze.\"\n\n\"Das ist ein Zeichen.\"\n\n\"Das ist Zufall.\"\n\nIch schickte ihr ein Foto des Antrags.\n\nEine Stunde später kam ihre Antwort: Seite 23, Frage 12: Ihr habt 'manchmal' angekreuzt. Das ist falsch. Kreuzt 'immer' an. Ihr seid nicht 'manchmal' geduldig. Ihr seid geduldig. Punkt.\n\n\"Was sagt sie?\" fragte Matei.\n\n\"Dass wir bei Frage 12 'immer' ankreuzen sollen.\"\n\n\"Sie hat recht.\"\n\n\"Sie hat immer recht.\"\n\n\"Dann ändern wir es.\"\n\n\"Der Antrag ist schon abgeschickt.\"\n\n\"Dann schicken wir einen zweiten.\"\n\n\"In Deutschland kann man alles. Man muss nur das richtige Formular finden.\"\n\nWir fanden das richtige Formular.\n\n\"Warum hat dieses Formular nur drei Seiten?\"\n\n\"Weil es ein Korrekturformular ist.\"\n\n\"Es gibt ein Formular, um ein Formular zu korrigieren?\"\n\n\"Ja. Willkommen in Deutschland.\"\n\nWir kreuzten \"immer\" an. Schickten es ab.\n\n\"Jetzt ist es perfekt.\"\n\n\"Weiß ich nicht. Aber es kommt.\"\n\nIm Wartezimmer des Jugendamtes saßen wir nebeneinander.\n\nEs roch nach Kaffee und Papier. Eine Frau rief unseren Namen.\n\n\"Herr Grey? Herr Matei?\"\n\n\"Kommen Sie bitte.\"\n\nDas Gespräch dauerte zwei Stunden.\n\nEine nette Frau mit einer Brille und einem Lächeln, das nicht aufgesetzt wirkte. Sie fragte alles. Noch einmal. Unsere Kindheit. Unsere Beziehung. Unsere Motivation. Unsere Ängste.\n\n\"Haben Sie Angst?\" fragte sie.\n\n\"Ja,\" sagte ich.", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}, {"prose": "\"Dass wir nicht gut genug sind.\"\n\n\"Das ist eine normale Angst.\"\n\n\"Ja. Gute Eltern haben Angst. Schlechte Eltern haben keine Angst.\"\n\n\"Das ist beruhigend.\"\n\n\"Das ist ehrlich. Dasselbe.\"\n\nAm Ende des Gesprächs sagte sie: \"Ich glaube, Sie werden gute Eltern.\"\n\n\"Woher wissen Sie das?\" fragte Matei.\n\n\"Weil Sie sich Sorgen machen. Weil Sie sich vorbereitet haben. Weil Sie beide
