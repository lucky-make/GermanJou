<!DOCTYPE html>
  <html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>The German Journey</title>
  <style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#1a1410;color:#f0e8d8;font-family:Georgia,'Times New Roman',serif;-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(232,168,76,.2);border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(232,168,76,.4)}

  /* Layout */
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh}

  /* Top bar */
  #topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid rgba(240,232,216,.08);background:rgba(26,20,16,.95);flex-shrink:0;z-index:20}
  #topbar .title-block{flex:1;overflow:hidden}
  .story-label{font-family:system-ui,sans-serif;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(240,232,216,.4);line-height:1}
  .chapter-label{font-size:.9rem;color:#e8a84c;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
  .top-right{display:flex;align-items:center;gap:8px}
  .progress-badge{font-family:system-ui,sans-serif;font-size:.75rem;color:rgba(240,232,216,.45);min-width:28px}
  .nav-btn{background:transparent;border:1px solid rgba(240,232,216,.15);color:rgba(240,232,216,.65);border-radius:4px;width:34px;height:34px;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .2s,color .2s;flex-shrink:0}
  .nav-btn:hover{border-color:rgba(232,168,76,.5);color:#e8a84c}

  /* Main */
  #main{flex:1;overflow-y:auto;padding:28px 20px 20px;display:flex;flex-direction:column;align-items:center}

  /* Bottom bar */
  #bottombar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-top:1px solid rgba(240,232,216,.08);background:rgba(26,20,16,.95);flex-shrink:0}
  .foot-btn{background:transparent;border:1px solid rgba(240,232,216,.14);color:rgba(240,232,216,.55);font-family:system-ui,sans-serif;font-size:.78rem;padding:6px 14px;border-radius:4px;cursor:pointer;transition:border-color .2s,color .2s}
  .foot-btn:hover:not(:disabled){border-color:rgba(232,168,76,.5);color:#e8a84c}
  .foot-btn:disabled{opacity:.3;cursor:not-allowed}
  .foot-info{font-family:system-ui,sans-serif;font-size:.73rem;color:rgba(240,232,216,.32)}

  /* Article */
  .chapter-article{width:100%;max-width:680px;margin:0 auto}

  /* Scene progress pips */
  .scene-pips{display:flex;gap:6px;margin-bottom:26px}
  .pip{width:28px;height:3px;border-radius:2px;background:rgba(240,232,216,.1);transition:background .3s}
  .pip.active{background:#e8a84c}
  .pip.done{background:rgba(192,103,58,.55)}

  /* Prose */
  .prose-body{font-size:1.1rem;line-height:1.88;color:#f0e8d8;letter-spacing:.01em}
  .prose-para{margin:0 0 1.4em}
  .prose-para:last-child{margin-bottom:0}

  /* German word */
  .gw{color:#e8a84c;font-style:italic;cursor:pointer;border-bottom:1px solid rgba(232,168,76,.32);transition:color .15s,border-color .15s;position:relative;display:inline}
  .gw:hover{color:#f0be72;border-bottom-color:rgba(240,190,114,.65)}

  /* Tooltip */
  .tooltip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:#221a14;border:1px solid rgba(232,168,76,.45);border-radius:6px;padding:10px 14px;min-width:190px;max-width:270px;z-index:300;box-shadow:0 6px 24px rgba(0,0,0,.7);display:flex;flex-direction:column;gap:4px;white-space:nowrap}
  .tooltip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:rgba(232,168,76,.45)}
  .tt-word{color:#e8a84c;font-style:italic;font-size:1.05rem;font-weight:600}
  .tt-tr{color:#f0e8d8;font-size:.88rem;font-family:system-ui,sans-serif}
  .tt-btn{background:rgba(232,168,76,.1);border:1px solid rgba(232,168,76,.3);color:#e8a84c;border-radius:3px;padding:2px 8px;font-size:.72rem;cursor:pointer;margin-top:3px;align-self:flex-start;transition:background .15s}
  .tt-btn:hover{background:rgba(232,168,76,.2)}
  .tt-close{position:absolute;top:5px;right:8px;background:transparent;border:none;color:rgba(240,232,216,.4);font-size:1.1rem;cursor:pointer;line-height:1}
  .tt-close:hover{color:#f0e8d8}

  /* Choices */
  .choices{display:flex;flex-direction:column;gap:10px;margin-top:8px}
  .choice-btn{background:transparent;border:1px solid rgba(240,232,216,.13);color:rgba(240,232,216,.75);font-family:Georgia,serif;font-size:.95rem;line-height:1.55;padding:13px 18px;border-radius:4px;text-align:left;cursor:pointer;transition:border-color .2s,background .2s,color .2s;width:100%;display:flex;align-items:baseline;gap:10px}
  .choice-btn:hover:not(:disabled){border-color:rgba(232,168,76,.5);background:rgba(232,168,76,.06);color:#f0e8d8}
  .choice-btn:disabled{opacity:.6;cursor:default}
  .choice-btn.selected{border-color:rgba(232,168,76,.7)!important;background:rgba(232,168,76,.1)!important;color:#e8a84c!important}
  .choice-arrow{color:#e8a84c;font-style:normal;flex-shrink:0}
  .finish-btn{border-color:rgba(192,103,58,.3);color:rgba(192,103,58,.8)}
  .finish-btn:hover:not(:disabled){border-color:rgba(192,103,58,.65)!important;background:rgba(192,103,58,.07)!important;color:#c0673a!important}

  /* Fade */
  .scene-wrap{opacity:0;transition:opacity .4s ease}
  .scene-wrap.visible{opacity:1}

  /* Vocab Gate */
  .gate{width:100%;max-width:500px;margin:40px auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
  .gate-icon{font-size:2.2rem}
  .gate-title{font-size:1.25rem;color:#e8a84c;font-style:italic}
  .gate-sub{font-family:system-ui,sans-serif;font-size:.85rem;color:rgba(240,232,216,.5)}
  .gate-clue{font-size:1.05rem;color:#f0e8d8;line-height:1.6}
  .gate-hint{font-size:.88rem;color:rgba(240,232,216,.5);font-style:italic}
  .gate-row{display:flex;gap:10px;width:100%;max-width:360px}
  .gate-row.shake{animation:shake .4s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
  .gate-input{flex:1;background:rgba(26,20,16,.7);border:1px solid rgba(232,168,76,.35);color:#f0e8d8;font-family:Georgia,serif;font-size:1rem;padding:11px 14px;border-radius:4px;outline:none;transition:border-color .2s}
  .gate-input:focus{border-color:rgba(232,168,76,.75)}
  .gate-input.ok{border-color:rgba(100,190,100,.7);color:#a8d8a8}
  .gate-submit{background:rgba(232,168,76,.1);border:1px solid rgba(232,168,76,.4);color:#e8a84c;font-family:system-ui,sans-serif;font-size:.88rem;padding:11px 16px;border-radius:4px;cursor:pointer;transition:background .2s;white-space:nowrap}
  .gate-submit:hover:not(:disabled){background:rgba(232,168,76,.2)}
  .gate-submit:disabled{opacity:.5;cursor:default}
  .gate-tries{font-family:system-ui,sans-serif;font-size:.78rem;color:rgba(192,103,58,.7)}

  /* Chapter map overlay */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-start;justify-content:flex-start}
  .map-panel{background:#1f1810;border-right:1px solid rgba(240,232,216,.1);height:100%;width:min(340px,90vw);overflow-y:auto;display:flex;flex-direction:column}
  .map-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px;border-bottom:1px solid rgba(240,232,216,.07)}
  .map-header h2{font-size:1.05rem;color:#e8a84c;font-style:italic}
  .panel-close{background:transparent;border:none;color:rgba(240,232,216,.45);font-size:1.4rem;cursor:pointer;line-height:1}
  .panel-close:hover{color:#f0e8d8}
  .ch-dots{display:flex;flex-wrap:wrap;gap:10px;padding:16px 20px}
  .ch-dot{width:36px;height:36px;border-radius:50%;font-family:system-ui,sans-serif;font-size:.7rem;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:default;transition:all .25s;flex-shrink:0;border:1px solid rgba(240,232,216,.18);background:rgba(240,232,216,.04);color:rgba(240,232,216,.38)}
  .ch-dot.accessible{border-color:rgba(240,232,216,.32);color:rgba(240,232,216,.65);cursor:pointer}
  .ch-dot.accessible:hover{border-color:rgba(232,168,76,.5);color:#e8a84c;background:rgba(232,168,76,.07)}
  .ch-dot.current{border-color:#e8a84c;background:rgba(232,168,76,.15);color:#e8a84c;cursor:pointer;animation:pulse 2.2s ease-in-out infinite}
  .ch-dot.completed{border-color:#c0673a;background:rgba(192,103,58,.2);color:#e8906a;cursor:pointer}
  .ch-dot.locked{opacity:.28}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,168,76,.4)}50%{box-shadow:0 0 0 5px rgba(232,168,76,.07)}}
  .map-legend{display:flex;flex-wrap:wrap;gap:8px;padding:10px 20px 16px;border-top:1px solid rgba(240,232,216,.07);margin-top:auto}
  .leg-item{font-family:system-ui,sans-serif;font-size:.7rem;color:rgba(240,232,216,.45)}

  /* Vocab panel */
  .vocab-panel{position:fixed;top:0;right:0;bottom:0;width:min(300px,85vw);background:#1f1810;border-left:1px solid rgba(240,232,216,.1);z-index:50;display:flex;flex-direction:column;overflow:hidden}
  .vocab-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid rgba(240,232,216,.07)}
  .vocab-header h3{font-size:.95rem;color:#e8a84c;font-style:italic}
  .vocab-list{list-style:none;overflow-y:auto;flex:1;padding:4px 0}
  .vocab-item{display:flex;align-items:baseline;gap:8px;padding:9px 18px;border-bottom:1px solid rgba(240,232,216,.04)}
  .voc-play{background:transparent;border:none;color:rgba(232,168,76,.55);font-size:.65rem;cursor:pointer;flex-shrink:0}
  .voc-play:hover,.voc-play.on{color:#e8a84c}
  .voc-de{color:#e8a84c;font-style:italic;font-size:.9rem;flex-shrink:0}
  .voc-sep{color:rgba(240,232,216,.22);font-size:.82rem}
  .voc-en{color:rgba(240,232,216,.6);font-size:.82rem;font-family:system-ui,sans-serif}

  /* Shadowing */
  .shadow-sheet{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:60;display:flex;align-items:flex-end}
  .shadow-panel{background:#1c1510;border-top:1px solid rgba(232,168,76,.18);width:100%;max-height:80dvh;overflow-y:auto;border-radius:16px 16px 0 0;display:flex;flex-direction:column}
  .sh-header{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 20px 12px;border-bottom:1px solid rgba(240,232,216,.07)}
  .sh-label{font-family:system-ui,sans-serif;font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(240,232,216,.35);margin-bottom:2px}
  .sh-title{font-size:1rem;color:#e8a84c;font-style:italic}
  .sh-instr{font-family:system-ui,sans-serif;font-size:.8rem;color:rgba(240,232,216,.4);padding:10px 20px 0;line-height:1.5}
  .sh-controls{display:flex;gap:10px;padding:12px 20px;align-items:center}
  .sh-auto{background:rgba(232,168,76,.1);border:1px solid rgba(232,168,76,.3);color:#e8a84c;font-family:system-ui,sans-serif;font-size:.83rem;padding:7px 16px;border-radius:20px;cursor:pointer;transition:background .2s}
  .sh-auto:hover{background:rgba(232,168,76,.18)}
  .sh-auto.on{background:rgba(192,103,58,.18);border-color:rgba(192,103,58,.55);color:#e8906a}
  .sh-repeat{background:transparent;border:1px solid rgba(240,232,216,.14);color:rgba(240,232,216,.5);font-family:system-ui,sans-serif;font-size:.83rem;padding:7px 14px;border-radius:20px;cursor:pointer;transition:border-color .2s,color .2s}
  .sh-repeat:hover:not(:disabled){border-color:rgba(240,232,216,.32);color:#f0e8d8}
  .sh-repeat:disabled{opacity:.3;cursor:default}
  .sh-script{display:flex;flex-direction:column;gap:6px;padding:4px 20px 8px}
  .sh-line{padding:11px 14px;border-radius:8px;border:1px solid transparent;transition:background .2s,border-color .2s}
  .sh-dialogue{cursor:pointer;display:flex;align-items:baseline;gap:12px;background:rgba(240,232,216,.03);border-color:rgba(240,232,216,.06)}
  .sh-dialogue:hover{background:rgba(232,168,76,.06);border-color:rgba(232,168,76,.2)}
  .sh-dialogue.active{background:rgba(232,168,76,.1)!important;border-color:rgba(232,168,76,.4)!important}
  .sh-speaker{font-family:system-ui,sans-serif;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#e8a84c;flex-shrink:0;min-width:44px}
  .sh-text{font-family:Georgia,serif;font-size:.98rem;color:#f0e8d8;line-height:1.5;flex:1}
  .sh-icon{color:rgba(232,168,76,.45);font-size:.72rem;flex-shrink:0}
  .sh-note{font-family:system-ui,sans-serif;font-size:.8rem;color:rgba(240,232,216,.35);font-style:italic;padding:4px 2px;line-height:1.5;border:none}
  .sh-tip{font-family:system-ui,sans-serif;font-size:.76rem;color:rgba(240,232,216,.28);padding:10px 20px 18px;border-top:1px solid rgba(240,232,216,.06);margin-top:4px;line-height:1.5}
  </style>
  </head>
  <body>
  <div id="app">
    <header id="topbar">
      <button class="nav-btn" id="mapBtn" title="Chapter map" aria-label="Chapter map">≡</button>
      <div class="title-block">
        <div class="story-label">The German Journey</div>
        <div class="chapter-label" id="chapterLabel">Ch. 1 — The Key</div>
      </div>
      <div class="top-right">
        <span class="progress-badge" id="progressBadge">0/35</span>
        <button class="nav-btn" id="shadowBtn" title="Shadowing" aria-label="Shadowing">🎙</button>
        <button class="nav-btn" id="vocabBtn" title="Vocabulary" aria-label="Vocabulary">词</button>
      </div>

    <main id="main"></main>
    <footer id="bottombar">
      <button class="foot-btn" id="prevBtn" disabled>← Prev</button>
      <span class="foot-info" id="footInfo">Scene 1/4</span>
      <button class="foot-btn" id="nextBtn" disabled>Next →</button>
    </footer>
  </div>

  <!-- Chapter map overlay -->
  <div class="overlay" id="mapOverlay" style="display:none" role="dialog" aria-label="Chapter map">
    <div class="map-panel" id="mapPanel">

  <div class="vocab-panel" id="vocabPanel" style="display:none" role="dialog" aria-label="Vocabulary">

        <button class="sh-auto" id="shAutoBtn">▶ Auto-play</button>

      </div>
      <div class="sh-script" id="shScript"></div>
      <div class="sh-tip">💡 Say each line out loud right after hearing it. Match the rhythm exactly.</div>
    </div>
  </div>

  <script>
  (function(){
  'use strict';

  // ── DATA ──────────────────────────────────────────────────────────
  const CHAPTERS = [{"id": 1, "title": "The Key", "scenes": [{"prose": "The Flugzeug landed twelve minutes early.\n\nThat should have been my first Warnung. Nothing in my life had ever been early. Not my Geburt — I came out screaming two weeks late, according to my Großmutter — not my flights, not my Gefühle. But Berlin wanted me to arrive before I was bereit.\n\nI grabbed my Koffer. One bag. I had learned to travel like I had learned to love: leicht enough to leave fast. No photos, no gifts, no souvenirs that would break in my Rucksack. Just clothes, a phone charger, and a Reisepass with more stamps than I deserved.\n\nThe Flughafen was quiet for a Tuesday afternoon. A few families hugged at the Ankunftsbereich. A woman cried into her phone. A man in a too-thin coat leaned against a pillar, scrolling through his phone like he had all the Zeit in the world.\n\nHe was the one who called my name.\n\nThe man from the pillar. He wasn't tall. He wasn't smiling. His coat was grau, his hair was dunkel, and his eyes were the colour of the February sky outside — grey, but warm in a way that made me wütend. Why was he warm? I didn't know him.\n\n\"You're Matei,\" I said.\n\n\"You're late,\" he said.\n\nI looked at the clock. \"The plane was early. That's the opposite of late.\"\n\nHe didn't lachen. \"My train was late.\"\n\n\"So we're both enttäuscht.\"\n\nHe almost smiled. Fast. The corner of his mouth twitched like he had caught himself. Then he picked up my Koffer without asking — didn't even look at me for permission — and walked toward the Ausgang.\n\nThat's how it started. Me following a man who didn't ask permission.\n\nOutside, Berlin was grau and kalt and exactly as unforgiving as I needed it to be.\n\nThe Wind cut through my jacket like it had something to prove. I had been in cold weather before — Lagos could get chilly in December, if you squinted — but this was different. This was cold that wanted you to know you were a Gast here.\n\n\"Do you like it?\" Matei asked. He was already three steps ahead of me, my Koffer rolling behind him like a loyal dog.\n\n\"I don't know yet.\"\n\nHe said it like a Tatsache. Not a hope. A Tatsache. Like he had decided my opinion for me and was just waiting for me to catch up. I wanted to be annoyed. I was annoyed. But also — and I hated this — I wanted to believe him.\n\nWe took the Bus. He paid for my ticket without asking. I opened my mouth to protest, but he just looked at me and said, \"You don't have Euro yet.\" He was right. I closed my mouth.\n\nWe sat in the back, away from the other passengers. The Bus was almost leer. An old woman with a shopping cart. A teenager with headphones so large they looked like ear muffs. And us.\n\nHe smelled like Kaffee and cold smoke — the good kind, not cigarette smoke but something woodier, like a Kamin that had just been put out. It reminded me of someone I had never met. A person I had erfunden in my head when I was younger. Someone who would hold me without explanation.\n\n\"Why are you here?\" Matei asked. Not looking at me. Looking out the window at the grey buildings sliding past.\n\nI could have gelogen. I was good at lying. I had spent years telling my Großmutter I was fein, telling my coworkers I was glücklich, telling myself I wasn't running away. I had a whole catalogue of polite Lügen prepared. For work. To see the city. A fresh start. All true enough to pass.\n\nBut I was müde. And his eyes — when he finally turned to look at me — were warm.\n\n\"I wanted to leave.\"\n\n\"Leave from where?\"\n\nHe didn't say I'm sorry or that's sad or any of the things people say when they don't know what else to say. He just put his hand on mine. His hand was warm too.\n\nWe stayed like that for the rest of the Fahrt. Neither of us spoke. Neither of us pulled away. Outside, the city changed from airport glass to apartment blocks to old buildings with stories written in their cracked Putz. I watched it all through the window, but I didn't see any of it. I was too aware of his fingers against mine.\n\nWhen we got off the Bus, he let go. He didn't sich entschuldigen. He just pointed at a building across the street — five storeys, faded yellow paint, a door that had been painted over so many times it looked like a geology experiment. Bicycles chained to a railing. A bakery on the ground floor, closed for the night.\n\n\"That's my Wohnung,\" he said. \"You sleep on the Sofa.\"\n\nI looked at the building. Then at him.\n\n\"Only for one night.\"\n\n\"Only for one night,\" he agreed.", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}, {"prose": "We both knew that was a Lüge. I don't know how I knew. Maybe it was the way he said it — too fast, like he was trying to convince himself. Maybe it was the way I didn't argue. But something in the air between us had already decided that one night wasn't going to be enough.\n\nThe stairs were eng and knarrten like they remembered every person who had ever climbed them.\n\nHis Wohnung was on the fourth floor. No Aufzug. By the time we got to his door, I was out of breath and he wasn't even sweating. Angeber.\n\nHe unlocked the door. Pushed it open. Stepped aside to let me in first.\n\nThe Wohnung was klein. That's the kindest thing I can say about it. One room that was supposed to be the living room, bedroom, and dining room all at once. A tiny kitchen in the corner, separated by a Theke with two stools. A door that I assumed led to a Badezimmer. One window that faced the street. One Lampe on a table that wobbled if you breathed on it. Two mismatched chairs — one wooden, one plastic. And a Sofa that had seen better decades. The fabric was worn thin in places, and one of the cushions had a dark Fleck that I decided not to investigate.\n\n\"It's not much,\" Matei said. He set my Koffer by the door and stood in the middle of the room with his hands in his pockets. For the first time, he looked nervös. Not scared — Matei didn't seem like the kind of person who got scared — but uncertain. Like he was waiting for me to judge him.\n\nHe nodded. Some of the Anspannung left his shoulders.\n\nI walked around the room, pretending to look at things. A Bücherregal crammed with paperbacks in German, Romanian, English. A Kalender on the wall with a photo of the Alps. A small stereo on the floor next to a stack of CDs — old ones, the kind I hadn't seen since I was a kid. I spotted a Frank Ocean album and felt something loosen in my chest.\n\n\"You like Frank Ocean?\"\n\nHe looked at the CD like he had forgotten it was there. \"He's okay.\"\n\n\"You have the album. That's more than 'okay.'\"\n\n\"My Ex left it.\" Flat. No emotion. But his jaw tightened for just a second.\n\nI decided not to ask about the Ex. Not yet. Maybe not ever.\n\nHe went into the kitchen — if you could call it that. I heard water running. Cabinet doors opening and closing. The sound of a mug being set on the counter. Then he came back. He was holding a Schlüssel.\n\nIt was small. Silver. Ordinary. The kind of key that opens a door you don't think about twice.\n\n\"Here,\" he said, and handed it to me.\n\nThe metal was warm — from his pocket, from his hand, from whatever strange Schwerkraft he carried. I turned it over in my palm. It was still just a key. But it felt schwerer than it should have.\n\nHe looked at me. Really looked. Like he was trying to decide if I was worth the Risiko. His grey eyes held mine for a long moment. The Lampe flickered. The street outside was quiet.\n\n\"For you,\" he said.\n\nI didn't know what that meant. A key for me? For me to keep? For me to come back? He didn't explain. He just turned around and walked back to the kitchen, leaving me standing there with a warm key in my hand and a thousand Fragen I was too tired to ask.\n\nI sat on the Sofa. The cushion sank lower than I expected. The fabric was scratchy against my neck. But it was soft in the middle, where someone had clearly spent a lot of nights. I wondered if that someone was Matei. Or the Ex. Or someone before the Ex.\n\nHe came back with two mugs of tea. Black tea, no sugar, no milk. He handed me one without asking how I took it. I took a sip. It was perfekt. I hated that it was perfekt.\n\n\"How do you know how I drink tea?\"\n\n\"You told me. Two years ago. In a Nachricht.\"\n\nI scrolled through my memory. Two years ago. We had been talking online — I had almost forgotten. Late nights, time zones, confessions that felt safe because they weren't real. I must have mentioned it. A throwaway line. And he remembered.\n\n\"That was two years ago.\"\n\n\"I remember things.\" He sat on the wooden chair across from me, his mug cradled in both hands. Dampf rose between us.\n\n\"That's creepy.\"\n\n\"That's accurate.\"\n\nI laughed. I hadn't expected to laugh. But something about him — his deadpan delivery, the way he didn't try to be charming — caught me off guard.\n\n\"You laugh,\" he said. \"Good.\"\n\n\"Why is that good?\"\n\nHe shrugged. \"You seemed sad at the Flughafen.\"", "choices": ["Notice the silence between them", "Focus on what is being said"]}, {"prose": "I didn't know what to say to that. Because he was right. I was sad. I had been sad for years. I had gotten good at hiding it — smiling when people expected it, saying the right things, being the version of myself that was easy to be around. But he saw through it in the first ten minutes.\n\n\"Okay.\" He didn't push. He just drank his tea.\n\nWe sat in silence for a while. The Lampe buzzed softly. The Heizung clicked. Somewhere downstairs, someone was playing music — something slow, maybe Frank Ocean again, or someone who sounded like him. The city outside was dark now. I could see a sliver of the sky through the window. No stars. Berlin didn't seem like a city that showed its stars.\n\n\"You can take the bed,\" Matei said eventually.\n\n\"You said I sleep on the Sofa.\"\n\n\"I changed my mind.\"\n\nHe set his mug down. Looked at me. \"You're müde. The Sofa is old. Take the bed.\"\n\nI should have argued. I was a guest — barely even that, a stranger he had invited into his home because of messages sent two years ago. But my body was heavy, and the bed was right there, and his voice was low in a way that didn't invite negotiation.\n\nHe nodded. Stood up. Walked to the closet and pulled out a clean Laken and a Decke. He made the bed — not neatly, but carefully, like he was doing something he had done a thousand times for someone else. When he was done, he stepped back.\n\n\"Gute Nacht, Yves.\"\n\n\"Gute Nacht, Matei.\"\n\nHe went to the Sofa. I went to the bed. The sheets smelled like laundry detergent and something else — something I couldn't name. I lay there in the dark, listening to him settle onto the old cushions. The Sofa creaked. He sighed. Then silence.\n\nI held the Schlüssel he had given me.\n\nThe metal had cooled now. But I could still feel the Wärme of his hand in it.\n\nThat's how I ended up with a key to a city I had never seen, a man I didn't understand, and a story I hadn't agreed to be in.\n\nGerman English Gender/Notes\n\ndas Flugzeug airplane neuter\n\ndie Warnung warning feminine\n\ndie Großmutter grandmother feminine\n\nder Koffer suitcase masculine\n\nleicht light / easy adjective\n\nder Rucksack backpack masculine\n\nder Reisepass passport masculine\n\nder Flughafen airport masculine\n\nder Ankunftsbereich arrivals area masculine\n\nenttäuscht disappointed adjective\n\nder Ausgang exit masculine\n\ndie Tatsache fact feminine\n\nder Kaffee coffee masculine\n\nder Kamin fireplace masculine\n\nerfinden (erfunden) to invent (invented) verb\n\nlügen (gelogen) to lie (lied) verb\n\nfein fine / okay adjective", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}, {"prose": "die Lüge lie (falsehood) feminine\n\ndie Fahrt ride / trip feminine\n\nder Putz plaster masculine\n\nsich entschuldigen to apologize reflexive verb\n\ndie Wohnung apartment feminine\n\nder Aufzug elevator masculine\n\nder Angeber show-off masculine\n\ndie Theke counter feminine\n\ndas Badezimmer bathroom neuter\n\ndie Anspannung tension feminine\n\ndas Bücherregal bookshelf neuter\n\nder Kalender calendar masculine\n\nder Ex ex (ex-partner) masculine\n\nder Schlüssel key masculine\n\ndie Schwerkraft gravity feminine\n\nschwerer heavier comparative\n\ndie Frage question feminine\n\ndie Nachricht message feminine\n\ndie Heizung radiator feminine\n\ndanke thank you interjection\n\ndas Laken sheet (bedding) neuter\n\ndie Decke blanket feminine\n\nGute Nacht Good night phrase\n\nFrom this chapter: \"I could still feel the Wärme of his hand in it.\"\n\nIn German, when in means \"inside/within,\" it takes the dative case.\n\nExamples from the chapter:\n\nin his pocket in seiner Tasche\n\nin the dark im Dunkeln (in dem)\n\nfrom his hand von seiner Hand\n\nin a message in einer Nachricht\n\nWhy this matters: You don't need to memorize declension tables. You will see im (in dem), vom (von dem), zum (zu dem) hundreds of times in this book. Your brain will learn the pattern naturally — through the story.\n\nKey pattern from this chapter: \"in seiner Wohnung\" (in his apartment) — the possessive sein takes -er for feminine dative. You don't need to know that now. You just need to see it.", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}], "gate": {"clue": "What is the German word for \"to sleep\"?", "answer": "schlafen", "hint": "schlafen"}, "vocab": [{"german": "das Flugzeug", "english": "airplane"}, {"german": "die Warnung", "english": "warning"}, {"german": "die Geburt", "english": "birth"}, {"german": "die Großmutter", "english": "grandmother"}, {"german": "das Gefühl", "english": "feeling"}, {"german": "bereit", "english": "ready"}, {"german": "der Koffer", "english": "suitcase"}, {"german": "leicht", "english": "light / easy"}, {"german": "der Rucksack", "english": "backpack"}, {"german": "der Reisepass", "english": "passport"}, {"german": "der Flughafen", "english": "airport"}, {"german": "der Ankunftsbereich", "english": "arrivals area"}, {"german": "die Zeit", "english": "time"}, {"german": "grau", "english": "grey"}, {"german": "dunkel", "english": "dark"}, {"german": "warm", "english": "warm"}, {"german": "wütend", "english": "angry"}, {"german": "lachen", "english": "to laugh"}, {"german": "enttäuscht", "english": "disappointed"}, {"german": "der Ausgang", "english": "exit"}, {"german": "kalt", "english": "cold"}, {"german": "der Wind", "english": "wind"}, {"german": "der Gast", "english": "guest"}, {"german": "die Tatsache", "english": "fact"}, {"german": "der Bus", "english": "bus"}, {"german": "der Euro", "english": "euro"}, {"german": "leer", "english": "empty"}, {"german": "der Kaffee", "english": "coffee"}, {"german": "der Kamin", "english": "fireplace"}, {"german": "erfinden", "english": "(erfunden) to invent (invented)"}, {"german": "die Lüge", "english": "lie (falsehood)"}, {"german": "müde", "english": "tired"}, {"german": "die Fahrt", "english": "ride / trip"}, {"german": "der Putz", "english": "plaster / render"}, {"german": "sich", "english": "(reflexive pronoun)"}, {"german": "sich entschuldigen", "english": "to apologize"}, {"german": "die Wohnung", "english": "apartment"}, {"german": "das Sofa", "english": "sofa / couch"}, {"german": "eng", "english": "narrow / tight"}, {"german": "knarren", "english": "to creak"}, {"german": "der Aufzug", "english": "elevator"}, {"german": "der Angeber", "english": "show-off"}, {"german": "klein", "english": "small"}, {"german": "die Theke", "english": "counter"}, {"german": "das Badezimmer", "english": "bathroom"}, {"german": "die Lampe", "english": "lamp"}, {"german": "der Fleck", "english": "stain / spot"}, {"german": "nervös", "english": "nervous"}, {"german": "die Anspannung", "english": "tension"}, {"german": "das Bücherregal", "english": "bookshelf"}, {"german": "der Kalender", "english": "calendar"}, {"german": "der Schlüssel", "english": "key"}, {"german": "die Schwerkraft", "english": "gravity"}, {"german": "schwerer", "english": "heavier"}, {"german": "das Risiko", "english": "risk"}, {"german": "die Frage", "english": "question"}, {"german": "perfekt", "english": "perfect"}, {"german": "die Nachricht", "english": "message"}, {"german": "der Dampf", "english": "steam"}, {"german": "die Heizung", "english": "radiator / heating"}, {"german": "das Laken", "english": "bed sheet"}, {"german": "die Decke", "english": "ceiling / blanket"}, {"german": "gut", "english": "good"}, {"german": "die Nacht", "english": "night"}, {"german": "die Wärme", "english": "warmth"}, {"german": "danke", "english": "thank you"}, {"german": "das Gefühl", "english": "feeling"}, {"german": "glücklich", "english": "happy / lucky"}, {"german": "lügen", "english": "to lie"}, {"german": "das Gefühl", "english": "feeling"}], "shadow": ["Read this exchange aloud, then again louder. Try to match the rhythm — Matei's lines are short and flat; Yves's land harder.", "Matei: \"You're late.\"", "Yves: \"The plane was early. That's the opposite of late.\"", "Matei: \"My train was late.\"", "Yves: \"So we're both enttaeuscht.\"", "Notice: enttaeuscht falls at the end of Yves's line and carries the stress. Say it like it costs something."]}, {"id": 2, "title": "The First Morning", "scenes": [{"prose": "Not because the bed was uncomfortable — it was actually better than any bed I had slept in for the last six Monate. Not because of the Jetlag — my body had given up on time zones somewhere over the Atlantic. I didn't schlafen because I could hear Matei atmen on the Sofa.\n\nIt was a quiet sound. Stetig. The kind of breathing that said I have no problem falling asleep anywhere, anytime, because I am a normal person who doesn't überdenken everything. I hated him for it. I also wanted to lie on the floor next to the Sofa and listen to it all night, which was a much bigger Problem.\n\nAround 3 Uhr morgens, I gave up pretending. I stared at the Decke. The building made noises — pipes groaning, floorboards settling, someone upstairs walking to their Badezimmer in the Dunkeln. Berlin sounds. Not the sounds of Lagos, where the night was never really quiet — always a generator, always a car alarm, always someone's television bleeding through the wall. Here, the silence was so loud it felt like Druck.\n\nI thought about the Schlüssel. It was on the table next to the Lampe. I could see its shape in the dim light. For you, he had said. What did that even mean? People didn't just give you keys. Keys were for something. A door, a locker, a city. A Zukunft.\n\nI closed my eyes and tried to remember his face at the Flughafen. The way he had said my name. The way he had picked up my Koffer without asking.\n\nI must have fallen asleep eventually, because the next thing I knew, light was hitting my face through the window, and I could smell Kaffee.\n\nHis back was to me. He wore the same graues shirt from yesterday — or maybe a different grey shirt, I couldn't tell — and he was pouring water into a French Press with the concentration of a Chirurg.\n\nI watched him for a minute before I said anything. His shoulders were entspannt. His hair was messier than it had been at the Flughafen, like he had run his hands through it a few times. He moved slowly, bewusst, like he had done this a thousand mornings and would do it a thousand more.\n\n\"You're staring,\" he said without turning around.\n\n\"I'm observing. There's a Unterschied.\"\n\nHe turned. His grey eyes found mine.\n\n\"What's the difference?\"\n\n\"Staring is creepy. Observing is wissenschaftlich.\"\n\nHe almost smiled again. Almost.\n\n\"And which one is this?\"\n\n\"Scientific. Definitely scientific. I'm collecting Daten.\"\n\nI sat up. The Laken fell to my waist. I was still wearing the clothes I had traveled in — jeans, a black sweater, socks that had lost their partner somewhere over the Sahara. I probably looked like a Katastrophe. He didn't seem to notice.\n\n\"Data on how Berliners make coffee. For my Forschung.\"\n\n\"Your research.\"\n\n\"I'm a student of Kultur.\"\n\nHe snorted. Actually snorted. It was the first undignified sound I had heard him make.\n\n\"You're a student of avoiding questions.\"\n\nHe poured the coffee into two mugs — plain white ceramic, no logos, no sentimental messages. He handed me one. Black. No sugar. No milk. Perfekt again.\n\n\"You remembered.\"\n\n\"I told you. I remember things.\"\n\nI took a sip. It was strong. Bitter. Exactly how I liked it. The heat spread through my chest and woke up parts of my brain that had been winterruhend.\n\n\"So. What's the Plan?\"\n\n\"For today. For the week. For me not sleeping on your Sofa forever.\"\n\nHe sat on the wooden chair across from me. The plastic one was still empty. He held his mug in both hands, staring into it like it contained Antworten to questions he hadn't asked yet.\n\n\"You need a Job.\"\n\n\"I need a lot of things.\"\n\n\"A job first. Geld. Then you can find your own place.\"\n\nI nodded. That was logisch. Practical. The kind of thing a normal person would say. But something about the way he said it — your own place — made my stomach clench. Like he was already planen for me to leave.\n\n\"I didn't come here to be a Last.\"\n\n\"I'm sleeping on your Sofa.\"\n\n\"You're sleeping on my Sofa because I offered. That's not a burden. That's a Wahl.\"\n\nI wanted to argue. I wanted to say you don't even know me and why are you being nice and what do you want from me. But I didn't. Because I was afraid of the Antworten.\n\nInstead, I said, \"What kind of job?\"\n\nHe shrugged. \"There's a Café around the corner. The owner is old. She needs help in the mornings.\"", "choices": ["Notice the silence between them", "Focus on what is being said"]}, {"prose": "\"I don't speak Deutsch.\"\n\n\"You don't need to. You just need to carry plates and say bitte and danke. You can learn the rest.\"\n\n\"You already asked her.\"\n\nHe didn't confirm or deny. He just drank his coffee.\n\n\"You already asked her, didn't you?\"\n\nHe set his mug down. Met my eyes.\n\n\"She needs someone starting tomorrow. I told her I knew a person.\"\n\n\"You told her before I even arrived.\"\n\n\"I was optimistisch.\"\n\nI laughed. I couldn't help it. The Absurdität of it — this man I had only talked to online, who I had met in person less than twelve hours ago, who had already arranged a job for me in a city I had never seen — was too much.\n\n\"You're verrückt.\"\n\n\"What if I had said no?\"\n\n\"What if I'm terrible at carrying plates?\"\n\n\"Then you learn to be less terrible.\"\n\n\"What if I drop everything and she hates me?\"\n\nHe stood up. Walked to the kitchen. Rinsed his mug in the sink. When he came back, he was holding a piece of Papier — a handwritten note with an Adresse and a time.\n\n\"Tomorrow. Nine AM. Don't be late.\"\n\nI took the Papier. His handwriting was small and neat, the kind of handwriting that belonged to someone who thought before they wrote.\n\n\"You really don't know me,\" I said leise.\n\nHe looked at me for a long moment. Then he said something I would replay in my head for weeks.\n\n\"I know you drink your coffee black. I know you laugh when you're uncomfortable. I know you left home because staying hurt more than leaving. And I know you're still here, on my Sofa, even though you could have gone anywhere.\"\n\n\"That's enough to start.\"\n\nI didn't have an Antwort. So I just held the Papier and watched him put on his coat.\n\n\"Where are you going?\"\n\n\"Work. I'll be back at sechs.\"\n\n\"You work on Saturdays?\"\n\n\"I work most days.\"\n\nHe grabbed his keys from a hook by the door. Not the key he had given me — a different one, smaller, for his own Schloss. He paused with his hand on the door.\n\n\"The Café is called Morgenlicht. Morning Light. Tell the owner Matei sent you.\"\n\n\"What if she asks who I am?\"\n\nHe opened the door. The cold air from the hallway rushed in.\n\n\"Tell her you're the friend I mentioned.\"\n\nThen he was gone. The door clicked shut. I sat there in the grey morning light, holding a job offer from a man who called me a friend after knowing me for twelve hours.\n\nI drank my coffee. It was cold now. I drank it anyway.\n\nThe Wohnung felt different without him. Bigger. Leerer. The silence wasn't peaceful anymore — it was just silence. I could hear the Heizung clicking, the fridge humming, the street below coming to life. A woman called to her dog. A bicycle bell rang. Someone laughed.\n\nI looked at the Schlüssel on the table. For you.\n\nI picked it up. Walked to the door. Schloss it from the inside. Schloss auf. Locked it again. The mechanism was old — it stuck a little, required a gentle tug to turn all the way. I memorized the feel of it.\n\nThen I went back to the Sofa, lay down, and stared at the ceiling until the morning became Nachmittag.\n\nAt noon, I finally got up.", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}, {"prose": "I took a Dusche. The water pressure was terrible — a weak stream that took forever to rinse the shampoo out of my hair — but the water was hot, and the Badezimmer smelled like Matei's Seife. Something clean and neutral. Not floral, not musk. Just clean.\n\nI put on fresh clothes. The same jeans. A different sweater — dark green this time, because I had packed like a person who only owned dark colours. I looked at myself in the Spiegel over the sink. Dark circles under my eyes. Hair still wet. Haut that hadn't seen the sun in months.\n\nYou're the friend I mentioned.\n\nI didn't feel like a friend. I felt like a stranger who had wandered into someone else's life and didn't know how to leave.\n\nI left the Wohnung anyway.\n\nThe stairs were narrower in the Tageslicht. The walls were covered in old posters — concerts from the 1990s, a faded ad for a bakery that no longer existed, a handwritten sign asking tenants to please close the door quietly. I walked down slowly, counting the steps. Siebenunddreißig from the fourth floor to the ground. I didn't know why I counted. It just felt like information I might need later.\n\nThe street was different at noon. Brighter. Lauter. People walked past with shopping bags and bicycles and children holding their hands. A man sold Brezeln from a cart on the corner. The bakery on the ground floor was open now — I could see pastries in the window, a woman behind the counter with grey hair and kind eyes.\n\nI almost went in. But I didn't have Euro yet. And I didn't know the word for pastry.\n\nMorgenlicht. Morning Light.\n\nI found the Adresse on the Papier. It was three blocks away, down a street with trees and benches and a small playground where a toddler was screaming with Freude. The Café was small — smaller than Matei's Wohnung, somehow — with a green awning and chalkboard signs advertising coffee and Kuchen.\n\nI stood across the street and looked at it.\n\nTomorrow at nine. I would be here. Carrying plates. Saying bitte and danke and probably dropping things.\n\nI should have been nervös. I was nervös. But underneath the nervousness, there was something else. Something that felt like the moment before a song drops — that breathless, electric second when you know something is about to change.\n\nI pulled out my phone. No messages. No missed calls. No one had tried to reach me since I left. My Großmutter, probably, but she didn't know how to text. My coworkers, maybe, but I hadn't given them my new number. The people I had left behind — they were behind me now. Physisch. Emotionally. Whatever.\n\nI opened my messages. The last conversation was with Matei, from two years ago. Before I had decided to come. Before I had bought the ticket. Before any of this was real.\n\nMatei (two years ago): If you ever come to Berlin, I have a Sofa.\n\nMe: That's a dangerous offer.\n\nI had thought he was flirting. Or being polite. Or both. I hadn't thought he actually meant come tomorrow, I'll have a key and a job waiting.\n\nI looked up at the Café again. Morgenlicht.\n\nMaybe that was what this was. Not a fresh start — I didn't believe in those. But Licht, at least. A little bit of it. Enough to see where I was going.\n\nI walked back to the Wohnung. Counted the steps again. Siebenunddreißig. Unlocked the door — the Schlüssel worked, of course it worked — and let myself in.\n\nThe Wohnung was still empty. Still quiet. But I had been outside. I had seen the street. I had found the Café. I had taken one step toward the life Matei had apparently already geplant for me.\n\nI sat on the Sofa. Pulled out my Notizbuch — the one I wrote in when I didn't want to forget anything. And I wrote:\n\nDay 1. Berlin. Grey and cold.\n\nMatei gave me a key. And a job. And didn't ask why I came.\n\nThen I closed the Notizbuch and waited for sechs Uhr.\n\nder Jetlag jet lag masculine\n\nstetig steady / constant adjective\n\nüberdenken to overthink separable\n\ndas Problem problem neuter\n\ndie Uhr clock / o'clock feminine\n\ndie Decke ceiling feminine (also blanket)\n\ndas Dunkel darkness neuter\n\nder Druck pressure masculine\n\ndie Zukunft future feminine\n\nder Flughafen airport masculine\n\nder Chirurg surgeon masculine\n\nentspannt relaxed adjective\n\nbewusst deliberate / conscious adjective", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}, {"prose": "der Unterschied difference masculine\n\nwissenschaftlich scientific adjective\n\ndie Sahara Sahara proper noun\n\ndie Katastrophe disaster feminine\n\ndie Forschung research feminine\n\ndie Kultur culture feminine\n\nwinterruhend hibernating adjective (poetic)\n\ndie Antwort answer feminine\n\nDeutsch German (language) neuter\n\noptimistisch optimistic adjective\n\ndie Absurdität absurdity feminine\n\ndie Adresse address feminine\n\nleise quiet / softly adjective/adverb\n\nMorgenlicht Morning Light proper noun\n\nleerer emptier comparative\n\nabschließen to lock separable\n\naufschließen to unlock separable\n\nder Nachmittag afternoon masculine\n\ndie Dusche shower feminine\n\nder Spiegel mirror masculine\n\ndas Tageslicht daylight neuter\n\nsiebenunddreißig thirty-seven number\n\ndie Brezel pretzel feminine\n\nphysisch physical / physically adjective/adverb\n\ndas Notizbuch notebook neuter\n\nsechs Uhr six o'clock time expression\n\nFrom this chapter: \"I picked it up. Walked to the door. Schloss it from the inside. Schloss auf.\"\n\nIn German, many verbs have a prefix that separates and goes to the end of the clause.\n\nExamples from the chapter:\n\nInfinitive Meaning Present tense example\n\nabschließen to lock Ich schließe die Tür ab\n\naufschließen to unlock Er schließt die Tür auf\n\nanrufen to call (by phone) Sie ruft mich an\n\nKey pattern: The prefix (ab-, auf-, an-) goes to the end of the sentence. The main verb is conjugated and stays in position 2.\n\nFrom later in the story you will see: \"Ich rufe dich später an\" (I'll call you later).\n\nWhy this matters: You don't need to memorize the rule. You just need to notice that every time Matei locks or unlocks a door, abschließen and aufschließen appear with the prefix at the end. After seeing it 20+ times, your brain will expect it.", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}], "gate": {"clue": "What is the German word for \"neighbour\"?", "answer": "nachbar", "hint": "der Nachbar"}, "vocab": [{"german": "schlafen", "english": "to sleep"}, {"german": "der Monat", "english": "month"}, {"german": "der Jetlag", "english": "jet lag"}, {"german": "atmen", "english": "to breathe"}, {"german": "stetig", "english": "steady / constant"}, {"german": "überdenken", "english": "to overthink"}, {"german": "das Problem", "english": "problem"}, {"german": "die Uhr", "english": "clock / o'clock"}, {"german": "die Decke", "english": "ceiling"}, {"german": "das Dunkel", "english": "darkness"}, {"german": "der Druck", "english": "pressure"}, {"german": "die Zukunft", "english": "future"}, {"german": "der Flughafen", "english": "airport"}, {"german": "der Chirurg", "english": "surgeon"}, {"german": "entspannt", "english": "relaxed"}, {"german": "bewusst", "english": "deliberate / conscious"}, {"german": "der Unterschied", "english": "difference"}, {"german": "wissenschaftlich", "english": "scientific"}, {"german": "die Daten", "english": "data"}, {"german": "die Sahara", "english": "Sahara proper"}, {"german": "die Katastrophe", "english": "disaster"}, {"german": "die Forschung", "english": "research"}, {"german": "die Kultur", "english": "culture"}, {"german": "bitter", "english": "bitter"}, {"german": "winterruhend", "english": "hibernating"}, {"german": "der Plan", "english": "plan"}, {"german": "die Antwort", "english": "answer"}, {"german": "der Job", "english": "job"}, {"german": "das Geld", "english": "money"}, {"german": "logisch", "english": "logical"}, {"german": "das Sofa", "english": "sofa / couch"}, {"german": "das Badezimmer", "english": "bathroom"}, {"german": "der Schlüssel", "english": "key"}, {"german": "die Lampe", "english": "lamp"}, {"german": "das Laken", "english": "bed sheet"}, {"german": "perfekt", "english": "perfect"}, {"german": "bitte", "english": "please / here you go"}, {"german": "danke", "english": "thank you"}, {"german": "das Schloss", "english": "lock / castle"}, {"german": "die Wohnung", "english": "apartment"}, {"german": "die Heizung", "english": "radiator / heating"}, {"german": "nervös", "english": "nervous"}, {"german": "die Absurdität", "english": "absurdity"}, {"german": "verrückt", "english": "crazy / mad"}, {"german": "siebenunddreißig", "english": "thirty-seven"}, {"german": "die Großmutter", "english": "grandmother"}, {"german": "abschließen", "english": "to lock"}, {"german": "aufschließen", "english": "to unlock"}, {"german": "schließen", "english": "to close / lock"}, {"german": "die Tür", "english": "door"}, {"german": "schließen", "english": "to close / lock"}, {"german": "später", "english": "later"}, {"german": "schließen", "english": "to close / lock"}, {"german": "schließen", "english": "to close / lock"}], "shadow": ["Read this aloud twice — once at normal speed, once slower.", "Yves: \"You're staring.\"", "Matei: \"I'm observing. There's a Unterschied.\"", "Yves: \"What's the difference?\"", "Matei: \"Staring is creepy. Observing is wissenschaftlich.\"", "Focus on wissenschaftlich — five syllables: wis-sen-schaft-lich. Put the stress on WISS."]}, {"id": 3, "title": "Six O'Clock", "scenes": [{"prose": "I spent the Nachmittag trying not to watch the door.\n\nIt is harder than it sounds. The Wohnung was klein. The door was right there, three meters from the Sofa, with its old brass handle and the crack in the wood where someone had probably kicked it once. Every time a Nachbar walked up the stairs, I looked up. Every time someone laughed in the Flur, I held my breath. By half past five, I had given up pretending and was just openly staring at the handle, waiting for it to turn.\n\nThis was erbärmlich. I knew it was erbärmlich. I had known Matei for less than twenty-four hours. He was a Fremder. A nice stranger who gave me keys and job leads and coffee made exactly the way I liked it, but still. A Fremder. I didn't need to be counting the Minuten until he came back.\n\nAt 5:47, the stairs creaked. Footsteps. Slow, bedacht, the kind of footsteps that belonged to someone who wasn't in a hurry because they knew exactly where they were going. I recognized them. Which was verrückt, because I had only heard him walk once, last night, when he had gone from the kitchen to the Sofa. But I recognized them anyway.\n\nThe Schlüssel turned in the Schloss. The door opened. Matei stepped inside, bringing a gust of cold air and the smell of the street — diesel, Regen, something baking from the bakery downstairs.\n\nHe looked at me. I looked at him.\n\n\"You're still here,\" he said.\n\n\"You sound surprised.\"\n\n\"I'm not surprised.\" He hung his coat on a hook by the door. \"I'm just... bemerkend.\"\n\nHe walked to the kitchen. I heard him open the Kühlschrank. Then the freezer. Then the Kühlschrank again.\n\n\"I didn't buy food,\" he said.\n\n\"I was going to buy food.\"\n\n\"But you didn't.\"\n\nHe turned around. His expression was almost verlegen — a faint flush at the tops of his cheeks.\n\nMatei, it turned out, was the kind of person who forgot to buy groceries because he was too busy working and arranging jobs for strangers and being quietly kompetent at everything except feeding himself. I filed that information away in the useful part of my brain.\n\n\"There's a Supermarkt around the corner,\" I said. \"I saw it when I went out.\"\n\n\"To find the Café. The one you got me the job at.\"\n\n\"Ah.\" He nodded slowly. \"And?\"\n\n\"And it exists. It has a green awning. It smells like bread from three blocks away.\"\n\n\"That's the one.\"\n\nWe stood there for a moment. The Kühlschrank hummed. Somewhere upstairs, someone was playing the same Frank Ocean album I had seen on his Regal.\n\n\"I can cook,\" I said. \"If you buy the food.\"\n\nHe raised an eyebrow. \"You can cook?\"\n\n\"I can cook. Don't look so surprised.\"\n\n\"You just arrived in a country where you don't speak the language, you're sleeping on a stranger's Sofa, and you're telling me you can cook.\"\n\n\"I'm full of surprises.\"\n\nHe almost smiled again. That was three times now. I was keeping count.\n\nHe grabbed his coat. \"Komm.\"\n\nThe Supermarkt was called Netto and it was exactly as depressing as every budget supermarket I had ever been in. Leuchtstoffröhren, Linoleum floors, shopping carts with wonky wheels. But it was warm, and it had food, and Matei walked through the aisles like a man on a mission.\n\nI followed him with a Korb. He threw things in without looking at prices. Pasta. Tomaten. A tube of tomato paste. Zwiebeln. Knoblauch. A block of Parmesan that cost more than my entire outfit.\n\n\"You're not going to let me pay for any of this, are you?\" I said.\n\n\"You don't have Euro.\"\n\n\"I can get Euro.\"\n\n\"Tomorrow. After your first Schicht. Tonight, I buy.\"\n\nI wanted to argue. I always wanted to argue. Arguing was my Standardeinstellung — it kept people at a distance, which was where I liked them. But Matei wasn't looking at me like he expected a fight. He was just... buying groceries. Like it was the most normal thing in the world to feed a stranger.\n\n\"What are we making?\" he asked.\n\n\"I'm a simple person.\"\n\nHe glanced at me. His grey eyes caught the Leuchtstofflicht.\n\n\"No, you're not.\"\n\nI didn't know what to say to that. So I grabbed a bag of Salz and threw it in the Korb and didn't say anything.", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}, {"prose": "Back at the Wohnung, I took over the kitchen.\n\nIt wasn't much of a kitchen — two Brenner, a sink, a mini-fridge that made a sound like a dying animal. But the knife was sharp, and the pot was the right size, and I had made this Soße a hundred times in a dozen different kitchens. It was the only Rezept I knew by heart. My Großmutter's, sort of. She had never written it down. I had watched her make it for years, standing on a Hocker so I could see the counter, and by the time I was fifteen, I could make it with my eyes closed.\n\nMatei sat on the plastic chair and watched me chop Zwiebeln. He didn't talk. He didn't hover. He just sat there with his hands in his lap, observing.\n\n\"You're staring,\" I said, not looking up.\n\n\"I'm observing. There's a Unterschied.\"\n\nI laughed. \"That's my line.\"\n\n\"I know.\" His voice was quiet. \"I liked it.\"\n\nThe onions made my eyes water. Or maybe it was something else. I wiped my face with the back of my hand and kept chopping.\n\nThe Soße came together the way it always did — onions first, until they were soft and golden, then Knoblauch, then the Tomaten, then a long, slow simmer while the pasta water boiled. The kitchen got hot and steamy. The windows fogged up. The whole Wohnung started to smell like my childhood, which was a weird thing to experience in Berlin, in a stranger's kitchen, with a man watching me from a plastic chair.\n\n\"You've done this before,\" Matei said.\n\n\"Once or twice.\"\n\n\"More than once or twice.\"\n\nI stirred the Soße. \"My Großmutter taught me. She said a man who can cook will never starve and will never be alone.\"\n\n\"She sounds weise.\"\n\n\"She sounds like she wanted me to get married.\"\n\nHe made a sound — not quite a laugh, but close.\n\n\"I'm here, aren't I? Alone. Cooking for a stranger.\"\n\nThe word alone hung in the air. I hadn't meant to say it. But it was true. I was alone. I had been alone for years, even when I was surrounded by people. Maybe especially then.\n\nMatei stood up. He walked to the kitchen — the three steps it took — and stood next to me at the counter. Close enough that I could feel the heat from his arm. Close enough that I could smell his coat on his skin — cold air and coffee.\n\n\"You're not alone right now.\"\n\nI didn't look at him. I stared at the Soße. It was bubbling, which meant I should turn down the heat, but my hand wouldn't move.\n\n\"You don't know me,\" I said again. It was becoming my Refrain.\n\n\"I know enough.\"\n\n\"That's not the same as knowing someone.\"\n\nHe was quiet for a moment. Then he said, \"No. It's not. But it's a start.\"\n\nI turned the heat down. My hand was steady. I was proud of that.\n\nWe ate at the table. The two mismatched chairs — me on the wooden one, him on the plastic one. The Lampe cast a yellow circle of light over our Teller. The pasta was good — not great, but good. The Soße had simmered long enough. The cheese was expensive enough to taste like actual cheese instead of sawdust.\n\nMatei ate slowly. Methodisch. He twirled the pasta around his fork like he had been taught to do it properly, which was more than I could say for myself. I stabbed mine and hoped for the best.\n\n\"This is good,\" he said.\n\n\"You sound surprised.\"\n\n\"I'm not surprised. I'm... anerkennend.\"\n\n\"No.\" He set his fork down. \"Surprised means I didn't expect it. Acknowledging means I knew you could do it, and now I'm saying thank you.\"\n\n\"You knew I could cook?\"\n\n\"You told me. Two years ago. In a Nachricht.\"\n\nI searched my memory. Late nights, phone screens, words that felt safe because they were going to someone who couldn't see my face. I had told him a lot of things. Some of them I had forgotten. Some of them I was trying to forget.\n\n\"I don't remember telling you that.\"\n\n\"You did.\" He picked up his fork again. \"You said your Großmutter's pasta was the only thing that made you feel like you had a home.\"\n\nThe fork in my hand stopped halfway to my mouth.\n\n\"You said a lot of things.\"\n\nI put the fork down. My appetite was gone. Not because the food was bad — it wasn't — but because I was realizing, slowly and painfully, that Matei had been paying attention. To everything. To throwaway lines from two years ago. To the way I drank my coffee. To the fact that I was sad at the Flughafen even though I was smiling.", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}, {"prose": "\"Why do you remember all of that?\"\n\nHe chewed. Swallowed. Took a sip of water. Then he looked at me with those grey eyes, and for the first time, he didn't look calm. He looked uncertain. Like he was deciding whether to tell the truth.\n\n\"Because no one had ever told me anything like that before. And I wanted to know why.\"\n\n\"Why you sounded so einsam.\"\n\nThe word hit me like a door slamming. Lonely. Not sad. Not tired. Lonely. He had seen it in my messages, in my voice, in the way I had laughed when he picked up my Koffer. He had seen it, and he had remembered, and he had given me a key anyway.\n\n\"I'm not lonely,\" I said. The lie tasted like Asche.\n\nMatei didn't call me out. He just nodded, finished his pasta, and took his plate to the sink.\n\n\"Thank you for dinner. It was the best meal I have had in months.\"\n\n\"Probably. But true.\"\n\nI sat at the table for a long time after he had gone to the Badezimmer. The Lampe buzzed. The Heizung clicked. Somewhere downstairs, the bakery was closing — I could hear the metal grate being pulled down over the window.\n\nI had come to Berlin to get away from people who knew me. I had come to be anonymous, to start over, to build a version of myself that didn't carry the Gewicht of everything I had left behind. But Matei already knew me. Not the facts — the surface things, the things you could fit into a Nachricht. He knew the shape of me. The lonely parts. The parts that drank black coffee and made pasta from memory and laughed when they were uncomfortable.\n\nI didn't know if that was a good thing or a terrible thing.\n\nI picked up my plate. Walked it to the sink. Rinsed it. Dried it. Put it in the cabinet where I had seen him take plates this morning.\n\nThen I went back to the Sofa and waited for him to come out of the Badezimmer.\n\nHe didn't go back to the plastic chair. He sat on the other end of the Sofa — the end that wasn't stained, the end that faced the window. The cushion sank under his weight. He was closer than he had been all night. Not touching. But close.\n\n\"Tomorrow, you start at the Café.\"\n\n\"Are you nervös?\"\n\nHe nodded like that was the right answer.\n\n\"Good. Terror means you care.\"\n\n\"Or it means I have Angst.\"\n\nI laughed. He didn't. But his hand was on the cushion between us, close enough that I could see the veins on the back of it, the small scar on his thumb, the way his fingers rested like they were waiting for something.\n\n\"Why did you really give me the Schlüssel?\"\n\nHe didn't answer right away. The room was dark except for the Lampe. His profile was sharp against the window — the curve of his jaw, the slope of his nose, the dark hair falling over his forehead.\n\n\"Because I wanted you to come back.\"\n\n\"Come back from where?\"\n\n\"From wherever you were going to go after you left my Wohnung.\"\n\nI frowned. \"I wasn't going anywhere.\"\n\n\"You were.\" He turned to look at me. His eyes were almost black in the dim light. \"You have that look. The look of someone who is always planning their exit. I wanted to give you a reason to stay.\"\n\nMy heart was doing something stupid in my chest. A stutter. A skip. The kind of thing that happened in bad Romanzen and not in real life.\n\n\"You don't even know me,\" I said for the third time that day.\n\nHe reached out. His hand covered mine. Warm. Calloused. Real.\n\n\"I know you drink your coffee black. I know you laugh when you're uncomfortable. I know you left home because staying hurt more than leaving. I know you make pasta like someone who learned from a Großmutter who loved you. And I know you're still here.\"\n\n\"That's enough to start.\"\n\nI didn't pull my hand away. I should have. I should have made a joke, changed the subject, retreated to the bed and pretended this conversation hadn't happened. But I was tired of retreating. Tired of planning my exit. Tired of being the person who always left first.\n\n\"Okay. That's enough to start.\"\n\nHis thumb moved across my Knöchel. Once. Twice. Then he let go and stood up.\n\n\"Gute Nacht, Yves.\"\n\n\"Gute Nacht, Matei.\"\n\nHe walked to the Sofa. The one he had given up for me. He lay down with his back to the room, his coat pulled over him like a blanket.\n\nI lay down in the bed. The sheets still smelled like his detergent. The pillow still held the shape of his head.", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}, {"prose": "I stared at the ceiling and listened to him breathe. Stetig. Quiet. Not asleep yet, but close.\n\nAnd for the first time in years, I didn't feel like running.\n\nder Nachbar neighbor masculine\n\nder Flur hallway masculine\n\nerbärmlich pathetic adjective\n\nder Fremder stranger masculine\n\ndie Minute minute feminine\n\nbedacht deliberate adjective\n\nbemerkend noticing present participle\n\nder Kühlschrank refrigerator masculine\n\nverlegen embarrassed adjective\n\nkompetent competent adjective\n\nder Supermarkt supermarket masculine\n\nNetto Netto (store) proper noun\n\ndie Leuchtstoffröhre fluorescent tube feminine\n\ndie Tomate tomato feminine\n\ndie Zwiebel onion feminine\n\nder Knoblauch garlic masculine\n\nder Parmesan parmesan masculine\n\ndie Schicht shift (work) feminine\n\ndie Standarteinstellung default setting feminine\n\ndas Leuchtstofflicht fluorescent light neuter\n\nder Brenner burner masculine\n\nder Hocker stool masculine\n\nder Refrain refrain masculine\n\nder Teller plate masculine\n\nmethodisch methodical adjective\n\nanerkennend acknowledging present participle\n\ndie Angst fear / anxiety feminine\n\ndie Romanze romance feminine\n\nder Knöchel knuckle masculine\n\nFrom this chapter: No explicit weil yet, but it is coming. Let me introduce it now because it is essential for B2.\n\nIn German, when you use weil (because), the verb goes to the end of the clause.\n\nEnglish order German order\n\nI stayed home because I was tired. Ich blieb zu Hause, weil ich müde war.\n\nI didn't sleep because I was nervous. Ich habe nicht geschlafen, weil ich nervös war.\n\nKey pattern: weil kicks the verb to the end.\n\nWhy this matters: Starting in Chapter Four, you will see weil clauses. When you do, notice where the verb goes. After 10-15 examples, you will start to feel when to put the verb at the end — without memorizing a rule.\n\nTip: Think of weil as a \"verb kicker\" — it kicks the verb to the end of the sentence.", "choices": ["Notice the silence between them", "Focus on what is being said"]}], "gate": {"clue": "What is the German word for \"alarm clock\"?", "answer": "wecker", "hint": "der Wecker"}, "vocab": [{"german": "der Nachbar", "english": "neighbor"}, {"german": "der Flur", "english": "hallway"}, {"german": "erbärmlich", "english": "pathetic"}, {"german": "der Fremder", "english": "stranger"}, {"german": "die Minute", "english": "minute"}, {"german": "bedacht", "english": "deliberate"}, {"german": "der Regen", "english": "rain"}, {"german": "bemerkend", "english": "noticing present participle"}, {"german": "der Kühlschrank", "english": "refrigerator"}, {"german": "verlegen", "english": "embarrassed"}, {"german": "kompetent", "english": "competent"}, {"german": "der Supermarkt", "english": "supermarket"}, {"german": "das Regal", "english": "shelf"}, {"german": "Komm!", "english": "Come! imperative"}, {"german": "Netto", "english": "Netto (store) proper"}, {"german": "die Leuchtstoffröhre", "english": "fluorescent tube"}, {"german": "Linoleum", "english": "linoleum"}, {"german": "der Korb", "english": "basket"}, {"german": "die Pasta", "english": "pasta"}, {"german": "die Tomate", "english": "tomato"}, {"german": "die Zwiebel", "english": "onion"}, {"german": "der Knoblauch", "english": "garlic"}, {"german": "der Parmesan", "english": "parmesan"}, {"german": "die Schicht", "english": "shift (work)"}, {"german": "die Standarteinstellung", "english": "default setting"}, {"german": "das Leuchtstofflicht", "english": "fluorescent light"}, {"german": "das Salz", "english": "salt"}, {"german": "der Brenner", "english": "burner"}, {"german": "die Soße", "english": "sauce"}, {"german": "das Rezept", "english": "recipe"}, {"german": "die Wohnung", "english": "apartment"}, {"german": "klein", "english": "small"}, {"german": "das Sofa", "english": "sofa / couch"}, {"german": "der Schlüssel", "english": "key"}, {"german": "das Schloss", "english": "lock / castle"}, {"german": "die Lampe", "english": "lamp"}, {"german": "die Nachricht", "english": "message"}, {"german": "das Badezimmer", "english": "bathroom"}, {"german": "die Heizung", "english": "radiator / heating"}, {"german": "nervös", "english": "nervous"}, {"german": "gut", "english": "good"}, {"german": "die Nacht", "english": "night"}, {"german": "weil", "english": "because"}, {"german": "müde", "english": "tired"}, {"german": "verrückt", "english": "crazy / mad"}, {"german": "die Leuchtstoffröhre", "english": "fluorescent tube"}, {"german": "die Großmutter", "english": "grandmother"}, {"german": "der Knöchel", "english": "knuckle / ankle"}, {"german": "die Leuchtstoffröhre", "english": "fluorescent tube"}], "shadow": ["Practise this exchange for natural café German.", "Frau Schmidt: \"Was moechten Sie?\"", "Yves: \"Einen Kaffee, bitte.\"", "Frau Schmidt: \"Schwarz?\"", "Yves: \"Ja. Schwarz. Kein Zucker, keine Milch.\"", "Moechten Sie is formal. Later in the book you will hear Yves say it to customers. Notice when the shift happens."]}, {"id": 4, "title": "Morning Light", "scenes": [{"prose": "I woke up before my Wecker.\n\nThat never happened. I was the kind of person who hit snooze at least three times, who verhandelte with myself about five more minutes, who treated mornings like an enemy to be defeated through sheer Sturheit. But at 7:15 AM, my eyes opened, and I was fully awake, and my first thought was Matei is still asleep on the Sofa.\n\nI lay there for a minute, listening. His breathing was slow and deep. He had fallen asleep on his back last night — I could hear the soft Rhythmus, the occasional pause, the way his breath caught when he turned over. The Sofa creaked. Then silence again.\n\nI got up quietly. The floorboards were cold under my bare feet. I stepped around the creaky spots — I had kartiert them last night, because that was the kind of person I was now — and made my way to the Badezimmer.\n\nThe shower was terrible again. Low pressure, lauwarm water, a curtain that tried to attack me every time I moved. But I was getting used to it. That was the thing about terrible things. You learned to live with them.\n\nI dressed in my only clean clothes. Dark jeans. A black sweater that had a small hole in the sleeve. The same boots I had worn on the plane. I looked at myself in the Spiegel. Same face. Same dark circles. Same hair that weigerte sich to do what I wanted.\n\nYou are starting a job today, I told my reflection. In a country where you don't speak the language. For a woman you have never met. Because a stranger arranged it for you.\n\nMy reflection didn't look beeindruckt.\n\nMatei was still asleep when I came out of the Badezimmer.\n\nI stood over him for a second — not creepy, just observational — and took in the details I hadn't noticed before. The way his dark hair lockte sich at the ends. The small scar on his chin, like he had fallen as a child. The way his hand rested on his chest, fingers curled loosely.\n\nHe looked younger when he slept. Less wachsam. Less like a man who remembered everything and more like a boy who hadn't learned to build walls yet.\n\nI turned away before I could do something stupid, like touch his face.\n\nIn the kitchen, I found coffee beans, a grinder, and the French press. I had watched him make it yesterday. I kopierte the movements — scoop, grind, pour, wait. The coffee smelled like hope. Or maybe I was just hungry.\n\nI poured two mugs. Black. No sugar. No milk. I set one on the table next to the Sofa, within reaching distance of his hand.\n\nThen I put on my coat, grabbed the Schlüssel — my key, the one he had given me — and left.\n\nThe street was different at 8 AM. Brighter. Betriebsamer. People walked with purpose, carrying coffee cups and briefcases and the tired expressions of people who hadn't slept enough. A man ran past me in workout clothes, headphones blaring music I could hear from ten meters away. The bakery on the ground floor was already open, and the smell of fresh bread made my stomach growl.\n\nI walked to Morgenlicht. Three blocks. Past the playground with the screaming toddler — she was there again, same pink coat, same joyful shriek. Past the bench where an old woman fed Tauben. Past the tree with the crooked branch that looked like it was pointing at the Café.\n\nThe green awning was out. The chalkboard sign said Heute geöffnet — I didn't know what that meant, but I assumed it was good. Through the window, I could see a woman behind the counter. Grey hair. Kind eyes. The same woman I had seen yesterday through the window.\n\nI stood across the street for a full minute, pretending I wasn't verängstigt.\n\nThe door made a chiming sound when I opened it. A little bell, the kind you saw in old movies. The woman looked up. She had a round face, red cheeks, and hands that were covered in Mehl.\n\n\"Guten Morgen,\" she said.\n\nI opened my mouth. Closed it. Opened it again.\n\n\"Um. Matei sent me.\"\n\nHer face broke into a smile.\n\n\"Ah! Der Freund.\" She wiped her hands on her apron and came around the counter. She was shorter than me — a lot shorter — and she moved like someone who had been standing behind this counter for decades.\n\n\"I'm sorry,\" I said. \"I don't speak German. Not really. A few words. Almost none.\"\n\nShe waved a hand. \"Kein Problem. You speak English. I speak a little. We manage.\"\n\n\"You're the owner?\"\n\n\"I am Frau Schmidt. And you are Yves.\" She said it Eevs, with a soft V, like she was trying to taste the word. \"Matei told me about you.\"\n\n\"What did he tell you?\"\n\nShe smiled again. \"That you need Arbeit. That you are serious. That you make good coffee.\"\n\nI hadn't made him coffee. He had made me coffee. Twice. But I didn't correct her.\n\n\"I can learn. I learn fast.\"\n\n\"Gut.\" She nodded. \"Then you start now.\"\n\nThe next four hours were a blur of coffee cups, plates, and the word bitte.\n\nFrau Schmidt showed me everything. How to work the espresso machine — a brass monster that fauchte like an angry cat. How to arrange the pastries in the display case so they looked like art instead of food. How to say \"What would you like?\" in German — Was möchten Sie? — and how to smile when I didn't understand the answer.\n\nI dropped a cup. Only one. It shattered on the floor, and Frau Schmidt swept it up without comment, and I wanted to die.\n\n\"First time?\" she asked.\n\n\"You will drop more. It's okay.\"\n\nBy noon, I was exhausted. My feet hurt. My back hurt. My face hurt from smiling at strangers. But I had learned four new Phrasen: Bitte schön (here you go), Danke schön (thank you very much), Entschuldigung (sorry/excuse me), and Tschüss (goodbye). I had served twelve customers. I had made eight cappuccinos, three lattes, and one hot chocolate that the customer said was \"perfect\" in English, which was probably a lie but I took it anyway.", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}, {"prose": "Frau Schmidt made me sit down at a table and eat a Gebäck. Apricot. Warm. Flaky. The best thing I had tasted since I had arrived.\n\n\"You did good,\" she said, sitting across from me.\n\n\"I dropped a cup.\"\n\n\"I dropped ten my first day. You will drop more. This is the way.\"\n\nI ate another bite of the pastry. It was so good I almost forgot to be ängstlich.\n\n\"What did Matei actually say about me? When he told you I needed a job.\"\n\nShe tilted her head. Her grey hair caught the light.\n\n\"He said you were a Freund. That you came from far away. That you needed a Chance.\"\n\n\"That is enough.\" She reached across the table and patted my hand. Her fingers were warm and floury. \"You are here now. The rest is just Arbeit.\"\n\nI walked back to the Wohnung at 1 PM. The sun was actually out — a pale, watery sun that didn't warm anything but looked nice anyway. The streets were quieter now. Lunchtime. People eating inside, behind windows, their faces blurred by steam.\n\nI had money in my pocket. Not much — Frau Schmidt had paid me cash for the half day, thirty Euro in crumpled bills that smelled like coffee. It was the first money I had earned in a new country. I held it in my hand as I walked, feeling the Gewicht of it.\n\nI stopped at the Supermarkt. Netto again. The same fluorescent lights, the same wonky carts. I bought bread. Cheese. A bag of apples. A bottle of water. I spent seven Euro and felt rich.\n\nThe stairs were still siebenunddreißig steps. The Schlüssel still stuck a little. The Wohnung was empty when I opened the door.\n\nOf course he wasn't. He had a job. A life. Things to do that didn't involve sitting on the Sofa waiting for me to come back. But still. The silence felt louder than it had yesterday.\n\nI put the groceries away. Made myself a sandwich. Sat on the wooden chair and ate it while staring at the wall. The clock on the wall — I hadn't noticed it before — tickte slowly. Tick. Tick. Tick. Like it was counting down to something.\n\nI pulled out my Notizbuch.\n\nDay 2. First day at Morgenlicht.\n\nI dropped one cup. Frau Schmidt didn't fire me.\n\nI learned: Bitte schön, Danke schön, Entschuldigung, Tschüss.\n\nMatei wasn't here when I got back.\n\nI don't know why that bothers me.\n\nI closed the Notizbuch. Stared at the wall some more.\n\nAt 2 PM, I couldn't take it anymore. I put on my coat and went out again.\n\nBerlin was different in the afternoon. Less grey. More alive. I walked without a destination, just moving, just seeing. Past a park where kids were playing Fußball. Past a bookstore with a display of books in the window — all German, all incomprehensible, all beautiful. Past a man playing guitar on the corner, singing something slow that I almost recognized.\n\nI found myself at a bridge. A small one, over a Kanal. The water was greenish-brown and moved slowly. I leaned on the Geländer and watched a duck paddle in circles.\n\nThis was my city now. My bridge. My duck.\n\nIt felt fake. Like I was playing a role in a movie about someone else's life. But I was here. I was really here. And I hadn't run away yet.\n\nMy phone buzzed. A message. Unknown number.\n\nI stared at it. No one had my number. No one except — I scrolled up. The last message was from Matei, two years ago. But this number was different. This was a German number.\n\nHow did you get my number?\n\nYou gave it to me. Two years ago. In a message.\n\nI laughed out loud. The duck looked at me.\n\nYou remember everything, I typed.\n\nI told you. I remember things.\n\nA pause. Then another message.\n\nIt was bread and cheese. That's food.\n\nCome to the bookstore on Karl-Marx-Allee at 7. I will buy you dinner.\n\nI stared at the message. Karl-Marx-Allee. I didn't know where that was. I didn't care.\n\nYou were late at the airport.\n\nThe plane was early. That's different.", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}, {"prose": "He didn't respond. But he didn't need to. I could feel him smiling on the other end. Or maybe that was just wishful thinking.\n\nAt 6:30, I started getting ready. Which was ridiculous, because I had exactly two outfits and neither of them was impressive. I put on the other sweater — the dark grey one, no holes yet — and tried to do something with my hair. It looked the same. It always looked the same.\n\nI looked at myself in the Badezimmer mirror.\n\nYou are going to dinner with a man who gave you a key and a job and said you weren't alone.\n\nThat's not a date, I told my reflection.\n\nKarl-Marx-Allee was wider than any street I had seen in Berlin. Big buildings on both sides, old and grand, the kind of architecture that looked like it belonged to a different century. There were shops and restaurants and people everywhere, even at 7 PM on a Sunday.\n\nThe bookstore was on the corner. Bücher &amp; Co. A sign in the window said Englische Bücher — English books — and I felt a small wave of relief.\n\nMatei was standing outside. He wasn't looking at his phone. He was just standing there, hands in his coat pockets, watching the street. When he saw me, he didn't wave. He just nodded, like he had been expecting me exactly at this moment.\n\n\"You're not late.\"\n\n\"You also told me you made a sandwich for lunch. I'm still judging you for that.\"\n\nWe walked into the bookstore. It was warm inside, and it smelled
