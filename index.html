"}, {"german": "wissen / weiß", "english": "to know / white"}, {"german": "essen", "english": "to eat"}, {"german": "nächste", "english": "next"}], "shadow": ["Feedback and correction German — workplace register:", "Das haben Sie gut gemacht. — You did that well.", "Hier gibt es noch Verbesserungspotenzial. — There is still room for improvement here.", "Naechstes Mal bitte [Anweisung]. — Next time please [instruction].", "Ich habe Ihre Anmerkung notiert. — I have noted your comment.", "Verbesserungspotenzial — literally improvement-potential — is how German professional culture softens criticism without removing it. Learn to hear it clearly."]}, {"id": 25, "title": "Das Heimweh", "scenes": [{"prose": "Es begann mit einem Kitzeln im Hals.\n\nNichts Schlimmes. Nur ein kleines Kratzen. Ich dachte, es wäre vom vielen Reden. Vom vielen Deutsch. Vom vielen Erklären, warum die Firewall nicht mit der Datenbank spricht.\n\n\"Du klingst komisch,\" sagte Mira am Morgen.\n\n\"Ich fühle mich komisch.\"\n\n\"Du siehst blass aus.\"\n\n\"Ich bin Nigerianer. Blass ist mein natürlicher Zustand.\"\n\n\"Nigerianer sind nicht blass.\"\n\n\"Dieser Nigerianer schon. Stress macht blass.\"\n\nSie gab mir einen Tee. Grünen Tee. Mit Ingwer. Ich trank ihn. Er war ekelhaft. Aber er half. Ein bisschen.\n\nAm Nachmittag fühlte ich mich schlechter.\n\nMeine Nase lief. Meine Augen juckten. Mein Kopf fühlte sich an wie ein voller Kaffeesatz.\n\n\"Geh nach Hause,\" sagte Herr Weber.\n\n\"Ich kann nicht. Ich muss das Projekt fertig machen.\"\n\n\"Das Projekt kann warten. Deine Gesundheit nicht.\"\n\n\"Das ist sehr vernünftig von Ihnen.\"\n\n\"Ich bin sehr vernünftig. Das ist mein Problem.\"\n\nEr gab mir eine Tüte mit Hustenbonbons. Minze. Die starke Sorte. Ich aß drei auf einmal.\n\nMatei war bei der Arbeit. Die Wohnung war leer. Nur Matei Jr. auf dem Fensterbrett. Lebendig. Überlebendig. Urteilend.\n\n\"Ich bin krank,\" sagte ich zu der Pflanze.\n\nDie Pflanze antwortete nicht.\n\n\"Du bist kein guter Zuhörer.\"\n\nDie Pflanze antwortete immer noch nicht.\n\nIch legte mich auf das Sofa. Die Decke war dünn. Das Kissen war hart. Die Heizung klickte. Alles fühlte sich falsch an.\n\nNicht weil ich krank war. Sondern weil ich allein war.\n\nZum ersten Mal seit Monaten. Seit meiner Ankunft in Berlin. Seit dem Schlüssel. Seit Matei.\n\n\"Das ist lächerlich,\" sagte ich zu mir selbst. \"Du bist kein Kind. Du kannst allein sein.\"\n\nIch konnte nicht allein sein.\n\nMein Handy lag auf dem Tisch.\n\nIch starrte es an. Die Kontakte. Die Nummern. Die Menschen, die ich zurückgelassen hatte.\n\nMeine Großmutter. Ada. Die alte Nachbarin mit dem Hund. Die Kollegen aus Lagos, die mich nie angerufen hatten.\n\n\"Ruf sie nicht an,\" sagte ich zu mir selbst.\n\nDas Telefon klingelte viermal.\n\nDann ihre Stimme. Trocken. Alt. Dieselbe Stimme, die mich als Kind ausgeschimpft hatte, weil ich zu laut war, zu leise, zu viel, zu wenig.\n\n\"Hallo, Großmutter.\"\n\n\"Du bist krank.\"\n\n\"Woher weißt du das?\"\n\n\"Weil du mich nur anrufst, wenn du krank bist oder Geld brauchst.\"\n\n\"Ich brauche kein Geld.\"\n\n\"Dann bist du krank.\"\n\nIch schwieg. Sie schwieg. Das Telefon rauschte.\n\n\"Wie geht es dir?\" fragte ich.\n\n\"Ich bin alt. Alten Menschen geht es schlecht. Das ist normal.\"\n\n\"Das ist nicht normal.\"\n\n\"Doch. Du wirst es auch merken. Irgendwann.\"\n\n\"Das ist nicht nett.\"\n\n\"Ich bin nicht nett. Ich bin deine Großmutter. Das ist ein Unterschied.\"\n\n\"Yves,\" sagte sie. Sie benutzte meinen neuen Namen. Das hatte sie noch nie getan.\n\n\"Warum rufst du an? Wirklich?\"\n\nIch dachte nach. Über Berlin. Über die Ausbildung. Über Matei. Über das Heimweh, das sich anfühlte wie ein Stein im Magen.\n\n\"Ich bin allein. Und krank. Und ich wollte deine Stimme hören.\"\n\nSie war einen Moment still.", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}, {"prose": "\"Aber es ist okay. Dumm sein ist menschlich.\"\n\n\"Das hast du früher nie gesagt.\"\n\n\"Früher hatte ich keine Zeit für Dummheit. Jetzt habe ich viel Zeit.\"\n\n\"Weil du alt bist?\"\n\n\"Weil ich in Rente bin. Das ist nicht dasselbe.\"\n\nÜber nichts. Über das Wetter in Lagos. Über die neue Nachbarin, die zu laut Musik hört. Über den Hund, der letzte Woche gestorben ist.\n\nSie sagte nicht \"Komm nach Hause\".\n\nIch sagte nicht \"Ich vermisse dich\".\n\nAber wir redeten. Das war genug.\n\n\"Wann kommst du nach Hause?\"\n\n\"Ich weiß nicht.\"\n\n\"Weißt du es nicht, oder willst du es nicht sagen?\"\n\n\"Das ist ehrlich.\"\n\n\"Ich lerne Ehrlichkeit. Von meinem Freund.\"\n\n\"Ist er gut zu dir?\"\n\n\"Dann ist es okay. Aber du musst trotzdem irgendwann kommen. Ich werde nicht jünger.\"\n\n\"Ruf mich wieder an. Nicht nur wenn du krank bist.\"\n\n\"Ich versuche es.\"\n\n\"Versuche es besser.\"\n\nIch starrte auf das Telefon.\n\nDer Bildschirm wurde dunkel. Das Zimmer wurde still. Die Heizung klickte.\n\n\"Das war nicht so schlimm,\" sagte ich zu Matei Jr.\n\nDie Pflanze antwortete nicht.\n\n\"Du bist trotzdem kein guter Zuhörer.\"\n\nMatei kam um 18 Uhr nach Hause.\n\nEr trug eine Tüte mit Suppe. Hühnersuppe. Aus der Dose. Die billige Sorte.\n\n\"Du siehst schrecklich aus,\" sagte er.\n\n\"Ich fühle mich schrecklich.\"\n\n\"Ich habe Suppe gekauft.\"\n\n\"Das ist keine Suppe. Das ist Dosenessen.\"\n\n\"Dosenessen ist auch Suppe. Ein bisschen.\"\n\n\"Es ist nicht dasselbe.\"\n\n\"Es ist jetzt dasselbe. Ich habe es erfunden. Iss.\"\n\nEr setzte sich neben mich auf das Sofa. Seine Hand war kalt. Er war schnell nach Hause gelaufen.\n\n\"Du bist nass,\" sagte ich.\n\n\"Du hast keinen Schirm.\"\n\n\"Ich habe dich. Das ist wichtiger.\"\n\n\"Das ist kitschig.\"\n\n\"Ich bin kitschig. Das ist mein Charme.\"\n\nEr machte die Suppe warm. Brachte sie mir im Bett. Nicht im Bett — auf dem Sofa. Aber das Sofa fühlte sich wie ein Bett an. Ein schlechtes Bett. Aber ein Bett.\n\n\"Du hast deine Großmutter angerufen,\" sagte er.\n\n\"Woher weißt du das?\"\n\n\"Weil du rotzeimig bist. Nicht nur von der Krankheit. Auch von den Tränen.\"\n\n\"Ich habe nicht geweint.\"\n\n\"Doch. Ein bisschen. Das ist okay.\"\n\n\"Ich weine nie.\"\n\n\"Du weinst bei Enten. Du weinst bei Pasteten. Du weinst bei Werbespots mit Hunden.\"\n\n\"Das war einmal.\"\n\n\"Das war dreimal. Letzte Woche.\"\n\n\"Du zählst meine Tränen?\"\n\n\"Ich zähle alles. Das weißt du.\"", "choices": ["Notice the silence between them", "Focus on what is being said"]}, {"prose": "Ich aß die Suppe. Sie war ekelhaft. Aber warm. Warm war genug.\n\n\"Danke. Dass du da bist.\"\n\n\"Ich bin immer da.\"\n\n\"Auch wenn ich krank bin und rotze und weine?\"\n\n\"Besonders dann. Krankheit ist die einzige Zeit, in der du still bist.\"\n\n\"Das ist nicht lustig.\"\n\n\"Es ist ein bisschen lustig.\"\n\n\"Du bist unmöglich.\"\n\n\"Du liebst mich.\"\n\nEr küsste meine Stirn. Sie war heiß. Vom Fieber. Oder von der Suppe. Oder von ihm.\n\n\"Du hast Fieber,\" sagte er.\n\n\"Du musst schlafen.\"\n\n\"Ich kann nicht schlafen. Ich habe Heimweh.\"\n\n\"Heimweh nach Lagos?\"\n\n\"Heimweh nach... ich weiß nicht. Nach etwas, das mir gehört. Nach etwas, das sich wie Zuhause anfühlt.\"\n\n\"Und was fühlt sich an wie Zuhause?\"\n\nIch dachte nach. Über den Schlüssel in meiner Tasche. Über die siebenunddreißig Stufen. Über den Kaffee am Morgen. Über Mateis Atem in der Nacht.\n\n\"Das hier,\" sagte ich. \"Diese Wohnung. Dieses Sofa. Du.\"\n\n\"Das Sofa ist schrecklich.\"\n\n\"Das Sofa ist schrecklich. Aber du nicht.\"\n\nEr lächelte. Das echte Lächeln. Selten. Wertvoll.\n\n\"Dann bist du zu Hause. Auch wenn Lagos weit weg ist.\"\n\n\"Das ist sehr philosophisch für 19 Uhr.\"\n\n\"Ich bin ein sehr philosophischer Mensch.\"\n\n\"Du bist ein sehr nerviger Mensch.\"\n\nIn dieser Nacht träumte ich von Lagos.\n\nVon der Großmutter. Von dem alten Haus. Von dem Hund, der gestorben war. Von dem Jungen, der ich einmal war.\n\nAber als ich aufwachte, war Matei da. Seine Hand auf meiner Brust. Sein Atem in meinem Nacken.\n\n\"Geht es dir besser?\" fragte er.\n\n\"Das Fieber ist weg.\"\n\n\"Woher weißt du das?\"\n\n\"Weil du nicht mehr leuchtet.\"\n\n\"Menschen leuchten nicht.\"\n\n\"Du leuchtest. Wenn du krank bist, leuchtest du rot. Jetzt leuchtest du normal.\"\n\n\"Das ist nicht wissenschaftlich.\"\n\n\"Das ist Erfahrung. Dasselbe.\"\n\nAm nächsten Morgen stand ich auf.\n\nMeine Beine waren wackelig. Mein Kopf war schwer. Aber ich stand auf.\n\n\"Bleib im Bett,\" sagte Matei.\n\n\"Ich muss zur Arbeit.\"\n\n\"Du bist krank.\"\n\n\"Ich bin besser.\"\n\n\"Du bist nicht besser. Du bist krank und stur.\"\n\nIch zog mich an. Langsam. Sehr langsam.\n\n\"Weil ich mir Sorgen mache. Und weil ich dich nicht allein lassen will.\"\n\n\"Du musst zur Arbeit.\"\n\n\"Ich habe schon angerufen. Ich bleibe zu Hause.\"\n\n\"Du hast für mich angerufen?\"\n\n\"Ja. Das nennt man Liebe. Oder Dummheit. Ich weiß nicht. Aber ich bleibe.\"\n\nEr machte Kaffee. Schwarz. Kein Zucker. Keine Milch. Perfekt.\n\nIch trank ihn. Meine Hände zitterten. Aber der Kaffee war warm. Warm war genug.", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}, {"prose": "Wir verbrachten den Tag auf dem Sofa.\n\nDecke. Tee. Alte Filme. Schlechte Filme. Filme, die Matei hasste und ich liebte.\n\n\"Dieser Film ist dumm,\" sagte er.\n\n\"Dieser Film ist romantisch.\"\n\n\"Nein. Romantisch ist gut. Dumm ist schlecht. Das ist ein Unterschied.\"\n\n\"Gibt es einen?\"\n\n\"Ja. Und du weißt es.\"\n\nEr rollte mit den Augen. Aber er blieb. Er blieb den ganzen Tag.\n\nAm Abend fühlte ich mich besser. Nicht gesund. Aber besser.\n\n\"Dass du geblieben bist.\"\n\n\"Ich bleibe immer. Das weißt du.\"\n\n\"Ich weiß. Aber heute war es wichtig.\"\n\n\"Weil ich heute wusste, dass ich nicht allein bin. Auch wenn Lagos weit weg ist. Auch wenn meine Großmutter alt wird. Auch wenn ich Heimweh habe.\"\n\n\"Jetzt bin ich hier. Das ist genug.\"\n\nEr küsste mich. Sanft. Langsam.\n\n\"Du bist zu Hause, Yves. Auch wenn es sich nicht immer so anfühlt.\"\n\n\"Woher weißt du das?\"\n\n\"Weil du aufgehört hast, die Treppe zu zählen.\"\n\n\"Die siebenunddreißig Stufen. Du zählst sie nicht mehr. Seit Wochen.\"\n\n\"Woher weißt du das?\"\n\n\"Weil ich dich beobachtet habe. Du gehst die Treppe hoch. Du zählst nicht. Du bist einfach da.\"\n\n\"Das ist creepy.\"\n\n\"Das ist Liebe. Dasselbe.\"\n\ndas Heimweh homesickness neuter\n\ndas Kitzeln tickling neuter\n\nder Hals throat/neck masculine\n\nder Kaffeesatz coffee grounds masculine\n\ndie Hustenbonbons cough drops plural\n\ndie Wohnung apartment feminine (review)\n\nder Schlüssel key masculine (review)\n\ndie Großmutter grandmother feminine (review)\n\nrauschen to rustle/white noise verb\n\ndie Rente retirement feminine\n\ndas Dosenessen canned food neuter\n\nrotzeimig snot-nosed/crying adjective (slang)\n\nder Schirm umbrella masculine\n\nFrom this chapter: Not explicitly, but let's introduce temporal conjunctions because they appear in narrative.\n\nTemporal conjunctions tell you when something happens. They send the verb to the end.\n\nCommon temporal conjunctions:\n\nConjunction Meaning Verb position\n\nals when (past, one time) end\n\nwenn when (regularly, or future) end\n\nExamples from this chapter (adapted):\n\nBefore you came, I was alone. Bevor du kamst, war ich allein.\n\nAfter I called her, I felt better. Nachdem ich sie angerufen hatte, fühlte ich mich besser.\n\nWhile you sleep, I make coffee. Während du schläfst, mache ich Kaffee.\n\nSince I arrived in Berlin, I've changed. Seit ich in Berlin bin, habe ich mich verändert.\n\nWhy this matters: Temporal clauses are everywhere in storytelling. Recognizing bevor, nachdem, während, seit will help you follow the timeline of events.\n\nTip from the method: When you see one of these words, look for the verb at the end of that clause. Everything in between is the when information.", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}], "gate": {"clue": "Wh }, {"german": "sein (subj.)", "english": "would be"}, {"german": "fühlen", "english": "to feel"}, {"german": "natürlich", "english": "more natural"}, {"german": "grün", "english": "green"}, {"german": "fühlen", "english": "to feel"}, {"german": "zurücklassen", "english": "to leave behind"}, {"german": "wissen", "english": "to know"}, {"german": "sich anfühlen", "english": "to feel like"}, {"german": "hören", "english": "to hear / listen"}, {"german": "wissen / weiß", "english": "to know / white"}, {"german": "jung", "english": "young"}, {"german": "die Träne", "english": "tear (drop)"}, {"german": "zählen", "english": "to count"}, {"german": "zählen", "english": "to count"}, {"german": "küssen", "english": "to kiss"}, {"german": "gehören", "english": "to belong"}, {"german": "sich anfühlen", "english": "to feel like"}, {"german": "fühlen", "english": "to feel"}, {"german": "lächeln", "english": "to smile"}, {"german": "träumen", "english": "to dream"}, {"german": "nächste", "english": "next"}, {"german": "die Hand", "english": "hand"}, {"german": "aufhören", "english": "to stop"}, {"german": "schlafen", "english": "to sleep"}, {"german": "verändern", "english": "to change"}], "shadow": ["Mental health and care vocabulary — say these gently:", "Ich bin gerade sehr erschoepft. — I am very exhausted right now.", "Ich brauche einen Moment. — I need a moment.", "Bist du okay? — Are you okay?", "Ich bin fuer dich da. — I am here for you.", "Ich bin fuer dich da — I am here for you — is one of the most important sentences in the German language. It is also one of the simplest. Say it like you mean it."]}, {"id": 26, "title": "Die Prüfung", "scenes": [{"prose": "Die Prüfung kam ohne Vorwarnung.\n\nAlso mit Vorwarnung. Herr Weber hatte sie vor zwei Wochen angekündigt. Aber ich hatte sie verdrängt. Verdrängen ist meine Superkraft.\n\n\"Heute ist der Test,\" sagte Herr Weber am Morgen.\n\n\"Der Test, über den wir seit zwei Wochen sprechen.\"\n\n\"Darüber haben wir nicht gesprochen.\"\n\n\"Doch. Du hast nicht zugehört. Das ist ein Unterschied.\"\n\n\"Gibt es einen?\"\n\n\"Nein. Setz dich.\"\n\nFünfzig Fragen. Fünfzig Multiple-Choice-Fragen. Über Netzwerke. Über Firewalls. Über Subnetzmasken. Über Dinge, die ich gelernt hatte und wieder vergessen hatte.\n\n\"Sie haben eine Stunde,\" sagte Herr Weber.\n\n\"Das ist nicht genug.\"\n\n\"Das ist genau genug. Für manche.\"\n\n\"Sie sind nicht nett.\"\n\n\"Ich bin nicht nett. Ich bin ehrlich. Jetzt schreib.\"\n\nMeine Hand zitterte. Mein Kopf war leer. Die Wörter auf dem Blatt verschwammen. Subnetzmaske / 255.255.255.0 / Was bedeutet das? Keine Ahnung. Ich kreuzte C an. Immer C. Wenn man keine Ahnung hat, einfach C.\n\n\"C ist nicht immer richtig,\" sagte Herr Weber, als er meine Antworten sah.\n\n\"C ist oft richtig.\"\n\n\"C ist nie richtig. Wenn man keine Ahnung hat, soll man B nehmen.\"\n\n\"Warum sagen Sie das jetzt?\"\n\n\"Weil die Prüfung vorbei ist. Das Lernen beginnt.\"\n\nDas Ergebnis kam am nächsten Tag. Vierunddreißig von fünfzig Punkten. Bestanden wäre fünfunddreißig gewesen. Ein Punkt gefehlt.\n\n\"Ein Punkt,\" sagte ich.\n\n\"Ein Punkt,\" sagte Herr Weber.\n\n\"Das ist nicht fair.\"\n\n\"Das Leben ist nicht fair. Die Prüfung war fair. Du warst nicht vorbereitet.\"\n\n\"Ich war vorbereitet.\"\n\n\"Du warst nicht vorbereitet genug. Das ist ein Unterschied.\"\n\n\"Gibt es einen?\"\n\n\"Ja. Vorbereitet genug sein bedeutet, dass man die Antworten weiß. Du hast geraten. C ist nicht immer richtig.\"\n\n\"Sie haben gesagt, man soll B nehmen.\"\n\n\"Das war ein Witz.\"\n\n\"Das war kein guter Witz.\"\n\n\"Ich bin kein guter Witzeschreiber. Ich bin ITler. Jetzt setz dich. Wir lernen, was du falsch gemacht hast.\"\n\nWir saßen drei Stunden zusammen.\n\nEr zeigte mir jede Frage. Erklärte jede Antwort. Warum A falsch war. Warum B richtig war. Warum C manchmal richtig war, aber nicht diesmal.\n\n\"Du hast bei Frage 17 geschlafen,\" sagte er.\n\n\"Ich habe nicht geschlafen. Ich habe nachgedacht.\"\n\n\"Nachdenken ist nicht dasselbe wie Wissen.\"\n\n\"Was ist der Unterschied?\"\n\n\"Wissen ist, wenn du die Antwort kennst. Nachdenken ist, wenn du sie suchst. In einer Prüfung sucht man nicht. Man weiß.\"\n\n\"Das ist Basic. Jetzt mach weiter.\"\n\nAm Ende des Tages hatte ich Kopfschmerzen. Und Hunger. Und ein bisschen Angst vor der nächsten Prüfung.\n\n\"Nächste Woche gibt es einen zweiten Test,\" sagte Herr Weber.\n\n\"Kann ich ihn wiederholen?\"\n\n\"Ja. Aber nur einmal. Wenn du wieder durchfällst, musst du ein Gespräch mit der Geschäftsführung führen.\"\n\n\"Was bedeutet das?\"\n\n\"Das bedeutet, dass du deine Ausbildung vielleicht verlieren könntest.\"\n\n\"Das ist nicht fair.\"\n\n\"Das ist die Realität. Gewöhn dich dran.\"\n\nDie Treppe war siebenunddreißig Stufen. Der Schlüssel klemmte. Die Tür öffnete sich.\n\nIch setzte mich auf das Sofa. Das Sofa war kalt. Die Wohnung war still. Nur Matei Jr. auf dem Fensterbrett. Lebendig. Überlebendig. Urteilend.\n\n\"Ich habe versagt,\" sagte ich zu der Pflanze.\n\nDie Pflanze antwortete nicht.\n\n\"Das ist nicht hilfreich.\"\n\nDie Pflanze antwortete immer noch nicht.\n\nVierunddreißig Punkte. Ein Punkt zu wenig.\n\nZwanzig Minuten später kam er durch die Tür.\n\nEr trug eine Tüte mit Pasteten. Die Aprikosen. Die guten.\n\n\"Du hast Pasteten gekauft.\"\n\n\"Für den Trost.\"\n\n\"Ich habe keinen Trost verdient.\"\n\n\"Doch. Du hast einen Test verpasst. Das ist kein Verbrechen.\"\n\n\"Ich könnte meine Ausbildung verlieren.\"", "choices": ["Notice the silence between them", "Focus on what is being said"]}, {"prose": "\"Könntest du. Aber nicht heute. Heute isst du Pasteten.\"\n\nEr setzte sich neben mich. Seine Hand war warm. Meine Hand war kalt.\n\n\"Erzähl mir, was passiert ist.\"\n\n\"Ich habe geraten. Bei fast jeder Frage. Ich dachte, C ist immer richtig.\"\n\n\"C ist nicht immer richtig.\"\n\n\"Das weiß ich jetzt.\"\n\n\"Was hast du gelernt?\"\n\n\"Dass ich lernen muss. Richtig lernen. Nicht nur nachdenken.\"\n\n\"Es fühlt sich nicht gut an.\"\n\n\"Lernen fühlt sich nie gut an. Nur das Ergebnis fühlt sich gut an.\"\n\n\"Wann kommt das Ergebnis?\"\n\n\"Nächste Woche. Beim zweiten Test.\"\n\n\"Und wenn ich wieder durchfalle?\"\n\n\"Dann kämpfst du. Das ist, was du tust. Du kämpfst.\"\n\nDrei Stück. Dann noch eins. Dann noch eins.\n\n\"Du isst alle,\" sagte Matei.\n\n\"Ich habe sie verdient.\"\n\n\"Du hast einen Test verpasst. Das ist nicht dasselbe wie verdienen.\"\n\n\"Trostpasteten sind immer verdient.\"\n\n\"Das ist nicht logisch.\"\n\n\"Das ist emotional. Dasselbe.\"\n\nEr lachte. Ein bisschen. Dann hörte er auf.\n\n\"Du schaffst das. Nächste Woche. Du lernst. Ich helfe dir.\"\n\n\"Du kennst dich nicht mit Netzwerken aus.\"\n\n\"Ich kenne mich mit dir aus. Das ist wichtiger.\"\n\n\"Das ist nicht wahr.\"\n\n\"Doch. Netzwerke kann man googeln. Deine Ängste kann man nicht googeln. Die kenne ich.\"\n\nEr stellte Fragen. Ich antwortete. Wenn ich die Antwort nicht wusste, schlug er in meinen Unterlagen nach.\n\n\"Frage siebzehn: Was ist eine Subnetzmaske?\"\n\n\"Das ist zu vage.\"\n\n\"Eine Zahl, die sagt, welcher Teil der IP-Adresse das Netzwerk ist.\"\n\n\"Besser. Aber nicht gut genug.\"\n\n\"Eine Subnetzmaske trennt die Netzwerkadresse von der Hostadresse.\"\n\n\"Gut. Nächste Frage.\"\n\nSo ging es weiter. Stunde um Stunde. Bis meine Augen brannten. Bis mein Kopf schmerzte. Bis Matei sagte: \"Schlaf jetzt. Morgen weiter.\"\n\n\"Ich kann nicht schlafen.\"\n\n\"Dann lieg still und denk an nichts.\"\n\n\"Das kann ich nicht.\"\n\n\"Dann denk an mich.\"\n\n\"Das ist nicht hilfreich.\"\n\n\"Doch. Ich bin sehr hilfreich. Ich bin Rumäne.\"\n\n\"Das ist keine Qualifikation.\"\n\n\"Es ist eine Lebenseinstellung.\"\n\nAm Abend vor dem zweiten Test konnte ich nicht essen.\n\nMatei machte Pasta. Meine Großmutters Rezept. Die Sauce war perfekt. Aber ich konnte keinen Bissen runterkriegen.\n\n\"Du musst essen.\"\n\n\"Ich kann nicht.\"\n\n\"Dann trink. Kaffee. Oder Tee. Oder Wasser. Irgendwas.\"\n\n\"Ich habe Angst.\"\n\n\"Was, wenn ich wieder durchfalle?\"\n\n\"Dann gehst du zu diesem Gespräch. Und du erklärst dich. Und du kämpfst. Das ist, was du tust.\"\n\n\"Und wenn ich verliere?\"\n\n\"Dann verlierst du. Und du fängst woanders an. Das ist nicht das Ende.\"\n\n\"Es fühlt sich an wie das Ende.\"\n\n\"Das Gefühl lügt. Gefühle lügen oft. Besonders Angst.\"\n\n\"Woher weißt du das?\"\n\n\"Weil ich auch Angst habe. Jeden Tag. Aber ich mache trotzdem weiter.\"\n\n\"Wovor hast du Angst?\"\n\n\"Dich zu verlieren.\"\n\n\"Das wird nicht passieren.\"\n\n\"Ja. Weil ich bleibe.\"\n\nEr küsste mich. Pasta-Geschmack und alles.\n\n\"Dann bleib. Und bestehe morgen diesen Test.\"", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}, {"prose": "\"Ich versuche es.\"\n\n\"Versuche es nicht. Mach es.\"\n\nDer zweite Test war anders.\n\nIch war ruhiger. Nicht ruhig. Aber ruhiger. Meine Hand zitterte weniger. Mein Kopf war klarer.\n\n\"Sie haben eine Stunde,\" sagte Herr Weber.\n\n\"Sie haben letzte Woche kein Glück gewünscht.\"\n\n\"Letzte Woche hatten Sie kein Glück verdient.\"\n\n\"Das ist nicht nett.\"\n\n\"Das ist ehrlich. Jetzt schreiben Sie.\"\n\nFünfzig Fragen. Fünfzig Multiple-Choice-Fragen. Aber diesmal wusste ich die Antworten. Nicht alle. Aber die meisten. Bei den anderen nahm ich B.\n\n\"Warum B?\" fragte Herr Weber später.\n\n\"Sie haben gesagt, B ist immer richtig, wenn man keine Ahnung hat.\"\n\n\"Das war ein Witz.\"\n\n\"Ich hatte keine Ahnung. Also habe ich B genommen.\"\n\n\"Und war B richtig?\"\n\n\"Dann war es kein Witz. Es war eine Lektion.\"\n\n\"Das ist verwirrend.\"\n\n\"Das ist Ausbildung. Dasselbe.\"\n\nDas Ergebnis kam am nächsten Tag.\n\nZweiundvierzig von fünfzig Punkten. Bestanden. Sogar gut bestanden.\n\n\"Sie haben bestanden,\" sagte Herr Weber.\n\n\"Sie sind nicht überrascht.\"\n\n\"Weil ich gelernt habe. Und weil mein Freund mir geholfen hat. Und weil B manchmal richtig ist.\"\n\n\"B ist oft richtig. Das ist die Lektion.\"\n\n\"Die Lektion ist, dass ich lernen muss. Nicht raten.\"\n\n\"Das ist auch eine Lektion. Aber B ist trotzdem oft richtig.\"\n\nEr stand auf. Machte eine Tasse Kaffee. Machte mir eine Tasse Kaffee. Die Tasse sagte I'm silently judging you.\n\n\"Ich bin stolz auf Sie,\" sagte er.\n\n\"Sie sagen nie 'stolz'.\"\n\n\"Heute schon. Einmal. Verschwenden Sie es nicht.\"\n\n\"Ich werde es nicht verschwenden.\"\n\n\"Gut. Nächste Woche lernen wir VLANs.\"\n\n\"Was sind VLANs?\"\n\n\"Das werden Sie nächste Woche lernen. Jetzt gehen Sie nach Hause. Feiern Sie. Aber nicht zu viel.\"\n\nDie Ente war da. Friedrich. Mit Krone. Unsichtbare Krone. Aber sie war da.\n\n\"Ich habe bestanden,\" sagte ich zu Friedrich.\n\n\"Danke. Das bedeutet mir viel.\"\n\n\"Du hast recht. Ich sollte Matei bescheid sagen.\"\n\nIch holte mein Handy hervor. Tippte: Bestanden. 42 Punkte.\n\nDrei Punkte. Dann: Ich wusste es.\n\nDu wusstest nichts. Du hast gehofft.\n\nDoch. Komm nach Hause. Ich habe Champagner gekauft.\n\nDen aus der Flasche. Mit einem richtigen Korken.\n\nIch bin immer optimistisch. Ich bin Rumäne.\n\nDie Treppe war siebenunddreißig Stufen. Der Schlüssel klemmte. Die Tür öffnete sich.\n\nMatei stand in der Küche. Zwei Gläser. Champagner. Die gute Sorte.\n\n\"Auf das Bestehen,\" sagte er.\n\n\"Auf das Bestehen,\" sagte ich.\n\n\"Dass du mich nicht aufgegeben hast.\"\n\n\"Ich gebe dich nie auf. Das weißt du.\"\n\n\"Ich weiß. Aber heute fühlt es sich besonders an.\"\n\n\"Weil ich heute bewiesen habe, dass ich bleiben kann. Dass ich kämpfen kann. Dass ich nicht weglaufe.\"\n\n\"Das hast du schon lange bewiesen. Du hast es nur nicht gesehen.\"\n\nEr küsste mich. Champagner und alles.\n\n\"Du stinkst nach Schweiß.\"\n\n\"Ich hatte einen langen Tag.\"\n\n\"Dann geh duschen. Danach gibt es Pasta.\"\n\n\"Ich versuche es. Deine Großmutter hat mir das Rezept gegeben.\"\n\n\"Per Brieftaube?\"\n\n\"Per E-Mail. Sie hat E-Mail. Sie hat es mir letzte Woche geschickt.\"\n\n\"Meine Großmutter hat mir noch nie eine E-Mail geschickt.\"\n\n\"Sie mag mich lieber.\"\n\n\"Das ist nicht wahr.\"", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}, {"prose": "\"Das ist jetzt wahr. Ich habe es erfunden.\"\n\n\"Du erfindest zu viel.\"\n\n\"Ich erfinde genau richtig. Jetzt geh duschen.\"\n\nDas Wasser war heiß. Der Dampf füllte das Badezimmer. Ich stand unter der Dusche und dachte an die letzten Wochen. An den ersten Test. An die Panik. An das Lernen mit Matei. An den zweiten Test. An das Bestehen.\n\n\"Du bist nicht mehr der, der du warst,\" sagte ich zu meinem Spiegelbild.\n\nOder vielleicht war es nur der Dampf.\n\nNach dem Abendessen saßen wir auf dem Sofa.\n\nDie Lampe brannte. Die Heizung klickte. Matei Jr. stand auf dem Fensterbrett. Lebendig. Überlebendig. Urteilend.\n\n\"Ich habe heute nicht an weglaufen gedacht. Nicht einmal.\"\n\n\"Das ist Fortschritt.\"\n\n\"Fühlt sich nicht so an.\"\n\n\"Fortschritt fühlt sich nie gut an. Nur Rückblick fühlt sich gut an.\"\n\n\"Das hast du schon mal gesagt.\"\n\n\"Es ist immer noch wahr.\"\n\n\"Du bist ein Philosoph.\"\n\n\"Ich bin ein Azubi-Freund. Das ist besser.\"\n\nEr legte seinen Arm um mich. Sein Herz schlug ruhig. Mein Herz schlug ruhiger.\n\n\"Du schaffst das. Die Ausbildung. Berlin. Alles.\"\n\n\"Woher weißt du das?\"\n\n\"Weil du heute nicht weggelaufen bist. Du bist geblieben. Du hast gekämpft. Das ist der Beweis.\"\n\n\"Das ist nur ein Test.\"\n\n\"Das ist nur der Anfang.\"\n\n\"Das ist nicht beruhigend.\"\n\n\"Das ist ehrlich. Dasselbe.\"\n\nIch lehnte meinen Kopf an seine Schulter.\n\nDie Lampe summte. Die Heizung klickte. Die Stadt war still.\n\n\"Ich bin froh, dass ich hier bin.\"\n\n\"Und ich bin froh, dass du da bist.\"\n\n\"Ich bin immer da.\"\n\n\"Dann schlaf jetzt. Morgen wartet die Arbeit.\"\n\n\"Was sind VLANs?\"\n\n\"Keine Ahnung. Aber du wirst es lernen.\"\n\n\"Woher weißt du das?\"\n\n\"Weil du heute nicht aufgegeben hast.\"\n\n\"Das ist keine Garantie.\"\n\n\"Das ist genug.\"\n\ndie Prüfung exam/test feminine\n\ndie Vorwarnung forewarning feminine\n\nverdrängen to suppress/repress verb\n\ndie Subnetzmaske subnet mask feminine\n\nraten (geraten) to guess (guessed) verb\n\nder Trost comfort/consolation masculine\n\ndie Trostpastete consolation pastry feminine (humorous)\n\ndie Unterlagen documents/materials plural\n\ndie IP-Adresse IP address feminine\n\ndie Qualifikation qualification feminine\n\ndie Lebenseinstellung attitude to life feminine\n\nverschwenden to waste verb\n\ndas VLAN VLAN (Virtual LAN) neuter\n\nder Beweis proof/evidence masculine\n\nFrom this chapter: \"Ich wusste, dass ich bestehen würde\" (I knew that I would pass).\n\nYou have seen dass (that) and ob (whether). Both send the verb to the end.\n\nConjunction Meaning Type Example\n\ndass that fact Ich weiß, dass du recht hast.\n\nob whether uncertainty Ich weiß nicht, ob du recht hast.\n\nExamples from this chapter (adapted):\n\nI knew that I would pass. Ich wusste, dass ich bestehen würde.\n\nI don't know whether I'll pass. Ich weiß nicht, ob ich bestehen werde.\n\nHe said that I should learn. Er sagte, dass ich lernen sollte.\n\nShe asked whether I was ready. Sie fragte, ob ich bereit war.\n\nWhy this matters: Dass and ob appear constantly in reported speech and thoughts. Recognizing the difference helps you understand whether someone is stating a fact (dass) or expressing uncertainty (ob).\n\nTip from the method: When you see ob, think \"whether\" or \"if\" (uncertain). When you see dass, think \"that\" (factual). The verb will always be at the end of the clause.", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}], "gate": {"clue": "What is the German word for \"step backwards\"?", "answer": "rueckschritt", "hint": "der Rueckschritt"}, "vocab": [{"german": "die Prüfung", "english": "exam/test"}, {"german": "die Vorwarnung", "english": "forewarning"}, {"german": "verdrängen", "english": "to suppress/repress"}, {"germ bathroom"}, {"german": "die Lampe", "english": "lamp"}, {"german": "die Heizung", "english": "radiator / heating"}, {"german": "ankündigen", "english": "to announce"}, {"german": "verdrängen", "english": "to suppress / push aside"}, {"german": "über", "english": "over / about"}, {"german": "darüber", "english": "about it / over it"}, {"german": "zuhören", "english": "to listen"}, {"german": "fünfzig", "english": "fifty"}, {"german": "für", "english": "for"}, {"german": "das Wort", "english": "word"}, {"german": "nächste", "english": "next"}, {"german": "vierunddreißig", "english": "thirty-four"}, {"german": "sein", "english": "to be (subjunctive)"}, {"german": "fünfunddreißig", "english": "thirty-five"}, {"german": "wissen", "english": "to know"}, {"german": "sitzen", "english": "to sit"}, {"german": "erklären", "english": "to explain"}, {"german": "durchfallen", "english": "to fail (an exam)"}, {"german": "das Gespräch", "english": "conversation"}, {"german": "die Geschäftsführung", "english": "management"}, {"german": "führen", "english": "to lead"}, {"german": "können", "english": "to be able to (subjunctive)"}, {"german": "die Realität", "english": "reality"}, {"german": "sich gewöhnen", "english": "to get used to"}, {"german": "siebenunddreißig", "english": "thirty-seven"}, {"german": "die Tür", "english": "door"}, {"german": "öffnen", "english": "to open"}, {"german": "überlebendig", "english": "vibrantly alive"}, {"german": "später", "english": "later"}, {"german": "die Tüte", "english": "bag"}, {"german": "können", "english": "to be able to (subjunctive)"}, {"german": "erzählen", "english": "to tell / narrate"}, {"german": "fühlen", "english": "to feel"}, {"german": "kämpfen", "english": "to fight"}, {"german": "das Stück", "english": "piece / bit"}, {"german": "hören", "english": "to hear / listen"}, {"german": "die Angst", "english": "fear / anxiety"}, {"german": "der Rumäne", "english": "Romanian (person)"}, {"german": "die Großmutter", "english": "grandmother"}, {"german": "erklären", "english": "to explain"}, {"german": "anfangen", "english": "to begin / start"}, {"german": "das Gefühl", "english": "feeling"}, {"german": "lügen", "english": "to lie"}, {"german": "das Gefühl", "english": "feeling"}, {"german": "wissen", "english": "to know"}, {"german": "küssen", "english": "to kiss"}, {"german": "das Glück", "english": "luck / happiness"}, {"german": "wünschen", "english": "to wish"}, {"german": "überrascht", "english": "surprised"}, {"german": "die Küche", "english": "kitchen"}, {"german": "das Glas", "english": "glass"}, {"german": "der Schweiß", "english": "sweat"}, {"german": "heiß", "english": "hot"}, {"german": "füllen", "english": "to fill"}, {"german": "der Rückblick", "english": "retrospect / look back"}, {"german": "kämpfen", "english": "to fight"}, {"german": "würden", "english": "would (subjunctive)"}, {"german": "ankündigen", "english": "to announce"}, {"german": "verdrängen", "english": "to suppress"}, {"german": "zuhören", "english": "to listen"}, {"german": "das Wort", "english": "word"}, {"german": "nächste", "english": "next"}, {"german": "sein (subj.)", "english": "would be"}, {"german": "wissen / weiß", "english": "to know / white"}, {"german": "sitzen", "english": "to sit"}, {"german": "erklären", "english": "to explain"}, {"german": "durchfallen", "english": "to fail (exam)"}, {"german": "können", "english": "could (subjunctive)"}, {"german": "sich gewöhnen", "english": "to get used to"}, {"german": "öffnen", "english": "to open"}, {"german": "können", "english": "could (subjunctive)"}, {"german": "erzählen", "english": "to tell / narrate"}, {"german": "fühlen", "english": "to feel"}, {"german": "kämpfen", "english": "to fight"}, {"german": "hören", "english": "to hear / listen"}, {"german": "die Angst", "english": "fears / anxieties"}, {"german": "die Großmutter", "english": "grandmother"}, {"german": "erklären", "english": "to explain"}, {"german": "anfangen", "english": "to begin"}, {"german": "lügen", "english": "to lie"}, {"german": "das Gefühl", "english": "feeling"}, {"german": "wissen", "english": "to know"}, {"german": "küssen", "english": "to kiss"}, {"german": "wünschen", "english": "to wish"}, {"german": "das Glas", "english": "glass"}, {"german": "füllen", "english": "to fill"}, {"german": "kämpfen", "english": "to fight"}, {"german": "würde", "english": "would (subjunctive)"}], "shadow": ["Exam and results German — say aloud:", "Ich habe die Pruefung bestanden. — I passed the exam.", "Ich habe die Pruefung leider nicht bestanden. — Unfortunately I did not pass the exam.", "Was sind die naechsten Schritte? — What are the next steps?", "Ich moechte die Pruefung wiederholen. — I would like to retake the exam.", "Notice leider — unfortunately — in the second sentence. It softens the delivery without changing the fact. German professional communication uses leider often. It is not weakness. It is politeness."]}, {"id": 27, "title": "Der Rückschritt", "scenes": [{"prose": "Der Rückschritt kam nicht mit einem Knall. Er kam mit einem Seufzer.\n\nMit einer Tasse Kaffee, die kalt wurde, weil ich keine Zeit hatte, sie zu trinken. Mit einem Stapel ungelesener E-Mails. Mit einem Blick von Matei, der zu müde war, um wütend zu sein.\n\n\"Du bist spät dran,\" sagte er. Es war kein Vorwurf. Es war eine Feststellung.\n\nIch setzte mich an den Küchentisch. Der Tisch war voll. Meine Unterlagen. Seine Bücher. Eine leere Pastetentüte. Ein Kugelschreiber ohne Kappe.\n\n\"Ich habe das Chaos nicht gemacht.\"\n\n\"Ich auch nicht.\"\n\n\"Das Chaos macht sich selbst. Das ist seine Superkraft.\"\n\nEr lächelte nicht. Ich lächelte nicht. Der Witz war flach. Alles war flach.\n\nEs war der dritte Monat meiner Ausbildung.\n\nDer erste Monat war aufregend gewesen. Der zweite Monat war schwer. Der dritte Monat war... grau. Wie der Berliner Himmel im November. Kein Regen. Kein Schnee. Nur Grau.\n\n\"Du machst keine Fortschritte,\" sagte Herr Weber.\n\n\"Du lernst nicht schnell genug.\"\n\n\"Das ist nicht meine Schuld.\"\n\n\"Es ist auch nicht meine. Es ist einfach so.\"\n\nEr klang nicht wütend. Er klang müde. Dieselbe Müdigkeit, die ich überall spürte. In meinen Knochen. In meinem Kopf. In der Beziehung zu Matei.\n\n\"Was soll ich tun?\"\n\n\"Mehr lernen. Weniger schlafen. Oder weniger lernen und mehr schlafen. Ich weiß es nicht. Ich bin auch müde.\"\n\n\"Sie sind mein Ausbilder. Sie sollen nicht müde sein.\"\n\n\"Ausbilder sind auch Menschen. Menschen werden müde. Besonders wenn ihre Azubis dieselben Fehler dreimal machen.\"\n\n\"Welche Fehler?\"\n\nZu Hause war es nicht besser.\n\nMatei kam spät nach Hause. Die Buchhandlung hatte Stress. Ein neuer Mitarbeiter, der nichts konnte. Ein alter Mitarbeiter, der gekündigt hatte. Ein Chef, der nicht wusste, was er wollte.\n\n\"Du siehst schrecklich aus,\" sagte ich.\n\n\"Du siehst auch nicht besser aus.\"\n\n\"Das war kein Wettbewerb.\"\n\n\"Alles ist ein Wettbewerb. Besonders wenn man müde ist.\"\n\nEr setzte sich auf das Sofa. Ich setzte mich neben ihn. Wir saßen da. Keine Hand auf meinem Knie. Kein Kopf auf seiner Schulter. Nur zwei müde Menschen in einer zu kleinen Wohnung.\n\n\"Kannst du heute kochen? Ich kann nicht.\"\n\n\"Ich kann auch nicht.\"\n\n\"Dann bestellen wir.\"\n\n\"Ich auch nicht.\"\n\nWir bestellten Pizza. Die schlechte Sorte. Die mit viel Käse und wenig Geschmack. Wir aßen schweigend. Die Lampe summte. Die Heizung klickte. Matei Jr. stand auf dem Fensterbrett. Sogar die Pflanze sah müde aus.\n\nDie Woche wurde nicht besser.\n\nAm Montag verschlief ich. Kam zu spät zur Arbeit. Herr Weber sagte nichts. Er nickte nur. Das war schlimmer als ein Vortrag.\n\nAm Dienstag vergaß ich Mateis Geburtstag. Nicht vergessen. Ich wusste, dass er bald war. Aber ich wusste nicht, dass es Dienstag war. Er sagte nichts. Aber ich sah es in seinen Augen.\n\n\"Es tut mir leid,\" sagte ich am Abend.\n\n\"Ist schon gut.\"\n\n\"Es ist nicht gut.\"\n\n\"Es ist okay. Ich feiere Geburtstage nicht.\"\n\n\"Das ist eine Lüge.\"\n\n\"Eine kleine Lüge.\"\n\n\"Eine Lüge ist eine Lüge.\"\n\n\"Dann ist es eine Lüge. Aber es ist okay.\"\n\nEr drehte sich um. Schlief ein. Oder tat so. Ich wusste es nicht.\n\nAm Mittwoch weinte Ada im Café.\n\nNicht laut. Leise. Mit zitternden Schultern und nassen Augen.\n\n\"Was ist passiert?\" fragte ich.\n\n\"Meine Mutter ist krank.\"\n\n\"Krebs. Stadium drei.\"\n\nIch wusste nicht, was ich sagen sollte. Also hielt ich ihre Hand. Die Café-Glocke schlug. Ein Kunde kam herein. Ich ignorierte ihn.\n\n\"Du musst arbeiten,\" sagte Ada.\n\n\"Die Arbeit kann warten.\"\n\n\"Nein, kann sie nicht. Das ist dein Job.\"\n\n\"Mein Job ist es, für dich da zu sein.\"\n\n\"Das ist nicht dein Job. Das ist Freundschaft. Das ist ein Unterschied.\"\n\n\"Gibt es einen?\"\n\n\"Ja. Und du weißt es.\"\n\nSie wischte ihre Tränen. Stand auf. Zog ihre Jacke an.\n\n\"Ich muss nach Hause. Nach Lagos.\"\n\n\"Kann ich etwas tun?\"\n\n\"Ja. Pass auf dich auf. Und auf Matei. Ihr seid beide so zerbrechlich.\"\n\n\"Wir sind nicht zerbrechlich.\"\n\n\"Doch. Aber das ist okay. Zerbrechlich ist menschlich.\"\n\nSie ging. Die Glocke schlug. Die Tür schloss sich.\n\nIch stand da. Allein. Mit einer kalten Kaffeetasse und dem Gefühl, dass die Welt ein bisschen dunkler geworden war.\n\nAm Donnerstag schrieb mir meine Großmutter eine E-Mail.\n\nEine echte E-Mail. Mit Betreff und Anhang und einem Rechtschreibfehler in jeder Zeile.\n\nich bin krank. Nicht schlimm. Aber alt. Du sollst wissen, dass ich dich liebe. Auch wenn ich es nie gesagt habe.", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}, {"prose": "Komm bald. Oder nicht. Aber ruf an.\n\nIch las die E-Mail dreimal. Dann rief ich sie an.\n\n\"Du hast eine E-Mail geschrieben.\"\n\n\"Du kannst E-Mails schreiben?\"\n\n\"Nein. Aber die Nachbarin hat geholfen.\"\n\n\"Die Nachbarin mit dem Hund?\"\n\n\"Der Hund ist tot. Die Nachbarin lebt noch.\"\n\n\"Das ist traurig.\"\n\n\"Das ist Leben. Jetzt erzähl mir von deinem Freund.\"\n\n\"Ja. Der Rumäne. Ist er immer noch da?\"\n\n\"Gut. Hat er dich heute zum Lachen gebracht?\"\n\n\"Weil wir beide müde sind.\"\n\n\"Dann macht eine Pause. Müdigkeit ist keine Schande. Nur Aufgeben ist eine Schande.\"\n\n\"Das ist weise.\"\n\n\"Ich bin alt. Alte Menschen sind weise. Oder langweilig. Ich weiß nicht.\"\n\nSie lachte. Ich lachte auch. Es war das erste Mal seit Tagen.\n\nAm Freitag passierte etwas Seltsames.\n\nIch saß auf der Brücke. Friedrich war da. Paddelte. Schwamm im Kreis. Immer im Kreis.\n\n\"Ich denke über Weglaufen nach,\" sagte ich zu Friedrich.\n\n\"Das ist nicht hilfreich.\"\n\n\"Du hast recht. Weglaufen ist dumm. Aber bleiben ist schwer.\"\n\nFriedrich quakte ein drittes Mal. Ich interpretierte das als bleiben ist immer schwer. Aber es lohnt sich.\n\nZehn Minuten später saß er neben mir.\n\nSeine Hände waren in den Taschen. Sein Atem war weiß in der kalten Luft. Er starrte auf die Ente.\n\n\"Friedrich sieht müde aus.\"\n\n\"Friedrich sieht immer müde aus. Er ist eine Ente.\"\n\n\"Enten können müde sein.\"\n\n\"Enten können nicht müde sein. Enten sind Enten.\"\n\n\"Das ist nicht nett.\"\n\n\"Ich bin nicht nett. Ich bin ehrlich.\"\n\nSchweigen. Die Kanal-Wasser waren ruhig. Die Stadt war still.\n\n\"Geht es dir gut?\"\n\n\"Mir auch nicht.\"\n\n\"Seit Wochen. Vielleicht seit Monaten.\"\n\n\"Warum hast du nichts gesagt?\"\n\n\"Weil du auch nichts gesagt hast.\"\n\n\"Das ist keine Antwort.\"\n\n\"Es ist die einzige Antwort, die ich habe.\"\n\nWir saßen da. Die Straßenlaternen gingen an. Orange Licht auf dem Wasser.\n\n\"Ich denke über Weglaufen nach,\" sagte ich.\n\n\"Wohin würde ich gehen?\"\n\n\"Weiß ich nicht. Zurück nach Lagos? In eine andere Stadt? In ein anderes Leben?\"\n\n\"Ich weiß es auch nicht.\"\n\n\"Dann geh nicht. Bleib. Auch wenn es schwer ist.\"\n\n\"Weil ich hier bin.\"\n\n\"Das ist kein Grund.\"\n\n\"Es ist der einzige Grund, der zählt.\"\n\nEr nahm meine Hand. Seine Hand war kalt. Meine Hand war kalt. Aber zusammen waren sie wärmer.\n\n\"Ich habe deinen Geburtstag vergessen.\"\n\n\"Ist schon gut.\"\n\n\"Es ist nicht gut. Es ist beschissen.\"\n\n\"Das ist ein starkes Wort.\"\n\n\"Es ist ein starkes Gefühl.\"\n\n\"Dann kauf mir später einen Kuchen. Einen großen. Mit Sahne.\"\n\n\"Du magst keine Sahne.\"\n\n\"Dann lern ich sie zu mögen.\"\n\n\"Du bist unmöglich.\"\n\n\"Du liebst mich.\"\n\nEr lächelte. Das echte Lächeln. Klein. Müde. Aber echt.\n\n\"Bleibst du?\" fragte er.\n\n\"Versprich es mir.\"\n\n\"Ich mache keine Versprechungen.\"\n\n\"Dann mach eine Ausnahme.\"\n\n\"Ich mache keine Ausnahmen.\"\n\n\"Dann zeig es mir.\"\n\n\"Bleib einfach. Heute. Morgen. Und übermorgen.\"\n\n\"Gut. Dann gehen wir jetzt nach Hause. Ich mache Tee. Du machst Pasta. Wir essen. Wir schlafen. Und morgen versuchen wir es wieder.\"\n\n\"Das ist ein guter Plan.\"", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}, {"prose": "\"Ich bin ein guter Planer.\"\n\n\"Du bist ein guter Lügner.\"\n\nDie Treppe war siebenunddreißig Stufen. Der Schlüssel klemmte. Die Tür öffnete sich.\n\nDie Wohnung war immer noch klein. Der Tisch war immer noch voll. Matei Jr. stand immer noch auf dem Fensterbrett.\n\nAber es fühlte sich anders an. Nicht anders gut. Aber anders.\n\n\"Ich mache Tee,\" sagte Matei.\n\n\"Ich mache Pasta.\"\n\n\"Keine Pasta. Du bist zu müde.\"\n\n\"Ich bin nicht zu müde.\"\n\n\"Doch. Du kannst morgen kochen. Heute gibt es Brot und Käse.\"\n\n\"Das ist kein Abendessen.\"\n\n\"Doch. Das ist ein Abendessen. Ein schlechtes. Aber ein Abendessen.\"\n\nEr schnitt Brot. Ich schnitt Käse. Wir aßen schweigend. Aber diesmal war das Schweigen nicht schwer. Es war einfach da.\n\n\"Es tut mir leid. Für die letzten Wochen.\"\n\n\"Du musst dich nicht entschuldigen.\"\n\n\"Doch. Ich war nicht da. Nicht wirklich.\"\n\n\"Ich war auch nicht da.\"\n\n\"Also sind wir beide schuld.\"\n\n\"Oder keiner. Oder das Leben. Oder der Job. Oder die Stadt.\" Er zuckte mit den Schultern. \"Es ist okay. Wir sind noch hier.\"\n\n\"Das ist ein niedriger Standard.\"\n\n\"Das ist ein ehrlicher Standard.\"\n\nNach dem Abendessen gingen wir früh ins Bett.\n\nNicht um zu schlafen. Um zu liegen. Um die Stille zu fühlen. Um uns daran zu erinnern, dass wir nicht allein waren.\n\n\"Ich liebe dich.\"\n\n\"Ich liebe dich auch.\"\n\n\"Auch wenn die letzten Wochen scheiße waren?\"\n\n\"Besonders dann.\"\n\n\"Weil Liebe nicht nur für gute Tage ist.\"\n\n\"Das ist sehr weise.\"\n\n\"Ich bin sehr weise.\"\n\n\"Du bist sehr müde.\"\n\nEr lachte. Ein bisschen. Dann schlief er ein.\n\nIch blieb wach. Ich starrte an die Decke. Ich dachte an Lagos. An die Ausbildung. An den Test, den ich fast nicht bestanden hätte. An Matei, der meinen Geburtstag nicht vergessen hätte.\n\n\"Ich bleibe,\" sagte ich leise.\n\nDie Decke antwortete nicht.\n\nAber Mateis Atem wurde ruhiger. Seine Hand fand meine im Schlaf.\n\nAm nächsten Morgen wachte ich mit einem Plan auf.\n\nKein großer Plan. Aber ein Plan.\n\n\"Es ist zu früh.\"\n\n\"Ich muss dir etwas sagen.\"\n\n\"Sag es später.\"\n\nEr öffnete ein Auge. \"Was?\"\n\n\"Ich habe beschlossen, zu bleiben.\"\n\n\"Du warst doch schon hier.\"\n\n\"Nein. Ich meine wirklich bleiben. Nicht nur physisch. Sondern mental. Emotional. Alles.\"\n\n\"Das ist ein großes Wort für 7 Uhr morgens.\"\n\n\"Ich bin ein großer Mensch.\"\n\n\"Du bist ein kleiner Mensch mit großen Gefühlen.\"\n\nEr setzte sich auf. Seine Haare standen ab. Sein Kinn war stoppelig. Er sah schrecklich aus. Und wunderschön.\n\n\"Was hat sich geändert?\" fragte er.\n\n\"Ja. Friedrich hat mir gesagt, dass Weglaufen dumm ist.\"\n\n\"Enten sprechen nicht.\"\n\n\"Friedrich spricht. Nur mit mir.\"\n\n\"Du bist verrückt.\"\n\n\"Ich bin verliebt. Dasselbe.\"\n\nEr zog mich zu sich. Sein Kopf lag auf meiner Brust. Mein Herz schlug. Sein Herz schlug mit.\n\n\"Bleib,\" sagte er.\n\n\"Auch wenn es schwer wird?\"\n\n\"Besonders dann.\"\n\n\"Auch wenn ich vergesse, einzukaufen?\"\n\n\"Besonders dann.\"\n\n\"Auch wenn du deinen Geburtstag vergisst?\"\n\n\"Das war einmal.\"\n\n\"Das war Dienstag.\"\n\n\"Ich sagte, es tut mir leid.\"\n\n\"Ich weiß. Aber ich werde es dir nie verzeihen.\"\n\n\"Das ist nicht wahr.\"\n\n\"Nein. Aber es klingt dramatisch. Und ich bin Rumäne. Drama ist meine Muttersprache.\"", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}, {"prose": "Ich lachte. Er lachte. Die Heizung klickte. Die Stadt wachte auf.\n\nIn der nächsten Woche wurde es besser.\n\nNicht perfekt. Aber besser. Ich machte weniger Fehler. Matei kam früher nach Hause. Wir kochten zusammen. Wir aßen zusammen. Wir schliefen zusammen.\n\n\"Du siehst besser aus,\" sagte Herr Weber.\n\n\"Ich fühle mich besser.\"\n\n\"Was hat sich geändert?\"\n\n\"Ich habe beschlossen zu bleiben.\"\n\n\"Sie waren doch schon hier.\"\n\n\"Das ist nicht dasselbe.\"\n\n\"Was ist der Unterschied?\"\n\n\"Hier sein ist passiv. Bleiben ist aktiv.\"\n\nEr nickte. \"Das ist gut. Jetzt setzen Sie sich. Wir lernen VLANs.\"\n\n\"Was sind VLANs?\"\n\n\"Das werden Sie heute lernen.\"\n\n\"Und wenn ich es nicht verstehe?\"\n\n\"Dann lernen Sie es morgen. Und übermorgen. Bis Sie es verstehen.\"\n\n\"Das ist ein guter Plan.\"\n\n\"Ich bin ein guter Ausbilder.\"\n\n\"Sie sind ein okay Ausbilder.\"\n\n\"Das ist genug.\"\n\nAm Freitag ging ich zur Brücke.\n\nFriedrich war da. Paddelte. Schwamm im Kreis.\n\n\"Ich bin geblieben,\" sagte ich.\n\n\"Danke. Das bedeutet mir viel.\"\n\n\"Du hast recht. Ich sollte Matei bescheid sagen.\"\n\nIch holte mein Handy hervor. Tippte: Ich bin geblieben.\n\nDrei Punkte. Dann: Ich weiß.\n\nWeil du nicht weggegangen bist.\n\nDoch. Komm nach Hause. Ich habe Pasteten gekauft.\n\nDie Aprikosen. Und ich habe sie nicht versteckt.\n\nDu bist nie unterstützend.\n\nIch bin immer unterstützend. Ich bin Rumäne.\n\nDie Treppe war siebenunddreißig Stufen. Der Schlüssel klemmte. Die Tür öffnete sich.\n\nMatei stand in der Küche. Die Pasteten lagen auf dem Tisch. Er lächelte.\n\n\"Bleibst du?\" fragte er.\n\n\"Versprich es mir.\"\n\n\"Ich mache keine Versprechungen.\"\n\n\"Dann mach eine Ausnahme.\"\n\n\"Ich mache keine Ausnahmen.\"\n\n\"Dann zeig es mir.\"\n\nder Rückschritt setback masculine\n\nder Seufzer sigh masculine\n\ndie Feststellung observation/statement feminine\n\nder Vortrag lecture masculine\n\nder Krebs cancer masculine\n\ndie Rechtschreibfehler spelling mistakes plural\n\nder Betreff subject line masculine\n\nder Anhang attachment masculine\n\ndie Schande shame/disgrace feminine\n\nbeschissen shitty (vulgar) adjective\n\ndie Sahne whipped cream feminine\n\ndie Muttersprache native language feminine\n\ndie Erklärung explanation feminine\n\nFrom this chapter: Not explicitly, but useful for expressing contrast — which fits a chapter about struggling but staying.\n\nObwohl and trotzdem both express contrast, but they work differently.\n\nConjunction Position Example\n\nobwohl (although) subordinates, verb to end Obwohl ich müde war, bin ich geblieben.\n\ntrotzdem (nevertheless) adverb, stays in main clause Ich war müde, trotzdem bin ich geblieben.\n\nExamples from this chapter (adapted):\n\nAlthough I was tired, I stayed. Obwohl ich müde war, bin ich geblieben.\n\nI was tired; nevertheless, I stayed. Ich war müde; trotzdem bin ich geblieben.\n\nAlthough the test was hard, he passed. Obwohl der Test schwer war, hat er bestanden.\n\nThe test was hard; nevertheless, he passed. Der Test war schwer, trotzdem hat er bestanden.\n\nWhy this matters: Obwohl and trotzdem are everywhere in spoken German. They let you say \"yes, this bad thing happened, but I did the good thing anyway\" — which is exactly the theme of this chapter.\n\nTip from the method: Obwohl = verb at the end (like weil). Trotzdem = verb in second position (like aber).", "choices": ["Notice the silence between them", "Focus on what is being said"]}], "gate": {"clue": "What is the German word for \"café (review)\"?", "answer": "cafe", "hint": "das Cafe"}, "vocab": [{"german": "der Rückschritt", "english": "setback"}, {"german": "der Seufzer", "english": "sigh"}, {"german": "die Feststellung", "english": "observation/statement"}, {"german": "der Vortrag", "english": "lecture"}, {"german": "der Krebs", "english": "cancer"}, {"german": "das Stadium", "english": "stage"}, {"german": "die Rechtschreibfehler", "english": "spelling mistakes"}, {"german": "der Betreff", "english": "subject line"}, {"german": "der Anhang", "english": "attachment"}, {"german": "die Schande", "english": "shame/disgrace"}, {"german": "beschissen", "english": "shitty (vulgar)"}, {"german": "die Sahne", "english": "whipped cream"}, {"german": "die Muttersprache", "english": "native language"}, {"german": "passiv", "english": "passive"}, {"german": "aktiv", "english": "active"}, {"german": "die Erklärung", "english": "explanation"}, {"german": "weil", "english": "because"}, {"german": "müde", "english": "tired"}, {"german": "auch", "english": "also / too"}, {"german": "sich", "english": "(reflexive pronoun)"}, {"german": "einfach", "english": "simple / just"}, {"german": "oder", "english": "or"}, {"german": "wenn", "english": "when / if"}, {"german": "das Sofa", "english": "sofa / couch"}, {"german": "die Wohnung", "english": "apartment"}, {"german": "heute", "english": "today"}, {"german": "die Lampe", "english": "lamp"}, {"german": "die Heizung", "english": "radiator / heating"}, {"german": "aber", "english": "but"}, {"german": "gut", "english": "good"}, {"german": "die Lüge", "english": "lie (falsehood)"}, {"german": "das Schloss", "english": "lock / castle"}, {"german": "noch", "english": "still / yet"}, {"german": "jetzt", "english": "now"}, {"german": "immer", "english": "always"}, {"german": "ruhig", "english": "quiet / calm"}, {"german": "vielleicht", "english": "maybe / perhaps"}, {"german": "warum", "english": "why"}, {"german": "klein", "english": "small"}, {"german": "der Morgen", "english": "morning"}, {"german": "der Schlüssel", n": "öffnen", "english": "to open"}, {"german": "fühlen", "english": "to feel"}, {"german": "haben", "english": "to have (subj.)"}, {"german": "nächste", "english": "next"}, {"german": "groß", "english": "big / tall"}, {"german": "groß", "english": "big / tall"}, {"german": "das Gefühl", "english": "feeling"}, {"german": "ändern", "english": "to change"}, {"german": "fühlen", "english": "to feel"}], "shadow": ["Recovery and correction language — workplace German:", "Ich habe den Fehler identifiziert. — I have identified the error.", "Ich werde die Aufgabe bis [Datum] korrigieren. — I will correct the task by [date].", "Koennen wir das gemeinsam durchgehen? — Can we go through that together?", "Ich lerne aus meinen Fehlern. — I learn from my mistakes.", "Ich lerne aus meinen Fehlern — I learn from my mistakes — is the sentence every Ausbilder wants to hear. Not as an excuse. As evidence. Show it, don't say it. But know how to say it when you need to."]}, {"id": 28, "title": "Das Café", "scenes": [{"prose": "Der Dienstagmorgen begann wie jeder andere.\n\nIch wachte auf. Matei war schon in der Küche. Kaffee. Schwarz. Kein Zucker. Keine Milch. Perfekt.\n\n\"Du hast einen Termin heute,\" sagte er.\n\n\"Mit Frau Schmidt. Im Café.\"\n\n\"Sie hat es nicht gesagt. Nur dass du kommen sollst.\"\n\n\"Das ist unheimlich.\"\n\n\"Das ist Frau Schmidt. Dasselbe.\"\n\nNur Frau Schmidt saß am Tisch. Dem Tisch mit dem geschnitzten Herzen. T + M. Nicht wir. Aber vielleicht bald.\n\n\"Setz dich,\" sagte sie.\n\n\"Ist alles okay?\"\n\n\"Ja. Nein. Vielleicht.\"\n\n\"Das ist keine Antwort.\"\n\n\"Es ist die einzige Antwort, die ich habe.\"\n\n\"Das sagt Matei immer.\"\n\n\"Er hat es von mir.\"\n\nSie schob einen Umschlag über den Tisch. Braun. Dick. Mit meinem Namen.\n\nPapiere. Viele Papiere. In Deutsch. In legalem Deutsch. Der Sorte, die man nicht versteht, auch wenn man die Sprache beherrscht.\n\n\"Ich verstehe das nicht.\"\n\n\"Das ist der Pachtvertrag. Für das Café.\"\n\n\"Warum zeigen Sie mir das?\"\n\n\"Weil ich es dir geben möchte.\"\n\n\"Das Café. Es gehört dir. Bald.\"\n\n\"Ich kann kein Café kaufen. Ich habe kein Geld.\"\n\n\"Du kaufst es nicht. Ich schenke es dir.\"\n\n\"Man kann kein Café verschenken.\"\n\n\"Doch. Das ist ein Geschenk. Es gibt Formulare dafür.\"\n\n\"Das ist verrückt.\"\n\n\"Das ist großzügig. Das ist ein Unterschied.\"\n\n\"Gibt es einen?\"\n\n\"Nein. Aber du schuldest mir jetzt etwas.\"\n\n\"Dass du es nicht kaputt machst. Und dass du die Kaffeemaschine nicht Gisela nennst.\"\n\n\"Woher wissen Sie von Gisela?\"\n\n\"Herr Weber hat es mir erzählt. Wir trinken manchmal Kaffee zusammen.\"\n\n\"Sie trinken Kaffee mit meinem Ausbilder?\"\n\n\"Ja. Wir haben viel zu besprechen. Zum Beispiel dich.\"\n\n\"Das ist unheimlich.\"\n\n\"Das ist Netzwerken. Dasselbe.\"\n\nIch starrte auf die Papiere.\n\n\"Ich kann das nicht annehmen.\"\n\n\"Du kannst. Und du wirst.\"\n\n\"Weil ich alt bin. Weil ich keine Familie habe. Weil das Café mein Leben ist. Und weil ich möchte, dass es weiterlebt. Mit dir.\"\n\n\"Ich bin nicht bereit.\"\n\n\"Bereit sein ist eine Lüge. Niemand ist bereit. Man springt einfach.\"\n\n\"Das ist kein guter Rat.\"\n\n\"Das ist der beste Rat. Jetzt unterschreib.\"\n\nSie schob mir einen Stift zu. Keinen normalen Stift. Einen Füller. Blau. Mit Tinte.\n\n\"Das ist ein Füller.\"\n\n\"Ich kann nicht mit Füller schreiben.\"\n\n\"Dann lernst du es. Jetzt.\"\n\nMeine Hand zitterte. Meine Unterschrift sah aus wie ein Krampfanfall. Aber sie war da. Auf dem Papier.\n\n\"Glückwunsch,\" sagte Frau Schmidt. \"Du bist jetzt Besitzer eines Cafés.\"\n\n\"Das fühlt sich nicht real an.\"\n\n\"Das wird es auch nicht. Nicht für eine Weile. Aber irgendwann wirst du aufwachen und es wird normal sein. Das ist der Trick.\"\n\n\"Was ist der Trick?\"\n\n\"So tun, bis es wahr wird.\"\n\n\"Das ist sehr amerikanisch.\"\n\n\"Ich bin sehr amerikanisch. Ich habe Familie in Ohio.\"\n\n\"Sie haben Familie?\"\n\n\"Nein. Aber ich wollte sehen, ob du zuhörst.\"\n\n\"Sie sind unmöglich.\"\n\n\"Ich bin deine Chefin. Dasselbe.\"\n\nDie Treppe war siebenunddreißig Stufen. Der Schlüssel klemmte. Die Tür öffnete sich.\n\nIch setzte mich auf das Sofa. Die Papiere lagen auf dem Tisch. Das Café gehörte mir. Nicht ganz. Bald. Aber irgendwie schon.\n\n\"Matei Jr., ich besitze ein Café.\"\n\nDie Pflanze antwortete nicht.\n\n\"Das ist nicht hilfreich.\"\n\nDie Pflanze antwortete immer noch nicht.\n\nMatei: Komm heute Abend um 19 Uhr ins Café.\n\nIch weiß. Deshalb habe ich es dir nicht früher gesagt.\n\nUm 19 Uhr ging ich zum Café.", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}, {"prose": "Die Tür war offen. Drinnen war es dunkel. Nur Kerzen. Viele Kerzen. Auf jedem Tisch. Auf der Theke. Auf dem Klavier, das niemand spielen konnte.\n\n\"Was ist das?\" fragte ich.\n\n\"Eine Überraschung,\" sagte Matei.\n\nEr stand in der Mitte des Raums. Er trug einen Anzug. Einen richtigen Anzug. Mit Krawatte und Einstecktuch und Schuhen, die glänzten.\n\n\"Warum trägst du einen Anzug?\"\n\n\"Weil heute ein besonderer Tag ist.\"\n\n\"Der Tag, an dem ich dir eine Frage stelle.\"\n\nEr ging auf ein Knie. Nicht auf eines. Auf beide. Er zitterte. Ich hatte ihn noch nie zittern sehen.\n\n\"Matei, was tust du?\"\n\n\"Ich mache einen Heiratsantrag. Das ist hoffentlich offensichtlich.\"\n\n\"Das ist nicht offensichtlich. Das ist verwirrend.\"\n\n\"Ich bin verwirrend. Das ist mein Charme.\"\n\nEr holte eine kleine Schachtel aus seiner Tasche. Schwarzer Samt. Die Art, die Ringe enthält.\n\n\"Ich liebe dich. Ich liebe dich seit der ersten Nachricht. Vor zwei Jahren. Bevor ich dein Gesicht kannte. Bevor ich wusste, dass du Tassen fallen lässt und dich beim Boden entschuldigst.\"\n\n\"Ich entschuldige mich nicht beim Boden.\"\n\n\"Doch. Ich habe es gesehen.\"\n\n\"Das ist nicht wahr.\"\n\n\"Doch. Aber das ist nicht der Punkt.\"\n\nDarin lag ein Ring. Silber. Einfach. Ein dünner Ring mit einer Gravur — eine Linie, die wie eine Welle aussah. Oder eine Brücke. Oder eine Ente.\n\n\"Ist das eine Ente?\" fragte ich.\n\n\"Es ist eine Brücke. Aber wenn du eine Ente siehst, ist es eine Ente.\"\n\n\"Das ist nicht sehr romantisch.\"\n\n\"Ich bin nicht romantisch. Ich bin ehrlich.\"\n\n\"Das ist dasselbe.\"\n\n\"Nein. Romantisch ist, wenn man lügt, um schön zu klingen. Ehrlich ist, wenn man die Wahrheit sagt, auch wenn sie nicht schön ist.\"\n\n\"Und was ist das hier?\"\n\n\"Das ist die Wahrheit. Ich will dich heiraten. Ich will, dass du meine Familie bist. Ich will, dass wir zusammen alt werden. Ich will, dass du mich jeden Morgen mit deiner schlechten Laune nervst. Ich will, dass wir uns über Pasteten streiten. Ich will, dass wir eine Wohnung mit Garten finden. Ich will, dass wir adoptieren. Zwei Kinder. Vielleicht drei.\"\n\n\"Das ist ein langer Antrag.\"\n\n\"Ich habe geübt.\"\n\n\"Dreihundertzweiundvierzig Mal.\"\n\n\"Du hast gezählt?\"\n\n\"Ich zähle alles.\"\n\n\"Yves, weinst du?\"\n\n\"Ich weine nie.\"\n\n\"Du weinst immer. Bei Enten. Bei Pasteten. Bei Werbespots mit Hunden.\"\n\n\"Das war einmal.\"\n\n\"Das war dreimal. Letzte Woche.\"\n\n\"Du zählst meine Tränen?\"\n\n\"Ich zähle alles. Das weißt du.\"\n\n\"Also?\" fragte er. \"Was ist deine Antwort?\"\n\n\"Du hast die Frage noch nicht gestellt.\"\n\n\"Habe ich nicht?\"\n\n\"Nein. Du hast nur darüber geredet.\"\n\n\"Dann stelle ich sie jetzt.\"\n\n\"Yves Arthur Grey — wirst du mich heiraten?\"\n\n\"Ja. Ja, ich werde dich heiraten. Ja, ich will deine Familie sein. Ja, ich will eine Wohnung mit Garten. Ja, ich will adoptieren. Zwei Kinder. Vielleicht drei. Ja, ich will jeden Morgen mit schlechter Laune aufwachen und dich nerven. Ja, ich will alt werden. Mit dir.\"\n\n\"Das ist eine lange Antwort.\"\n\n\"Ich habe geübt.\"\n\n\"Einmal. Gerade jetzt.\"\n\n\"Das ist nicht viel.\"\n\n\"Ich bin ein spontaner Mensch.\"\n\n\"Du bist kein spontaner Mensch. Du bist ein Planer.\"\n\n\"Heute bin ich spontan. Das ist eine Ausnahme.\"\n\n\"Ich liebe Ausnahmen.\"\n\nEr steckte mir den Ring an den Finger.\n\nEr war warm. Von seiner Tasche. Von seiner Hand. Von seiner Liebe.\n\n\"Er passt perfekt.\"\n\n\"Ich habe deinen Finger vermessen, während du geschlafen hast.\"\n\n\"Das ist creepy.\"\n\n\"Das ist praktisch.\"\n\nEr stand auf. Zog mich hoch. Küsste mich. Die Kerzen flackerten. Das Café roch nach Wachs und Hoffnung.\n\n\"Woher wusstest du, dass ich Ja sagen würde?\"\n\n\"Ich wusste es nicht.\"\n\n\"Was, wenn ich Nein gesagt hätte?\"\n\n\"Dann hätten wir trotzdem Pasta gegessen. Und ich hätte den Ring zurückgegeben. Und dich trotzdem geliebt.\"\n\n\"Das ist sehr reif von dir.\"\n\n\"Ich bin sehr reif. Ich habe eine Freundin in Ohio.\"\n\n\"Das hast du von Frau Schmidt.\"\n\n\"Sie hat gute Ideen.\"\n\nWir setzten uns an den Tisch. Den mit dem Herzen.", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}, {"prose": "\"Schau,\" sagte Matei. Er zeigte auf das Holz.\n\nNeben T + M war etwas Neues eingeritzt. Klein. Fast unsichtbar.\n\n\"Wer hat das gemacht?\" fragte ich.\n\n\"Ich weiß nicht. Vielleicht Frau Schmidt. Vielleicht ein Gast. Vielleicht war es schon immer da.\"\n\n\"Das war nicht immer da.\"\n\n\"Dann ist es jetzt da. Das ist wichtig.\"\n\n\"Das ist sehr romantisch.\"\n\n\"Ich bin sehr romantisch. Ich bin Rumäne.\"\n\n\"Rumänen sind nicht romantisch.\"\n\n\"Dieser Rumäne schon.\"\n\nWir blieben noch lange im Café.\n\nDie Kerzen brannten herunter. Der Wachs tropfte. Die Stadt wurde still.\n\n\"Was machen wir jetzt?\"\n\n\"Jetzt? Wir gehen nach Hause. Wir schlafen. Morgen sagst du es Ada. Und Frau Schmidt. Und deiner Großmutter.\"\n\n\"Und Herr Weber?\"\n\n\"Herr Weber weiß es schon.\"\n\n\"Ich habe es ihm heute Morgen gesagt. Er hat 'Gut' gesagt. Das ist sein Segen.\"\n\n\"Das ist kein Segen.\"\n\n\"Doch. Von ihm ist das ein Segen.\"\n\n\"Du kennst meinen Ausbilder besser als ich.\"\n\n\"Ich kenne alle, die dich lieben. Das ist mein Job.\"\n\n\"Dein Job ist Buchhändler.\"\n\n\"Buchhändler ist mein Beruf. Dich lieben ist meine Berufung.\"\n\n\"Das ist kitschig.\"\n\n\"Ich bin kitschig. Das ist mein Charme.\"\n\nDie Treppe war siebenunddreißig Stufen. Der Schlüssel klemmte. Die Tür öffnete sich.\n\nDie Wohnung war klein. Der Tisch war voll. Matei Jr. stand auf dem Fensterbrett.\n\nAber jetzt war es anders. Nicht die Wohnung. Wir.\n\n\"Verlobt,\" sagte ich.\n\n\"Verlobt,\" sagte er.\n\n\"Das klingt komisch.\"\n\n\"Das klingt richtig.\"\n\nMatei schlief sofort ein. Ich blieb wach. Ich starrte an die Decke. Der Ring war schwer an meinem Finger. Aber gut schwer.\n\n\"Ich liebe dich.\"\n\n\"Ich weiß. Schlaf jetzt.\"\n\n\"Ich kann nicht.\"\n\n\"Dann denk an die Ente.\"\n\n\"Ja. Friedrich ist jetzt dein Trauzeuge.\"\n\n\"Enten können keine Trauzeugen sein.\"\n\n\"Diese Ente schon. Sie hat eine Krone.\"\n\n\"Die Krone ist unsichtbar.\"\n\n\"Nicht für mich.\"\n\nEr lächelte im Halbschlaf. Ich lächelte auch.\n\nDann schlief ich ein. Mit dem Ring am Finger. Mit Mateis Atem im Nacken. Mit dem Gefühl, dass alles möglich war.\n\nAm nächsten Morgen rief ich Ada an.\n\n\"Yves? Es ist 7 Uhr.\"\n\n\"Matei hat mir einen Antrag gemacht.\"\n\n\"Ich komme vorbei.\"\n\n\"Das Café ist noch nicht offen —\"\n\n\"Das ist mir egal. Ich komme vorbei.\"\n\nZwanzig Minuten später stand sie vor der Tür. Sie trug noch ihren Schlafanzug. Ihre Haare waren ein Durcheinander. Ihre Augen waren groß.\n\n\"Lass mich den Ring sehen.\"\n\nIch hielt meine Hand hin. Sie starrte.\n\n\"Er ist perfekt.\"\n\n\"Wann ist die Hochzeit?\"\n\n\"Du hast keine Ahnung von nichts.\"\n\n\"Ich habe Ahnung von Matei. Das ist genug.\"\n\nSie umarmte mich. Ganz fest.\n\n\"Ich bin so glücklich für dich.\"\n\n\"Hast du deiner Großmutter Bescheid gesagt?\"\n\n\"Dann ruf sie an. Sie wird sich freuen.\"\n\n\"Oder sie wird wütend sein.\"\n\n\"Oder beides. Dasselbe.\"\n\nIch rief meine Großmutter an.\n\n\"Matei hat mir einen Antrag gemacht.\"\n\n\"Will er dich heiraten?\"\n\n\"Und du willst ihn heiraten?\"\n\n\"Dann mach es. Aber schick mir ein Foto. Von dem Ring.\"\n\n\"Du willst ein Foto?\"\n\n\"Ich bin alt. Ich kann nicht mehr reisen. Aber ich kann Fotos anschauen.\"", "choices": ["Notice the silence between them", "Focus on what is being said"]}, {"prose": "\"Das ist traurig.\"\n\n\"Das ist Leben. Jetzt schick das Foto.\"\n\nEine Minute später kam ihre Antwort: Schön. Aber zu dünn. Sag ihm, er soll einen dickeren kaufen.\n\n\"Was hat sie gesagt?\" fragte Matei.\n\n\"Dass der Ring zu dünn ist.\"\n\n\"Deine Großmutter ist hart.\"\n\n\"Meine Großmutter ist ehrlich.\"\n\nAm Nachmittag ging ich zu Frau Schmidt.\n\nSie saß an ihrem Tisch. Der mit dem Herzen.\n\n\"Du weißt es schon, oder?\" fragte ich.\n\n\"Dass Matei dir einen Antrag gemacht hat? Ja.\"\n\n\"Er hat mich um Erlaubnis gefragt. Gestern.\"\n\n\"Ja. Er sagte, ich bin wie eine Mutter für dich. Das war süß.\"\n\n\"Das war übertrieben.\"\n\n\"Das war romantisch. Dasselbe.\"\n\nSie lächelte. Ein echtes Lächeln.\n\n\"Du bist jetzt verlobt. Und bald Besitzer eines Cafés. Und bald Azubi im zweiten Lehrjahr. Und bald ein bisschen erwachsener.\"\n\n\"Das ist viel auf einmal.\"\n\n\"Das ist Leben. Gewöhn dich dran.\"\n\n\"Ich versuche es.\"\n\n\"Versuche es nicht. Mach es.\"\n\nAm Abend saßen wir auf dem Sofa.\n\nMatei hatte Pasta gekocht. Meine Großmutters Rezept. Perfekt.\n\n\"Dass du mich gefragt hast.\"\n\n\"Ich hatte keine Wahl.\"\n\n\"Nein. Ich liebe dich. Das ist keine Wahl. Das ist eine Tatsache.\"\n\n\"Das ist sehr romantisch.\"\n\n\"Ich bin sehr romantisch. Das weißt du.\"\n\nEr nahm meine Hand. Der Ring glänzte im Lampenlicht.\n\n\"Willst du wirklich adoptieren? Zwei Kinder? Vielleicht drei?\"\n\n\"Und einen Garten?\"\n\n\"Und eine Ente?\"\n\n\"Friedrich wohnt an der Brücke. Aber er kann zu Besuch kommen.\"\n\n\"Enten können nicht zu Besuch kommen.\"\n\n\"Friedrich schon. Er hat eine Krone.\"\n\n\"Die Krone ist unsichtbar.\"\n\n\"Nicht für mich.\"\n\nDie Heizung klickte. Die Stadt war still.\n\n\"Ich bin froh, dass ich geblieben bin.\"\n\n\"Auch wenn es schwer war.\"\n\n\"Besonders dann.\"\n\nAber das Schweigen war nicht schwer.\n\nWie der Ring an meinem Finger.\n\nder Pachtvertrag lease contract masculine\n\nder Umschlag envelope masculine\n\nder Füller fountain pen masculine\n\nder Krampfanfall seizure masculine\n\nder Heiratsantrag marriage proposal masculine\n\ndie Gravur engraving feminine\n\nder Trauzeuge witness (at wedding) masculine\n\ndie Berufung calling/vocation feminine\n\nder Segen blessing masculine\n\ndie Erlaubnis permission feminine\n\nübertrieben exaggerated adjective\n\ndie Tatsache fact feminine\n\ndas Lampenlicht lamplight neuter\n\nFrom this chapter: Not explicit, but the proposal has implied purpose: \"Ich habe geübt, um den Antrag zu machen\" (I practiced to make the proposal).\n\nInfinitive clauses with zu express purpose, intention, or result.\n\nTypes of zu infinitive clauses:\n\num...zu in order to Ich lerne, um die Prüfung zu bestehen.\n\nohne...zu without Er ging, ohne etwas zu sagen.\n\nstatt...zu instead of Statt zu weinen, lachte er.\n\nExamples from this chapter (adapted):\n\nI practiced to make the proposal. Ich habe geübt, um den Antrag zu machen.\n\nHe left without saying goodbye. Er ging, ohne sich zu verabschieden.\n\nInstead of running, he stayed. Statt zu rennen, blieb er.\n\nWhy this matters: These structures are everywhere in spoken and written German. Recognizing um...zu helps you understand why someone does something.\n\nTip from the method: Um...zu always has a comma before um, and the zu goes directly before the infinitive verb. The subject is the same as the main clause.", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}], "gate": {"clue": "What is the German word for \"wedding\"?", "answer": "hochzeit", "hint": "die Hochzeit"}, "vocab": [{"german": "der Pachtvertrag", "english": "lease contract"}, {"german": "der Umschlag", "english": "envelope"}, {"german": "der Füller", "english": "foun
