like paper and coffee — there was a small Café in the back. He led me past the shelves, past a table where someone was reading to a child, to a corner table by the window.\n\n\"You work here?\"\n\n\"Sometimes. I help with the events. Poetry readings, book launches. Nothing exciting.\"\n\n\"It's a bookstore. It's automatically exciting.\"\n\nHe looked at me. \"You like books?\"\n\n\"I like stories.\"\n\n\"No.\" I sat down across from him. The chair was comfortable. The light was soft. \"Books are the containers. Stories are what fill them. You can have a story without a book. You can't have a book without a story.\"\n\nHe was quiet for a moment. Then he said, \"What is your story, Yves?\"\n\nThe question hung between us. I could have deflected. Made a joke. Changed the subject. That was my specialty — talking without saying anything, filling silence with noise.\n\nBut I was tired of that. And he had given me a key.\n\n\"I don't know yet. That's why I'm here.\"\n\nHe nodded slowly. \"Good answer.\"\n\nA woman came to the table. She asked something in German. Matei answered. She left.\n\n\"I ordered for you.\"\n\n\"You don't know the words for the food yet. I saved you the embarrassment.\"\n\n\"How considerate.\"\n\n\"I'm a considerate person.\"\n\nI laughed. He almost smiled. The fourth time. I was definitely counting.\n\nThe food came. Something with potatoes and sausage and a dark Soße that tasted like winter. I ate it slowly, watching him watch the street through the window.\n\n\"Why do you remember everything?\"\n\nHe didn't answer right away. His fingers traced the edge of his plate.\n\n\"Because most people don't. They forget. They say things and then they move on and they don't think about it again. But the things people say — the small things, the things they think don't matter — those are the things that tell you who they are.\"\n\n\"And you want to know who people are.\"\n\n\"I want to know who you are.\"\n\nMy heart did that stupid thing again. The stutter. The skip.\n\n\"You're getting there.\"\n\n\"I know.\" He looked at me. \"That's why I'm still here.\"\n\nWe finished dinner in silence. Not uncomfortable — the good kind, the kind that felt like breathing. When the bill came, he paid before I could even reach for my pocket.\n\n\"Tomorrow, you work again.\"\n\n\"I will be gone before you wake up.\"", "choices": ["Notice the silence between them", "Focus on what is being said"]}, {"prose": "He tilted his head. \"Does that bother you?\"\n\nI considered lying. Decided not to.\n\nHe nodded. \"Good.\"\n\n\"Why is that good?\"\n\n\"Because I would be bothered if you weren't bothered.\"\n\nWe walked back to the Wohnung together. Not touching. But close. Close enough that our shoulders almost brushed. Close enough that I could feel the heat from his arm through both our coats.\n\nThe stairs were siebenunddreißig steps. The Schlüssel still stuck. The Wohnung was dark when we opened the door.\n\n\"Gute Nacht, Yves.\"\n\n\"Gute Nacht, Matei.\"\n\nI lay down in the bed. He lay down on the Sofa.\n\nI listened to him breathe until I fell asleep.\n\nder Wecker alarm clock masculine\n\nverhandeln to negotiate verb\n\ndie Sturheit stubbornness feminine\n\nder Rhythmus rhythm masculine\n\nkartieren to map (out) verb\n\nlauwarm lukewarm adjective\n\nsich weigern to refuse reflexive verb\n\nbeeindruckt impressed adjective\n\nsich locken to curl (hair) reflexive verb\n\nwachsam watchful adjective\n\nbetriebsamer busier comparative\n\nverängstigt frightened adjective\n\nder Freund friend (or boyfriend) masculine\n\ndie Chance chance feminine\n\ndie Phrase phrase feminine\n\nängstlich anxious adjective\n\nder Fußball soccer masculine\n\ndas Geländer railing neuter\n\nFrom this chapter: \"You like books?\" (instead of \"Do you like books?\")\n\nIn German, you can ask a yes/no question by putting the verb first — no extra do or does needed.\n\nDo you like books? Magst du Bücher?\n\nAre you nervous? Bist du nervös?\n\nDid you eat? Hast du gegessen?\n\nDo you remember? Erinnerst du dich?\n\nKey pattern: Verb → Subject → Rest of sentence.\n\nFrom this chapter: \"You like Frank Ocean?\" would be Magst du Frank Ocean? in German. The question mark does the work.\n\nWhy this matters: No do/does/did — just flip the verb to the front.", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}], "gate": {"clue": "What is the German word for \"week\"?", "answer": "woche", "hint": "die Woche"}, "vocab": [{"german": "der Wecker", "english": "alarm clock"}, {"german": "verhandeln", "english": "to negotiate"}, {"german": "die Sturheit", "english": "stubbornness"}, {"german": "der Rhythmus", "english": "rhythm"}, {"german": "kartieren", "english": "to map (out)"}, {"german": "lauwarm", "english": "lukewarm"}, {"german": "sich", "english": "weigern to refuse"}, {"german": "beeindruckt", "english": "impressed"}, {"german": "sich", "english": "locken to curl (hair)"}, {"german": "wachsam", "english": "watchful"}, {"german": "kopieren", "english": "to copy"}, {"german": "betriebsamer", "english": "busier comparative"}, {"german": "die Taube", "english": "pigeon"}, {"german": "verängstigt", "english": "frightened"}, {"german": "das Mehl", "english": "flour"}, {"german": "der Freund", "english": "friend (or boyfriend)"}, {"german": "die Chance", "english": "chance"}, {"german": "die Arbeit", "english": "work"}, {"german": "fauchen", "english": "to hiss"}, {"german": "das Gebäck", "english": "pastry"}, {"german": "ängstlich", "english": "anxious"}, {"german": "ticken", "english": "to tick"}, {"german": "der Fußball", "english": "soccer"}, {"german": "der Kanal", "english": "canal"}, {"german": "das Geländer", "english": "railing"}, {"german": "das Sofa", "english": "sofa / couch"}, {"german": "das Badezimmer", "english": "bathroom"}, {"german": "der Schlüssel", "english": "key"}, {"german": "heute", "english": "today"}, {"german": "gut", "english": "good"}, {"german": "der Morgen", "english": "morning"}, {"german": "bitte", "english": "please / here you go"}, {"german": "schön", "english": "beautiful / nice"}, {"german": "danke", "english": "thank you"}, {"german": "die Wohnung", "english": "apartment"}, {"german": "gut", "english": "good"}, {"german": "die Nacht", "english": "night"}, {"german": "nervös", "english": "nervous"}, {"german": "öffnen", "english": "to open"}, {"german": "möchten", "english": "would like to"}, {"german": "tschüss", "english": "bye / goodbye"}, {"german": "siebenunddreißig", "english": "thirty-seven"}, {"german": "das Buch", "english": "book"}, {"german": "die Soße", "english": "sauce"}, {"german": "öffnen", "english": "to open"}, {"german": "das Buch", "english": "book"}], "shadow": ["Read this short exchange — it is a typical Matei-Yves rhythm: short questions, longer answers, then a short Matei line that lands everything.", "Matei: \"How was it?\"", "Yves: \"I dropped a cup. Frau Schmidt said she dropped ten on her first day.\"", "Matei: \"Good.\"", "Yves: \"Good that I dropped it?\"", "Matei: \"Good that she told you.\"", "Matei's last line is the emotional resolution. Say it quieter than the rest."]}, {"id": 5, "title": "The Space Between", "scenes": [{"prose": "The second Woche was harder than the first.\n\nNot because of the work — I was getting better at the espresso machine, and Frau Schmidt had stopped watching me like I might accidentally abbrennen the Café. Not because of the language — I had learned a dozen new words, including Milch (milk), Zucker (sugar), and Rechnung (the bill), which I said wrong every time but people understood anyway.\n\nIt was harder because Matei had started to feel like something I could verlieren.\n\nThat sounds dramatic. I know. But here is the thing: when you have spent your whole life waiting for people to leave, you start seeing Ausgänge everywhere. A closed door. A missed text. A silence that lasts a few hours too long. Your brain fills in the gaps with the worst possible Geschichte, and then you are already grieving before anyone has even gone.\n\nMatei didn't leave. He went to work. He came home. He made coffee in the morning and left mine on the table. He cooked sometimes — simple things, eggs and bread, a soup that tasted like Rumänien. He sat on the plastic chair and read his books while I wrote in my Notizbuch.\n\nBut he didn't touch me again.\n\nNot after that night at the bookstore. Not after his hand had covered mine on the Sofa. He was close — physically, always close — but there was a space between us that felt like a held breath. Like we were both waiting for something. And I didn't know how to ask for it without sounding verzweifelt.\n\nSo I didn't ask. I just watched him. Beobachtete. Collected data.\n\nOn my eighth day at Morgenlicht, Frau Schmidt taught me how to close the Café.\n\nIt was a Ritual. Wipe down the counters. Count the register. Take out the trash. Lock the door. Turn off the lights. The last part was my favorite — standing in the dark Café, the streetlight coming through the window, the smell of coffee and sugar still hanging in the air. It felt like being inside a memory.\n\n\"You're doing good,\" Frau Schmidt said, putting on her coat.\n\n\"I dropped a cup yesterday.\"\n\n\"Only one. Yesterday you dropped one. The day before you dropped two. This is Verbesserung.\"\n\nShe patted my cheek — actually patted my cheek, like I was five years old — and left me to lock up.\n\nI stood in the dark for a minute. The bell above the door was silent. The street outside was quiet. Somewhere down the block, someone was playing music — something slow, something sad, something that made me think of Matei.\n\nI locked the door and walked home.\n\nHe was already there when I got back. Sitting on the Sofa. His laptop open on the table. He was typing something, his brow gerunzelt, his fingers moving fast.\n\n\"You're home early,\" I said.\n\n\"The library closed.\"\n\n\"You work at the library?\"\n\n\"I work at the bookstore. The library is where I go to write when I don't want to be at home.\"\n\n\"You don't want to be at home?\"\n\nHe looked up. His eyes were tired.\n\n\"I didn't say that.\"\n\n\"You implied it.\"\n\n\"I said I go to the library to write. That's not the same as not wanting to be here.\"\n\nI sat on the wooden chair. The plastic one was still empty. It was always empty, now. He sat on the Sofa. I sat on the chair. The space between us was two meters and a Lebenszeit.\n\n\"What are you writing?\" I asked.\n\nHe closed the laptop. \"Nothing.\"\n\n\"You're a bad liar.\"\n\n\"I'm an excellent liar. I just don't want to lie to you.\"\n\nThat shut me up. He went back to staring at the wall. I went back to watching him.\n\n\"Why don't you ever sit in the other chair?\"\n\nHe turned to look at me. The Lampe light caught the side of his face.", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}, {"prose": "\"Because I want to sit where you sat.\"\n\nI blinked. \"What?\"\n\n\"The first night. When you made pasta. You sat on the Sofa. I sat on the wooden chair.\" He paused. \"I have been sitting on the Sofa ever since.\"\n\n\"That doesn't make any sense.\"\n\n\"It makes perfect sense.\" He leaned back into the cushions. \"I wanted to know what it felt like. Where you had been.\"\n\nMy chest did something complicated. A twist. A squeeze. A feeling I didn't have a name for.\n\n\"That's the seltsamste thing anyone has ever said to me.\"\n\n\"And also the nicest.\"\n\n\"I'm a nice person.\"\n\n\"You're a strange person.\"\n\nI laughed. He didn't. But his hand was on the cushion again, resting where mine had rested that first night. The same spot. The same distance.\n\nI wanted to reach out. I wanted to close the two meters. I wanted to do something other than sit here and pretend I wasn't terrified.\n\nInstead, I stood up. \"I'm going to bed.\"\n\n\"It's eight o'clock.\"\n\nHe didn't stop me. He just nodded and turned back to his laptop.\n\nI lay in the dark, listening to him type. The keys clicked softly. A Rhythmus. A heartbeat. Something I could almost fall asleep to.\n\nThe next morning, he was gone before I woke up.\n\nBut there was coffee on the table. And a Notiz.\n\nThere's bread in the freezer. Don't just eat cheese for breakfast.\n\nI stared at the note for a long time. His handwriting was small and neat. The kind of handwriting that belonged to someone who thought before they wrote.\n\nI folded the note and put it in my pocket. Next to the Schlüssel.\n\nWork was slow that day. Frau Schmidt sent me home early — something about a doctor's appointment, something I didn't fully understand because she said it in German and I only caught every third word. She patted my cheek again and told me to ausruhen.\n\nI didn't want to rest. I wanted to walk.\n\nBerlin was grey again. The sky was low and heavy, like it was thinking about rain but hadn't committed yet. I walked without a destination. Past the park. Past the bridge with the duck — the duck wasn't there today. Past a church with a bell tower that looked like it hadn't been used in years.\n\nI ended up at the bookstore. Bücher &amp; Co. The sign in the window still said Englische Bücher. I went inside without thinking.\n\nHe was standing behind the counter, talking to a customer. An older woman with a stack of books in her arms. He was explaining something — in German, fast, too fast for me to follow — and the woman was nodding, and his hands were moving, and he looked like he gehörte here. Like this was his place. His language. His life.\n\nI almost left. I didn't want to interrupt. I didn't want him to see me watching.\n\nBut he looked up. His eyes found mine through the crowd. He didn't smile. He just nodded, the way he always did, and went back to helping the customer.\n\nI waited by the English section. Browsing. Not browsing. Reading the same book jacket three times without understanding a word.\n\n\"You're staring,\" he said.\n\nI turned. He was standing behind me. Close. Too close for a bookstore, too close for coworkers, too close for two people who were just sharing a Wohnung.\n\n\"I'm observing. There's a Unterschied.\"\n\n\"You have used that line before.\"\n\n\"It's a good line.\"", "choices": ["Notice the silence between them", "Focus on what is being said"]}, {"prose": "He took a step closer. I took a step back. My shoulders hit the Bücherregal.\n\n\"Why are you here, Yves?\"\n\n\"I wanted to see you.\"\n\nThe words came out before I could stop them. Honest. Unfiltered. The kind of thing I usually schluckte.\n\nMatei's expression didn't change. But his hand — his right hand — came up and rested on the bookshelf next to my shoulder. Not touching me. Close.\n\n\"You see me every day.\"\n\n\"That's not the same.\"\n\n\"What's the difference?\"\n\nI looked at his hand. The veins. The scar on his thumb. The way his fingers curled against the shelf.\n\n\"Seeing someone is passiv. It just happens. Looking is active. You choose.\"\n\n\"And you chose to look at me?\"\n\n\"I chose to come here. The looking just happened.\"\n\nHe was quiet for a moment. The bookstore was noisy around us — people talking, pages turning, a child laughing somewhere in the children's section. But in the space between us, there was only silence.\n\n\"You're doing it again.\"\n\n\"Talking without saying anything.\"\n\nI opened my mouth. Closed it. Opened it again.\n\n\"I don't know how to say what I want to say.\"\n\n\"Then don't say it.\" He leaned closer. His breath was warm on my cheek. \"Zeig es mir.\"\n\nMy heart was a disaster. A mess. A stuttering, skipping, out-of-control thing that had no business being this loud.\n\n\"I don't know how to do that either,\" I whispered.\n\n\"Then we will figure it out together.\"\n\nHe pulled back. His hand left the shelf. He walked back to the counter like nothing had happened.\n\nI stood there for a full minute, my back against the books, my heart trying to escape my chest.\n\nThen I left the bookstore. Didn't ding whether to tell the truth\" — this kind of hypothetical often uses würde + infinitive in German.\n\nThe Subjunctive II is used for:\n\n· Wishes (I wish I were there → Ich wünschte, ich wäre da)\n\n· Polite requests (Would you help me? → Würdest du mir helfen?)\n\n· Hypothetical situations (If I had a key... → Wenn ich einen Schlüssel hätte...)\n\nKey forms you will see in this book:\n\nEnglish German Subjunctive II\n\nWhy this matters: At B2, you need to recognize subjunctive forms, not produce them perfectly. You will see würde, hätte, and wäre many times in later chapters. Your brain will absorb the pattern.", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}], "gate": {"clue": "What is the German word for \"to shift (reflexive)\"?", "answer": "sich verschieben", "hint": "sich verschieben"}, "vocab": [{"german": "die Woche", "english": "week"}, {"german": "abbrennen", "english": "to burn down"}, {"german": "die Milch", "english": "milk"}, {"german": "der Zucker", "english": "sugar"}, {"german": "die Rechnung", "english": "bill / check"}, {"german": "verlieren", "english": "to lose"}, {"german": "der Ausgang", "english": "exit"}, {"german": "die Geschichte", "english": "story"}, {"german": "Rumänien", "english": "Romania"}, {"german": "verzweifelt", "english": "desperate"}, {"german": "beobachten", "english": "to observe"}, {"german": "das Ritual", "english": "ritual"}, {"german": "die Verbesserung", "english": "improvement"}, {"german": "gerunzelt", "english": "furrowed"}, {"german": "die Lebenszeit", "english": "lifetime"}, {"german": "seltsamste", "english": "strangest superlative"}, {"german": "die Notiz", "english": "note"}, {"german": "ausruhen", "english": "to rest"}, {"german": "gehören", "english": "to belong"}, {"german": "passiv", "english": "passive"}, {"german": "schlucken", "english": "to swallow"}, {"german": "zeigen", "english": "(Zeig es mir) to show (Show me)"}, {"german": "wähltest", "english": "chose"}, {" of the wooden chair. \"It's cold,\" he said when I asked. \"You don't have a scarf.\" He was right. I wore it every morning.\n\nA Notizbuch — a new one, black, with blank pages — on the table. \"You're filling the other one,\" he said. \"I saw it at the bookstore.\" I didn't tell him I had already bought a replacement. I used his instead.\n\nA small Pflanze on the windowsill. A succulent, the kind that survived Vernachlässigung. \"Every Wohnung needs a plant,\" he said. \"Otherwise it's just a box.\" I named it Matei Jr. He didn't laugh, but his mouth twitched.\n\nThese were not grand Gesten. They were not Erklärungen. But they were things. Physical evidence that he was thinking about me when I wasn't there. And I was collecting them like Beweise.\n\nOn my twelfth day at Morgenlicht, Frau Schmidt asked me a question.\n\n\"Yves. You and Matei. Are you together?\"\n\nI dropped the cup I was holding.\n\nIt shattered on the floor. Coffee everywhere. Frau Schmidt didn't turn around.\n\n\"That's your fourth cup this week,\" she said calmly.\n\n\"You're not sorry. You're vermeidest the question.\"\n\nI got the broom. Swept up the pieces. My face was hot. I could feel it brennen.\n\n\"We're not together.\"\n\n\"Ah.\" She finally turned. Her grey eyes were kind, but they were also sharp. \"So you are just living in his Wohnung. Sleeping in his bed. Wearing his scarf.\"\n\n\"It's not his bed. It's his Sofa.\"\n\n\"His Sofa. His Wohnung. His Schlüssel.\" She raised an eyebrow. \"This is a lot for not together.\"\n\nI didn't have an answer. I threw the broken cup in the trash and went back to the espresso machine.\n\n\"He talks about you.\"\n\n\"When he comes in for coffee. He talks about you.\" She smiled. \"He doesn't say much. He never says much. But he mentions you. Yves likes the apricot pastries. Yves learned to say Rechnung today. Yves laughed at something I said.\" She shrugged. \"A man who remembers the pastries you like is a man who is paying Aufmerksamkeit.\"\n\nI didn't know what to say. So I said nothing. I made a cappuccino for a customer who wasn't there. Frau Schmidt watched me with that sharp, kind look.\n\n\"You are both stur,\" she said. \"This is why nothing has happened yet.\"\n\n\"Nothing hasn't happened because nothing is supposed to happen.\"\n\n\"Lie to yourself if you want. But don't lie to me.\" She patted my cheek. \"Now clean the counter. You got coffee everywhere.\"\n\nThat night, I walked home slower than usual.\n\nThe streets were wet. It had geregnet while I was working, and the Straßenlaternen reflected off the pavement in orange pools. The air smelled like wet stone and something green. Spring was coming. I could feel it.\n\nI thought about what Frau Schmidt had said. He talks about you. Matei, who spoke in short sentences. Matei, who remembered everything. Matei, who had given me a key and a job and a scarf and a plant.\n\nMatei, who had not touched me since that first week.", "choices": ["Notice the silence between them", "Focus on what is being said"]}, {"prose": "I stopped at the bridge. The Kanal was dark. The duck was asleep somewhere, probably. I leaned on the Geländer and stared at the water.\n\nShe was right. I was stur. I was terrified. I had spent my whole life waiting for people to leave, and now someone was staying, and I didn't know what to do with that. My body knew what it wanted. My heart knew what it wanted. But my mouth — my stupid, broken mouth — couldn't form the words.\n\nI typed it. Erased it. Typed it again.\n\nThree dots appeared. Then disappeared. Then appeared again.\n\nI stared at the screen. I know. How did he know? Was he watching the window? Did he have a sixth sense for when I was standing on bridges, trying to work up the Mut to say something?\n\nI put my phone away and walked.\n\nThe stairs were siebenunddreißig steps. The Schlüssel stuck. The door opened.\n\nMatei was standing by the window. His back was to me. He was looking out at the street — the same street I had just walked down. The same orange lights.\n\n\"You're late,\" he said without turning.\n\n\"The Café closed late.\"\n\n\"Frau Schmidt texted me. She said you dropped a cup.\"\n\n\"She texted you about that?\"\n\n\"She texts me about a lot of things.\" He turned. His face was half in shadow. \"She likes you.\"\n\n\"She told me you talk about me.\"\n\nHe didn't deny it. He just stood there, hands in his pockets, watching me.\n\n\"Why did you text me?\"\n\nI walked to the table. Sat on the wooden chair. The scarf — his scarf — was still around my neck. I unwrapped it slowly, buying time.\n\n\"Because I wanted to know if you were here.\"\n\n\"I'm always here.\"\n\n\"Not always. You work. You go to the library. You have a life that doesn't involve me.\"\n\nHe walked to the plastic chair. Sat down across from me. The Lampe was between us, casting a yellow circle on the table.\n\n\"You're in every part of my life. You just don't see it.\"\n\nThe words came out before I could stop them. They hung in the air like smoke.\n\nMatei's expression didn't change. But his hand — his right hand — reached across the table. Palm up. An Einladung.\n\n\"If I come over there, something is going to happen.\"\n\n\"And I don't know if I'm ready.\"\n\nHe didn't pull his hand back. He just waited. His palm was open. His fingers were still.\n\n\"You don't have to be ready. You just have to be here.\"\n\nI stood up. Walked around the table. Sat on the Sofa next to him. Close. Close enough that our knees touched. Close enough that I could smell his coat — cold air, coffee, something underneath that was just him.", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}, {"prose": "He didn't move. He didn't touch me. He just sat there, his hand still on the cushion between us.\n\n\"Why haven't you kissed me yet?\"\n\nThe question was stupid. It was also the only question that mattered.\n\nHe turned to look at me. His grey eyes were dark in the lamplight. His face was close. Too close. Not close enough.\n\n\"Because I wanted you to want it. Not because you felt verpflichtet. Not because I'm the only person who has been nice to you. I wanted you to want it.\"\n\n\"Then why haven't you kissed me?\"\n\nI blinked. \"What?\"\n\n\"You asked why I haven't kissed you. Why haven't you kissed me?\"\n\nI opened my mouth. Closed it. Opened it again.\n\n\"Because I'm a Feigling.\"\n\n\"You're not a coward.\"\n\n\"I am. I have been running my whole life. From home, from people, from Gefühle. I came to Berlin because I was running.\"\n\nI looked at his hand. The scar on his thumb. The veins. The way his fingers curled slightly, like he was resisting the urge to reach for me.\n\n\"Now I don't want to run anymore. But I don't know how to stay.\"\n\nHe turned his hand over. Palm up again. The Einladung was still there.\n\n\"You stay by staying. One day at a time. One moment at a time. You wake up. You make coffee. You go to work. You come home. And you don't leave.\"\n\nI looked at his palm. The lines. The warmth.\n\n\"And what about you? Are you staying?\"\n\nHe didn't answer with words. He moved his hand — slowly, so slowly — and placed it on top of mine. His fingers curled around my Knöchel. His palm was warm. His grip was light, like he was holding something fragile.\n\n\"I have been staying. I have been staying since the first message. Two years ago. I have been staying since you got off the plane. I will be staying when you finally figure out that you deserve to be here.\"\n\nMy eyes were wet. I didn't know when that had happened.\n\n\"That's a lot of Druck.\"\n\n\"No.\" He squeezed my hand. \"It's a lot of Geduld. Pressure is what you put on yourself. Patience is what I'm giving you.\"\n\nI turned my hand over. Our palms pressed together. His fingers laced through mine.\n\n\"I still don't know how to say what I want to say.\"\n\n\"Then don't say it.\"\n\nThe space between us disappeared.\n\nHis forehead touched mine. His breath was warm on my lips. His nose brushed against my cheek. We were so close that I could see the individual lashes of his eyes, the small Muttermal above his eyebrow, the way his mouth was slightly open.\n\nHe just stayed there. Forehead to forehead. Breath to breath. Hands together.", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}, {"prose": "\"This is enough. For now.\"\n\nWe stayed like that for a long time. The Lampe buzzed. The Heizung clicked. Somewhere downstairs, someone was playing music — slow, sad, beautiful.\n\nAnd for the first time, I didn't feel like I was waiting for something to end.\n\nI felt like I was at the beginning.\n\nsich verschieben to shift reflexive verb\n\nleiser quieter comparative\n\ndas Notizbuch notebook neuter (review)\n\ndie Pflanze plant feminine\n\ndie Vernachlässigung neglect feminine\n\ndie Geste gesture feminine\n\ndie Erklärung explanation feminine\n\nder Beweis evidence masculine\n\ndie Aufmerksamkeit attention feminine\n\ndie Straßenlaterne streetlight feminine\n\ndie Einladung invitation feminine\n\nverpflichtet obligated adjective\n\nder Feigling coward masculine\n\nder Druck pressure masculine (review)\n\ndie Geduld patience feminine\n\ndas Muttermal mole (on skin) neuter\n\nFrom this chapter: \"She said that he talks about you\" → Sie sagte, dass er über dich redet.\n\nA dass clause acts as the object of a verb (like \"that\" in English). In German, dass sends the verb to the end.\n\nI think that he remembers everything. Ich glaube, dass er sich an alles erinnert.\n\nShe said that I dropped a cup. Sie sagte, dass ich eine Tasse fallen gelassen habe.\n\nI know that you're scared. Ich weiß, dass du Angst hast.\n\nKey pattern: main clause + dass + subject + ... + verb (at the end).\n\nWhy this matters: In later chapters, characters will express thoughts and feelings with dass. Recognizing it will help you understand complex sentences without getting lost.\n\nTip: When you see dass, look for the verb at the very end of that clause. Everything in between is the content of what someone thinks/says/knows.", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}], "gate": {"clue": "What is the German word for \"hurry\"?", "answer": "eile", "hint": "die Eile"}, "vocab": [{"german": "sich", "english": "verschieben to shift"}, {"german": "die Rede", "english": "speech"}, {"german": "leiser", "english": "quieter comparative"}, {"german": "der Schal", "english": "scarf"}, {"german": "das Notizbuch", "english": "notebook"}, {"german": "die Pflanze", "english": "plant"}, {"german": "die Vernachlässigung", "english": "neglect"}, {"german": "die Geste", "english": "gesture"}, {"german": "die Erklärung", "english": "explanation"}, {"german": "der Beweis", "english": "evidence"}, {"german": "vermeiden", "english": "to avoid"}, {"german": "brennen", "english": "to burn"}, {"german": "die Aufmerksamkeit", "english": "attention"}, {"german": "stur", "english": "stubborn"}, {"german": "regnen", "english": "to rain"}, {"german": "die Straßenlaterne", "english": "streetlight"}, {"german": "der Mut", "english": "courage"}, {"german": "die Einladung", "english": "invitation"}, {"german": "verpflichtet", "english": "obligated"}, {"german": "der Feigling", "english": "coward"}, {"german": "der Druck", "english": "pressure"}, {"german": "die Geduld", "english": "patience"}, {"german": "das Muttermal", "english": "mole (on skin)"}, {"german": "die Wohnung", "english": "apartment"}, {"german": "das Sofa", "english": "sofa / couch"}, {"german": "der Schlüssel", "english": "key"}, {"german": "die Lampe", "english": "lamp"}, {"german": "die Heizung", "english": "radiator / heating"}, {"german": "die Erklärung", "english": "explanation"}, {"german": "die Straßenlaterne", "english": "streetlight"}, {"german": "das Geländer", "english": "railing"}, {"german": "siebenunddreißig", "english": "thirty-seven"}, {"german": "das Gefühl", "english": "feeling"}, {"german": "der Knöchel", "english": "knuckle / ankle"}, {"german": "über", "english": "over / about"}, {"german": "wissen", "english": "to know"}, {"german": "die Erklärung", "english": "explanation"}, {"german": "die Straßenlaterne", "english": "streetlight"}, {"german": "das Gefühl", "english": "feeling"}, {"german": "wissen / weiß", "english": "to know / white"}], "shadow": ["This is the emotional peak of Part One. Read it as if you don't know what happens next.", "Matei: \"Warum bist du hier?\"", "Yves: \"Ich wollte dich sehen.\"", "Matei: \"Zeig es mir.\"", "Zeig es mir: three syllables, falling stress. ZEIG — es — mir. The command form of zeigen. It asks for something that cannot be explained."]}, {"id": 7, "title": "The Crack", "scenes": [{"prose": "The next morning, Matei was gone before I woke up.\n\nThat wasn't neu. But something else was new: he hadn't left coffee on the table.\n\nI stood in the kitchen, staring at the empty space where the mug should have been. The French press was clean. The beans were in the cabinet. But no coffee. No note. Nothing.\n\nHe forgot, I told myself. He was in a Eile.\n\nBut Matei didn't forget things. That was his whole thing. He remembered everything.\n\nI made my own coffee. It tasted wrong. Too bitter. Too weak. I poured it down the sink and went to work.\n\nFrau Schmidt noticed immediately.\n\n\"You look like someone died.\"\n\n\"Your face says otherwise.\" She handed me an apron. \"Did you and Matei fight?\"\n\n\"We didn't fight. He just... wasn't there this morning.\"\n\n\"Ah.\" She nodded like this explained everything. \"The silent treatment. I know it well. My husband did this for forty years.\"\n\n\"We're not together.\"\n\n\"You keep saying that.\" She walked to the espresso machine. \"One day you will stop lying to yourself. Until then, you clean the Badezimmer.\"\n\nThe Badezimmer at Morgenlicht was small and smelled like Bleichmittel. I scrubbed the toilet. I wiped the mirror. I thought about Matei's hand on mine. The way his forehead had touched my forehead. The way he had said this is enough.\n\nIf it was enough, why wasn't he here?\n\nAt noon, Frau Schmidt sent me to the bakery down the street to pick up pastries. I walked with my head down, avoiding Augenkontakt with everyone. The bakery was warm and loud. A woman behind the counter shouted orders in German. I waited in line, staring at the floor.\n\nI looked up. A man was standing at the counter. Dark hair. Grey coat. Not Matei.\n\n\"You're Matei's friend, right?\"\n\nI blinked. \"I'm sorry. Do I know you?\"\n\n\"Lukas.\" He smiled. It was a nice smile — easy, confident, nothing like Matei's almost-smiles. \"I work at the bookstore. Matei and I have the same Schicht sometimes.\"\n\n\"Oh.\" I didn't know what else to say.\n\n\"He talks about you a lot.\" Lukas leaned on the counter. \"Says you're learning German fast. Says you make better coffee than Frau Schmidt, which I don't believe because her coffee is terrible.\"\n\nI laughed before I could stop myself. \"Her coffee is fine.\"\n\n\"Her coffee is Spülwasser. But she's nice, so no one tells her.\" He tilted his head. \"You okay? You look like someone cancelled your favorite show.\"\n\n\"Matei keeping you up?\"\n\nThe question hung in the air. His smile didn't change. But there was something in his eyes — curiosity, maybe. Or something else.\n\n\"We're not like that.\"\n\n\"Sure.\" He pulled out his phone. \"What's your number? I'll text you when Matei's being an Idiot at work. You can come laugh at him.\"\n\nI should have said no. I should have taken my pastries and left. But I was tired. And lonely. And Matei hadn't left me coffee.\n\nThe pastries were warm. I carried them back to Morgenlicht and didn't think about Lukas's smile.\n\nThat night, Matei came home at nine.\n\nI was sitting on the Sofa, pretending to read a book I had found on his shelf. Something in German, with small print and no pictures. I had been on the same page for an Stunde.\n\n\"You're late,\" I said.", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}, {"prose": "\"Work ran long.\"\n\n\"You didn't leave coffee this morning.\"\n\nHe hung his coat on the hook. Didn't look at me.\n\n\"You don't forget things.\"\n\nHe finally turned. His face was blank. The same blank he had worn at the Flughafen. The one that said I'm here but I'm not letting you in.\n\n\"I forgot. It happens.\"\n\nHe walked to the kitchen. Opened the Kühlschrank. Stared inside like it contained answers.\n\n\"Nothing's wrong.\"\n\n\"Something is wrong. You have been komisch since last night.\"\n\n\"I have been weird?\" He closed the Kühlschrank. Turned. \"You're the one who sat on the Sofa and let me hold your hand and then went to bed like nothing happened.\"\n\nI stood up. \"Nothing did happen.\"\n\n\"Nothing happened because you didn't want anything to happen.\"\n\n\"That's not true.\"\n\n\"Then what did you want, Yves? Tell me. Because I have been patient. I have been waiting. I have been giving you space and time and all the things you said you needed. But I don't know what you actually want.\"\n\nThe room was quiet. The Lampe buzzed. The Heizung clicked.\n\n\"I want you to stop being so patient.\"\n\nHe stared at me. \"What?\"\n\n\"I want you to stop waiting. I want you to stop giving me space. I want you to stop acting like I'm going to break.\" I walked toward him. Stopped a meter away. \"I'm not zerbrechlich, Matei. I'm scared. There's a Unterschied.\"\n\n\"Then what do you want me to do?\"\n\n\"Kiss me. Or don't. But stop standing in the kitchen like you're planning your exit.\"\n\n\"I'm not planning my exit.\"\n\n\"Then why did you leave this morning without saying Auf Wiedersehen?\"\n\nHe was quiet for a long moment. Then he said, \"Because I didn't trust myself to stay.\"\n\nThe words hit me like cold water.\n\n\"What does that mean?\"\n\nHe ran a hand through his hair. It fell back over his forehead.\n\n\"It means that when I'm close to you, I want things. And I don't know if you want the same things. So I put distance between us. To protect you. To protect me. I don't know anymore.\"\n\n\"I'm not good at this.\" His voice was low. Rau. \"I'm good at remembering. I'm good at waiting. I'm not good at... taking.\"\n\nHe looked up. His grey eyes were dark.\n\nI walked to him. Closed the meter. Stood so close I could feel the heat from his chest.\n\n\"You have been waiting for me to make a move. I have been waiting for you. That's stupid. We're both stupid.\"\n\n\"So I'm going to do something. And you're going to let me.\"\n\nHe didn't nod. Didn't speak. But he didn't step back.", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}, {"prose": "I reached up. My hand touched his face. His jaw was rough with Stoppeln. His skin was warm.\n\nIt wasn't gentle. It wasn't the kind of kiss you see in movies, with soft music and perfect lighting. It was messy. Verzweifelt. The kind of kiss that happens when two people have been circling each other for weeks and finally run out of excuses.\n\nHis hands found my waist. Pulled me closer. My back hit the kitchen counter. His mouth was hot and tasted like coffee and something else — something bitter and sweet at the same time.\n\nI had imagined this moment a hundred times. On the Sofa in the dark. On the bridge with the duck. In the bed, listening to him breathe. I had imagined it soft and careful, the way Matei did everything else.\n\nThis was his fingers pressing into my hips. This was my hands fisting in his shirt. This was the sound he made — a small, broken thing — when my teeth grazed his lower lip. This was the way he said my name, not as a question but as an answer.\n\nHe broke the kiss first. His forehead rested against mine. His breathing was fast. His hands were still on my waist, shaking slightly.\n\n\"That,\" he said, \"was not nothing.\"\n\n\"No. It wasn't.\"\n\nI laughed. Actually laughed. The sound surprised both of us.\n\n\"Now we stop being Idioten. And we figure this out.\"\n\nHe kissed me again. Slower this time. Like he was memorierte the shape of my mouth. Like he was trying to remember every detail — the way my breath hitched, the way my fingers curled into his shirt, the way I said his name when he pulled back just enough to look at me.\n\nWhen he pulled back, his hands were still on my waist. His thumbs traced circles on my hips.\n\n\"You're staying tonight. In the bed. With me.\"\n\n\"Are you asking or telling?\"\n\nI smiled. \"Okay.\"\n\nWe didn't sleep much that night.\n\nWe lay in the dark, on the bed that had been mine for two weeks but was really his. His arm was under my head. His chest was warm against my back. His breath was slow and even, but I knew he wasn't asleep.\n\n\"Why did you really give me the Schlüssel?\"\n\nHis arm tightened around me.\n\n\"Because I wanted you to have a reason to come back. And because I wanted to know what it felt like to trust someone again.\"\n\n\"Who broke your trust?\"\n\nHe was quiet for a long time.\n\n\"The Ex. The one who left the Frank Ocean album.\"\n\n\"What happened?\"\n\n\"He left. That's what happened.\" His voice was flat. \"One day he was here. The next day he wasn't. No explanation. Just a note on the table. I can't do this anymore.\"\n\nI turned over. Faced him in the dark.\n\n\"It was years ago.\"\n\n\"That doesn't make it less awful.\"\n\nHe was quiet. Then he said, \"You're not him.\"\n\n\"You haven't run away yet.\"\n\n\"I'm not going to.\"\n\nHe kissed my forehead. Soft. Kurz.\n\n\"Good. Because I don't think I could handle another Abschied.\"", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}, {"prose": "I held him. He held me. The Heizung clicked. The street was quiet.\n\nAnd for the first time, I didn't think about leaving.\n\nbitter bitter adjective (review)\n\nfein fine / okay adjective\n\ndas Bleichmittel bleach neuter\n\nder Augenkontakt eye contact masculine\n\nLukas Lukas (name) proper noun\n\ndie Schicht shift (work) feminine (review)\n\ndas Spülwasser dishwater neuter\n\nkomisch weird / funny adjective\n\nzerbrechlich fragile adjective\n\nAuf Wiedersehen goodbye (formal) phrase\n\ndie Stoppeln stubble plural\n\nSei still Be quiet imperative\n\nverzweifelt desperate adjective (review)\n\nmemorieren to memorize verb\n\nkurz short / brief adjective\n\nder Abschied farewell masculine\n\nFrom this chapter: \"Sei still\" (Be quiet) and earlier \"Komm\" (Come).\n\nThe imperative is how you tell someone to do something. Different forms for different people.\n\nForms you will see in this story:\n\nyou (singular informal, du) verb stem + (e) Komm her! (Come here)\n\nyou (singular, sein / to be) sei Sei still! (Be quiet)\n\nyou (plural, ihr) verb stem + t Kommt her! (Come here - to multiple people)\n\nyou (formal, Sie) infinitive + Sie Kommen Sie bitte (Please come)\n\nKey irregulars to remember:\n\nVerb du imperative Meaning\n\nhaben (to have) hab have (rare)\n\nwerden (to become) werd become\n\nWhy this matters: In later chapters, characters will give direct commands. Recognizing the imperative helps you understand urgency and tone.", "choices": ["Notice the silence between them", "Focus on what is being said"]}], "gate": {"clue": "What is the German word for \"trust\"?", "answer": "vertrauen", "hint": "das Vertrauen"}, "vocab": [{"german": "neu", "english": "new"}, {"german": "die Eile", "english": "hurry"}, {"german": "bitter", "english": "bitter"}, {"german": "fein", "english": "fine / okay"}, {"german": "das Bleichmittel", "english": "bleach"}, {"german": "der Augenkontakt", "english": "eye contact"}, {"german": "Lukas", "english": "Lukas (name) proper"}, {"german": "die Schicht", "english": "shift (work)"}, {"german": "das Spülwasser", "english": "dishwater"}, {"german": "die Stunde", "english": "hour"}, {"german": "komisch", "english": "weird / funny"}, {"german": "zerbrechlich", "english": "fragile"}, {"german": "Auf", "english": "Wiedersehen goodbye (formal)"}, {"german": "rau", "english": "rough"}, {"german": "die Stoppeln", "english": "stubble"}, {"german": "Sei", "english": "still Be quiet imperative"}, {"german": "verzweifelt", "english": "desperate"}, {"german": "der Idiot", "english": "idiot"}, {"german": "memorieren", "english": "to memorize"}, {"german": "hm", "english": "hmm interjection"}, {"german": "kurz", "english": "short / brief"}, {"german": "der Abschied", "english": "farewell"}, {"german": "das Badezimmer", "english": "bathroom"}, {"german": "das Sofa", "english": "sofa / couch"}, {"german": "die Lampe", "english": "lamp"}, {"german": "die Heizung", "english": "radiator / heating"}, {"german": "der Schlüssel", "english": "key"}, {"german": "bitte", "english": "please / here you go"}, {"german": "der Kühlschrank", "english": "refrigerator"}], "shadow": ["The fight before the kiss. These lines are faster — less pause between them than usual.", "Yves: \"I want you to stop being so patient. I'm not fragile. I'm scared. There's a difference.\"", "Matei: \"Ich weiss.\"", "Ich weiss: I know. Two words. Said quietly. Everything Matei has been holding back is in those two words. Say them like a door opening.", "---", "Review — Part One: Arrival (Chapters 1-7)", "You have finished Part One. Yves has arrived. The kiss has happened. Nothing will be the same.", "What You Have Learned", "By now your brain has encountered the following — not memorised, but seen in context many times:", "Core vocabulary: der Schluessel (key), die Wohnung (apartment), muede (tired), die Luge (lie), wuetend (angry), bereit (ready), die Tatsache (fact), enttaeuscht (disappointed), die Zukunft (future), das Vertrauen (trust).", "Core grammar: dative prepositions (in, aus, von, mit), separable verbs (aufschliessen, abschliessen, anrufen), imperative forms (Sei still, Gib mir, Komm), weil-clauses with verb at the end.", "Production Challenge", "Without looking back: write five sentences about what has happened in the story so far. In German. No dictionary. Use the words your brain already holds.", "If you can write three sentences, you are exactly where you should be. If you can write five, you are ahead.", "Recall Challenge", "Without looking back, answer from memory:", "1. How does Matei take his coffee?", "2. What is the name of the café where Yves works?", "3. What is on the CD Matei's Ex left behind?", "4. What does Yves count on every trip upstairs?", "5. What does Matei say when he gives Yves the key?", "Answers: 1. He doesn't — Yves drinks black tea, no sugar, no milk. Matei remembers this from a message two years ago. 2. Morgenlicht. 3. Frank Ocean. 4. The stairs — siebenunddreissig (37). 5. Fur dich — For you.", "Part One German Self-Test", "Translate these sentences without looking up any words. If you can't, that's the signal — go back to that chapter.", "1. Ich bin muede, aber ich bleibe.", "2. Er fast laechelt. Fast.", "3. Das ist nicht eine Luge. Das ist die Wahrheit.", "4. Wo ist der Schluessel?", "5. Ich wollte dich sehen.", "Translations: 1. I am tired, but I am staying. 2. He almost smiles. Almost. 3. That is not a lie. That is the truth. 4. Where is the key? 5. I wanted to see you.", "Part Two begins with 50-70% German. You are ready. Turn the page.", "---"]}, {"id": 8, "title": "The Text", "scenes": [{"prose": "Things were gut for exactly four days.\n\nThat's not a Beschwerde. Four days of waking up next to Matei, of his arm around my waist, of coffee that he made and left on the table with notes that said things like Don't burn the milk and You have flour in your hair and — my personal favorite — The plant is watching you. I think it knows.\n\nI had named the succulent Matei Jr. on day three. By day four, I was having full conversations with it.\n\n\"You're talking to the plant again,\" Matei said from the kitchen.\n\n\"Matei Jr. is worried about you. He says you work too much.\"\n\n\"The plant doesn't talk.\"\n\n\"He talks to me. We have a deep emotional connection.\"\n\nMatei walked over with two mugs. Handed me one. Black. No sugar. No milk. Perfekt.\n\n\"Does Matei Jr. also tell you that you left your socks on the bathroom floor?\"\n\n\"He doesn't need to. You already told me. Twice.\"\n\n\"I'm telling you again. Third time's the Charme.\"\n\nI threw a sugar packet at him. He caught it without looking. Angeber.\n\nHey Yves. Matei's being a total Idiot at work today. You should come by the bookstore and witness it. I'll buy you a coffee.\n\nI read the message three times. It was friendly. Lässig. The kind of thing you would send to a friend's Mitbewohner. Nothing weird about it.\n\nThat's the thing about trust. It's zerbrechlich. And I had spent my whole life learning to keep things to myself. Not because I was dishonest. Because I was scared. Scared that if I showed someone everything, they would use it against me. Or worse — they would get gelangweilt and leave.\n\nSo I put my phone away and didn't mention Lukas.\n\nThen he texted again an hour later.\n\nSeriously, Yves. He just schrie at a customer for pronouncing \"Goethe\" wrong. It was beautiful. The customer said \"Go-eth.\" Matei's eye started twitching. I thought he was going to levitate.\n\nI laughed. I couldn't help it. The image of Matei losing his cool over a mispronounced dead poet was too good.\n\nWhat did the customer do? I wrote back.\n\nLeft. But not before calling Matei a \"pedantisches Arschloch.\" Which is fair, honestly. Matei then spent ten minutes explaining why Goethe is pronounced \"Ger-ta\" and not \"Go-eth.\" To no one. The customer was gone. He was explaining it to the empty doorway.\n\nI laughed so hard Frau Schmidt looked up from her tea.\n\n\"What's so funny?\"\n\n\"Matei yelled at a customer.\"\n\n\"That's not funny. That's Tuesday.\"\n\n\"He explained Goethe pronunciation to an empty doorway for ten minutes.\"\n\nShe stared at me. Then she started laughing. A deep, wheezy laugh that turned into a cough that turned back into a laugh.\n\n\"That man,\" she said, wiping her eyes, \"is the most Romanian person I have ever met.\"\n\nI decided to go to the bookstore after my Schicht.\n\nNot because of Lukas. Because I wanted to see Matei. And maybe also because I wanted to see Matei being ridiculous. And maybe also because Lukas said he would buy me coffee, and Frau Schmidt's coffee was free but terrible, and I was curious what actual coffee tasted like again.\n\n\"You're going to the bookstore,\" Frau Schmidt said. It wasn't a question.\n\n\"How do you know?\"\n\n\"You have that look. The look of someone who is about to watch their boyfriend make a fool of himself.\"\n\n\"Don't finish that sentence. I will hit you with a broom.\"\n\nI finished my shift. Changed out of my apron. Walked to Karl-Marx-Allee.\n\nThe bookstore was busy when I walked in. A poetry reading in the back room, someone with a loud voice and a guitar that was slightly out of tune. The front was quieter — just a few customers browsing, a woman at the counter buying a stack of children's books.\n\nLukas was behind the counter. He saw me and waved like we had been friends for years.\n\n\"Yves! You came!\"\n\n\"You said you would buy me coffee.\"\n\n\"I did say that.\" He poured two cups from a pot behind the counter. Handed me one. \"Fair warning: this coffee is terrible. But it's free.\"\n\nI took a sip. It was worse than Frau Schmidt's. It tasted like someone had washed a coffee bean in dishwater and called it a day.\n\n\"This is Spülwasser,\" I said.\n\n\"I know. That's why I'm giving it to you and not drinking it myself.\" He was drinking tea. Earl Grey. The fancy kind.\n\n\"You tricked me.\"\n\n\"I'm a bookseller. Tricking people is in the job description.\"\n\n\"So. Matei.\" He leaned on the counter. \"He's in the back. Helping with the reading. He's been in a weird mood all day.\"\n\n\"Weird like... happy? It's unsettling. Usually he's just quiet and judgmental. Today he's quiet and smiling. It's like watching a cat purr. You don't trust it.\"", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}, {"prose": "I felt something warm spread through my chest.\n\n\"He's not that bad.\"\n\n\"He's exactly that bad. Last week a customer asked where the self-help section was. Matei said, and I quote, 'On the floor, where you're sitting.' The customer was standing.\" Lukas shook his head. \"He's a menace. But he's our menace.\"\n\n\"Does he know you're texting me?\"\n\nLukas's smile didn't change. But something flickered in his eyes.\n\n\"Does he need to?\"\n\nThe question hung in the air.\n\n\"I don't know,\" I said. \"Maybe.\"\n\n\"Matei and I are friends. Work friends. I text everyone. It's not a thing.\"\n\n\"I didn't say it was a thing.\"\n\n\"You didn't have to. Your face said it.\" He took a sip of his tea. \"Look. I'm not trying to cause drama. I just think Matei is funny when he's annoyed, and you seem like someone who would also think that's funny. That's all.\"\n\n\"That's all.\" He paused. \"Also, he talks about you constantly. It's nauseating. 'Yves learned a new word today. Yves dropped a cup and apologized to it. Yves named my plant after himself.' Do you know how weird that is? He named a plant after himself?\"\n\n\"I named it after him. Matei Jr.\"\n\n\"That's worse. That's so much worse.\"\n\nWe both laughed. A customer walked up to the counter. Lukas helped her. I stood there, holding my terrible coffee, watching the door to the back room.\n\nMatei came out twenty minutes later.\n\nHe was talking to someone — a woman with a notebook and glasses — and he was doing that thing where he listened more than he spoke. Nodding. Asking a question. Nodding again. The woman laughed at something he said. He almost smiled.\n\nHis expression didn't change. But his shoulders relaxed. Just a little. The kind of shift you wouldn't notice unless you were watching for it.\n\nI was always watching for it.\n\nHe said something to the woman. She nodded and walked away. He walked to me.\n\n\"Lukas said you yelled at a customer.\"\n\n\"I didn't yell. I corrected.\"\n\n\"He said you explained Goethe to an empty doorway for ten minutes.\"\n\nMatei's jaw tightened. \"Lukas has a big mouth.\"\n\n\"He also said your coffee is terrible. He was right.\"\n\nI held out my cup. Matei took it. Smelled it. Made a face.\n\n\"This isn't coffee. This is hot water that once saw a coffee bean from across the room.\"\n\n\"That's exactly what I said.\"\n\n\"You said it was Spülwasser.\"\n\nHe almost smiled. Almost. Then he looked at me — really looked — and the almost disappeared.\n\n\"Why are you really here, Yves?\"\n\n\"I wanted to see you.\"\n\n\"You see me every day.\"\n\n\"That's not the same.\"\n\n\"What's the difference?\"\n\nI looked at his hand. The scar on his thumb. The way his fingers curled around the cup.\n\n\"Seeing you is passive. It just happens. Coming to see you is a choice.\"\n\nHe was quiet for a moment. Then he said, \"You're quoting yourself. From the last time we had this conversation.\"\n\n\"It's a good line.\"\n\n\"It's an okay line.\"\n\n\"You liked it the first time.\"\n\n\"I was being polite.\"\n\n\"You're never polite.\"\n\n\"I'm always polite. I'm Romanian.\"\n\nI laughed. He didn't. But his hand — his right hand — reached out and touched mine. Just for a second. Just a brush of fingers.\n\n\"Lukas texted you, didn't he?\"\n\n\"How do you know?\"", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}, {"prose": "\"Because he's been smiling at his phone all day. And now you're here. Two plus two.\"\n\n\"That's not how math works.\"\n\n\"It's how my math works.\"\n\nI didn't deny it. I was tired of denying things.\n\n\"He said you explained Goethe pronunciation to an empty doorway.\"\n\n\"The doorway was not empty. I was in the doorway. The customer had left. I was finishing my thought.\"\n\n\"For ten minutes.\"\n\n\"It was a complex thought.\"\n\nI laughed so hard a woman browsing nearby shushed me. Matei looked at her. She looked away.\n\n\"You're dangerous,\" I said.\n\nHe almost smiled. That was the fifth one I had counted since I arrived in Berlin. I was keeping a list in my Notizbuch. Page fourteen. Almost-smile #5: Bookstore, after Goethe incident.\n\nI stayed for another hour.\n\nMatei worked the counter. I sat at a table near the window and pretended to read a book. Actually, I watched him. The way he explained things to customers — patient, precise, never condescending. The way he handled a stack of books like they were zerbrechlich. The way he looked up every few minutes, just to check if I was still there.\n\nLukas brought me another coffee. It was still terrible.\n\n\"You're staring at him,\" Lukas said.\n\n\"I'm observing.\"\n\n\"You're staring. It's fine. He stares at you too. It's disgusting.\"\n\n\"We're disgusting.\"\n\n\"At least you own it.\"\n\nLukas went back to the counter. I went back to watching.\n\nAt 6 PM, Matei's shift ended. He walked to my table. Put on his coat.\n\n\"Dinner. You're cooking.\"\n\n\"Why am I cooking?\"\n\n\"Because I bought groceries yesterday. And you're better at it.\"\n\n\"You bought groceries? Voluntarily?\"\n\n\"Lukas made me.\"\n\n\"Lukas made you buy groceries?\"\n\n\"He said, and I quote, 'If you don't feed that boy something other than coffee and regret, I'm calling social services.'\"\n\nI laughed. \"Lukas is weird.\"\n\n\"Lukas is a lot of things. Weird is one of them.\"\n\nWe walked home together. The streets were dark. The Straßenlaternen cast orange light on the pavement. His hand brushed mine. Then held it.\n\n\"Lukas texts me sometimes. About you. About work. It's nothing.\"\n\nHe was quiet for a step. Then two.\n\n\"You're not jealous?\"\n\n\"I didn't say that.\"\n\n\"Are you jealous?\"\n\nHe stopped walking. Turned to look at me.\n\n\"I'm jealous of everyone who gets to see you when I'm not there.\"\n\n\"That's the most romantic thing you have ever said.\"\n\n\"It's not romantic. It's territorial.\"\n\nHe kissed my forehead. Soft. Kurz.\n\n\"Just tell me next time. When he texts you. I don't care what he says. I care that you don't hide it.\"\n\nWe walked home. His hand was in mine. The stairs were siebenunddreißig steps. The Schlüssel stuck. The door opened.\n\nThat night, after dinner, my phone buzzed.\n\nLukas: You two are disgustingly cute. I hate it. Also, Matei almost smiled today. Almost. I’ve worked with him for two years and never seen him get that close. What did you do?\n\nI put my phone away. Matei was on the Sofa, reading. His glasses were on — the ones he only wore at home, the ones that made him look like a Professor from a black-and-white movie.\n\n\"Lukas says you almost smiled today.\"", "choices": ["Notice the silence between them", "Focus on what is being said"]}, {"prose": "He didn't look up from his book.\n\n\"He says he’s never seen you get that close.\"\n\n\"He's not paying attention.\"\n\n\"He's been paying attention for two years.\"\n\nMatei looked up. His grey eyes caught the light.\n\n\"Then he wasn't paying attention to the right things.\"\n\nI sat next to him. Leaned my head on his shoulder.\n\n\"What were you smiling about?\"\n\n\"What about me?\"\n\n\"You told Frau Schmidt that Matei Jr. needed more sunlight. She asked if Matei Jr. was your child. You said yes.\"\n\nI laughed. \"She believed me.\"\n\n\"She believes everything you say. You could tell her the sky is green and she would say 'ah, the light is different in Berlin.'\"\n\n\"That's because she likes me.\"\n\n\"Everyone likes you. It's annoying.\"\n\nHe closed his book. Set it on the table. Turned to look at me.\n\n\"I like you more than I have liked anyone. And that's terrifying.\"\n\n\"Because now I have something to lose.\"\n\n\"You're not going to lose me.\"\n\n\"You don't know that.\"\n\n\"I'm choosing to stay. Every day. That's not nothing.\"\n\n\"No,\" he said. \"It's not nothing.\"\n\ndie Beschwerde complaint feminine\n\nder Charme charm masculine\n\nder Angeber show-off masculine (review)\n\nder Mitbewohner roommate masculine\n\nlässig casual / relaxed adjective\n\nzerbrechlich fragile adjective (review)\n\ngelangweilt bored adjective\n\nschreien (schrie) to shout (shouted) verb\n\ndas Arschloch asshole neuter\n\ndie Schicht shift (work) feminine (review)\n\ndas Spülwasser dishwater neuter (review)\n\ndie Stunde hour feminine (review)\n\nkomisch weird / funny adjective (review)\n\nder Professor professor masculine\n\nkurz short / brief adjective (review)\n\nFrom this chapter: \"Das ist ja Spülwasser\" (That's so dishwater) — ja as a modal particle softens or emphasizes.\n\nWhat are modal particles? Small words that add tone, feeling, or attitude to a sentence. They don't translate directly to English. Very common in spoken German.\n\nKey particles you will encounter:\n\nja statement of obvious fact Das ist ja schön! (That's beautiful, as you can see)\n\ndoch contradiction / reminder Komm doch mit! (Just come with me — you know you should)\n\nhalt resignation / acceptance Das ist halt so. (That's just how it is)\n\neben same as halt Dann geh eben nicht. (Then just don't go)\n\nschon reassurance / qualification Das wird schon gut gehen. (It'll be fine — don't worry)\n\nmal softening / casual (short for einmal) Komm mal her. (Come here for a sec)\n\nExample from this chapter (paraphrased): \"Ich hab dir doch gesagt\" (I told you — remember?) — doch reminds the listener of something they should know.\n\nWhy this matters: Modal particles are the secret sauce of natural German. You don't need to produce them at B2, but recognizing them will make you understand tone much better. And they're very funny when you start noticing them.", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}], "gate": {"clue": "What is the German word for \"the morning after\"?", "answer": "morgen danach", "hint": "der Morgen danach"}, "vocab": [{"german": "gut", "english": "good"}, {"german": "die Beschwerde", "english": "complaint"}, {"german": "der Charme", "english": "charm"}, {"german": "der Angeber", "english": "show-off"}, {"german": "der Idiot", "english": "idiot"}, {"german": "der Mitbewohner", "english": "roommate"}, {"german": "lässig", "english": "casual / relaxed"}, {"german": "zerbrechlich", "english": "fragile"}, {"german": "gelangweilt", "english": "bored"}, {"german": "schreien", "english": "(schrie) to shout (shouted)"}, {"german": "das Arschloch", "english": "asshole"}, {"german": "die Schicht", "english": "shift (work)"}, {"german": "das Spülwasser", "english": "dishwater"}, {"german": "die Stunde", "english": "hour"}, {"german": "komisch", "english": "weird / funny"}, {"german": "der Professor", "english": "professor"}, {"german": "kurz", "english": "short / brief"}, {"german": "perfekt", "english": "perfect"}, {"german": "der Schlüssel", "english": "key"}, {"german": "das Sofa", "english": "sofa / couch"}, {"german": "schön", "english": "beautiful / nice"}, {"german": "die Straßenlaterne", "english": "streetlight"}, {"german": "siebenunddreißig", "english": "thirty-seven"}, {"german": "die Straßenlaterne", "english": "streetlight"}], "shadow": ["Formal register practice — write and say this sentence aloud, which appears in a different form in the chapter:", "Deine Aufgabe ist es, mir zu vertrauen. — Your job is to trust me.", "Then try the informal version: Vertrau mir einfach. — Just trust me.", "Notice: formal German uses mehr Worte. Informal German gets to the point faster. Both are correct. Context decides.", "Understood. All chapters going forward will be romantic comedy — sharp banter, absurd situations, Yves's dry wit, Matei's deadpan ridiculousness, and genuine laughs alongside the heart. I will revise previous chapters later if you wish, but from now on: rom-com energy fully engaged.", "Here is Chapter Nine — The Morning After (with humor baked in).", "---"]}, {"id": 9, "title": "The Morning After", "scenes": [{"prose": "Not ungewöhnlich. Matei was an early riser. He liked to be out of the Wohnung before the city got loud, before the bakery downstairs started selling out of the good bread, before I had to drag myself out of bed and pretend to be a funktionierender human being.\n\nBut this time felt different.\n\nThe space beside me was cold. No lingering Wärme. No dent in the pillow where his head had been. He had gotten up hours ago, and he hadn't come back.\n\nI sat up. The Wohnung was quiet. Too quiet.\n\nOn the table, there was coffee. Black. No sugar. No milk. And a note.\n\nI need some Luft. I'll be back tonight.\n\nP.S. There are pastries in the freezer. Not the apricot ones. Those are mine. Yours are the ones that look like someone stepped on them. Sorry.\n\nP.P.S. I'm not actually sorry.\n\nI stared at the note for a long time. His handwriting was small and neat. The kind of handwriting that belonged to someone who thought before they wrote — and then thought again, and then added a postscript about pastries.\n\nI folded the note and put it in my pocket. Next to the Schlüssel.\n\n\"You absolute weirdo,\" I said to the empty room.\n\nThe empty room did not respond. Matei Jr. sat on the windowsill, judging me silently.\n\nI dropped two cups before noon. Frau Schmidt didn't say anything, but she watched me with those sharp grey eyes, and at 11:30, she pulled me aside.\n\n\"I have to clean the Badezimmer.\"\n\n\"The Badezimmer can wait. Sit.\"\n\nI sat. She sat across from me. The Café was empty except for a man in the corner reading a newspaper and ignoring us.\n\n\"What happened?\"\n\n\"You dropped two cups. Last week you dropped four total. This is Rückschritt.\"\n\n\"You're lying.\" She folded her arms. \"Did you and Matei fight?\"\n\nI stared at the table. The wood was scratched. Someone had carved a heart into it, years ago, with two initials inside. T + M. Not Matei. Someone else. Probably two people who also had terrible taste in furniture.\n\n\"He left a note,\" I said. \"He said he needed Luft.\"\n\n\"Ah.\" Frau Schmidt nodded. \"The Luft note. My husband wrote that note forty-three times.\"\n\n\"I counted. The first thirty times, I panicked. The last thirteen, I ate his pastries while he was gone.\"\n\n\"Did he ever actually leave?\"\n\n\"Once. He got as far as the U-Bahn station. Then he remembered he left his wallet on the kitchen table.\" She smiled. \"He came back. He always came back.\"\n\n\"That's not advice.\"\n\n\"It's not advice. It's a Geschichte. And a warning: hide the pastries.\"\n\nI laughed. I couldn't help it.\n\n\"You're terrible.\"\n\n\"I'm practical. There's a Unterschied.\"\n\nI left work early. Frau Schmidt shooed me out the door with a bag of pastries — the stepped-on kind, Matei's warning had been accurate — and a warning not to drop the bag.\n\nI walked to the bridge. The one with the duck.\n\nThe duck was there today, paddling in circles like it had nowhere to be and all day to get there. It was a small duck. Unremarkable. But it had a quality I admired: it never seemed worried about anything.\n\n\"You have it easy,\" I told the duck.\n\nThe duck quacked. I chose to interpret this as agreement.", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}, {"prose": "I leaned on the Geländer and ate a pastry. It was good. Flaky. Too sweet. I ate another one.\n\nI stared at the message. He hadn't texted me all day. Now he was asking where I was.\n\nBridge, I wrote back. The one with the duck.\n\nI know which one. Stay there.\n\nWhy? Are you coming to push me in?\n\nBecause I need to apologize. And I can't do it over text. My thumbs are not emotionally available.\n\nI laughed. The duck looked at me.\n\n\"He's an idiot,\" I told the duck.\n\nThe duck quacked. I chose to interpret this as obviously.\n\nTwenty minutes later, Matei appeared at the end of the bridge.\n\nHe was wearing the same grey coat. His hands were in his pockets. His hair was messy, like he had been running his hands through it. He looked like someone who had spent the morning walking halfway across Berlin and regretting every step.\n\nHe walked to me. Stopped a meter away. Didn't touch me.\n\n\"You came,\" I said.\n\n\"I said I would.\"\n\n\"You also said you needed Luft.\"\n\n\"I got Luft. A lot of Luft. I walked to Tiergarten and back.\"\n\n\"That's like ten kilometers.\"\n\n\"No. My feet hurt.\"\n\nI looked at his shoes. They were nice shoes. Expensive. Completely wrong for a ten-kilometer walk of shame.\n\n\"You wore your good shoes.\"\n\n\"I wasn't planning to walk to Tiergarten. I was planning to walk to the bakery. Then I kept going.\"\n\n\"Because you were angry.\"\n\n\"Because I was stupid.\"\n\n\"I'm not good at this.\"\n\n\"At being angry. When I'm angry, I schalte ab. I leave. I don't talk. It's what I learned. From my father. From the Ex. From all the people who taught me that anger is dangerous.\"\n\n\"It is dangerous.\"\n\n\"Not when it's honest.\" He took a breath. \"I was angry last night. Not because of Lukas. Because you didn't trust me.\"\n\n\"I do trust you.\"\n\n\"You hide things. Small things. Things that don't matter. And every time you hide something, I wonder what else you're hiding.\"\n\nI wanted to argue. I wanted to say I'm not hiding anything. But that wasn't true. I had been hiding my whole life. Hiding my fear. Hiding my Einsamkeit. Hiding the fact that I didn't know who I was or what I wanted.\n\nAlso hiding that I had eaten his apricot pastries yesterday. But that felt like a separate issue.\n\n\"I'm scared,\" I said.\n\n\"I'm scared that if you know everything about me, you'll leave.\"\n\nHe stepped closer. Close enough that I could smell his coat. Cold air. Coffee. Him. And something else. Slightly burnt.\n\n\"Did you set something on fire?\" I asked.", "choices": ["Notice the silence between them", "Focus on what is being said"]}, {"prose": "\"I tried to make coffee. At a Späti. I burned my hand.\"\n\n\"You burned your hand making coffee at a convenience store?\"\n\n\"The machine was complicated.\"\n\n\"It's a coffee machine. You press a button.\"\n\n\"This one had dials.\"\n\nI laughed so hard the duck looked up.\n\n\"You're an idiot,\" I said.\n\n\"I'm your idiot.\"\n\nHe said it like a Tatsache. Not a question. A fact.\n\n\"That's not an apology.\"\n\n\"I'm getting there.\" He reached out. His hand touched my face. His thumb traced my Wange. His burned finger was bandaged with what looked like a piece of paper towel and electrical tape.\n\n\"Is that electrical tape?\"\n\n\"It's what the Späti had.\"\n\n\"You're going to get an infection.\"\n\n\"Then you can take care of me.\"\n\n\"That's not romantic. That's just medical negligence.\"\n\nHe almost smiled again. Then he said, quietly:\n\n\"I'm sorry. For leaving this morning. For not leaving coffee. For being bad at feelings. For wearing my good shoes on a ten-kilometer walk of shame.\"\n\n\"The shoes are unforgivable.\"\n\n\"But I forgive the rest.\"\n\nHe kissed me. On the bridge. In front of the duck. In front of a family with a dog, who whistled and said something in German that I didn't understand but sounded zustimmend.\n\nWhen he pulled back, his hand was still on my face.\n\n\"No more hiding,\" he said.\n\n\"No more hiding.\"\n\n\"And no more running.\"\n\n\"That's all I ask.\"\n\n\"Also, I ate your apricot pastries.\"\n\n\"Yesterday. After you left for work. I ate both of them.\"\n\n\"They were good.\"\n\n\"They were mine.\"\n\n\"Sharing is caring.\"\n\n\"That's not —\" He stopped. Shook his head. Then he laughed. A real laugh. The first one I had heard from him that wasn't an almost.\n\n\"You're terrible,\" he said.\n\n\"I'm practical. There's a Unterschied.\"\n\n\"That's Frau Schmidt's line.\"", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}, {"prose": "\"I'm learning from the best.\"\n\nHe kissed my forehead. \"Come on. Let's go home.\"\n\n\"Only if we stop at the bakery. I need to replenish your pastry supply.\"\n\n\"You're just going to eat those too.\"\n\n\"Probably. But I'll feel bad about it.\"\n\n\"I'll feel slightly guilty. For at least three seconds.\"\n\nHe took my hand. We walked home. The duck quacked behind us.\n\nI chose to interpret this as goodbye.\n\nungewöhnlich unusual adjective\n\nfunktionierend functioning adjective\n\ndie Wärme warmth feminine (review)\n\ndie Luft air / space feminine\n\ndie Katastrophe disaster feminine (review)\n\nder Rückschritt setback masculine\n\ndie U-Bahn subway feminine\n\ndie Geschichte story feminine (review)\n\ndas Geländer railing neuter (review)\n\nabschalten to shut down separable verb\n\ndie Einsamkeit loneliness feminine\n\nder Späti convenience store masculine (slang: Spätkauf)\n\nzustimmend approving adjective\n\ndie Wahrheit truth feminine (implied)\n\nder Idiot idiot masculine (review)\n\nFrom this chapter: \"Ich schaltete ab\" (I shut down) — the prefix goes to the end, the verb stem is conjugated in the middle.\n\nYou have seen separable verbs (abschließen, aufschließen, auspacken, abschalten). In the present tense, the prefix goes to the end. In the simple past (preterite/imperfect), the same rule applies — the prefix stays at the end, and the verb stem is conjugated.\n\nExamples from the story (present vs. past):\n\nVerb Present Simple Past (Imperfect)\n\nauspacken (to unpack) Ich packe aus Ich packte aus\n\nabschalten (to shut down) Ich schalte ab Ich schaltete ab\n\naufschließen (to unlock) Ich schließe auf Ich schloss auf\n\nankommen (to arrive) Ich komme an Ich kam an\n\nKey pattern: Conjugated verb stem + prefix at the end. Same word order as present tense!\n\nWhy this matters: As German density increases, you will see more simple past forms. Knowing they behave like present tense separable verbs (prefix at the end) helps you parse sentences faster. Also, Matei's internal monologue becomes much funnier in past tense. Trust me.", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}], "gate": {"clue": "What is the German word for \"phone call\"?", "answer": "anruf", "hint": "der Anruf"}, "vocab": [{"german": "ungewöhnlich", "english": "unusual"}, {"german": "funktionierend", "english": "functioning"}, {"german": "die Wärme", "english": "warmth"}, {"german": "die Luft", "english": "air / space"}, {"german": "die Katastrophe", "english": "disaster"}, {"german": "der Rückschritt", "english": "setback"}, {"german": "die U-Bahn", "english": "subway"}, {"german": "die Geschichte", "english": "story"}, {"german": "das Geländer", "english": "railing"}, {"german": "abschalten", "english": "to shut down"}, {"german": "der Ex", "english": "ex"}, {"german": "die Einsamkeit", "english": "loneliness"}, {"german": "die Wange", "english": "cheek"}, {"german": "der Späti", "english": "convenience store"}, {"german": "zustimmend", "english": "approving"}, {"german": "die Wahrheit", "english": "truth"}, {"german": "der Idiot", "english": "idiot"}, {"german": "die Wohnung", "english": "apartment"}, {"german": "der Schlüssel", "english": "key"}, {"german": "das Badezimmer", "english": "bathroom"}, {"german": "die Tatsache", "english": "fact"}, {"german": "das Schloss", "english": "lock / castle"}, {"german": "der Spätkauf", "english": "late-night shop (Späti)"}, {"german": "abschließen", "english": "to lock"}, {"german": "aufschließen", "english": "to unlock"}, {"german": "schließen", "english": "to close / lock"}, {"german": "schließen", "english": "to close / lock"}], "shadow": ["Practise this short exchange for casual spoken German rhythm:", "Yves: \"Guten Morgen.\"", "Matei: \"Morgen.\"", "Yves: \"Schon wach?\"", "Matei: \"Schon lange.\"", "Schon lange — already a long time. No subject, no verb. Spoken German drops them constantly. Practise being comfortable with incomplete sentences."]}, {"id": 10, "title": "The Call", "scenes": [{"prose": "The week after the bridge was different.\n\nNot perfekt. Nothing was perfekt. Matei still forgot to buy groceries. I still dropped cups at work. We still had moments where the silence between us felt like a held breath, waiting to be released.\n\nBut we were trying. Both of us. And trying, it turned out, was most of the Arbeit.\n\nAlso, Matei had started leaving me notes with drawings. Bad drawings. The first one was a stick figure next to a coffee cup with the caption \"This is you. This is your third cup. Please stop.\"\n\nThe second one was a duck wearing a tiny crown. No caption. Just a duck with a crown.\n\n\"What is this supposed to mean?\" I asked.\n\n\"It means you spend too much time at the bridge.\"\n\n\"The duck has a crown.\"\n\n\"He's the king of the bridge.\"\n\n\"You gave the duck a backstory?\"\n\n\"Everyone has a backstory. Even ducks.\"\n\nI kept the drawing. It was in my Notizbuch now, between the vocabulary lists and the count of Matei's almost-smiles. Page nineteen. King Duck, ruler of the Kanal.\n\nThen Frau Schmidt didn't show up for work.\n\nIt was a Tuesday. I arrived at Morgenlicht at 8:45, ten minutes early, because Matei had started walking me to work in the mornings. He didn't say it was romantic. He just said, \"It's on my way.\" It wasn't. He worked in the opposite Richtung.\n\n\"You know I can walk alone,\" I said.\n\n\"You don't have to escort me like I'm a child.\"\n\n\"You dropped three cups yesterday.\"\n\n\"That's not related.\"\n\n\"You also walked into a door.\"\n\n\"The door was very clean. I didn't see it.\"\n\n\"That's my point.\"\n\nThe Café was dark. The green awning was still closed. The chalkboard sign was blank.\n\nI stood outside, verwirrt. Frau Schmidt was always here before me. She opened at 8:30. She had a Routine — unlock the door, turn on the lights, start the espresso machine. The old brass one that hissed like a cat. She said the hiss woke her up.\n\n\"That's weird,\" I said.\n\n\"The lights are off. She's always here by now.\"\n\n\"Maybe she's late.\"\n\n\"Frau Schmidt is never late. She told me once that being late is 'a moral failure.' Then she looked at you.\"\n\n\"She looked at me?\"\n\n\"For a really long time. Uncomfortably long.\"\n\n\"I was late once. One time.\"\n\n\"You were late three times last week.\"\n\n\"The U-Bahn was —\"\n\n\"The U-Bahn was fine. You just wanted to finish your chapter.\"\n\nHe didn't deny it. Which was basically an admission of guilt.\n\nI called Frau Schmidt's phone. No answer.\n\nI waited fifteen minutes. Then I called Matei.\n\n\"She's not here.\"\n\n\"Frau Schmidt. The Café is closed. She's not answering her phone.\"\n\nHe was quiet for a moment. Then: \"Stay there. I'm coming.\"\n\n\"You don't have to —\"\n\n\"Don't argue. Just stay there.\"\n\n\"I wasn't arguing. I was expressing a differing opinion.\"\n\n\"That's arguing.\"\n\n\"That's discussion.\"\n\nThat's how I knew he was worried — Matei never took Taxis. He walked everywhere, even when it was raining, even when it was freezing, even when I offered to pay for the bus. He said walking was \"better for the soul.\" I said walking was better for his Sturheit. He said those were the same thing.\n\n\"You took a Taxi,\" I said.\n\n\"You don't run.\"\n\n\"I ran today. My soul can recover tomorrow.\"\n\n\"Did you pay the Taxi driver?\"\n\n\"I gave him a book.\"\n\n\"It was a good book. He seemed happy.\"\n\nI stared at him. \"You paid a Taxi driver with a book?\"\n\n\"It was a first edition.\"\n\n\"That's not how money works.\"\n\n\"It worked. He drove me here.\"\n\n\"You're insane.\"\n\n\"Probably. Did you try the back door?\"\n\n\"There's a back door?\"\n\nHe walked around the building. I followed. The Gasse behind the Café was narrow and smelled like old grease and regret. Matei knocked on a metal door. No answer. He knocked again. Harder.\n\n\"Frau Schmidt? It's Matei.\"\n\n\"Maybe she's not here,\" I said.\n\n\"Her car is in the back.\"\n\n\"She has a car?\"\n\n\"A 1998 Volvo. It's beige. She calls it 'the tank.'\"\n\n\"Of course she does.\"\n\nHe tried the handle. It was nicht abgeschlossen. The door opened into a small Wohnung. A kitchen. A table. A sink full of dishes.\n\nFrau Schmidt was on the floor.\n\nNot dead — her chest was moving, slow but steady — but her face was pale, and her lips were grey, and there was a phone on the floor next to her hand like she had tried to call someone and dropped it.\n\n\"Oh no,\" I said. \"Oh no no no.\"", "choices": ["Notice the silence between them", "Focus on what is being said"]}, {"prose": "Matei was on his knees next to her in half a second. His hand was on her wrist, checking her Puls. His face was calm, but I could see the Zittern in his fingers.\n\n\"Call an ambulance.\"\n\n\"I don't know the number.\"\n\n\"112. Call. Now.\"\n\n\"Why is it 112? Why not 911? Why does Germany have to be different about everything?\"\n\n\"Right. Sorry. Calling.\"\n\nI called. My German was bad. The operator asked questions I couldn't understand. Something about \"Wo ist der Notfall?\" and \"Atmet sie?\" I handed the phone to Matei.\n\n\"They want to talk to you.\"\n\n\"Everyone wants to talk to me.\"\n\nHe took the phone. Spoke in rapid German. Answered everything. Hung up.\n\n\"They're coming.\" He hadn't moved from her side. His hand was still on her wrist.\n\n\"Is she going to be okay?\"\n\n\"You're supposed to say yes. You're supposed to lie to me.\"\n\n\"I don't lie to you.\"\n\n\"This would be a good time to start.\"\n\nHe looked at me. His grey eyes were tired.\n\n\"She's going to be okay.\"\n\n\"That was a terrible lie. You sounded like a robot.\"\n\n\"I'm not good at lying.\"\n\n\"You're not good at a lot of things.\"\n\n\"Thank you for your support.\"\n\n\"That's what I'm here for.\"\n\nThe ambulance came in seven minutes.\n\nI know because I counted. It was something to do besides panic. The Sanitäter were fast and efficient and spoke to Matei like he was family. They loaded Frau Schmidt onto a Trage. One of them asked something in German. Matei answered. The paramedic nodded and looked at me.\n\n\"You come too. She would want.\"\n\n\"How do you know what sh
