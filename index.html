<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The German Journey</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1410;--surface:#231e18;--surface2:#2c2520;
  --text:#f0e8d8;--muted:#8a7a65;--amber:#e8a84c;
  --rust:#c0673a;--rust-dim:#8a4828;--border:#3a3228;
  --correct:#5a8a5e;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;font-size:18px;line-height:1.85}
#topbar{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 24px 14px}
#book-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.2em;color:var(--muted);margin-bottom:10px;font-family:system-ui,sans-serif}
#chapter-map{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.ch-dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--border);background:transparent;transition:all .3s;position:relative;cursor:default;flex-shrink:0}
.ch-dot.done{background:var(--rust);border-color:var(--rust)}
.ch-dot.active{border-color:var(--amber);animation:pulse 2.4s ease-in-out infinite}
.ch-dot.locked{opacity:.28}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(232,168,76,.15)}50%{box-shadow:0 0 0 5px rgba(232,168,76,.06)}}
.ch-dot[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface2);color:var(--text);font-size:.65rem;padding:3px 8px;border-radius:4px;white-space:nowrap;pointer-events:none;border:1px solid var(--border);font-family:system-ui,sans-serif;z-index:999}
#main{max-width:620px;margin:0 auto;padding:48px 28px 100px}
#ch-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.16em;color:var(--rust);font-family:system-ui,sans-serif;margin-bottom:8px}
#ch-title{font-size:1.55rem;font-weight:normal;color:var(--text);margin-bottom:40px;letter-spacing:.02em}
#scene-wrap{opacity:1;transition:opacity .32s}
#scene-wrap.fading{opacity:0}
.prose-block{margin-bottom:26px;font-size:1.02rem;line-height:1.95;color:var(--text)}
.prose-block p{margin-bottom:.85em;text-align:justify}
.prose-block p:last-child{margin-bottom:0}
.de{cursor:pointer;color:var(--amber);font-style:italic;border-bottom:1px solid rgba(232,168,76,.3);transition:color .15s;padding-bottom:1px}
.de:hover,.de.playing{color:#f5c97a;border-color:var(--amber)}
#choice-area{margin-top:34px;display:none}
#choice-prompt{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-family:system-ui,sans-serif;margin-bottom:14px}
#choice-buttons{display:flex;flex-direction:column;gap:9px}
.choice-btn{background:var(--surface);border:1.5px solid var(--border);color:var(--text);padding:15px 19px;cursor:pointer;border-radius:6px;font-family:Georgia,serif;font-size:.94rem;text-align:left;line-height:1.5;transition:all .2s}
.choice-btn:hover{border-color:var(--amber);color:var(--amber);background:rgba(232,168,76,.05)}
.choice-btn.chosen{border-color:var(--rust-dim);color:var(--rust);background:rgba(192,103,58,.06);pointer-events:none}
#continue-btn{display:none;margin-top:30px;background:transparent;border:1.5px solid var(--border);color:var(--muted);padding:11px 26px;cursor:pointer;font-family:system-ui,sans-serif;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;border-radius:4px;transition:all .2s}
#continue-btn:hover{border-color:var(--amber);color:var(--amber)}
#continue-btn.vis{display:inline-block}
#gate-area{display:none;margin-top:38px}
#gate-area.vis{display:block}
.gate-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:26px 22px}
.gate-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-family:system-ui,sans-serif;margin-bottom:8px}
.gate-prompt{font-size:.98rem;color:var(--text);margin-bottom:18px;line-height:1.65}
.gate-prompt em{color:var(--amber);font-style:italic}
#gate-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
#gate-input{flex:1;min-width:150px;background:var(--surface2);border:1.5px solid var(--border);color:var(--text);padding:10px 15px;font-family:Georgia,serif;font-size:1rem;border-radius:4px;outline:none;transition:border-color .2s}
#gate-input:focus{border-color:var(--amber)}
#gate-input.ok{border-color:var(--correct)!important;color:var(--correct)}
#gate-input.err{animation:shake .28s}
#gate-sub{background:var(--rust-dim);border:1.5px solid var(--rust);color:var(--text);padding:10px 20px;cursor:pointer;font-family:system-ui,sans-serif;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;border-radius:4px;transition:all .2s}
#gate-sub:hover{background:var(--rust)}
#gate-fb{margin-top:12px;font-size:.85rem;font-family:system-ui,sans-serif;min-height:18px;color:var(--muted)}
#gate-fb.ok{color:var(--correct)}
#gate-fb.err{color:#c07070}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#ch-complete{display:none;margin-top:38px}
#ch-complete.vis{display:block}
.ch-complete-box{background:var(--surface);border:1px solid var(--rust-dim);border-radius:8px;padding:28px 24px}
.cc-icon{font-size:1.6rem;margin-bottom:12px}
.cc-title{color:var(--rust);font-size:1.05rem;margin-bottom:8px;letter-spacing:.02em}
.cc-word{font-size:.88rem;color:var(--muted);font-family:system-ui,sans-serif;margin-bottom:18px;line-height:1.55}
.cc-word em{color:var(--amber);font-style:italic}
#next-ch-btn{background:var(--rust-dim);border:1.5px solid var(--rust);color:var(--text);padding:12px 24px;cursor:pointer;font-family:system-ui,sans-serif;font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;border-radius:4px;transition:all .2s}
#next-ch-btn:hover{background:var(--rust)}
#story-end{display:none;margin-top:38px}
#story-end.vis{display:block}
.story-end-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:36px 28px;text-align:center}
.se-title{color:var(--amber);font-size:1.3rem;margin-bottom:14px;letter-spacing:.02em}
.se-body{color:var(--muted);font-family:system-ui,sans-serif;font-size:.88rem;line-height:1.7}
#tooltip{position:fixed;background:var(--surface2);color:var(--text);padding:9px 14px;border-radius:7px;font-size:.8rem;z-index:9999;pointer-events:none;opacity:0;transition:opacity .2s;max-width:210px;box-shadow:0 4px 20px rgba(0,0,0,.6);line-height:1.5;border:1px solid rgba(232,168,76,.18);font-family:system-ui,sans-serif}
#tooltip.show{opacity:1}
.tip-de{font-size:.9rem;font-style:italic;color:var(--amber);margin-bottom:2px;font-family:Georgia,serif}
.tip-en{color:#d0c8b0}
.tip-g{font-size:.68rem;color:var(--muted);margin-top:2px}
@media(max-width:600px){#main{padding:28px 16px 80px}#ch-title{font-size:1.25rem}.prose-block{font-size:.98rem}#topbar{padding:10px 14px 12px}}
</style>
</head>
<body>
<nav id="topbar">
  <div id="book-label">The German Journey</div>
  <div id="chapter-map"></div>
</nav>
<main id="main">
  <div id="ch-label"></div>
  <h1 id="ch-title"></h1>
  <div id="scene-wrap">
    <div id="prose-area"></div>
    <div id="choice-area">
      <div id="choice-prompt"></div>
      <div id="choice-buttons"></div>
    </div>
    <button id="continue-btn">Continue →</button>
    <div id="gate-area">
      <div class="gate-box">
        <div class="gate-label">Before you leave</div>
        <div class="gate-prompt" id="gate-prompt-text"></div>
        <div id="gate-row">
          <input id="gate-input" type="text" placeholder="type it here…" autocomplete="off" autocorrect="off" spellcheck="false">
          <button id="gate-sub">Check</button>
        </div>
        <div id="gate-fb"></div>
      </div>
    </div>
    <div id="ch-complete">
      <div class="ch-complete-box">
        <div class="cc-icon">✦</div>
        <div class="cc-title" id="cc-title-text"></div>
        <div class="cc-word" id="cc-word-text"></div>
        <button id="next-ch-btn">Next Chapter →</button>
      </div>
    </div>
    <div id="story-end">
      <div class="story-end-box">
        <div class="se-title">Ich bleibe.</div>
        <div class="se-body">You finished The German Journey.<br>All 35 chapters. A1 to C1. Yves stayed.<br><br>So did you.</div>
      </div>
    </div>
  </div>
</main>
<div id="tooltip"></div>
<script>
/* ── helpers ── */
function de(w,e,g){return`<span class="de" data-de="${w}" data-en="${e}"${g?` data-g="${g}"`:''}  onclick="speak(this)">${w}</span>`}

function norm(s){return s.trim().toLowerCase().replace(/^(der|die|das|ein|eine)\s+/,'').replace(/ü/g,'ü').replace(/ö/g,'ö').replace(/ä/g,'ä').replace(/ß/g,'ss').replace(/ue/g,'ü').replace(/oe/g,'ö').replace(/ae/g,'ä').replace(/ss/g,'ss')}

/* ── chapter metadata ── */
const CHS=[
  {n:1,t:'The Key',          g:{q:'the German word for <em>key</em>',              a:'schlüssel',   d:'der Schlüssel'}},
  {n:2,t:'The First Morning',g:{q:'the German word for <em>coffee</em>',            a:'kaffee',      d:'der Kaffee'}},
  {n:3,t:'Six O\'Clock',     g:{q:'the German word for <em>lonely</em>',            a:'einsam',      d:'einsam'}},
  {n:4,t:'Morning Light',    g:{q:'the German word for <em>excuse me</em>',         a:'entschuldigung',d:'Entschuldigung'}},
  {n:5,t:'The Space Between',g:{q:'the German word for <em>to wait</em>',           a:'warten',      d:'warten'}},
  {n:6,t:'The Almost',       g:{q:'the German word for <em>almost</em>',            a:'fast',        d:'fast'}},
  {n:7,t:'The Crack',        g:{q:'the German word for <em>friend</em>',            a:'freund',      d:'der Freund'}},
  {n:8,t:'The Text',         g:{q:'the German word for <em>message</em>',           a:'nachricht',   d:'die Nachricht'}},
  {n:9,t:'The Morning After',g:{q:'the German word for <em>honest</em>',            a:'ehrlich',     d:'ehrlich'}},
  {n:10,t:'The Call',        g:{q:'the German word for <em>grandmother</em>',       a:'grossmutter', d:'die Großmutter'}},
  {n:11,t:'The First Day',   g:{q:'the German word for <em>home</em> (being at home)',a:'zuhause',  d:'zuhause'}},
  {n:12,t:'Lucky',           g:{q:'the German word for <em>luck</em>',              a:'glück',       d:'das Glück'}},
  {n:13,t:'The Dinner',      g:{q:'the German word for <em>dinner</em>',            a:'abendessen',  d:'das Abendessen'}},
  {n:14,t:'The Ex',          g:{q:'the German word for <em>past</em> (history)',    a:'vergangenheit',d:'die Vergangenheit'}},
  {n:15,t:'The Decision',    g:{q:'the German word for <em>to stay</em>',           a:'bleiben',     d:'bleiben'}},
  {n:16,t:'Die Bewerbung',   g:{q:'the German word for <em>application</em>',       a:'bewerbung',   d:'die Bewerbung'}},
  {n:17,t:'Die Ablehnung',   g:{q:'the German word for <em>rejection</em>',         a:'ablehnung',   d:'die Ablehnung'}},
  {n:18,t:'The Architect',   g:{q:'the German word for <em>advice</em>',            a:'ratschlag',   d:'der Ratschlag'}},
  {n:19,t:'Die Schwester',   g:{q:'the German word for <em>sister</em>',            a:'schwester',   d:'die Schwester'}},
  {n:20,t:'Die zweite Bewerbung',g:{q:'the German word for <em>progress</em>',     a:'fortschritt', d:'der Fortschritt'}},
  {n:21,t:'Das Vorstellungsgespräch',g:{q:'the German word for <em>job interview</em>',a:'vorstellungsgesprach',d:'das Vorstellungsgespräch'}},
  {n:22,t:'Der erste Tag',   g:{q:'the German word for <em>apprenticeship</em>',    a:'ausbildung',  d:'die Ausbildung'}},
  {n:23,t:'Die Berufsschule',g:{q:'the German word for <em>vocational school</em>', a:'berufsschule',d:'die Berufsschule'}},
  {n:24,t:'Der Ausbilder',   g:{q:'the German word for <em>mistake</em>',           a:'fehler',      d:'der Fehler'}},
  {n:25,t:'Das Heimweh',     g:{q:'the German word for <em>homesickness</em>',      a:'heimweh',     d:'das Heimweh'}},
  {n:26,t:'Die Prüfung',     g:{q:'the German word for <em>exam</em>',              a:'prüfung',     d:'die Prüfung'}},
  {n:27,t:'Der Rückschritt', g:{q:'the German word for <em>defeat / setback</em>',  a:'niederlage',  d:'die Niederlage'}},
  {n:28,t:'Das Café',        g:{q:'the German word for <em>regular customer</em>',  a:'stammgast',   d:'der Stammgast'}},
  {n:29,t:'Die Hochzeit',    g:{q:'the German word for <em>wedding</em>',           a:'hochzeit',    d:'die Hochzeit'}},
  {n:30,t:'Der Abschluss',   g:{q:'the German word for <em>completion / graduation</em>',a:'abschluss',d:'der Abschluss'}},
  {n:31,t:'Die Rückkehr',    g:{q:'the German word for <em>farewell</em>',          a:'abschied',    d:'der Abschied'}},
  {n:32,t:'Das neue Leben',  g:{q:'the German word for <em>beginning</em>',         a:'anfang',      d:'der Anfang'}},
  {n:33,t:'Die Wurzeln',     g:{q:'the German word for <em>roots</em>',             a:'wurzeln',     d:'die Wurzeln'}},
  {n:34,t:'Das Versprechen', g:{q:'the German word for <em>promise</em>',           a:'versprechen', d:'das Versprechen'}},
  {n:35,t:'Ich bleibe',      g:{q:'the German phrase meaning <em>I am staying</em>',a:'ich bleibe',  d:'Ich bleibe'}}
];

/* ── scenes ── */
const SC={

/* ── Chapter 1 ── */
c1a:{prose:`<p>The ${de('das Flugzeug','airplane','neuter')} landed twelve minutes early. Yves had never been early for anything in his life. Not for school. Not for his cousin's wedding. Not for his own heartbreaks.</p>
<p>He grabbed his bag and joined the strangers blinking in the bright corridor of ${de('der Flughafen','airport','masculine')}. A ${de('der Bus','bus','masculine')} was waiting at the kerb like it had been there all century. He got on and found a seat by the window. He was already ${de('müde','tired','adjective')}.`,
prompt:'On the bus, Yves sits by the window.',
choices:[{t:'He looks out at Berlin.',n:'c1b1'},{t:"He opens Matei's last message again.",n:'c1b2'}]},

c1b1:{prose:`<p>The city came without ceremony. Grey apartment blocks. Bare trees. A yellow tram sliding past like a thought you almost had. He watched Berlin arrive and waited for it to tell him something. It didn't. Cities never do.</p>`,next:'c1c'},
c1b2:{prose:`<p>The message was two sentences: <em>"The key is under the mat. Make yourself at home."</em> He had read it forty times on the flight. On the bus he read it forty-one. He still couldn't decide if <em>make yourself at home</em> felt like an invitation or an instruction.</p>`,next:'c1c'},

c1c:{prose:`<p>Number 14. A yellow door. He crouched and lifted the mat: a small silver ${de('der Schlüssel','key','masculine')}, still warm despite the ${de('kalt','cold','adjective')} air. He stood and put the key in the lock. It went in. It did not turn.</p>`,
prompt:'The key isn\'t working.',
choices:[{t:'Keep trying — it\'s just stiff.',n:'c1d1'},{t:'Text Matei.',n:'c1d2'}]},

c1d1:{prose:`<p>He tried slower. Then faster. Then slower again, feeling past where he thought it stopped. On the fourth attempt: a small clean click. ${de('die Tür','the door','feminine')} swung open. He stood in the frame a moment before stepping through.</p>`,next:'c1e'},
c1d2:{prose:`<p>He typed: <em>"Key isn't working."</em> No reply came — Matei was at work. He tried the lock again, slower this time, and on the fourth attempt: a small clean click. ${de('die Tür','the door','feminine')} swung open. He stepped through.</p>`,next:'c1e'},

c1e:{prose:`<p>${de('die Wohnung','the apartment','feminine')} was small and smelled like coffee and something woodsy — the good kind, the kind that means someone actually lives here. Books on every surface. A radiator ticking in the corner. A folded note on the table in German and English: <em>${de('das Bett','the bed','neuter')} gehört dir. The bed is yours.</em> He stood holding the note and felt ${de('müde','tired','adjective')} in a way the flight alone couldn't explain.</p>`,
prompt:'Yves is finally inside.',
choices:[{t:'He looks around the apartment.',n:'c1f1'},{t:'He goes straight to the bed.',n:'c1f2'}]},

c1f1:{prose:`<p>He walked through every room. It took forty-five seconds. Kitchen. Bathroom. This room. A window facing a courtyard. He stood at the window and watched a pigeon navigate the cobblestones with the confidence of someone who had made their choice years ago. He liked the pigeon. He sat on the floor next to the bed.</p>`,next:'gate'},
c1f2:{prose:`<p>He didn't take his shoes off. He sat on the edge of the bed, coat still on, springs complaining softly. He looked up at the ceiling of his new life. It was white and slightly cracked. He stayed like that for a long time before he reached into his bag, found his notebook, and wrote: <em>Day 1. Berlin. I made it.</em></p>`,next:'gate'},

/* ── Chapter 2 ── */
c2a:{prose:`<p>Matei was making ${de('der Kaffee','coffee','masculine')} at seven in the morning with the concentration of a surgeon. Yves watched from the bed and pretended to still be asleep. ${de('die Wohnung','the apartment','feminine')} smelled exactly like the night before: good.</p>`,
prompt:'Yves watches Matei from across the room.',
choices:[{t:'He calls him out.',n:'c2b1'},{t:'He keeps pretending to be asleep.',n:'c2b2'}]},

c2b1:{prose:`<p>"You're staring," Matei said without turning. "I'm observing. There's a difference." "That's my line." "I know. I liked it." The coffee was perfect. It was always going to be perfect. Yves had known this somehow from the bus.</p>`,next:'c2c'},
c2b2:{prose:`<p>"You're awake," Matei said, still not turning. Yves didn't move. "Your breathing changed." Of all the things Matei could know about him, this was somehow the one Yves minded least.</p>`,next:'c2c'},

c2c:{prose:`<p>Matei had already arranged a job for Yves at the café around the corner. ${de('Morgenlicht','Morning Light','the café name')}. Starting tomorrow at nine. "You already asked her before I arrived." "I was ${de('optimistisch','optimistic','adjective')}." Yves looked at the piece of paper with the address in Matei's small, neat handwriting and thought: this is either very presumptuous or very kind. He decided it was both.</p>`,next:'gate'},

/* ── Chapter 3 ── */
c3a:{prose:`<p>He had known Matei for three days. He had spent the afternoon trying not to watch ${de('die Tür','the door','feminine')}. This was pathetic and he knew it. At 5:47 PM the stairs creaked. He recognized the footsteps.</p>`,
prompt:'Matei comes home and opens the fridge. It\'s empty.',
choices:[{t:'Yves offers to cook.',n:'c3b1'},{t:'Yves stays quiet and waits.',n:'c3b2'}]},

c3b1:{prose:`<p>He made his grandmother's pasta. Matei sat on the kitchen counter and watched him chop ${de('der Knoblauch','garlic','masculine')} and said nothing, which was somehow worse than any question would have been. The kitchen smelled like somewhere Yves had been before.</p>`,next:'c3c'},
c3b2:{prose:`<p>"We could go to Netto," Matei said. "Or I can cook," Yves said. Too quickly. Matei looked at him. "Okay," he said. Just: okay. Like it had already been decided and he was simply agreeing.</p>`,next:'c3c'},

c3c:{prose:`<p>At dinner, Yves said: "I'm ${de('einsam','lonely','adjective, literally einsam')}." The word sat there. Matei got up, stood next to him at the small table. "You're not alone right now." It was a small thing to say. It wasn't a small thing. Yves wrote that night: <em>Day 4. He said: you're not alone right now. He meant it.</em></p>`,next:'gate'},

/* ── Chapter 4 ── */
c4a:{prose:`<p>${de('Morgenlicht','Morning Light','the café')} — a green awning on a corner, flour in the air, the sound of something good happening in a small room. Frau Schmidt opened the door and looked at Yves like she already knew who he was. She had flour on her hands. She always had flour on her hands.</p>`,
prompt:'Frau Schmidt asks Yves about himself. He doesn\'t have the German words.',
choices:[{t:'He tries in German anyway.',n:'c4b1'},{t:'He stays quiet and just picks up an apron.',n:'c4b2'}]},

c4b1:{prose:`<p>He had four words: <em>Guten Morgen. Ich bin Yves.</em> She smiled at all of them. "Your German," she said in German, slowly, "is a beginning." She said it like a compliment. He took it like one.</p>`,next:'c4c'},
c4b2:{prose:`<p>He picked up the apron from the hook. She nodded once. He understood: this was the kind of place where showing up counted as introducing yourself. He put the apron on. He was ready enough.</p>`,next:'c4c'},

c4c:{prose:`<p>By noon he had survived the espresso machine, dropped one cup, and learned ${de('Entschuldigung','excuse me','interjection')} by accident — from the look on a customer's face when he nearly spilled a flat white. Frau Schmidt told him Matei had said he was serious and made good coffee. Yves had never made coffee for Matei. He didn't correct her.</p>`,next:'gate'},

/* ── Chapter 5 ── */
c5a:{prose:`<p>They had a routine now. Yves worked mornings; Matei worked afternoons. For two hours every evening they were in the same small room and talked about everything except the thing they were not talking about. This was comfortable in a way Yves didn't fully trust.</p>`,
prompt:'Yves feels the tension between what\'s said and what isn\'t.',
choices:[{t:'He pushes — says something direct.',n:'c5b1'},{t:'He lets it be, and just sits with it.',n:'c5b2'}]},

c5b1:{prose:`<p>"You don't have to be careful with me," Yves said. Matei looked at him for a long moment. "I know," he said. "I'm being careful with myself." It was a more honest answer than Yves had expected. He filed it away carefully.</p>`,next:'c5c'},
c5b2:{prose:`<p>Matei made tea the way Yves had once mentioned liking it — two bags, no sugar — without saying anything. Yves held the mug and thought: this is either kindness or love and I'm not sure it matters which.</p>`,next:'c5c'},

c5c:{prose:`<p>He wrote in his notebook: <em>Day 18. Still here. Not ${de('warten','waiting','verb — to wait')} to leave. This is new.</em> He counted the days since he had last thought about leaving. He had stopped counting at twelve. By then the thought had stopped coming.</p>`,next:'gate'},

/* ── Chapter 6 ── */
c6a:{prose:`<p>It was raining. They were standing at the window and Matei said something quiet about the street below and Yves turned and Matei was already turned and they were very close together.</p>`,
prompt:'They are close enough to feel the other person breathe.',
choices:[{t:'Yves stays still.',n:'c6b1'},{t:'Yves steps back.',n:'c6b2'}]},

c6b1:{prose:`<p>Neither of them moved. The rain continued. Matei looked at him with the steadiness he used when deciding whether to trust something. Yves didn't breathe. Then Matei said: "${de('fast','almost','adverb')}." Just that. Yves understood exactly.</p>`,next:'c6c'},
c6b2:{prose:`<p>He stepped back. An inch. Matei noticed. "Okay," Matei said. Just: okay. He went and made tea. Yves stood at the window and watched the rain and felt the inch like a mile. He had not decided to step back. His body had decided. He wasn't sure it was right.</p>`,next:'c6c'},

c6c:{prose:`<p>Later, Yves wrote: <em>Not yet. But not never. That's something.</em> The ${de('fast','almost','adverb')} sat between them for a week — warm and patient, not a wound. He was learning that some things in German didn't need finishing. They just needed time.</p>`,next:'gate'},

/* ── Chapter 7 ── */
c7a:{prose:`<p>Lukas worked with Matei at the bookstore. He had an easy smile and introduced himself to Yves at the bakery on Tuesday like it was the most natural thing in the world, which for him it probably was. He said: "Matei talks about you."</p>`,
prompt:'Lukas is friendly. He might be more than that.',
choices:[{t:'Yves asks what Matei says.',n:'c7b1'},{t:'Yves changes the subject.',n:'c7b2'}]},

c7b1:{prose:`<p>"He says you're stubborn," Lukas said. "That sounds like him." "He says it like a compliment." Yves held that for a moment. In Matei's vocabulary, stubborn probably was a compliment. "Tell him I said hello," Yves said.</p>`,next:'c7c'},
c7b2:{prose:`<p>He asked about the bookstore instead. Lukas talked for eight minutes about a Romanian poet he loved. Yves listened. Lukas was easy to be around in a way that felt effortless and therefore slightly suspicious. Some people were just like that. Yves was learning to trust them anyway.</p>`,next:'c7c'},

c7c:{prose:`<p>He mentioned Lukas to Matei that evening. Matei said: "He does that — introduces himself. He means nothing by it." "I know," Yves said. "Do you?" "Yes." A pause. "Mostly." Matei looked at him steadily. "Mostly is enough," he said. Which was, Yves thought, Matei's entire philosophy. <em>Der ${de('Freund','friend','masculine')}.</em> The word sat there between them.</p>`,next:'gate'},

/* ── Chapter 8 ── */
c8a:{prose:`<p>He was at the café when his phone buzzed. A German number he didn't recognize. He stared at the screen for a long moment. Frau Schmidt watched him from across the counter. "Bad ${de('die Nachricht','news / message','feminine')}?" "I don't know yet," he said.</p>`,
prompt:'There\'s a message from a number he doesn\'t know.',
choices:[{t:'He opens it immediately.',n:'c8b1'},{t:'He waits until after his shift.',n:'c8b2'}]},

c8b1:{prose:`<p>It was from Matei's phone but not in Matei's voice. <em>"This is his sister. He told me about you. Meet me Thursday. — Ada."</em> Yves read it three times. He was still reading it when Frau Schmidt took the phone gently from his hand and replaced it with an espresso cup.</p>`,next:'c8c'},
c8b2:{prose:`<p>He made it through three more customers and a small argument about the correct way to make a flat white. Then he opened it. <em>"This is his sister. He told me about you. — Ada."</em> Small sentence. Very large.</p>`,next:'c8c'},

c8c:{prose:`<p>He texted back: <em>"Thursday works."</em> He spent the rest of the shift trying to understand what it meant that Matei had talked about him to his ${de('die Schwester','sister','feminine')}. He decided it meant something. He did not decide what. Some sentences were better left with their meaning still approaching.</p>`,next:'gate'},

/* ── Chapter 9 ── */
c9a:{prose:`<p>He met Ada on Thursday. She was shorter than Matei, faster to smile, and she ordered her coffee with the confidence of someone who knew exactly what she wanted from every room she walked into. She looked at Yves like she was confirming something.</p>`,
prompt:'Ada has something she wants to tell him about Matei.',
choices:[{t:'Yves asks directly what Matei said about him.',n:'c9b1'},{t:'Yves lets Ada lead.',n:'c9b2'}]},

c9b1:{prose:`<p>"He said you were ${de('ehrlich','honest','adjective')}," Ada said. "He said it like it surprised him." Yves turned that over. He had been called many things. Honest was not usually one of them. He wasn't sure if he was honest or just bad at pretending. He decided those might be the same thing.</p>`,next:'c9c'},
c9b2:{prose:`<p>"He's been alone for two years," Ada said. "Since someone left without explaining." She said it like she'd decided to. Like it was information he needed. "I'm telling you because you're staying," she said. "I don't know that," Yves said. "I know," she said. "That's why I'm telling you."</p>`,next:'c9c'},

c9c:{prose:`<p>On the way home he thought about the word ${de('ehrlich','honest','adjective')}. About what it meant to someone who had been left without explanation. He thought about the things he hadn't said to Matei and couldn't decide if not saying them was kindness or its opposite. He wrote: <em>Ada told me something. I needed to hear it.</em></p>`,next:'gate'},

/* ── Chapter 10 ── */
c10a:{prose:`<p>His ${de('die Großmutter','grandmother','feminine')} called every Sunday. Same time, same opening: <em>"You're eating?"</em> He said yes. He was. The apartment had good food in it now. He had stopped lying to her about the small things.</p>`,
prompt:'She asks about his life in Berlin.',
choices:[{t:'He tells her about Matei.',n:'c10b1'},{t:'He keeps it vague — "I\'m not alone."',n:'c10b2'}]},

c10b1:{prose:`<p>"There's someone," he said. Silence. Then: "Someone like how?" "Like how you think." More silence. "Is he kind?" "He remembers how I take my tea." A long pause. "Then yes," she said. "That's how."</p>`,next:'c10c'},
c10b2:{prose:`<p>"I'm not alone," he said. She didn't ask more. She had a gift for knowing which questions to leave on the ground between them. "Good," she said. He could hear her smiling. "That's good."</p>`,next:'c10c'},

c10c:{prose:`<p>After the call he sat on the floor and felt something shift — like a key turning past where it usually stopped. He wrote: <em>Told Omi. Or almost. She knew anyway.</em> He underlined <em>she knew anyway</em>. He thought about his ${de('die Großmutter','grandmother','feminine')} and her particular way of understanding things without being told them, and felt something that might have been home.</p>`,next:'gate'},

/* ── Chapter 11 ── */
c11a:{prose:`<p>Three months in, he realized he had stopped counting the days. He had started counting other things — how many German words he'd used without translating them first, how many times Matei had almost smiled all the way. Berlin had become a place he knew the shape of.</p>`,
prompt:'A moment when Yves notices he has changed.',
choices:[{t:'He marks it — buys a small plant.',n:'c11b1'},{t:'He lets it pass quietly.',n:'c11b2'}]},

c11b1:{prose:`<p>He put the plant on the windowsill. He didn't tell Matei why. Matei watered it the next morning without asking. That was enough of an explanation for both of them.</p>`,next:'c11c'},
c11b2:{prose:`<p>He made coffee at seven, walked to work, came home, cooked dinner. Ate it. It was good. The city outside sounded like his city now — not because it had changed, but because he had.</p>`,next:'c11c'},

c11c:{prose:`<p>Matei said that evening: "You're different." "Different how?" "Quieter." "Is that bad?" Matei looked at him with the particular steadiness he used when saying something exact. "Quieter isn't sad," he said. "Quieter is settled." ${de('zuhause','at home','means: here, settled, belonging')}. That was the word Yves had been looking for.</p>`,next:'gate'},

/* ── Chapter 12 ── */
c12a:{prose:`<p>He dropped a full tray on a Tuesday. Everything. Frau Schmidt swept it up without comment and handed him a fresh one. She said: <em>"Na ja."</em> Which meant, roughly, <em>well, these things happen.</em> He made four perfect espressos afterward.</p>`,
prompt:'Frau Schmidt watches him recover from the mistake.',
choices:[{t:'He pushes through and shows her.',n:'c12b1'},{t:'He steps back, breathes, then returns.',n:'c12b2'}]},

c12b1:{prose:`<p>"Better," she said after the fourth espresso. Just: better. It landed like a medal. In this café, Yves had learned, "better" was the highest grade. "Sehr gut" was for occasions. "Better" was for every day.</p>`,next:'c12c'},
c12b2:{prose:`<p>He went to the back room for three minutes and thought about his grandmother's kitchen, which smelled like onions and certainty. He came back out and finished the shift cleanly. Frau Schmidt didn't mention the tray again. Some things only needed to happen once.</p>`,next:'c12c'},

c12c:{prose:`<p>On the walk home he thought: <em>I am lucky.</em> Not in a shallow way. In the deep way — the way you feel ${de('das Glück','luck / happiness','neuter, also means fortune')} when you've been somewhere long enough to know what you almost didn't have. Berlin. Matei. The café that smelled like flour and coffee. He was lucky and he was starting to believe it.</p>`,next:'gate'},

/* ── Chapter 13 ── */
c13a:{prose:`<p>Matei cooked. This was not a sentence Yves had expected to write in his notebook, but here it was: Matei cooked. He had bought ingredients without being asked and been in the kitchen for forty minutes making something that smelled like it knew what it was doing.</p>`,
prompt:'Yves doesn\'t know what to do with this.',
choices:[{t:'He hovers in the kitchen doorway.',n:'c13b1'},{t:'He stays out of the way.',n:'c13b2'}]},

c13b1:{prose:`<p>"You're watching me," Matei said. "You watch me all the time." "That's different." "How?" Matei considered this with actual seriousness. "I'm better at it," he said. Yves could not argue with this.</p>`,next:'c13c'},
c13b2:{prose:`<p>He sat on the floor with his notebook and let the smell come to him. When the ${de('das Abendessen','dinner','neuter')} arrived it was pasta — slightly different from his grandmother's recipe, slightly better in a way that would take him a week to admit.</p>`,next:'c13c'},

c13c:{prose:`<p>They ate across from each other and talked for two hours. About nothing. About everything. It was the kind of ${de('das Abendessen','dinner','neuter')} Yves had given up expecting to have. Afterward he washed the dishes and Matei dried them and neither of them suggested stopping. Some evenings worked. This was one.</p>`,next:'gate'},

/* ── Chapter 14 ── */
c14a:{prose:`<p>He found out indirectly — the way you always find out about the ${de('die Vergangenheit','past','feminine')}. Lukas, at the café, saying: "How's Matei since the whole thing with Sebastian?" And then stopping, because Yves's face had done something.</p>`,
prompt:'Yves now knows there\'s a past Matei hasn\'t told him.',
choices:[{t:'He asks Lukas more.',n:'c14b1'},{t:'He goes straight to Matei.',n:'c14b2'}]},

c14b1:{prose:`<p>Lukas was careful. Sebastian had left after eighteen months, without explaining. Two years ago. "Matei doesn't talk about it." "I know," Yves said. "That's why I'm telling you." He said it simply, like medical history. Like something Yves needed in order to understand the patient.</p>`,next:'c14c'},
c14b2:{prose:`<p>That evening: "Lukas told me about Sebastian." A pause. "What did he tell you?" "Enough." Matei nodded slowly. "I would have told you," he said. "I know," Yves said. "I wasn't asking for an apology." "I know," Matei said. They looked at each other. It was enough.</p>`,next:'c14c'},

c14c:{prose:`<p>That night Yves didn't write anything in his notebook. He lay on his side of the bed — it was his side of the bed now — and thought about the word <em>left.</em> How it was both a direction and an action. How he had been both, before. He was neither now. ${de('die Vergangenheit','the past','feminine')} was the past. This was the present.</p>`,next:'gate'},

/* ── Chapter 15 ── */
c15a:{prose:`<p>He had been in Berlin for five months. He had a shift, a plant, a side of the bed. A notebook half-full of German words he used without translating them first. He was not going home. He needed to stay — officially, legally, permanently. He needed a plan.</p>`,
prompt:'Yves decides to apply for an Ausbildung — an apprenticeship.',
choices:[{t:'He researches it first, alone.',n:'c15b1'},{t:'He tells Matei first.',n:'c15b2'}]},

c15b1:{prose:`<p>He found the listings at two in the morning. IT infrastructure. Three years. A real qualification. A life he could build here. He closed the laptop and stared at the ceiling and thought: <em>I can do this.</em> Then: <em>I have to do this.</em> Then: <em>I'm going to do this.</em> In that order.</p>`,next:'c15c'},
c15b2:{prose:`<p>"I want to stay. Properly. An Ausbildung." Matei was very still for a moment. "You'd be good at it," he said. Not: are you sure. Not: that's complicated. Just: you'd be good at it. That was not what Yves expected. He had expected practical questions. Matei was not that kind of person.</p>`,next:'c15c'},

c15c:{prose:`<p>He wrote in his notebook: <em>Plan: ${de('bleiben','to stay','infinitive verb')}. Ausbildung in IT. Three years. German will need to get much better.</em> Then on the next line: <em>Matei said I'd be good at it.</em> He underlined that. He knew why. He wasn't ready to say why yet.</p>`,next:'gate'},

/* ── Chapter 16 ── */
c16a:{prose:`<p>Writing a job application in your second language is a specific kind of humbling. Every sentence he wrote in German sounded like a child explaining something to an adult. Matei sat across from him and read each draft and said nothing until asked. This was, Yves was learning, Matei's way of being very helpful.</p>`,
prompt:'Yves needs Matei\'s honest opinion on the application letter.',
choices:[{t:'He asks for brutal honesty.',n:'c16b1'},{t:'He asks only for corrections.',n:'c16b2'}]},

c16b1:{prose:`<p>"It sounds desperate," Matei said. "I am desperate." "I know. They don't need to." He rewrote it. Less want, more certainty. More <em>"I would like to contribute"</em> and less <em>"I need this."</em> In German the difference was significant. In German it was almost confident.</p>`,next:'c16c'},
c16b2:{prose:`<p>Matei made twelve marks in the margin. "Why that word?" Yves asked. "Because this one sounds like you're asking permission," Matei said. "That one sounds like you're extending an offer." In English they were the same. In German they weren't. Yves was beginning to understand that German was a language where precision was love.</p>`,next:'c16c'},

c16c:{prose:`<p>Frau Schmidt proofread the final version, made one correction, and framed it as a joke: "When you get the job — one free coffee per day, forever." He sent the ${de('die Bewerbung','application','feminine')} on a Thursday at 9:14 AM. He went to the café and had a coffee and ${de('warten','waited','past of warten')}.</p>`,next:'gate'},

/* ── Chapter 17 ── */
c17a:{prose:`<p>The email came on a Tuesday at 11:46 AM. He read the subject line and closed the app and made an espresso and drank it standing at the machine. Then he opened the app again. <em>Leider müssen wir Ihnen mitteilen.</em> We regret to inform you. ${de('die Ablehnung','the rejection','feminine')}.</p>`,
prompt:'The first rejection. What does Yves do?',
choices:[{t:'He calls Matei immediately.',n:'c17b1'},{t:'He finishes the shift first.',n:'c17b2'}]},

c17b1:{prose:`<p>Matei picked up in one ring. "They said no." A pause. "Okay," Matei said. Just: okay. "What does that mean?" "It means you apply again." "What if they all say no?" "Then you apply until one says yes." It wasn't comfort exactly. It was something better than comfort.</p>`,next:'c17c'},
c17b2:{prose:`<p>He worked the rest of the shift. Made coffee. Wiped the counter. Said <em>bitte schön</em> forty times. When he got home Matei was already there — which almost never happened. There was food on the table. No explanation. They ate. They didn't talk about it. They didn't have to.</p>`,next:'c17c'},

c17c:{prose:`<p>He reread the ${de('die Ablehnung','rejection','feminine')} three more times. Each time it stung slightly less. He wrote: <em>First rejection. Expected. Not the last. That's okay.</em> He sent his application to two more companies that week. The second letter was already better than the first. He was already better than the first.</p>`,next:'gate'},

/* ── Chapter 18 ── */
c18a:{prose:`<p>A friend of Matei's named Rosa was an architect and liked to eat at Morgenlicht on Saturdays. She had opinions about everything, including Yves's cover letter, which she read over his shoulder without asking and then sat down and put her coffee on the table like she intended to stay awhile.</p>`,
prompt:'Rosa has opinions about his letter.',
choices:[{t:'Yves defends it.',n:'c18b1'},{t:'Yves listens.',n:'c18b2'}]},

c18b1:{prose:`<p>"The structure is wrong," she said. "It's fine." "It's not fine. It's apologetic. Cover letters aren't apologies. They're arguments." She rewrote the opening paragraph in seven minutes. It was, infuriatingly, much better.</p>`,next:'c18c'},
c18b2:{prose:`<p>"You're writing like someone who expects to be turned down," she said. He looked at the letter. "I do," he said. "Then write the version where you don't." He did. It took forty minutes. It was a different letter. He almost believed it.</p>`,next:'c18c'},

c18c:{prose:`<p>As she left she said: "Matei told me you were stubborn. He was right. But stubbornness is useful if you point it the right direction." A good ${de('der Ratschlag','piece of advice','masculine')} from someone who didn't need to give it. Yves was beginning to understand that everyone who knew Matei was, in some small way, trying to look out for him.</p>`,next:'gate'},

/* ── Chapter 19 ── */
c19a:{prose:`<p>Ada came back in November for a week. She occupied the apartment the way weather occupies a room — completely, without apology. She reorganized Matei's bookshelf. He let her. Yves watched the two of them move through the small rooms and understood something about patience he hadn't understood before.</p>`,
prompt:'Ada has something to say to Yves before she leaves.',
choices:[{t:'Yves asks her directly what she thinks.',n:'c19b1'},{t:'He listens and lets her say it.',n:'c19b2'}]},

c19b1:{prose:`<p>"Do you think I should stay?" "I think you're already staying," she said. "The question is whether you're going to admit it." He thought about that. She was, like her ${de('die Schwester','sister','wait — Ada is the sister')}, wrong about the word. Ada was the sister. Matei was the brother. He corrected himself silently.</p>`,next:'c19c'},
c19b2:{prose:`<p>"He's been waiting," she said, "for something that felt worth waiting for." She said it like a fact, not a pressure. "I'm not telling you to do anything," she added. "I know," Yves said. "That's why it lands."</p>`,next:'c19c'},

c19c:{prose:`<p>After she left he lay in the dark and thought about what it meant to be waited for. Not expected — waited for. The ${de('die Schwester','sister','feminine')} had given him something he hadn't known he needed: the information that patience was not the same as absence. That someone waiting for you was a form of presence.</p>`,next:'gate'},

/* ── Chapter 20 ── */
c20a:{prose:`<p>The second application letter was shorter, tighter, more German. He wrote the first draft alone. He showed it to Matei. Matei made three corrections. Then he showed it to Frau Schmidt. She made one. The ${de('der Fortschritt','progress','masculine')} was measurable and it felt like something.</p>`,
prompt:'He\'s about to send it.',
choices:[{t:'He sends it the same day.',n:'c20b1'},{t:'He waits three days and reads it again.',n:'c20b2'}]},

c20b1:{prose:`<p>He sent it before he could second-guess it. The confidence, Matei had said once, is in the sending as much as the writing. At the time Yves had thought this was a nice thing to say. Now he thought it was true.</p>`,next:'c20c'},
c20b2:{prose:`<p>Each morning he read it again. Each morning it looked slightly better. On the third morning he sent it. He told himself the three days were preparation. They were really courage accumulating at its own pace.</p>`,next:'c20c'},

c20c:{prose:`<p>He noticed the ratio. First draft: twelve errors. Second draft: three. Not just grammar — voice. He was arriving, slowly, in a language he'd been standing in for months. ${de('der Fortschritt','progress','masculine')} looked like this: not a leap. A series of slightly better versions of the same person.</p>`,next:'gate'},

/* ── Chapter 21 ── */
c21a:{prose:`<p>The interview was on a Wednesday at two in the afternoon in an office in Mitte. He wore his one good shirt and rehearsed fourteen answers on the bus. By the time he arrived he had forgotten all of them. He stood outside the door for thirty seconds and then went in.</p>`,
prompt:'Frau Janssen asks: "Why do you want this Ausbildung?"',
choices:[{t:'He gives the prepared answer.',n:'c21b1'},{t:'He gives the honest answer.',n:'c21b2'}]},

c21b1:{prose:`<p>He gave clean, practiced German. Frau Janssen nodded and made notes. "Your German is very precise," she said after his third answer. "I practised," he said. She smiled slightly. He recognized that smile. It was the same one Frau Schmidt had given him when he got through his first Tuesday without breaking anything.</p>`,next:'c21c'},
c21b2:{prose:`<p>"I came to Germany to build a life. This is how I build it." Too direct for an interview. He knew the moment he said it. Frau Janssen's pen stopped moving. She looked at him for a moment. Then she wrote something. He couldn't read what.</p>`,next:'c21c'},

c21c:{prose:`<p>"We'll be in touch." He took the U-Bahn home, stared at his reflection in the window. He went to the café and told Frau Schmidt. She put a cake on the counter. "For the ${de('warten','waiting','gerund-use: das Warten')}," she said. He ate the whole thing. That night Matei asked how it went. "I don't know," Yves said. "Then you did it right," Matei said. Yves had no idea what that meant. It helped anyway.</p>`,next:'gate'},

/* ── Chapter 22 ── */
c22a:{prose:`<p>He got the job. The email came on a Friday morning, three weeks later. He read it standing in the kitchen in his socks. He sent it to Matei without comment. Matei texted back: <em>"I told you."</em> Two words. He sat down on the floor and stayed there for several minutes.</p>`,
prompt:'He gets to tell someone.',
choices:[{t:'He goes to tell Frau Schmidt.',n:'c22b1'},{t:'He and Matei celebrate at home.',n:'c22b2'}]},

c22b1:{prose:`<p>He went in on his day off. Frau Schmidt pulled him into a hug that smelled like flour and coffee. "One free coffee every day," she said. "Forever." He had forgotten she'd said that. She hadn't. He held onto her for a moment longer than he meant to.</p>`,next:'c22c'},
c22b2:{prose:`<p>Matei bought wine. Bad wine, from a box. They drank it and Matei told him about his own first job — a disaster — and Yves laughed until he had to put the glass down. It was the first time Matei had told him a story about himself. It was a very good evening.</p>`,next:'c22c'},

c22c:{prose:`<p>The morning of the first day, he stood in front of the mirror and looked like someone starting something. He was someone starting something. In the hallway Matei put a hand on his shoulder and said: "You already know how to do this." It was a lie, kindly spoken. But it was the right lie. The ${de('die Ausbildung','apprenticeship','feminine')} began.</p>`,next:'gate'},

/* ── Chapter 23 ── */
c23a:{prose:`<p>The vocational school — ${de('die Berufsschule','vocational school','feminine')} — was every Tuesday and Thursday and conducted entirely in German at a speed Yves had not prepared for. The first session: he understood maybe sixty percent of the words and thirty percent of the sentences. He took notes on everything he didn't understand.</p>`,
prompt:'He\'s lost in the first class.',
choices:[{t:'He tries to keep up silently.',n:'c23b1'},{t:'He admits he\'s lost and asks for help.',n:'c23b2'}]},

c23b1:{prose:`<p>He filled his notebook with words he looked up on the bus home. His handwriting got worse as the semester went on because he was writing faster. His comprehension got better. By week six he was at eighty percent. He didn't tell anyone. He just kept going.</p>`,next:'c23c'},
c23b2:{prose:`<p>He waited until the end of class and said, in careful German: <em>"Entschuldigung — I follow the content but not always the speed."</em> The teacher looked at him and nodded. "Better," she said, "that you tell me than guess." It was the same lesson Frau Schmidt had taught him with the espresso machine.</p>`,next:'c23c'},

c23c:{prose:`<p>There was a student named Priya who also took notes on everything. They compared notebooks after the second week. She was from Hyderabad, had been in Germany two years, and had opinions that were always exactly right. They became friends in the efficient way people become friends when they're both learning the same language at the same speed in the same cold city. ${de('die Berufsschule','vocational school','where it all happens')} became, slowly, something he looked forward to.</p>`,next:'gate'},

/* ── Chapter 24 ── */
c24a:{prose:`<p>His trainer was Herr Weber. Precise, impatient, fair. He gave Yves a report in the second week with every ${de('der Fehler','mistake','masculine')} circled in red. The margins were full of red. Yves counted seventeen circles on the bus home. He did not sleep well that night.</p>`,
prompt:'Yves brings the red-circled report home.',
choices:[{t:'He feels discouraged. He shows Matei.',n:'c24b1'},{t:'He feels motivated. He goes through each circle.',n:'c24b2'}]},

c24b1:{prose:`<p>Matei turned it over and read it in silence. "He circled everything," Yves said. "Yes," Matei said. Then: "He read everything." Yves looked up. "That's a strange way to look at it." "It's the correct way." Yves thought about that for a while. Then he started on the first circle.</p>`,next:'c24c'},
c24b2:{prose:`<p>He went through each circle one by one. By eleven PM he had addressed fourteen. Three he didn't understand. He sent Herr Weber an email with three questions. At 7 AM the next morning: three answers. Thorough ones. He understood then what kind of trainer Herr Weber was.</p>`,next:'c24c'},

c24c:{prose:`<p>By week four he handed in a report with three red marks. Herr Weber said: <em>"Besser."</em> Just: better. Yves thought of Frau Schmidt and the broken cups and the flat whites and every small German word of approval that had arrived like a medal when he hadn't expected one. He was learning that in this language, <em>besser</em> — better — was sometimes the highest thing you could say. He kept going.</p>`,next:'gate'},

/* ── Chapter 25 ── */
c25a:{prose:`<p>${de('das Heimweh','homesickness','neuter — literally: home-pain')} came on a Wednesday morning without warning. He was making coffee and for half a second he could smell his grandmother's kitchen — onions and something sweet — and then it was gone and he was in Berlin and it was cold and grey and he stood very still for a moment before he could move again.</p>`,
prompt:'The homesickness is real.',
choices:[{t:'He calls his grandmother.',n:'c25b1'},{t:'He writes about it.',n:'c25b2'}]},

c25b1:{prose:`<p>She answered on the second ring. He didn't say he was homesick. He said: "Tell me about the house." She told him. The generator sound. The neighbour's dog. The market on Saturday. He sat on the kitchen floor and listened and felt, somehow, better — not because anything had changed, but because she was there.</p>`,next:'c25c'},
c25b2:{prose:`<p>He wrote three pages in the mix of English and German that had become his private language — the one he used when he needed to say something true. He wrote about what he missed without trying to explain why he was still here. Both things were true at once. He was learning to let them be.</p>`,next:'c25c'},

c25c:{prose:`<p>That evening Matei said: "You're somewhere else today." "Lagos," Yves said. Matei nodded slowly. "Tell me something about it." So Yves told him about the generator and the dog and the market. Matei listened the way he listened to everything — as if it mattered. ${de('das Heimweh','homesickness','neuter')} and home were not opposites. You could be homesick and still be exactly where you belonged.</p>`,next:'gate'},

/* ── Chapter 26 ── */
c26a:{prose:`<p>The mid-year ${de('die Prüfung','exam','feminine')} was in December. He had been studying for six weeks. The night before, he couldn't sleep. He lay in the dark and counted what he knew: networking protocols, German conditional clauses, how Matei took his coffee. It was a good list.</p>`,
prompt:'The night before the exam.',
choices:[{t:'He reviews his notes until 2 AM.',n:'c26b1'},{t:'He tries to sleep.',n:'c26b2'}]},

c26b1:{prose:`<p>He went through his notebook until 2 AM. Then he put it down and thought: either you know it or you don't. You know it. He slept at 2:17. Matei did not comment on the light being on. He had noticed. He said nothing. That, too, was a kind of support.</p>`,next:'c26c'},
c26b2:{prose:`<p>He lay in the dark and tried to breathe slowly. From the other side of the bed, Matei: "Stop counting." "I'm not counting." "You're counting. I can hear it." He stopped. He fell asleep faster than he expected. Some people were better at being helped than they thought.</p>`,next:'c26c'},

c26c:{prose:`<p>He finished the exam in ninety minutes. He walked out into the cold and texted Matei: "Done." Back: "And?" "Don't know." "You know." He walked to the café. Frau Schmidt put a cake on the counter without being asked. He had not told her about the ${de('die Prüfung','exam','feminine')}. He ate the cake. Some things you didn't need to explain.</p>`,next:'gate'},

/* ── Chapter 27 ── */
c27a:{prose:`<p>He failed a module in February. Not the exam — a coursework submission. A technical report marked down for language, not content. Herr Weber called him into the office. Not to reprimand him. To plan. Yves sat across the desk and felt, briefly, like the first day in Frau Janssen's office. Then he remembered how that had ended.</p>`,
prompt:'Herr Weber has a plan. Yves can resist it or accept it.',
choices:[{t:'He pushes back — the content was correct.',n:'c27b1'},{t:'He accepts the plan and starts immediately.',n:'c27b2'}]},

c27b1:{prose:`<p>"The content was correct," Yves said. Herr Weber looked at him levelly. "Yes. But documentation is communication. Communication requires the reader to understand you." A pause. "Do you understand me?" "Yes." "Then write it so they do." It was the most useful thing anyone had said to him in months.</p>`,next:'c27c'},
c27b2:{prose:`<p>He took the list of exercises and went home and started at the top. He didn't love the feeling of starting over. He was getting better at it. Starting over had taught him more than getting it right the first time ever had. ${de('die Niederlage','defeat / setback','feminine')} was another kind of teacher.</p>`,next:'c27c'},

c27c:{prose:`<p>He rewrote the report in a week. It came back marked: <em>ausreichend.</em> Sufficient. Not good. He took it home and pinned it to the wall and looked at it. Then he made coffee and thought about how many things in his life had started as sufficient. The apartment. The German. The city. Himself. <em>Sufficient</em> was a beginning. It always had been.</p>`,next:'gate'},

/* ── Chapter 28 ── */
c28a:{prose:`<p>Frau Schmidt told him she was retiring in April. She said it over coffee on a Tuesday, matter-of-factly, the way she said everything. The café would close or be sold. She hadn't decided. He put his cup down and felt the weight of the word <em>closing</em> like a door he hadn't expected to face.</p>`,
prompt:'Morgenlicht might close. Yves has a response.',
choices:[{t:'He asks her not to let it close.',n:'c28b1'},{t:'He says nothing. Her choice to make.',n:'c28b2'}]},

c28b1:{prose:`<p>"There are people who need it," he said. She looked at him. "You mean you." "I mean the regulars. I mean the corner. I mean whoever opens that door in the morning." She was quiet for a while. "Someone might take it on," she said. "Someone might."</p>`,next:'c28c'},
c28b2:{prose:`<p>He said nothing. She had run the café for twenty years. He just sat with her and drank his coffee and let the weight of the decision belong to her, where it belonged. Sometimes being a good ${de('der Stammgast','regular customer','masculine')} meant knowing when to just be present.</p>`,next:'c28c'},

c28c:{prose:`<p>She looked at him over her cup and said: "You know, Matei told me you came here to see if you could stay. I don't think that's what you're doing anymore." He thought about that on the walk home. She was right. He had stopped testing himself against Berlin. He was just living in it. ${de('der Stammgast','the regular','masculine')}. That was what he was now.</p>`,next:'gate'},

/* ── Chapter 29 ── */
c29a:{prose:`<p>Priya got married in March. She married Jonas, a German man who had been learning Tamil for two years for her sake and was still not good at it, which Yves found both very funny and very moving. The wedding was in a small hall in Neukölln and smelled like flowers and something from another continent.</p>`,
prompt:'Yves needs a date for the wedding.',
choices:[{t:'He goes alone.',n:'c29b1'},{t:'He asks Matei to come.',n:'c29b2'}]},

c29b1:{prose:`<p>He wore his good shirt. He sat with Priya's family and communicated entirely through smiling and the word <em>wunderbar</em>, which covered a lot of ground. He felt, in a room full of strangers, not like a stranger. That was something he had not been able to say about most rooms, most of his life.</p>`,next:'c29c'},
c29b2:{prose:`<p>Matei said yes without the pause Yves had expected. At the wedding he stood next to Yves and translated the ceremony and was, by some distance, the quietest person in the room and also somehow one of the most present. Yves thought: he is always like this. I should stop being surprised.</p>`,next:'c29c'},

c29c:{prose:`<p>Priya's mother danced with Yves for one song he didn't know the steps to. He followed badly. She laughed and pulled him along. Afterward he sat down and Matei said: "You looked happy." "I was happy," Yves said. He meant it simply. At the ${de('die Hochzeit','wedding','feminine')}, among people he had made into his people, he had been happy. It was a simple fact. He let it be simple.</p>`,next:'gate'},

/* ── Chapter 30 ── */
c30a:{prose:`<p>He passed. 89 points out of 100. He lost one point on an ethics question. He opened the email in the kitchen at 9:14 AM and read it four times. The fourth time he cried a little, which he had not expected and which he decided not to mention to anyone, and then he went and made coffee.</p>`,
prompt:'He has to tell people. Who does he call first?',
choices:[{t:'He tells Matei first.',n:'c30b1'},{t:'He calls his grandmother first.',n:'c30b2'}]},

c30b1:{prose:`<p>He walked into the living room and said: <em>"Ich bin Fachinformatiker."</em> Matei looked at him. Then — only the second time Yves had heard it — he said: <em>"Sehr gut."</em> Quietly. Yves stood very still. "You said 'very good.'" "You passed." "You never say 'very good.'" "I can make exceptions." He could.</p>`,next:'c30c'},
c30b2:{prose:`<p>"Omi, I passed." A silence. Then: "I know." "You know?" "I always knew." Her voice was so certain it made his chest hurt. "Come home soon," she said. "I will," he said. "Berlin is good?" "Berlin is very good." "The man?" "Still here." "Good," she said. "Good."</p>`,next:'c30c'},

c30c:{prose:`<p>He found Frau Schmidt at a café two streets from ${de('Morgenlicht','Morning Light','the café she ran for twenty years')}. She hugged him, flour still on her apron out of habit, and said: "One free coffee. Forever. At whatever café you find next." It was the most generous thing anyone had said to him in months. The ${de('der Abschluss','completion / graduation','masculine')}. The end of the beginning.</p>`,next:'gate'},

/* ── Chapter 31 ── */
c31a:{prose:`<p>He went to Lagos in August. Two weeks. The heat at the airport arrived like a wall and he stood in it and just breathed. He had forgotten what warmth felt like when it had no winter behind it. His grandmother met him at the arrivals gate and held him for a long time without speaking.</p>`,
prompt:'Lagos: does he feel like a visitor or like he\'s come home?',
choices:[{t:'Like a visitor — he moves at the wrong speed.',n:'c31b1'},{t:'Like home — it still fits.',n:'c31b2'}]},

c31b1:{prose:`<p>Lagos was the same and completely different. The same streets, the same sounds, the same smell at Saturday's market. But he moved through it slightly wrong now — calibrated for somewhere else, half a beat off. He was not from here the same way he used to be. He was from here in the way you can only be from somewhere after you've left.</p>`,next:'c31c'},
c31b2:{prose:`<p>His grandmother's kitchen smelled exactly as he'd remembered it in Berlin on Wednesday mornings. He stood in the doorway and she said <em>"na, endlich"</em> — well, finally — which she had started saying in German since he'd been sending her vocabulary lists. He sat at the table and didn't move for twenty minutes. It fit.</p>`,next:'c31c'},

c31c:{prose:`<p>He called Matei every evening from the courtyard while his grandmother slept. "How is it?" "Good. Strange. Right." "Come back when you're ready." He stood in the courtyard of the city he grew up in and thought: I'm going back. That's how I know. ${de('der Abschied','farewell / departure','masculine')} is only hard when the place you're leaving doesn't know you'll return. Berlin knew. He was going back.</p>`,next:'gate'},

/* ── Chapter 32 ── */
c32a:{prose:`<p>He came back in September. The key no longer stuck. He had oiled the lock in the spring and forgotten, and now it opened on the first try, every time. This shouldn't have felt like anything. It felt like something.</p>`,
prompt:'Back in Berlin. The beginning of year two.',
choices:[{t:'He says it out loud — "the key doesn\'t stick."',n:'c32b1'},{t:'He keeps it and hangs the key on its hook.',n:'c32b2'}]},

c32b1:{prose:`<p>"The key doesn't stick anymore," he told Matei. "I oiled it in May." "I know." "You noticed." "I always noticed." Matei looked at him with the particular stillness he used when deciding something. Then he nodded once. "I know," he said. Two small words. Enormous.</p>`,next:'c32c'},
c32b2:{prose:`<p>He hung the key on the hook by the door. Their hooks now — there were two. He put the kettle on. Matei came in behind him. They didn't say anything. They didn't have to. The apartment smelled like coffee and a year of living in the same rooms and something that didn't need a name.</p>`,next:'c32c'},

c32c:{prose:`<p>He had a job, a qualification, a plant that had survived a year, a notebook almost full. He started a new one. First line: <em>Year 2.</em> Second line: <em>Still here.</em> Third line: blank. Some things didn't need a sentence. ${de('der Anfang','the beginning','masculine')}. Everything was a beginning if you were paying attention.</p>`,next:'gate'},

/* ── Chapter 33 ── */
c33a:{prose:`<p>He started writing the letter to his grandmother in German. Not to practise — because it felt right. Because German was the language of his daily life now and his daily life was where he wanted to tell her he was okay. He wrote slowly. He looked up words he already knew, just to be sure.</p>`,
prompt:'He writes to her in German.',
choices:[{t:'He finishes it entirely in German.',n:'c33b1'},{t:'He switches to English halfway.',n:'c33b2'}]},

c33b1:{prose:`<p>He made twelve mistakes by his own count, probably more. He sent it anyway. She called the next day: "Your German is good." "How do you know?" "Google Translate." A pause. "It said <em>I miss you</em> in four different ways." "That's accurate," he said. "I know," she said.</p>`,next:'c33c'},
c33b2:{prose:`<p>He switched to English at the third paragraph and showed Matei the German half. Matei made one correction. One. "Only one?" Yves said. "Only one," Matei said. They looked at each other across the kitchen. Something passed between them that didn't need words. Something that had been approaching for a very long time.</p>`,next:'c33c'},

c33c:{prose:`<p>He pinned the letter to the wall next to the "sufficient" report. Two pieces of writing. One in German, one half and half. Both true. He was not yet fluent. He was not yet anything in full. He was somewhere in the middle, still growing, still rooted. ${de('die Wurzeln','the roots','plural feminine')}. You didn't have to be still to have them.</p>`,next:'gate'},

/* ── Chapter 34 ── */
c34a:{prose:`<p>Matei said it on a Thursday evening, without preamble, while washing dishes. "I don't want you to leave." Not a question. Not a condition. A statement — the kind that had been waiting a long time to be said and had finally found its moment in an ordinary kitchen on an ordinary evening.</p>`,
prompt:'Yves has to answer.',
choices:[{t:'He answers immediately.',n:'c34b1'},{t:'He dries his hands and takes a moment.',n:'c34b2'}]},

c34b1:{prose:`<p>"I'm not going to," Yves said. Simple. "I mean ever," Matei said. "I mean you should be able to." "I know what you mean." He put the dish down and turned around. "I'm not going to," he said again. Twice was enough. Twice made it true.</p>`,next:'c34c'},
c34b2:{prose:`<p>He dried his hands. He thought about the airport. The bus. The key. The note on the table. Two years of small accumulations that had made something he didn't have a single word for in any language. "No," he said. "I'm not leaving." It was the simplest and largest sentence he had ever said.</p>`,next:'c34c'},

c34c:{prose:`<p>They stood in the kitchen that smelled like coffee and two years of living and Matei said: "That's enough for me." A small ${de('das Versprechen','promise','neuter')} — and also the largest one Yves had been given. He thought of his grandmother's voice: <em>Is he kind?</em> He makes coffee exactly the way I like. <em>Then yes. That's how.</em></p>`,next:'gate'},

/* ── Chapter 35 ── */
c35a:{prose:`<p>A year and a half. He was sitting on the roof of a building in Prenzlauer Berg with Priya and Matei and Jonas and a bottle of wine that tasted like June. The city below them was lit and indifferent and exactly right. He thought: I didn't plan any of this. He thought: that's fine.</p>`,
prompt:'Yves has one last choice.',
choices:[{t:'He writes it down.',n:'c35b1'},{t:'He just sits and lets it be.',n:'c35b2'}]},

c35b1:{prose:`<p>He wrote: <em>${de('Ich bleibe','I am staying','the final two words')}. I'm staying. Same sentence in two languages. I've been saying it for eighteen months. This is the first time it doesn't feel like a decision. It feels like a description.</em> He closed the notebook.</p>`,next:'c35c'},
c35b2:{prose:`<p>He didn't write anything. He sat and looked at the city and let it be what it was — his city, earned and imperfect and full of the specific weight of everything he hadn't run from. He would remember this. He always remembered what mattered.</p>`,next:'c35c'},

c35c:{prose:`<p>Walking home, Matei said: "What are you thinking?" Yves considered. "That I'm glad the key stuck," he said. "In the beginning. I'm glad it was hard." Matei looked at him. "So am I," he said. They walked the rest of the way in quiet, their footsteps on the pavement, the city around them, the night ordinary and sufficient and exactly enough. ${de('Ich bleibe','I am staying','the last words of the story')}.</p>`,next:'gate'}

};/* end SCENES */

/* ── state ── */
let ST={ch:1,scene:'c1a',done:[],gateAttempts:0};
function loadST(){try{const s=JSON.parse(localStorage.getItem('gj3')||'null');if(s)ST=s;}catch(e){}}
function saveST(){try{localStorage.setItem('gj3',JSON.stringify(ST));}catch(e){}}

/* ── map ── */
function buildMap(){
  const m=document.getElementById('chapter-map');
  m.innerHTML='';
  CHS.forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='ch-dot';
    d.setAttribute('data-tip',`Ch ${c.n} — ${c.t}`);
    if(ST.done.includes(c.n))d.classList.add('done');
    else if(c.n===ST.ch)d.classList.add('active');
    else d.classList.add('locked');
    m.appendChild(d);
  });
}

/* ── header ── */
function setHeader(n,t){
  document.getElementById('ch-label').textContent=`Chapter ${n}`;
  document.getElementById('ch-title').textContent=t;
}

/* ── tts / tooltip ── */
const TT=document.getElementById('tooltip');
let ttTimer;
function speak(el){
  const w=el.dataset.de||el.textContent,e=el.dataset.en||'',g=el.dataset.g||'';
  TT.innerHTML=`<div class="tip-de">${w}</div><div class="tip-en">${e}</div>${g?`<div class="tip-g">${g}</div>`:''}`;
  const r=el.getBoundingClientRect();
  let top=r.bottom+10,left=r.left;
  if(left+220>window.innerWidth)left=window.innerWidth-226;
  if(top+80>window.innerHeight)top=r.top-88;
  TT.style.top=top+'px';TT.style.left=left+'px';
  TT.classList.add('show');clearTimeout(ttTimer);
  ttTimer=setTimeout(()=>TT.classList.remove('show'),3600);
  if(!('speechSynthesis' in window))return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(w);
  u.lang='de-DE';u.rate=0.82;u.pitch=1.0;
  el.classList.add('playing');
  u.onend=u.onerror=()=>el.classList.remove('playing');
  const vs=window.speechSynthesis.getVoices();
  const dv=vs.find(v=>v.lang&&v.lang.startsWith('de'));
  if(dv)u.voice=dv;
  window.speechSynthesis.speak(u);
}
document.addEventListener('click',e=>{if(!e.target.classList.contains('de'))TT.classList.remove('show');});
'speechSynthesis' in window&&(window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices());

/* ── engine ── */
const PROSE=document.getElementById('prose-area');
const CHOICEAREA=document.getElementById('choice-area');
const CHOICEPROMPT=document.getElementById('choice-prompt');
const CHOICEBTNS=document.getElementById('choice-buttons');
const CONTBTN=document.getElementById('continue-btn');
const GATEAREA=document.getElementById('gate-area');
const CHCOMP=document.getElementById('ch-complete');
const STORYEND=document.getElementById('story-end');
const WRAP=document.getElementById('scene-wrap');

function fade(fn){WRAP.classList.add('fading');setTimeout(()=>{fn();WRAP.classList.remove('fading');},330);}

function renderScene(id){
  const s=SC[id];if(!s)return;
  ST.scene=id;saveST();
  PROSE.innerHTML=`<div class="prose-block">${s.prose}</div>`;
  CHOICEAREA.style.display='none';
  CONTBTN.className='';
  GATEAREA.className='';GATEAREA.style.display='none';
  CHCOMP.className='';CHCOMP.style.display='none';
  STORYEND.className='';STORYEND.style.display='none';
  // reset gate
  document.getElementById('gate-input').value='';
  document.getElementById('gate-input').className='';
  document.getElementById('gate-fb').textContent='';
  document.getElementById('gate-fb').className='';
  document.getElementById('gate-sub').disabled=false;
  ST.gateAttempts=0;
  if(s.choices){
    CHOICEAREA.style.display='block';
    CHOICEPROMPT.textContent=s.prompt;
    CHOICEBTNS.innerHTML='';
    s.choices.forEach(c=>{
      const b=document.createElement('button');
      b.className='choice-btn';b.textContent=c.t;
      b.onclick=()=>makeChoice(b,c);
      CHOICEBTNS.appendChild(b);
    });
  } else if(s.next==='gate'){
    CONTBTN.textContent="I've read this.  →";
    CONTBTN.classList.add('vis');
    CONTBTN.onclick=()=>{CONTBTN.className='';showGate();};
  } else if(s.next){
    CONTBTN.textContent='Continue →';
    CONTBTN.classList.add('vis');
    CONTBTN.onclick=()=>fade(()=>renderScene(s.next));
  }
}

function makeChoice(btn,choice){
  document.querySelectorAll('.choice-btn').forEach(b=>{b.disabled=true;if(b===btn)b.classList.add('chosen');});
  const ns=SC[choice.n];if(!ns)return;
  setTimeout(()=>fade(()=>{
    PROSE.innerHTML=`<div class="prose-block">${ns.prose}</div>`;
    CHOICEAREA.style.display='none';
    CONTBTN.className='';
    ST.scene=choice.n;saveST();
    if(ns.next==='gate'){
      CONTBTN.textContent="I've read this.  →";CONTBTN.classList.add('vis');
      CONTBTN.onclick=()=>{CONTBTN.className='';showGate();};
    } else if(ns.next){
      CONTBTN.textContent='Continue →';CONTBTN.classList.add('vis');
      CONTBTN.onclick=()=>fade(()=>renderScene(ns.next));
    }
  }),180);
}

/* ── gate ── */
function showGate(){
  const ch=CHS[ST.ch-1];
  document.getElementById('gate-prompt-text').innerHTML=
    `One word. It appeared in this chapter.<br>${ch.g.q}?`;
  GATEAREA.style.display='block';GATEAREA.classList.add('vis');
  setTimeout(()=>document.getElementById('gate-input').focus(),80);
}

function checkGate(){
  const ch=CHS[ST.ch-1];
  const inp=document.getElementById('gate-input');
  const fb=document.getElementById('gate-fb');
  const raw=norm(inp.value);
  const ans=norm(ch.g.a);
  // also accept: strip accents and compare
  const rawStripped=raw.replace(/[üöäß]/g,c=>({ü:'u',ö:'o',ä:'a',ß:'ss'}[c]||c));
  const ansStripped=ans.replace(/[üöäß]/g,c=>({ü:'u',ö:'o',ä:'a',ß:'ss'}[c]||c));
  const correct=raw===ans||rawStripped===ansStripped||(ans.length>8&&raw.length>4&&ans.startsWith(raw.slice(0,4)));
  if(correct){
    inp.classList.add('ok');
    fb.innerHTML=`<em style="color:var(--amber)">${ch.g.d}</em> ✓ You've got it.`;
    fb.className='ok';
    document.getElementById('gate-sub').disabled=true;inp.disabled=true;
    setTimeout(()=>showChComplete(),1300);
  } else {
    ST.gateAttempts=(ST.gateAttempts||0)+1;
    inp.classList.add('err');setTimeout(()=>inp.classList.remove('err'),320);
    if(ST.gateAttempts>=2){
      fb.innerHTML=`It's <em style="color:var(--amber)">${ch.g.d}</em>. Try typing it.`;
      fb.className='err';
    } else {
      fb.textContent='Not quite — look for it in the chapter prose.';
      fb.className='err';
    }
    saveST();
  }
}

document.getElementById('gate-sub').addEventListener('click',checkGate);
document.getElementById('gate-input').addEventListener('keydown',e=>{if(e.key==='Enter')checkGate();});

/* ── chapter complete ── */
function showChComplete(){
  GATEAREA.style.display='none';
  const ch=CHS[ST.ch-1];
  if(!ST.done.includes(ch.n))ST.done.push(ch.n);
  saveST();buildMap();
  document.getElementById('cc-title-text').textContent=`Chapter ${ch.n} — ${ch.t} complete.`;
  document.getElementById('cc-word-text').innerHTML=
    `You learned <em>${ch.g.d}</em> in this chapter. You'll use it again.`;
  CHCOMP.style.display='block';CHCOMP.classList.add('vis');
  const nextCh=CHS[ST.ch];
  if(!nextCh){
    document.getElementById('next-ch-btn').style.display='none';
    STORYEND.style.display='block';STORYEND.classList.add('vis');
  } else {
    document.getElementById('next-ch-btn').textContent=`Chapter ${nextCh.n} — ${nextCh.t} →`;
    document.getElementById('next-ch-btn').onclick=()=>startChapter(nextCh.n);
  }
}

function startChapter(n){
  ST.ch=n;
  const firstScene=`c${n}a`;
  ST.scene=firstScene;
  saveST();
  fade(()=>{
    setHeader(n,CHS[n-1].t);
    window.scrollTo({top:0,behavior:'smooth'});
    renderScene(firstScene);
  });
  buildMap();
}

/* ── init ── */
loadST();
// Guard: if saved chapter doesn't have scenes, reset to ch1
if(!SC[`c${ST.ch}a`]){ST={ch:1,scene:'c1a',done:[],gateAttempts:0};saveST();}
buildMap();
setHeader(ST.ch,CHS[ST.ch-1].t);
// If current chapter already done, show complete screen
if(ST.done.includes(ST.ch)&&ST.ch===35){
  STORYEND.style.display='block';STORYEND.classList.add('vis');
} else if(ST.done.includes(ST.ch)){
  showChComplete();
} else {
  renderScene(ST.scene||`c${ST.ch}a`);
}
</script>
