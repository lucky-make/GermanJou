rn an an (+ acc.) accusative Ich erinnere mich an den Schlüssel. (I remember the key.)\n\nsich freuen auf auf (+ acc.) accusative Ich freue mich auf das Wochenende. (I'm looking forward to the weekend.)\n\nsich freuen über über (+ acc.) accusative Ich freue mich über das Geschenk. (I'm happy about the gift.)\n\nsich kümmern um um (+ acc.) accusative Ich kümmere mich um die Pflanze. (I take care of the plant.)\n\nsich interessieren für für (+ acc.) accusative Ich interessiere mich für IT. (I'm interested in IT.)\n\nExamples from this chapter (adapted):\n\nI remember the almost smiles. Ich erinnere mich an die fast-Lächeln.\n\nI'm looking forward to seeing you. Ich freue mich auf dich.\n\nTake care of him. Kümmere dich um ihn.\n\nWhy this matters: In high-density German, you will see these reflexive-preposition combinations constantly. Instead of memorizing the list, notice the pattern: sich + verb + preposition + noun. The preposition links the verb to the thing being remembered, looked forward to, or cared for.\n\nTip from the method: When you see sich erinnern, look for an nearby. When you see sich freuen, look for auf (future) or über (past/present). Your brain will absorb the connections.", "choices": ["Notice the silence between them", "Focus on what is being said"]}], "gate": {"clue": "What is the German word for \"the second application\"?", "answer": "zweite bewerbung", "hint": "die zweite Bewerbung"}, "vocab": [{"german": "die Schwester", "english": "sister"}, {"german": "die Pension", "english": "guesthouse"}, {"german": "der Mut", "english": "courage"}, {"german": "die Vergangenheit", "english": "past"}, {"german": "die Gegenwart", "english": "present"}, {"german": "die Zukunft", "english": "future"}, {"german": "verzeihen", "english": "to forgive"}, {"german": "vertrauen", "english": "to trust"}, {"german": "bleiben", "english": "to stay"}, {"german": "ankommen", "english": "to arrive"}, {"german": "weggehen", "english": "to go away"}, {"german": "die Erinnerung", "english": "memory"}, {"german": "die Hoffnung", "english": "hope"}, {"german": "der Frieden", "english": "peace"}, {"german": "die Versöhnung", "english": "reconciliation"}, {"german": "ehrlich", "english": "honest"}, {"german": "geduldig", "english": "patient"}, {"german": "hoffnungsvoll", "english": "hopeful"}, {"german": "gut", "english": "good"}, {"german": "der Morgen", "english": "morning"}, {"german": "die Lampe", "english": "lamp"}, {"german": "die Heizung", "english": "radiator / heating"}, {"german": "das Sofa", "english": "sofa / couch"}, {"german": "der Schlüssel", "english": "key"}, {"german": "die Wohnung", "english": "apartment"}, {"german": "sich", "english": "(reflexive pronoun)"}, {"german": "die Straßenlaterne", "english": "streetlight"}, {"german": "siebenunddreißig", "english": "thirty-seven"}, {"german": "über", "english": "over / about"}, {"german": "sich kümmern", "english": "to take care of"}, {"german": "sich kümmern", "english": "to take care of"}, {"german": "für", "english": "for"}, {"german": "das Lächeln", "english": "smile"}, {"german": "die Straßenlaterne", "english": "streetlight"}, {"german": "sich kümmern", "english": "to take care of"}], "shadow": ["Emotional vocabulary — say these aloud, slowly:", "Ich habe dich vermisst. — I missed you.", "Es tut mir leid, dass ich so lange gewartet habe. — I'm sorry I waited so long.", "Ich bin froh, dass du hier bist. — I'm glad you're here.", "Wir haben viel zu besprechen. — We have a lot to talk about.", "None of these are difficult words. But they are hard to say. That is the point. Practise saying them until they feel available — until you can reach for them when you need them."]}, {"id": 20, "title": "Die zweite Bewerbung", "scenes": [{"prose": "Andreea stayed for four days.\n\nShe slept in the bed. We slept on the Sofa. My back hurt. My neck hurt. Everything hurt. But Matei was warm, and his sister made coffee in the mornings, and the apartment smelled like Romania for the first time in years.\n\n\"You're still here,\" Matei said on the fourth morning.\n\n\"I'm leaving today.\"\n\n\"Where are you going?\"\n\n\"Back to Romania. Back to work. Back to my life.\"\n\n\"You could stay.\"\n\n\"I could. But I won't.\"\n\n\"Because you don't need me here. You have him.\" She looked at me. \"And he's annoying enough for two people.\"\n\n\"That's rude,\" I said.\n\n\"That's honest. There's a Unterschied.\"\n\n\"Everyone keeps saying that.\"\n\n\"Because it keeps being true.\"\n\nShe hugged Matei. Held on longer than usual.\n\n\"Come visit,\" she said.\n\n\"Not maybe. Promise.\"\n\n\"I don't make promises.\"\n\n\"Then make an exception.\"\n\n\"I don't make exceptions either.\"\n\n\"You're impossible.\"\n\n\"Unfortunately.\"\n\nShe hugged me too. Her arms were strong. Her perfume smelled like cigarettes and something floral. I didn't pull away.\n\n\"Take care of him,\" she said.\n\n\"I'm trying to try harder.\"\n\n\"That's not a thing.\"\n\n\"It is now. I invented it.\"\n\nShe laughed. Then she left. The door closed. The apartment felt bigger. Emptier. Quieter.\n\n\"Are you okay?\" I asked.\n\n\"That's not an answer.\"\n\n\"It's the only answer I have.\"\n\n\"You need new answers.\"\n\n\"Then help me find them.\"\n\nThe interview with SecureNet Systems was in three days.\n\nMatei had made a list. A long list. On yellow paper. With bullet points.\n\n\"You made a list,\" I said.\n\n\"This list has sub-lists.\"\n\n\"Lists need sub-lists. It's hierarchical.\"\n\n\"You're not an IT person.\"\n\n\"I'm an organized person. Same thing.\"\n\nThe list had everything: possible questions, sample answers, vocabulary to memorize, topics to research. He had even drawn a small diagram of a server network. It was wrong. I didn't tell him.\n\n\"This is wrong,\" I said.\n\n\"It's symbolic. There's a Unterschied.\"\n\n\"No. But it looks impressive.\"\n\n\"It looks like a stick figure having a seizure.\"\n\n\"That's called modern art.\"\n\nHe sat on the wooden chair. I sat on the plastic one. The one no one used. It was uncomfortable. That was the point.\n\n\"Tell me about yourself,\" he said.\n\n\"My name is Yves. I am from Nigeria. I live in Berlin. I speak German badly but I'm improving. I once asked for a glass of cow.\"\n\n\"Don't say that.\"\n\n\"It shows personality.\"\n\n\"It shows you don't know the difference between Milch and Kuh.\"\n\n\"That's the same thing.\"\n\n\"It is now. I invented it.\"\n\n\"You didn't invent anything. Now say it again. Without the cow.\"\n\n\"My name is Yves. I am from Nigeria. I live in Berlin. I speak German. I'm learning IT because I like computers and I want to stay in this country.\"\n\n\"Why do you want to stay?\"\n\n\"Because of Matei.\"\n\n\"Don't say that either.\"", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}, {"prose": "\"Why not? It's true.\"\n\n\"Because it's not professional. They don't care about your boyfriend. They care about your skills.\"\n\n\"My boyfriend is a skill.\"\n\n\"He could be. I could put him on my Lebenslauf. 'Languages: English, German (basic), Matei (advanced).'\"\n\n\"You're impossible.\"\n\n\"Unfortunately. Now say it again. Without the jokes.\"\n\nWe practiced for three hours.\n\nI learned how to say \"I have experience in customer service\" (Ich habe Erfahrung im Kundenservice). I learned how to say \"I am reliable and motivated\" (Ich bin zuverlässig und motiviert). I learned how to say \"I am willing to learn\" (Ich bin bereit zu lernen) without sounding like a robot.\n\n\"You still sound like a robot,\" Matei said.\n\n\"I am a robot. A robot who makes coffee and cries at ducks.\"\n\n\"That's not a selling point.\"\n\n\"It's a personality. There's a Unterschied.\"\n\n\"No. But it's all I have.\"\n\nThe night before the interview, I couldn't sleep.\n\nMatei was already in bed. His breathing was slow. His arm was around my waist. But I was staring at the ceiling, thinking about servers and networks and German words I didn't know.\n\n\"You're thinking too loud,\" he murmured.\n\n\"What if I forget everything?\"\n\n\"Then you remember. That's what brains do.\"\n\n\"What if I say something stupid?\"\n\n\"Then you say something stupid. And then you say something smart. And they remember the smart thing.\"\n\n\"That's not how memory works.\"\n\n\"It's how my memory works. Now sleep.\"\n\n\"What if I oversleep?\"\n\n\"I'll wake you.\"\n\n\"What if I can't find the office?\"\n\n\"I'll draw you a map.\"\n\n\"What if they ask about my Lebenslauf and I realize I lied?\"\n\n\"I said I was 'proficient in Microsoft Office.' I'm not. I can open Word. That's it.\"\n\n\"That's proficiency.\"\n\n\"It is now. I invented it. Now sleep.\"\n\nBut at 7 AM, Matei woke me with coffee. Black. No sugar. No milk. Perfect.\n\n\"You look terrible,\" he said.\n\n\"I feel terrible.\"\n\n\"Good. Terror means you care.\"\n\n\"Or it means I'm about to throw up.\"\n\n\"Same thing. Now drink your coffee. You have an interview to win.\"\n\nThe office was in Wedding.\n\nSame neighborhood as Herr Köhler. Different building. Greyer. Smaller. The sign on the door said SecureNet Systems in a font that was definitely not Garamond. Matei would be disappointed.\n\nI walked in. A woman at the front desk smiled. She had kind eyes. The kind that said I've seen a lot of nervous applicants and you're not the worst.\n\n\"They're ready for you. Second door on the left.\"\n\nI walked to the door. Knocked. Entered.\n\nThree people sat at a table. Two men. One woman. They were all wearing glasses. The woman had a laptop. The older man had a beard. The younger man had a coffee stain on his shirt. I felt immediately better.\n\n\"Guten Morgen,\" I said.\n\n\"Guten Morgen, Herr Yves. Bitte, setzen Sie sich.\"\n\nI sat. The chair was comfortable. Not plastic. Not wooden. Something with padding. It felt like hope.\n\nThe interview lasted forty-five minutes.\n\nThey asked about my background. My experience. My German. My motivation. I answered. Sometimes correctly. Sometimes not. But I kept going.\n\n\"Why do you want this Ausbildung?\" the woman asked.\n\nI thought about Matei. About the duck. About the key in my pocket. About Andreea and Sebastian and Frau Schmidt and all the people who had stayed when I wanted to run.\n\n\"Because I want to build something,\" I said. \"A life. A future. Something that's mine. And I need the skills to do it.\"\n\nThe woman nodded. The older man wrote something on his notepad. The younger man smiled.\n\n\"Your German is good,\" the woman said.\n\n\"It's better than okay. It's good. And it will get better.\"\n\n\"We'll let you know next week.\"\n\nI stood up. Shook their hands. Walked out.\n\nThe woman at the front desk smiled again.\n\n\"I don't know. I said 'glass of cow' once. But I think they understood.\"\n\n\"You said what?\"", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}, {"prose": "\"It's a long story. I'll write a book about it.\"\n\nThe duck was there. Paddling. Judging. Being a duck.\n\n\"I think it went okay,\" I told him.\n\n\"That's not helpful.\"\n\n\"You're right. I should just wait. Waiting is the hard part.\"\n\nThe duck quacked a third time. I chose to interpret this as you're an idiot but I support you.\n\nI don't know. I said \"glass of cow\" again.\n\nHow does \"glass of cow\" slip out?\n\nUnfortunately. Come home. I bought pastries.\n\nThe apricot ones. And I'm not hiding them.\n\nI'm always supportive. I'm Romanian.\n\nIt's not an excuse. It's an explanation.\n\nI walked home. The stairs were siebenunddreißig steps. The Schlüssel stuck. The door opened.\n\nMatei was in the kitchen. Not making coffee. Making pasta. My grandmother's recipe. The sauce was bubbling. The kitchen smelled like garlic and home.\n\n\"You're making pasta,\" I said.\n\n\"You had an interview. That's worth pasta.\"\n\n\"What if I don't get the job?\"\n\n\"Then you had an interview. That's still worth pasta.\"\n\n\"What if I never get a job?\"\n\n\"Then you'll be a professional pasta eater. I'll support you.\"\n\n\"That's not a real job.\"\n\n\"It could be. You'd be good at it. You have experience.\"\n\n\"I have experience eating your pastries.\"\n\n\"That's the same thing.\"\n\nHe handed me a fork. I tasted the sauce. It was perfect. I hated that it was perfect.\n\n\"You're getting good at this.\"\n\n\"I'm getting good at a lot of things.\"\n\n\"Like being patient. Like not murdering you when you say 'glass of cow' in interviews. Like staying.\"\n\n\"That's three things.\"\n\n\"I'm a complex person.\"\n\n\"You're a simple person who uses big words to seem complex.\"\n\n\"That's my line.\"\n\n\"I'm borrowing it.\"\n\n\"Help me with the thank-you email. I don't know how to say 'thank you for not laughing at me' in German.\"\n\n\"Say 'Vielen Dank für das freundliche Vorstellungsgespräch.'\"\n\n\"That's too formal.\"\n\n\"Formal is good. Formal gets you jobs.\"\n\n\"What if I want to say something funnier?\"\n\n\"Then you don't get the job. And I'll be stuck with you forever.\"\n\n\"You're already stuck with me forever.\"\n\n\"I know. That's the problem.\"\n\n\"That's not what you said last night.\"\n\n\"Last night I was tired. Tonight I'm honest.\"\n\nHe kissed me. Sauce on his lips. Garlic on his tongue.\n\n\"You're going to get the job.\"\n\n\"You don't know that.\"\n\n\"I know you. That's enough.\"\n\nWe ate pasta. Drank wine. The cheap kind. The one that came in a box. Matei said it was \"rustic.\" I said it was \"box wine.\" He said \"same thing.\"\n\nAfter dinner, we sat on the Sofa. The Lampe buzzed. The Heizung clicked. The plant sat on the windowsill. Alive. Thriving. Judging.\n\n\"What if I don't get this job?\"\n\n\"Then you apply to another one.\"\n\n\"What if I don't get any job?\"\n\n\"Then you keep trying. That's what staying means.\"\n\n\"That's very optimistic for 9 PM.\"\n\n\"I'm an optimistic person.\"\n\n\"You're not. You're a realist who sometimes pretends to be optimistic.\"\n\n\"That's the same thing.\"\n\n\"It is now. I invented it. Now sleep. You have to open the Café tomorrow.\"", "choices": ["Notice the silence between them", "Focus on what is being said"]}, {"prose": "\"What if I dream about the interview?\"\n\n\"Then dream about getting the job. That's called manifesting. It's very trendy.\"\n\n\"You don't believe in manifesting.\"\n\n\"I believe in you. That's the same thing.\"\n\nThe Sofa was still lumpy. My back still hurt. But Matei was warm, and the pasta was in my stomach, and the apartment smelled like garlic and hope.\n\nThree days later, the email came.\n\nWir freuen uns, Ihnen mitteilen zu können, dass wir Sie für die Ausbildung zum Fachinformatiker ausgewählt haben.\n\n\"How do you know?\"\n\n\"Because you called. You only call when something happens.\"\n\n\"I got the Ausbildung.\"\n\n\"Aren't you going to say something?\"\n\n\"I bought champagne. It's in the fridge. It's been there for two weeks.\"\n\n\"You bought champagne before I got the answer?\"\n\n\"I'm optimistic. There's a Unterschied.\"\n\n\"No. But I was right. Now come home. We're celebrating.\"\n\n\"What if I had been rejected?\"\n\n\"Then we would have drunk the champagne anyway. To your courage. To trying. To staying.\"\n\n\"You're ridiculous.\"\n\n\"I'm in love. Same thing.\"\n\nI walked home. The stairs were siebenunddreißig steps. The Schlüssel stuck. The door opened.\n\nMatei was standing in the kitchen. Two glasses. Champagne. The good kind. The expensive kind. The kind he had bought with his book money.\n\n\"To staying,\" he said, handing me a glass.\n\n\"To staying,\" I said.\n\nIt was cold. Bubbly. Perfect.\n\nI hated that it was perfect.\n\nBut I didn't hate anything else.\n\ndie zweite Bewerbung the second application feminine\n\nder Fachinformatiker IT specialist masculine (review)\n\ndie Ausbildung apprenticeship feminine (review)\n\ndas Vorstellungsgespräch job interview neuter (review)\n\nder Lebenslauf CV/resume masculine (review)\n\nzuverlässig reliable adjective\n\nmotiviert motivated adjective\n\nbereit ready adjective (review)\n\ndie Erfahrung experience feminine\n\nder Kundenservice customer service masculine\n\ndie Firma company feminine\n\ndie Kollegin female colleague feminine\n\ndie Nervosität nervousness feminine\n\ndie Vorbereitung preparation feminine (review)\n\nder Erfolg success masculine (review)\n\ndie Freude joy feminine (review)\n\nder Champagner champagne masculine (review)\n\nFrom this chapter: \"You will get the job\" → Du wirst den Job bekommen.\n\nIn German, the future tense is formed with the present tense of werden (to become) + the infinitive of the main verb at the end of the sentence.\n\ner/sie/es wird he/she/it becomes/will\n\nihr werdet you (plural) become/will\n\nsie/Sie werden they/you (formal) become/will\n\nFuture tense formation: werden (conjugated) + infinitive (at the end)\n\nI will learn. Ich werde lernen.\n\nYou will succeed. Du wirst Erfolg haben.\n\nHe will stay. Er wird bleiben.\n\nExamples from this chapter (adapted):\n\nYou will get the job. Du wirst den Job bekommen.\n\nWe will celebrate. Wir werden feiern.\n\nIt will be perfect. Es wird perfekt sein.\n\nWhy this matters: In spoken German, the present tense is often used for the future (Ich mache das morgen — I'll do that tomorrow). But in written German and formal contexts, the werden + infinitive construction appears frequently. Recognizing it will help you understand when something is going to happen.\n\nTip from the method: Don't overthink it. When you see werde, wirst, wird, werden, werdet, look for the infinitive at the end of the sentence. That's the action that will happen.", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}], "gate": {"clue": "What is the German word for \"job interview (review)\"?", "answer": "vorstellungsgespraech", "hint": "das Vorstellungsgespraech"}, "vocab": [{"german": "die zweite", "english": "Bewerbung the second application"}, {"german": "der Fachinformatiker", "english": "IT specialist"}, {"german": "die Ausbildung", "english": "apprenticeship"}, {"german": "das Vorstellungsgespräch", "english": "job interview"}, {"german": "der Lebenslauf", "english": "CV/resume"}, {"german": "zuverlässig", "english": "reliable"}, {"german": "motiviert", "english": "motivated"}, {"german": "bereit", "english": "ready"}, {"german": "die Erfahrung", "english": "experience"}, {"german": "der Kundenservice", "english": "customer service"}, {"german": "das Büro", "english": "office"}, {"german": "die Firma", "english": "company"}, {"german": "der Chef", "english": "boss"}, {"german": "die Kollegin", "english": "female colleague"}, {"german": "die Nervosität", "english": "nervousness"}, {"german": "die Vorbereitung", "english": "preparation"}, {"german": "der Erfolg", "english": "success"}, {"german": "die Freude", "english": "joy"}, {"german": "der Champagner", "english": "champagne"}, {"german": "feiern", "english": "to celebrate"}, {"german": "das Sofa", "english": "sofa / couch"}, {"german": "gut", "english": "good"}, {"german": "der Morgen", "english": "morning"}, {"german": "bitte", "english": "please / here you go"}, {"german": "sich", "english": "(reflexive pronoun)"}, {"german": "der Schlüssel", "english": "key"}, {"german": "die Lampe", "english": "lamp"}, {"german": "die Heizung", "english": "radiator / heating"}, {"german": "perfekt", "english": "perfect"}, {"german": "Herr Köhler", "english": "Mr Köhler"}, {"german": "siebenunddreißig", "english": "thirty-seven"}, {"german": "für", "english": "for"}, {"german": "können", "english": "to be able to / can"}, {"german": "auswählen", "english": "to select"}, {"german": "auswählen", "english": "to select"}], "shadow": ["Interview preparation — say these aloud in a calm, professional voice:", "Guten Morgen, mein Name ist Yves. Ich habe einen Termin bei Herrn Koehler. — Good morning, my name is Yves. I have an appointment with Mr Koehler.", "Ich interessiere mich besonders fuer Cybersicherheit. — I am particularly interested in cybersecurity.", "In meiner bisherigen Erfahrung habe ich gelernt, dass... — In my previous experience I have learned that...", "Ich bin bereit, kontinuierlich zu lernen. — I am ready to keep learning continuously.", "Ich bin bereit is one of the first sentences in this book. It appears in Chapter One. It means something different now."]}, {"id": 21, "title": "Das Vorstellungsgespräch", "scenes": [{"prose": "Three days before the acceptance email. Three days before the champagne. Three days before Matei said \"I told you so\" with his eyes instead of his mouth.\n\nThe morning of the interview, I woke up before my Wecker.\n\nNot because I was ready. Because I had dreamed about servers. Angry servers. Servers that spoke German too fast and laughed when I didn't understand.\n\n\"You're sweating,\" Matei said. He was already awake. Already dressed. Already holding coffee.\n\n\"You're sweating. There's a Unterschied.\"\n\n\"No. Drink this.\"\n\nHe handed me the coffee. Black. No sugar. No milk. Perfect. I drank it. Burned my tongue. Didn't care.\n\n\"What if they ask me something I don't know?\"\n\n\"Then you say you don't know. And then you say you'll learn. That's what interviews are for.\"\n\n\"What if they ask me why I want to work in IT and I say 'because I like computers' and they say 'that's not a reason'?\"\n\n\"Then you say 'why not?' and stare at them until they feel uncomfortable.\"\n\n\"That's terrible advice.\"\n\n\"That's excellent advice. Confidence is 90% of interviews. The other 10% is not saying 'glass of cow.'\"\n\n\"I'm never going to live that down.\"\n\n\"No. Now put on your shirt. The one without the stain.\"\n\n\"All my shirts have stains.\"\n\n\"The one with the smallest stain.\"\n\nI wore the blue shirt. The one Frau Schmidt had said made me look \"professional but approachable.\" I didn't know what that meant. But it was clean. Mostly.\n\nMatei walked me to the U-Bahn.\n\n\"You don't have to come,\" I said.\n\n\"You have work.\"\n\n\"I called in late.\"\n\n\"You're going to get fired.\"\n\n\"I'm Romanian. We don't get fired. We just become more passive-aggressive until our bosses quit.\"\n\n\"That's not how employment works.\"\n\n\"It's how my employment works. Now go. Your train is coming.\"\n\nThe train arrived. I stepped on. The doors closed. Matei stood on the platform, hands in his pockets, watching me leave.\n\n\"Break a leg!\" he yelled through the glass.\n\n\"That's for actors!\" I yelled back.\n\n\"Then break a router!\"\n\nThe train pulled away. I watched him disappear.\n\nThe office was in Wedding.\n\nI had been there before. For the first interview. The one that led to nothing. The one where the interviewer had looked at my Lebenslauf and said \"interesting\" in a way that meant \"not interesting at all.\"\n\nThis time was different. New building. New people. New hope.\n\nThe receptionist smiled. \"Yves?\"\n\n\"They're ready for you. Down the hall, third door on the left.\"\n\nI walked down the hall. My shoes squeaked. The floor was shiny. The kind of shiny that made you feel like you were walking on water. I tried not to look down. I looked down.\n\nThe third door on the left was open.\n\nInside, three people sat at a table. Two men. One woman. The woman had a laptop. The older man had a beard. The younger man had a coffee stain on his shirt. I felt immediately better.\n\n\"Guten Morgen,\" I said.\n\n\"Guten Morgen, Herr Yves. Bitte, setzen Sie sich.\"\n\nI sat. The chair was comfortable. Not plastic. Not wooden. Something with padding that bounced when I shifted my weight. It felt like hope.\n\n\"Erzählen Sie uns etwas über sich,\" the woman said.\n\nTell us something about yourself.", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}, {"prose": "I had practiced this. Fifty times. With Matei. With Frau Schmidt. With Ada, who had called from across the city to wish me luck and remind me not to say anything stupid.\n\n\"Mein Name ist Yves. Ich komme aus Nigeria. Ich lebe seit vier Monaten in Berlin. Ich habe Erfahrung im Kundenservice — ich arbeite in einem Café — und ich interessiere mich für IT und Cybersecurity.\"\n\nThe woman nodded. The older man wrote something on his notepad. The younger man smiled.\n\n\"Ihr Deutsch ist gut,\" the woman said.\n\n\"Danke. Es wird besser. Jeden Tag.\"\n\nThank you. It's getting better. Every day.\n\n\"Warum möchten Sie eine Ausbildung in der IT machen?\"\n\nWhy do you want to do an IT apprenticeship?\n\nI thought about Matei. About the key. About the duck. About all the things I wanted to build.\n\n\"Weil ich etwas bauen möchte. Ein Leben. Eine Zukunft. Etwas, das mir gehört. Und ich brauche die Fähigkeiten dafür.\"\n\nBecause I want to build something. A life. A future. Something that belongs to me. And I need the skills for it.\n\nThe woman nodded again. The older man stopped writing. The younger man leaned forward.\n\n\"Haben Sie schon Erfahrung mit Programmierung?\" the younger man asked.\n\nDo you have any experience with programming?\n\n\"Ein bisschen. Ich habe online Kurse gemacht. HTML. CSS. Ein bisschen Python. Nicht viel. Aber ich lerne schnell.\"\n\nA little. I've done online courses. HTML. CSS. A little Python. Not much. But I learn fast.\n\n\"Weil es einfach ist. Am Anfang. Und weil mein Freund gesagt hat, dass es gut für Anfänger ist.\"\n\nBecause it's simple. At the beginning. And because my boyfriend said it's good for beginners.\n\nThe woman raised an eyebrow. The older man looked up. The younger man smiled wider.\n\n\"Ja. Er ist... sehr unterstützend. Auch wenn er zu viel korrigiert.\"\n\nYes. He's... very supportive. Even though he corrects too much.\n\nThey laughed. The older man's laugh was a wheeze. The younger man's laugh was a giggle. The woman's laugh was a smile.\n\n\"Das ist gut,\" the woman said. \"Unterstützung ist wichtig.\"\n\nThat's good. Support is important.\n\nThey asked about my Lebenslauf. About my time at the Café. About why I left Nigeria. About why I chose Berlin.\n\nI answered. Sometimes in complete sentences. Sometimes in fragments. Sometimes in German that made me cringe.\n\n\"Haben Sie Fragen an uns?\" the woman asked at the end.\n\nDo you have any questions for us?\n\n\"Ja. Wie ist die Arbeitskultur hier? Sind die Kollegen freundlich? Gibt es Kaffee?\"\n\nYes. What's the work culture like here? Are the colleagues friendly? Is there coffee?\n\nThe older man laughed again. The wheeze.\n\n\"Ja, es gibt Kaffee. Sehr viel Kaffee. Vielleicht zu viel.\"\n\nYes, there's coffee. A lot of coffee. Maybe too much.\n\n\"Das ist perfekt,\" I said. \"Ich bin süchtig.\"\n\nThat's perfect. I'm addicted.\n\nI stood up. Shook their hands. The woman's hand was warm. The older man's hand was rough. The younger man's hand had a coffee stain on the thumb.\n\n\"Wir melden uns in einer Woche,\" the woman said.\n\nWe'll contact you in a week.\n\n\"Vielen Dank für Ihre Zeit.\"\n\nI walked out. The receptionist smiled.\n\n\"I said 'I'm addicted to coffee.' I think it went okay.\"\n\n\"You said what?\"\n\n\"It's a long story. I'll write a book about it.\"\n\nThe duck was there. Paddling. Judging. Being a duck.", "choices": ["Notice the silence between them", "Focus on what is being said"]}, {"prose": "\"I think it went okay,\" I told him.\n\n\"That's not helpful.\"\n\n\"You're right. I should just wait. Waiting is the hard part.\"\n\nThe duck quacked a third time. I chose to interpret this as you're an idiot but I support you.\n\nI don't know. I said I'm addicted to coffee.\n\nHow does \"I'm addicted to coffee\" slip out?\n\nUnfortunately. Come home. I bought pastries.\n\nThe apricot ones. And I'm not hiding them.\n\nI'm always supportive. I'm Romanian.\n\nIt's not an excuse. It's an explanation.\n\nI walked home. The stairs were siebenunddreißig steps. The Schlüssel stuck. The door opened.\n\nMatei was in the kitchen. Not making coffee. Making pasta. My grandmother's recipe. The sauce was bubbling. The kitchen smelled like garlic and home.\n\n\"You're making pasta,\" I said.\n\n\"You had an interview. That's worth pasta.\"\n\n\"What if I don't get the job?\"\n\n\"Then you had an interview. That's still worth pasta.\"\n\n\"You're going to make pasta every time I do something scary?\"\n\n\"Yes. It's a new tradition. I invented it.\"\n\n\"You didn't invent pasta.\"\n\n\"I invented the tradition. There's a Unterschied.\"\n\nHe handed me a fork. I tasted the sauce. It was perfect. I hated that it was perfect.\n\n\"You're getting good at this.\"\n\n\"I'm getting good at a lot of things.\"\n\n\"Like being patient. Like not murdering you when you say weird things in interviews. Like staying.\"\n\n\"That's three things.\"\n\n\"I'm a complex person.\"\n\n\"You're a simple person who uses big words to seem complex.\"\n\n\"That's my line.\"\n\n\"I'm borrowing it.\"\n\n\"Help me wait. The next week is going to be terrible.\"\n\n\"I know. That's why I bought extra pastries.\"\n\n\"Enough for seven days. One for each day of waiting.\"\n\n\"That's very calculated.\"\n\n\"I'm a very calculated person. Now eat. You have a week of anxiety ahead of you. You'll need your strength.\"\n\nWe ate pasta. Drank wine. The cheap kind. The one that came in a box. Matei said it was \"vintage.\" I said it was \"box wine.\" He said \"same thing.\"\n\nAfter dinner, we sat on the Sofa. The Lampe buzzed. The Heizung clicked. The plant sat on the windowsill. Alive. Thriving. Judging.\n\n\"What if I don't get this job?\"\n\n\"Then you apply to another one.\"\n\n\"What if I don't get any job?\"\n\n\"Then you keep trying. That's what staying means.\"\n\n\"That's very optimistic for 9 PM.\"\n\n\"I'm an optimistic person.\"\n\n\"You're not. You're a realist who sometimes pretends to be optimistic.\"\n\n\"That's the same thing.\"", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}, {"prose": "\"It is now. I invented it. Now sleep. You have to open the Café tomorrow.\"\n\n\"What if I dream about the interview?\"\n\n\"Then dream about getting the job. That's called manifesting. It's very trendy.\"\n\n\"You don't believe in manifesting.\"\n\n\"I believe in you. That's the same thing.\"\n\nThe Sofa was lumpy. My back hurt. But Matei was warm, and the pasta was in my stomach, and the apartment smelled like garlic and hope.\n\nThree days later, the email came.\n\nBut that's another chapter.\n\ndas Vorstellungsgespräch job interview neuter (review)\n\nder Wecker alarm clock masculine (review)\n\ndie Erfahrung experience feminine (review)\n\nder Kundenservice customer service masculine (review)\n\ndie Cybersecurity cybersecurity feminine (loan)\n\ndie Programmierung programming feminine\n\nder Anfänger beginner masculine\n\nunterstützend supportive adjective\n\nkorrigieren to correct verb\n\ndie Arbeitskultur work culture feminine\n\nder Kollege colleague masculine\n\nsüchtig addicted adjective\n\ndie Tradition tradition feminine\n\ndie Angst fear feminine (review)\n\ndie Geduld patience feminine (review)\n\ndie Hoffnung hope feminine (review)\n\nFrom this chapter: \"Haben Sie Fragen an uns?\" (Do you have questions for us?) — using Sie (formal) instead of du (informal).\n\nIn German, formal vs. informal matters — especially in interviews.\n\n· With people you don't know\n\n· In professional settings (interviews, meetings, emails)\n\n· With authority figures (bosses, professors, police)\n\n· With people older than you (unless you're close)\n\nWhen to use du (informal):\n\n· With people your age in casual settings\n\nKey differences in verb conjugation:\n\nPronoun Verb (fragen) Example\n\ndu fragst Fragst du mich? (Are you asking me?)\n\nSie (formal) fragen Fragen Sie mich? (Are you asking me?)\n\nExamples from this chapter (adapted):\n\nEnglish German (formal) German (informal)\n\nDo you have questions? Haben Sie Fragen? Hast du Fragen?\n\nWhat is your name? Wie heißen Sie? Wie heißt du?\n\nWhere do you work? Wo arbeiten Sie? Wo arbeitest du?\n\nWhy this matters: Using the wrong form in an interview can make you seem disrespectful or overly familiar. Always use Sie until invited to use du. In the novel, Yues uses Sie with the interviewers (correct) and du with Matei, Ada, Frau Schmidt (familiar).\n\nTip from the method: When in doubt, use Sie. It's better to be too formal than not formal enough. The other person will tell you if you can switch to du.", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}], "gate": {"clue": "What is the German word for \"first day (review)\"?", "answer": "erste tag", "hint": "der erste Tag"}, "vocab": [{"german": "das Vorstellungsgespräch", "english": "job interview"}, {"german": "der Wecker", "english": "alarm clock"}, {"german": "die Erfahrung", "english": "experience"}, {"german": "der Kundenservice", "english": "customer service"}, {"german": "die Cybersecurity", "english": "cybersecurity"}, {"german": "die Programmierung", "english": "programming"}, {"german": "der Anfänger", "english": "beginner"}, {"german": "unterstützend", "english": "supportive"}, {"german": "korrigieren", "english": "to correct"}, {"german": "die Arbeitskultur", "english": "work culture"}, {"german": "der Kollege", "english": "colleague"}, {"german": "süchtig", "english": "addicted"}, {"german": "die Tradition", "english": "tradition"}, {"german": "die Angst", "english": "fear"}, {"german": "das Warten", "english": "waiting"}, {"german": "die Geduld", "english": "patience"}, {"german": "die Hoffnung", "english": "hope"}, {"german": "gut", "english": "good"}, {"german": "der Morgen", "english": "morning"}, {"german": "bitte", "english": "please / here you go"}, {"german": "sich", "english": "(reflexive pronoun)"}, {"german": "danke", "english": "thank you"}, {"german": "warum", "english": "why"}, {"german": "weil", "english": "because"}, {"german": "aber", "english": "but"}, {"german": "einfach", "english": "simple / just"}, {"german": "sehr", "english": "very"}, {"german": "auch", "english": "also / too"}, {"german": "wenn", "english": "when / if"}, {"german": "die Frage", "english": "question"}, {"german": "vielleicht", "english": "maybe / perhaps"}, {"german": "perfekt", "english": "perfect"}, {"german": "der Schlüssel", "english": "key"}, {"german": "das Sofa", "english": "sofa / couch"}, {"german": "die Lampe", "english": "lamp"}, {"german": "die Heizung", "english": "radiator / heating"}, {"german": "erzählen", "english": "to tell / narrate"}, {"german": "über", "english": "over / about"}, {"german": "für", "english": "for"}, {"german": "möchten", "english": "would like to"}, {"german": "möchten", "english": "would like to"}, {"german": "gehören", "english": "to belong"}, {"german": "die Fähigkeit", "english": "skill / ability"}, {"german": "dafür", "english": "for it / in favour of"}, {"german": "die Unterstützung", "english": "support"}, {"german": "siebenunddreißig", "english": "thirty-seven"}, {"german": "heißen", "english": "to be called"}, {"german": "heißen", "english": "to be called"}, {"german": "möchten", "english": "would like to"}, {"german": "gehören", "english": "to belong"}, {"german": "die Fähigkeit", "english": "skill / ability"}, {"german": "heißen", "english": "to be called"}], "shadow": ["Interview closing — say this aloud clearly and warmly:", "Vielen Dank fuer das Gespraech. Es hat mir sehr gut gefallen. — Thank you very much for the conversation. I enjoyed it very much.", "Ich freue mich auf die Zusammenarbeit. — I look forward to working together.", "Wann kann ich mit einer Rueckmeldung rechnen? — When can I expect to hear back?", "Wann kann ich mit einer Rueckmeldung rechnen is professional, not impatient. It shows you are organised. Use it at the end of every interview.", "---", "Review — Part Three: The Ausbildung (Chapters 15-21)", "Part Three is done. Yves has applied, been rejected, applied again, and been accepted. The Ausbildung is real. So is the German.", "What You Have Learned", "Technical vocabulary now in your active range: der Fachinformatiker, die Systemintegration, die Anwendungsentwicklung, konfigurieren, das Betriebssystem, die Firewall, das Netzwerk, analysieren, die Dokumentation.", "Formal register: Bewerbung structure, email openings and closings, interview vocabulary, contract language.", "Grammar: Konjunktiv II appearing in formal requests (Koennten Sie bitte...), passive voice in instructions (wird neu gestartet — is being restarted), infinitive constructions with zu.", "IT Production Challenge", "Write a short formal email in German — six sentences maximum — to your Ausbilder. Subject: you need clarification on an assigned task. Use the templates from Chapters 11 and 16. Use Sie throughout.", "This is a real task. In your Ausbildung, you will write this email. Write it now.", "Technical Vocabulary Self-Test", "Translate without help:", "1. Das Betriebssystem muss aktualisiert werden.", "2. Ich habe das Problem in der Dokumentation beschrieben.", "3. Die Firewall blockiert unbekannte Verbindungen.", "4. Koennen Sie die Konfiguration ueberpruefen?", "5. Ich habe das Ticket dem zustaendigen Kollegen weitergeleitet.", "Translations: 1. The operating system needs to be updated. 2. I have described the problem in the documentation. 3. The firewall blocks unknown connections. 4. Can you check the configuration? 5. I forwarded the ticket to the responsible colleague.", "If sentences 3-5 were manageable, your IT German is functional. If not, re-read Chapters 18 and 22's shadowing scripts.", "Story Recall", "From memory: What did the Ausbilder's feedback reveal about Yves's first weeks? What did Andreea and Matei's reconciliation require? What does Matei propose, and when?", "You don't need to answer perfectly. Recall is the goal. The effort of trying to remember is what makes the memory stick.", "Part Four is 85-95% German. You are living in the language now. Keep going.", "---"]}, {"id": 22, "title": "Der erste Tag", "scenes": [{"prose": "The first day of the Ausbildung arrived like a Zug — fast, loud, and slightly terrifying.\n\nI had slept maybe three hours. The rest of the night I spent staring at the ceiling, running through German IT vocabulary in my head. Der Server. Die Firewall. Das Passwort. Die Hölle von Excel-Tabellen.\n\n\"You're thinking too loud,\" Matei murmured.\n\n\"I'm practicing.\"\n\n\"The early bird gets the Ausbildung.\"\n\n\"The early bird gets stepped on by people who slept.\"\n\n\"That's not motivational.\"\n\n\"I'm not motivational. I'm tired. There's a Unterschied.\"\n\n\"No. Now go back to sleep.\"\n\nI didn't sleep. But I lay there, listening to him breathe, and tried not to think about all the ways I could embarrass myself.\n\nI made coffee. Black. No sugar. No milk. I made coffee for Matei too. Left it on the table. Wrote a note: Don't burn the milk. There is no milk. Don't burn the coffee.\n\n\"That's not funny,\" he said, walking into the kitchen. His hair was a mess. His eyes were half-closed. He was wearing the shirt that said I'm silently judging you in German.\n\n\"It's a little funny.\"\n\n\"It's 6 AM. Nothing is funny at 6 AM.\"\n\n\"That's not true. I'm funny at 6 AM.\"\n\n\"You're loud at 6 AM. There's a Unterschied.\"\n\nHe drank his coffee. Made a face. The face that said this is terrible but I love you anyway.\n\n\"You're nervous,\" he said.\n\n\"Good. Terror means you care.\"\n\n\"Or it means I'm going to throw up on my first day.\"\n\n\"Then throw up. And then keep going. That's what staying means.\"\n\n\"You're very philosophical for 6 AM.\"\n\n\"I'm a very philosophical person. Now eat something. You can't learn IT on an empty stomach.\"\n\n\"What should I eat?\"\n\n\"Pastries. The apricot ones. I hid them in the freezer.\"\n\n\"Behind the frozen peas. You would have found them eventually.\"\n\n\"You know me so well.\"\n\n\"I know you too well. It's a curse.\"\n\nI ate three pastries. Drank two coffees. Brushed my teeth twice. Checked my bag four times. Laptop? Yes. Notebook? Yes. Pen? Yes. Spare pen? Yes. Spare spare pen? Yes.\n\n\"You have five pens,\" Matei said.\n\n\"What if one runs out?\"\n\n\"Pens don't run out that fast.\"\n\n\"What if four run out?\"\n\n\"Then you have a backup for the backup for the backup for the backup.\"\n\n\"That's called planning.\"\n\n\"That's called paranoia. Same thing.\"\n\nHe walked me to the U-Bahn. The station was crowded. People in suits. People with coffee. People who looked like they knew what they were doing. I was none of those people.\n\n\"You're going to be fine,\" Matei said.\n\n\"You don't know that.\"\n\n\"I know you. That's enough.\"\n\n\"What if they ask me to do something I don't know how to do?\"\n\n\"Then you ask for help. That's what the Ausbildung is for.\"\n\n\"What if they think I'm stupid?\"\n\n\"Then they're wrong. And I will write them a strongly worded letter. In Romanian. They won't understand it. But they'll know they're being judged.\"\n\n\"You've used that line before.\"\n\n\"It's a good line.\"\n\n\"It's an okay line.\"\n\n\"You liked it the first time.\"\n\n\"I was being polite.\"\n\n\"You're never polite.\"\n\n\"I'm always polite. I'm Nigerian.\"\n\n\"That's not a thing.\"\n\n\"It is now. I invented it.\"\n\nHe kissed my forehead. Right there on the platform. In front of strangers. In front of a woman who smiled and a man who looked away and a child who said \"Mama, warum küssen die sich?\" and the mother said \"Weiß nicht, schatz, frag später.\"\n\n\"Your train is coming,\" Matei said.\n\nI didn't go. The train arrived. The doors opened. People got on. People got off. I stood there.\n\nThe Betrieb was in Wedding.\n\nThe same neighborhood as the interview. Different building. Bigger. Greyer. The sign on the door said SecureNet Systems in the same font that wasn't Garamond. I walked in.", "choices": ["Notice the silence between them", "Focus on what is being said"]}, {"prose": "The receptionist was the same woman from the interview. She smiled.\n\n\"Guten Morgen, Yves. Nervös?\"\n\n\"Das ist normal. Komm, ich zeige dir den Weg.\"\n\nShe walked me down a hallway. Past offices. Past a kitchen that smelled like old coffee. Past a room full of servers that hummed like angry bees.\n\n\"Das ist dein Platz,\" she said.\n\nA desk. A computer. A chair that looked comfortable. A nameplate that said Yves — Azubi. I stared at it.\n\n\"That's my name,\" I said.\n\n\"Yes. You're expected to sit there.\"\n\n\"Three years. Maybe more if you're slow.\"\n\n\"That's not funny.\"\n\n\"I'm not funny. I'm practical. There's a Unterschied.\"\n\nShe left. I sat down. The chair was comfortable. The computer was on. The screen was blank. The keyboard was covered in dust.\n\n\"You must be the new Azubi.\"\n\nI turned. A man stood in the doorway. Late thirties. Bald. Glasses. A coffee mug that said I survived another meeting that could have been an email. His nameplate said Herr Weber — Ausbilder.\n\n\"Yes. I'm Yves.\"\n\n\"I know. I read your Bewerbung. You're the one who said 'I make good pasta.'\"\n\n\"That's not a qualification.\"\n\n\"It should be. I love pasta.\"\n\nHe sat on the edge of my desk. His coffee mug was almost empty. He didn't seem to notice.\n\n\"First day. You're nervous.\"\n\n\"Good. Nervous means you care. Scared means you're paying attention. There's a Unterschied.\"\n\n\"No. But you'll learn. That's what the Ausbildung is for.\"\n\nThe first hour was paperwork.\n\nForms. Lots of forms. Forms in German. Forms in legal German. The kind of German that made my eyes cross and my soul leave my body.\n\n\"This is terrible,\" I said.\n\n\"This is bureaucracy,\" Herr Weber said. \"Same thing.\"\n\n\"How do people do this?\"\n\n\"They complain. Then they sign. Then they forget. That's the circle of life.\"\n\n\"Sign here. And here. And here. And then initial here. And here. And here. And then write your name again. And then again. And then again.\"\n\n\"Why so many times?\"\n\n\"Because Germany loves paperwork. It's our national sport.\"\n\n\"I thought football was the national sport.\"\n\n\"Football is for amateurs. Paperwork is for professionals.\"\n\nI signed. And initialed. And wrote my name. And signed again. By the end, my hand hurt. My brain hurt. My soul hurt.\n\n\"Congratulations,\" Herr Weber said. \"You're officially an Azubi.\"\n\n\"That's it. Now the real work begins.\"\n\nThe real work was... slow.\n\nHerr Weber showed me the server room. The servers were loud. They blinked. They hummed. They looked important.\n\n\"This is the heart of the company,\" he said.\n\n\"It looks like a washing machine.\"\n\n\"It's a server. Washing machines are for clothes. Servers are for data. There's a Unterschied.\"\n\n\"They sound the same.\"\n\n\"They don't. Washing machines are quieter. And they have more spin cycles.\"\n\n\"You know a lot about washing machines.\"\n\n\"I'm an IT guy. We know everything about everything. It's in the contract.\"\n\n\"There's a contract?\"\n\n\"There's always a contract. You just signed it.\"\n\nHe showed me the network setup. The firewalls. The backup systems. The emergency protocols. I understood maybe 30%. The rest was noise.\n\n\"You'll learn,\" he said.\n\n\"What if I don't?\"\n\n\"Then you'll be fired. And you'll have to find another Ausbildung. And you'll start over. And you'll learn then.\"\n\n\"That's not encouraging.\"\n\n\"I'm not encouraging. I'm honest. There's a Unterschied.\"\n\n\"Everyone keeps saying that.\"\n\n\"Because it keeps being true.\"\n\nAt noon, the other Azubi found me.\n\nHer name was Mira. She was in her second year. She had purple hair and a nose ring and a tattoo of a raccoon on her forearm.\n\n\"You're the new one,\" she said.", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}, {"prose": "\"I'm the new one.\"\n\n\"You look lost.\"\n\n\"Good. Being lost is the first step to being found. Or whatever. I saw that on a poster once.\"\n\n\"That's not helpful.\"\n\n\"I'm not helpful. I'm funny. There's a Unterschied.\"\n\n\"No. But I brought coffee. The good kind. From the bakery around the corner.\"\n\nShe handed me a cup. I took a sip. It was good. Really good. Better than Frau Schmidt's. Better than the bookstore's. Better than anything I had tasted in weeks.\n\n\"This is amazing.\"\n\n\"I know. That's why I'm the favorite Azubi.\"\n\n\"I thought Herr Weber didn't have favorites.\"\n\n\"He doesn't. But I bring him coffee every morning. So I'm his favorite. It's called strategy.\"\n\n\"That's bribery.\"\n\n\"That's networking. Same thing.\"\n\nWe ate lunch together in the break room.\n\nMira asked questions. Where was I from? Nigeria. How long had I been in Berlin? Four months. Did I have a boyfriend? Yes. Was he cute? Yes. Was he annoying? Very. Did he make coffee? Yes. Was it good? No. Did I tell him that? No. Why not? Because he would cry.\n\n\"Men are dramatic,\" Mira said.\n\n\"Especially German men.\"\n\n\"He's Romanian.\"\n\n\"Even worse. Eastern Europeans are the most dramatic. It's the history.\"\n\n\"It's science. I read it somewhere.\"\n\n\"You don't know that. I could have.\"\n\nShe was chaotic. Loud. Unfiltered. I liked her immediately.\n\nThe afternoon was more training.\n\nHerr Weber showed me how to configure a firewall. I watched. I took notes. I understood maybe 40%.\n\n\"You're taking too many notes,\" he said.\n\n\"I want to remember.\"\n\n\"You won't remember. You'll forget. And then you'll ask me again. And I'll explain again. And then you'll forget again. And then you'll ask again. That's how learning works.\"\n\n\"That's inefficient.\"\n\n\"That's human. There's a Unterschied.\"\n\n\"No. But you'll remember the third time. Maybe the fourth.\"\n\nI packed my bag. Checked for my phone. Checked for my keys. Checked for my wallet. Checked for my sanity. It was missing.\n\n\"First day done,\" Mira said. \"How do you feel?\"\n\n\"Like I ran a marathon. In German.\"\n\n\"That's normal. It gets easier.\"\n\n\"In about two years.\"\n\n\"That's not soon.\"\n\n\"That's soon enough. Now go home. Your boyfriend is probably waiting.\"\n\n\"How do you know?\"\n\n\"Because you checked your phone seventeen times today. I counted.\"\n\n\"That's creepy.\"\n\n\"That's observant. Same thing.\"\n\nI walked to the U-Bahn. The train was crowded. I stood in the corner. Stared out the window. Thought about servers and firewalls and the nameplate that said Yves — Azubi.\n\nTerrible. I understood maybe 30%.\n\nIt's not 0%. Tomorrow it will be 35%. That's progress.\n\nThat's not how math works.\n\nIt's how my math works. Come home. I bought pastries.\n\nThe apricot ones. And I didn't hide them. You deserve them.\n\nI'm always supportive. I'm Romanian.\n\nIt's not an excuse. It's an explanation.\n\nI walked home. The stairs were siebenunddreißig steps. The Schlüssel stuck. The door opened.\n\nMatei was on the Sofa. Not reading. Waiting.\n\n\"You're home,\" he said.\n\n\"How was it really?\"\n\n\"Hard. Confusing. Exhausting. Also, there's a woman with purple hair who brings coffee and has a raccoon tattoo.\"\n\n\"That's specific.\"\n\n\"Her name is Mira. She's my new favorite person.\"\n\n\"I thought I was your favorite person.\"\n\n\"You're my favorite Romanian. There's a Unterschied.\"", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}, {"prose": "\"No. But Mira brings better coffee than you.\"\n\n\"I'll work on it.\"\n\nHe handed me a pastry. I ate it. Then another. Then another.\n\n\"You're eating all of them,\" he said.\n\n\"I earned them.\"\n\n\"You earned three pastries?\"\n\n\"I earned a bakery. But I'll settle for three.\"\n\n\"You're impossible.\"\n\n\"Unfortunately.\"\n\nHe kissed me. Pastry crumbs and all.\n\n\"You're going to be good at this,\" he said.\n\n\"You don't know that.\"\n\n\"I know you. That's enough.\"\n\nAfter dinner, we sat on the Sofa. The Lampe buzzed. The Heizung clicked. The plant sat on the windowsill. Alive. Thriving. Judging.\n\n\"For not letting me give up.\"\n\n\"You didn't give up. You started. That's harder.\"\n\n\"That's not true.\"\n\n\"It is. Starting is the hardest part. Everything else is just continuing.\"\n\n\"That's very philosophical for 8 PM.\"\n\n\"I'm a very philosophical person. Now eat another pastry. You have day two tomorrow.\"\n\n\"What if day two is worse?\"\n\n\"Then day three will be better. That's how patterns work.\"\n\n\"Eat the pastry, Yves.\"\n\nI hated that it was perfect.\n\nBut I didn't hate anything else.\n\ndie Ausbildung apprenticeship feminine (review)\n\ndie Firewall firewall feminine (loan)\n\nder Azubi trainee/apprentice masculine (slang)\n\nder Ausbilder trainer/supervisor masculine\n\ndie Bewerbung application feminine (review)\n\ndie Bürokratie bureaucracy feminine\n\nder Server server masculine (review)\n\ndas Netzwerk network neuter\n\nder Kollege colleague masculine (review)\n\nkonfigurieren to configure verb\n\nder Marathon marathon masculine\n\ndie Panik panic feminine (review)\n\ndie Erfahrung experience feminine (review)\n\ndie Hoffnung hope feminine (review)\n\ndie Tradition tradition feminine (review)\n\nder Fortschritt progress masculine\n\nFrom this chapter: Not explicitly, but let's solidify the pattern you've been seeing throughout the novel.\n\nCommon separable prefixes:\n\nan- ankommen, anrufen to arrive, to call\n\nauf- aufwachen, aufräumen to wake up, to clean up\n\naus- auspacken, ausgehen to unpack, to go out\n\nbei- beibringen, beisteuern to teach, to contribute\n\nein- einkaufen, einladen to shop, to invite\n\nmit- mitkommen, mitnehmen to come along, to take along\n\nnach- nachdenken, nachfragen to think, to ask\n\nvor- vorbereiten, vorstellen to prepare, to introduce\n\nzu- zumachen, zuhören to close, to listen\n\nweg- weggehen, wegwerfen to go away, to throw away\n\nzurück- zurückkommen, zurückgeben to come back, to give back\n\nKey pattern: In present and simple past, the prefix goes to the end. In perfect tense, the ge- goes between the prefix and the stem: aufgepasst, mitgenommen, zurückgekommen.\n\nExample from this chapter (implied): Ich komme nach Hause (I come home) → prefix nach goes to the end? No, nach Hause is a fixed phrase. But mitkommen — Kommst du mit? (Are you coming along?) — prefix mit at the end.\n\nWhy this matters: Recognizing separable verbs helps you guess meaning. Kommen = to come. Mitkommen = to come along (with). Zurückkommen = to come back. Ankommen = to arrive (come toward). Your brain will start predicting the prefix.", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}], "gate": {"clue": "What is the German word for \"vocational school\"?", "answer": "berufsschule", "hint": "die Berufsschule"}, "vocab": [{"german": "die Ausbildung", "english": "apprenticeship"}, {"german": "der Zug", "english": "train"}, {"german": "die Firewall", "english": "firewall"}, {"german": "der Azubi", "english": "trainee/apprentice"}, {"german": "der Ausbilder", "english": "trainer/supervisor"}, {"german": "die Bewerbung", "english": "application"}, {"german": "die Bürokratie", "english": "bureaucracy"}, {"german": "der Server", "english": "server"}, {"german": "das Netzwerk", "english": "network"}, {"german": "der Kollege", "english": "colleague"}, {"german": "die Pause", "english": "break"}, {"german": "konfigurieren", "english": "to configure"}, {"german": "der Marathon", "english": "marathon"}, {"german": "die Panik", "english": "panic"}, {"german": "die Erfahrung", "english": "experience"}, {"german": "die Hoffnung", "english": "hope"}, {"german": "die Tradition", "english": "tradition"}, {"german": "der Fortschritt", "english": "progress"}, {"german": "warum", "english": "why"}, {"german": "sich", "english": "(reflexive pronoun)"}, {"german": "gut", "english": "good"}, {"german": "der Morgen", "english": "morning"}, {"german": "nervös", "english": "nervous"}, {"german": "der Schlüssel", "english": "key"}, {"german": "das Sofa", "english": "sofa / couch"}, {"german": "die Lampe", "english": "lamp"}, {"german": "die Heizung", "english": "radiator / heating"}, {"german": "die Hölle", "english": "hell"}, {"german": "küssen", "english": "to kiss"}, {"german": "wissen", "english": "to know"}, {"german": "später", "english": "later"}, {"german": "siebenunddreißig", "english": "thirty-seven"}, {"german": "aufräumen", "english": "to tidy up"}, {"german": "zuhören", "english": "to listen"}, {"german": "zurück", "english": "back"}, {"german": "zurückkommen", "english": "to come back"}, {"german": "zurückgeben", "english": "to give back"}, {"german": "zurückkommen", "english": "to come back"}, {"german": "wissen / weiß", "english": "to know / white"}, {"german": "zurückkommen", "english": "to come back"}], "shadow": ["Ausbildung contract vocabulary — read and understand, then say aloud:", "Der Ausbildungsvertrag wird hiermit unterzeichnet. — The training contract is hereby signed.", "Die Probezeit betraegt drei Monate. — The probationary period is three months.", "Das Ausbildungsverhaeltnis beginnt am [Datum]. — The training relationship begins on [date].", "Bei Fragen wenden Sie sich bitte an Ihre Ausbilderin. — For questions, please contact your trainer.", "Diese Saetze (these sentences) are the language of German official documents. They sound formal because they are formal. Learning to read them is part of the Ausbildung."]}, {"id": 23, "title": "Die Berufsschule", "scenes": [{"prose": "Die Berufsschule begann am Montag.\n\nZwei Wochen nach meinem ersten Tag im Betrieb. Zwei Wochen voller neuer Wörter, neuer Gesichter, neuer Fehler. Ich hatte schon drei Firewalls falsch konfiguriert, zwei Kaffee über die Tastatur gekippt und einmal versehentlich den Drucker ausgeschaltet. Mira sagte, das sei ein Rekord.\n\n\"Du bist ein Naturtalent,\" sagte sie.\n\n\"Das ist kein Kompliment.\"\n\n\"Es ist eins von mir. Das ist dasselbe.\"\n\nDie Berufsschule war ein altes Gebäude in Neukölln. Gelbe Fassade. Kaputte Fenster. Ein Fahrstuhl, der seit 1998 nicht mehr funktionierte. Ich musste vier Stockwerke hochlaufen. Jeden Tag. Meine Beine schmerzten.\n\n\"Du wirst dich daran gewöhnen,\" sagte Herr Weber am ersten Tag.\n\n\"Das bezweifle ich.\"\n\n\"Zweifel ist der erste Schritt zur Akzeptanz. Oder so. Ich weiß nicht. Ich bin ITler, kein Philosoph.\"\n\n\"Sie haben letzte Woche gesagt, Sie sind ein Philosoph.\"\n\n\"Ich habe gelogen. Das machen ITler manchmal. Gewöhn dich dran.\"\n\nDie Klasse war klein. Zwölf Auszubildende. Alle zwischen achtzehn und dreißig. Alle mit demselben Ausdruck im Gesicht: Ich habe keine Ahnung, was ich hier mache.\n\nDer Lehrer hieß Herr Dr. Schmidt. Nicht verwandt mit Frau Schmidt. Ich fragte trotzdem.\n\n\"Sind Sie mit Frau Schmidt verwandt?\"\n\n\"Wer ist Frau Schmidt?\"\n\n\"Meine Chefin. Vom Café.\"\n\n\"Ich trinke keinen Kaffee.\"\n\n\"Das ist nicht normal.\"\n\n\"Ich bin nicht normal. Ich bin Lehrer. Das ist dasselbe.\"\n\nEr hatte eine Glatze und einen Bart und eine Brille, die immer schief saß. Er sprach sehr schnell. Sehr deutsch. Sehr ich-wiederhole-mich-nicht-weil-ihr-aufpassen-solltet.\n\n\"Ihr Deutsch ist nicht gut genug,\" sagte er zu mir nach der ersten Stunde.\n\n\"Aber es wird besser. Lesen Sie mehr. Sprechen Sie mehr. Hören Sie mehr. Und hören Sie auf, 'glass of cow' zu sagen.\"\n\n\"Woher wissen Sie das?\"\n\n\"Ihr Ausbilder hat es mir erzählt. Herr Weber liebt diese Geschichte.\"\n\n\"Ich werde ihn töten.\"\n\n\"Das ist illegal. Aber ich verstehe den Impuls.\"\n\nMeine Sitznachbarin hieß Fatima.\n\nSie war im zweiten Lehrjahr. Sie hatte schwarze Locken und einen silbernen Ring in der Nase und trug immer denselben Pullover mit einem Loch am Ärmel.\n\n\"Du bist der Nigerianer,\" sagte sie am ersten Tag.\n\n\"Ich bin Fatima. Ich mag keinen Kaffee. Ich mag Tee. Grünen Tee. Mit Ingwer. Wenn du mir Tee bringst, helfe ich dir mit den Hausaufgaben.\"\n\n\"Das ist Bestechung.\"\n\n\"Das ist Networking. Dasselbe.\"\n\n\"Du klingst wie meine Kollegin Mira.\"\n\n\"Mira ist meine Cousine.\"\n\n\"Ihr seid verwandt?\"\n\n\"Ja. Und wir sind beide chaotisch. Gewöhn dich dran.\"\n\nDie erste Woche war die Hölle.\n\nDer Unterricht war auf Deutsch. Alles auf Deutsch. Die Lehrer sprachen zu schnell. Die anderen Schüler verstanden mehr als ich. Ich saß hinten in der Klasse und schrieb Wörter auf, die ich nicht kannte. Am Ende jeder Stunde hatte ich eine Liste mit dreißig neuen Vokabeln. Jeden Abend lernte ich sie mit Matei.\n\n\"Das Wort für 'firewall' ist 'Firewall',\" sagte Matei.\n\n\"Das ist zu einfach.\"\n\n\"Manchmal ist Deutsch einfach. Das ist der Fehler.\"\n\n\"Das ist nicht lustig.\"\n\n**\"Ich bin nicht lustig. Ich bin hilfreich. Dasselbe.\"\n\nEr saß mit mir am Küchentisch. Die Lampe brannte. Die Heizung klickte. Matei Jr. stand auf dem Fensterbrett. Lebendig. Überlebendig. Urteilend.\n\n\"Du lernst schneller als ich dachte,\" sagte Matei.\n\n\"Ich lerne nicht schnell. Ich lerne verzweifelt. Das ist ein Unterschied.\"\n\n\"Gibt es einen?\"\n\n\"Nein. Aber ich habe keine Wahl.\"\n\nAm fünften Tag passierte etwas Komisches.\n\nIch saß im Unterricht. Herr Dr. Schmidt erklärte etwas über Netzwerke. Ich verstand plötzlich jedes Wort. Nicht alle. Aber viele. Genug, um zu wissen, worum es ging.", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}, {"prose": "\"Haben Sie eine Frage, Herr Yves?\" fragte er.\n\n\"Ja. Warum ist das so einfach?\"\n\nDie Klasse lachte. Fatima lachte am lautesten.\n\n\"Das ist nicht einfach,\" sagte Herr Dr. Schmidt. \"Sie lernen nur schneller als Sie denken.\"\n\n\"Das fühlt sich nicht so an.\"\n\n\"Lernen fühlt sich nie gut an. Wenn es sich gut anfühlt, lernen Sie nichts Neues.\"\n\n\"Das ist deprimierend.\"\n\n\"Das ist ehrlich. Dasselbe.\"\n\nIn der Pause sprach ich mit Fatima.\n\n\"Du verstehst mehr als letzte Woche,\" sagte sie.\n\n\"Das ist gut. In einem Monat verstehst du mehr. In einem Jahr verstehst du fast alles. In zwei Jahren beschwerst du dich über die Kaffeemaschine wie ein echter Deutscher.\"\n\n\"Das ist das Ziel?\"\n\n\"Das ist immer das Ziel.\"\n\nSie gab mir einen grünen Tee. Mit Ingwer. Er war ekelhaft. Ich trank ihn trotzdem.\n\n\"Du bist seltsam,\" sagte sie.\n\n\"Ich bin Nigerianer. Dasselbe.\"\n\n\"Das ist rassistisch.\"\n\n\"Das ist lustig. Dasselbe.\"\n\nAm Ende der zweiten Woche hatte ich meinen ersten Test.\n\nHerr Dr. Schmidt gab uns vierzig Minuten. Fünf Seiten. Zwanzig Fragen. Die Hälfte der Wörter kannte ich nicht.\n\nIch schrieb auf Deutsch. Schlechtes Deutsch. Deutsch mit Fehlern. Aber Deutsch.\n\n\"Sie haben bestanden,\" sagte Herr Dr. Schmidt am nächsten Tag.\n\n\"Mit welcher Note?\"\n\n\"Das ist die schlechteste Note.\"\n\n\"Das ist die niedrigste Bestehensnote. Das ist ein Unterschied.\"\n\n\"Gibt es einen?\"\n\n\"Nein. Aber Sie haben bestanden. Feiern Sie. Aber nicht zu viel. Die nächste Prüfung ist schwerer.\"\n\nPasta. Wein. Die schlechte Sorte. Die aus dem Karton.\n\n\"Du hast bestanden,\" sagte er.\n\n\"Mit vier minus.\"\n\n\"Das ist eine Eins in Nigeria.\"\n\n\"Das ist nicht wahr.\"\n\n\"Das ist jetzt wahr. Ich habe es erfunden.\"\n\n\"Du erfindest zu viel.\"\n\n\"Ich erfinde genau richtig. Jetzt iss deine Pasta. Du hast sie verdient.\"\n\nDie Pasta war gut. Nicht perfekt. Aber gut. Genug.\n\n\"Danke. Für das Lernen. Für die Geduld. Für die Ingwer-Tee-Toleranz.\"\n\n\"Ingwer-Tee ist ekelhaft.\"\n\n\"Ich weiß. Deshalb habe ich ihn getrunken. Aus Solidarität.\"\n\n\"Du bist seltsam.\"\n\n\"Ich bin verliebt. Dasselbe.\"\n\nIn der dritten Woche lernte ich Fatimas Freund kennen.\n\nEr hieß Kofi. Auch Nigerianer. Auch Azubi. Auch verwirrt.\n\n\"Du bist auch Nigerianer?\" fragte ich.\n\n\"Ja. Aber ich komme aus Ghana.\"\n\n\"Das ist nicht dasselbe.\"\n\n\"Für Deutsche schon. Für uns auch. Ein bisschen.\"\n\nWir sprachen über Lagos. Über Berlin. Über die Ausbildung. Über die Schwierigkeit, Deutsch zu lernen, wenn alle um einen herum perfekt sprechen.\n\n\"Es wird besser,\" sagte Kofi.\n\n\"Jetzt. Ein bisschen. Jeden Tag ein bisschen.\"", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}, {"prose": "\"Das ist sehr optimistisch.\"\n\n\"Ich bin Ghanaer. Optimismus ist unsere Nationalität.\"\n\n\"Das ist nicht wahr.\"\n\n\"Das ist jetzt wahr. Ich habe es erfunden.\"\n\n\"Ihr erfindet zu viel.\"\n\n\"Wir erfinden genau richtig. Jetzt komm. Ich zeige dir den besten Döner in Neukölln.\"\n\nDer beste, den ich seit Monaten gegessen hatte. Vielleicht seit Lagos. Vielleicht seit immer.\n\n\"Du siehst glücklich aus,\" sagte Kofi.\n\n\"Ich bin glücklich. Überraschend.\"\n\n\"Das ist die Ausbildung. Sie macht dich kaputt und dann wieder ganz.\"\n\n\"Das ist nicht wissenschaftlich.\"\n\n\"Das ist Erfahrung. Dasselbe.\"\n\nWir aßen. Wir redeten. Wir lachten.\n\nAm Ende des Tages hatte ich einen neuen Freund. Und einen vollen Magen. Und ein bisschen weniger Angst vor der Berufsschule.\n\n\"Du riechst nach Döner,\" sagte er.\n\n\"Ich war mit Kofi essen.\"\n\n\"Ein Ghanaer. Auch Azubi. Auch verwirrt.\"\n\n\"Du hast einen neuen Freund?\"\n\n\"Ja. Ist das okay?\"\n\n\"Natürlich. Ich bin nicht eifersüchtig.\"\n\n\"Du bist ein bisschen eifersüchtig.\"\n\n\"Ich bin ein bisschen eifersüchtig. Das ist ein Unterschied.\"\n\n\"Gibt es einen?\"\n\n\"Nein. Aber ich arbeite daran.\"\n\nEr küsste mich. Döner-Geschmack und alles.\n\n\"Du liebst mich.\"\n\nDie Berufsschule wurde einfacher.\n\nNicht leicht. Aber einfacher. Ich verstand mehr. Ich sprach mehr. Ich machte weniger Fehler. Aber immer noch viele.\n\n\"Du machst Fortschritte,\" sagte Fatima.\n\n\"Fühlt sich nicht so an.\"\n\n\"Fortschritt fühlt sich nie gut an. Nur Rückblick fühlt sich gut an. In einem Jahr wirst du zurückblicken und lachen.\"\n\n\"Oder beides. Dasselbe.\"\n\nSie gab mir einen weiteren grünen Tee. Ich trank ihn. Er war immer noch ekelhaft.\n\n\"Du gewöhnst dich daran,\" sagte sie.\n\n\"Das bezweifle ich.\"\n\n\"Zweifel ist der erste Schritt zur Gewöhnung. Oder so. Ich weiß nicht. Ich bin Azubi, kein Philosoph.\"\n\n\"Ihr sagt alle dasselbe.\"\n\n\"Weil es stimmt.\"\n\nEines Abends, nach der Berufsschule, ging ich zur Brücke.\n\nDie Ente war da. Paddelte. Ruhig. Friedlich.\n\n\"Ich verstehe mehr als vor einem Monat,\" sagte ich zu ihr.\n\n\"Das ist kein Kompliment.\"\n\n\"Du hast recht. Ich sollte nicht meckern. Ich lerne. Das ist genug.\"\n\nDie Ente quakte ein drittes Mal. Ich interpretierte das als du bist ein Idiot, aber ich bin stolz auf dich.\n\nBei der Brücke. Bei der Ente.\n\nDie Ente hat keinen Namen.\n\nSie hat jetzt einen. Friedrich.\n\nDu hast die Ente Friedrich genannt?\n\nWeil sie deutsch aussieht.\n\nEnten sehen nicht deutsch aus.", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}, {"prose": "Friedrich sieht deutsch aus.\n\nLeider. Komm nach Hause. Ich habe Pasteten gekauft.\n\nDie Aprikosen. Und ich habe sie nicht versteckt.\n\nDu bist nie unterstützend.\n\nIch bin immer unterstützend. Ich bin Rumäne.\n\nEs ist keine Ausrede. Es ist eine Erklärung.\n\nDie Treppe war siebenunddreißig Stufen. Der Schlüssel klemmte. Die Tür öffnete sich.\n\nMatei saß auf dem Sofa. Die Pasteten lagen auf dem Tisch. Er lächelte. Ein echtes Lächeln. Nicht das Fast-Lächeln.\n\n\"Wie war die Schule?\" fragte er.\n\n\"Gut. Ich habe einen Test bestanden. Mit vier minus.\"\n\n\"Das ist eine Eins in Rumänien.\"\n\n\"Das ist nicht wahr.\"\n\n\"Das ist jetzt wahr. Ich habe es erfunden.\"\n\n\"Du erfindest zu viel.\"\n\n\"Ich erfinde genau richtig. Jetzt iss deine Pastete. Du hast sie verdient.\"\n\nIch hasste, dass sie perfekt war.\n\nAber ich hasste nichts anderes.\n\ndie Berufsschule vocational school feminine\n\nder Betrieb company masculine (review)\n\nder Auszubildende (Azubi) trainee/apprentice masculine\n\nder Ausbilder trainer masculine (review)\n\ndie Fassade facade feminine\n\nder Fahrstuhl elevator masculine (alternative to Aufzug)\n\ndie Glatze bald head feminine\n\ndie Glatze bald head feminine\n\nder Ingwer ginger masculine\n\ndie Bestechung bribery feminine\n\ndas Networking networking neuter (loan)\n\nchaotisch chaotic adjective\n\nverzweifelt desperate adjective (review)\n\nder Döner döner kebab masculine\n\ndie Gewöhnung habituation feminine\n\nfriedlich peaceful adjective\n\nFrom this chapter: \"Du lernst schneller als ich dachte\" (You learn faster than I thought).\n\nWhen comparing two things in German, use als (than). The adjective takes the comparative form (-er).\n\nComparative forms you have seen in this novel:\n\nPositive Comparative Example\n\nschnell schneller Du lernst schneller als ich.\n\ngut besser Dein Kaffee ist besser als meiner.\n\nviel mehr Ich habe mehr Fehler gemacht als du.\n\nwenig weniger Er spricht weniger Deutsch als sie.\n\neinfach einfacher Die Prüfung war einfacher als gedacht.\n\nschwer schwerer Die nächste Prüfung wird schwerer sein.\n\nExamples from this chapter (adapted):\n\nYou learn faster than I thought. Du lernst schneller als ich dachte.\n\nYour German is better than last month. Dein Deutsch ist besser als letzten Monat.\n\nI made more mistakes than you. Ich habe mehr Fehler gemacht als du.\n\nWhy this matters: You will use als constantly when comparing things — test scores, coffee quality, pastries, boyfriend annoyingness. The pattern is simple: adjective + er + als.\n\nTip from the method: Don't confuse als (than) with wie (as). Wie is for equality (so gut wie — as good as). Als is for inequality (besser als — better than). Your brain will learn the difference with practice.", "choices": ["Notice the silence between them", "Focus on what is being said"]}], "gate": {"clue": "What is the German word for \"trainer / supervisor (review)\"?", "answer": "ausbilder", "hint": "der Ausbilder"}, "vocab": [{"german": "die Berufsschule", "english": "vocational school"}, {"german": "der Betrieb", "english": "company"}, {"german": "der Auszubildende", "english": "(Azubi) trainee/apprentice"}, {"german": "der Ausbilder", "english": "train e und einmal eine Woche lang jeden Tag dasselbe Hawaiihemd trug.\n\n\"Gisela ist empfindlich,\" sagte er am zweiten Tag. \"Du musst sanft mit ihr sein. Sie mag keine Wut.\"\n\n\"Die Tastatur hat keine Gefühle.\"\n\n\"Gisela hat Gefühle. Sie hat mir gestern Abend eine E-Mail geschickt. Sie fühlt sich vernachlässigt.\"\n\n\"Tastaturen schicken keine E-Mails.\"\n\n\"Gisela schon. Sie ist besonders.\"\n\nIch dachte, er machte Witze. Er machte keine Witze. Drei Tage später fand ich eine E-Mail in meinem Postfach. Von Gisela Tastatur g.weber@securenet.de. Der Betreff: Ich beobachte dich.\n\n\"Das ist nicht lustig,\" sagte ich zu Mira.\n\n\"Doch. Das ist sehr lustig.\"\n\n\"Er hat sich selbst eine E-Mail geschickt. Von einer Tastatur.\"\n\n\"Das nennt man Hingabe.\"\n\n\"Das nennt man Wahnsinn.\"\n\nDie ersten Wochen mit Herrn Weber waren chaotisch.\n\nEr zeigte mir Dinge. Ich vergaß die Dinge. Er zeigte sie mir noch einmal. Ich vergaß sie wieder.\n\n\"Du vergisst zu viel,\" sagte er.\n\n\"Lernen bedeutet nicht vergessen. Lernen bedeutet erinnern. Das ist ein Unterschied.\"\n\n\"Gibt es einen?\"\n\n\"Nein. Aber wir üben weiter.\"\n\nEr hatte eine seltsame Methode. Er erklärte nichts. Er zeigte es einfach. Einmal. Dann ließ er mich es selbst machen. Wenn ich scheiterte, seufzte er und machte eine Tasse Kaffee. Wenn ich Erfolg hatte, nickte er und sagte \"Gut.\"\n\nKein \"Super\". Kein \"Ausgezeichnet\". Nur \"Gut\".\n\n\"Warum sagt er nie 'gut gemacht'?\" fragte ich Mira.\n\n\"Das ist sein Kompliment. 'Gut' ist von ihm wie 'Fantastisch' von anderen.\"\n\n\"Das ist verwirrend.\"\n\n\"Das ist deutsch. Dasselbe.\"\n\nAm Ende des ersten Monats machte ich einen großen Fehler.\n\nIch löschte versehentlich eine Datei. Eine wichtige Datei. Eine Datei, die Herr Weber seit drei Jahren nicht gesichert hatte.\n\n\"Das war die Datenbank für die Kundenrechnungen,\" sagte er ruhig.\n\n\"Nicht 'oh'. 'Oh' ist für kleine Fehler. Das war ein großer Fehler.\"\n\n\"Kann man sie wiederherstellen?\"\n\n\"Vielleicht. Aber es wird dauern. Und es wird wehtun.\"\n\n\"Mir oder Ihnen?\"\n\n\"Uns beiden. Setz dich. Wir lernen jetzt, wie man gelöschte Dateien wiederherstellt.\"\n\nEr setzte sich neben mich. Er roch nach Kaffee und alten Büchern. Seine Hände waren ruhig. Er tippte Befehle, die ich nicht verstand. Die Datei kam zurück. Langsam. Stück für Stück.\n\n\"Das war dein Fehler,\" sagte er. \"Aber es war auch deine Lektion. Nächste Woche zeige ich dir, wie man Backups macht.\"\n\n\"Sie hätten Backups machen sollen.\"\n\n\"Ja. Das war mein Fehler. Jetzt haben wir beide etwas gelernt.\"\n\nEr stand auf. Machte eine Tasse Kaffee. Machte mir eine Tasse Kaffee. Die Tasse hatte einen Spruch: I'm silently judging you.\n\n\"Woher haben Sie diese Tasse?\"\n\n\"Ihr Freund Matei hat sie mir geschenkt. Er sagte, sie würde zu mir passen.\"\n\n\"Er kennt Sie nicht.\"\n\n\"Er kennt mich genug. Und er hat recht. Ich urteile immer still.\"\n\nIn der zweiten Woche fragte ich Herrn Weber, warum er IT-Ausbilder geworden war.\n\nEr dachte lange nach. Dann sagte er: \"Weil ich früher Buchhändler war.\"\n\n\"Das ergibt keinen Sinn.\"\n\n\"Doch. Bücher sind wie Server. Sie enthalten Informationen. Man muss sie pflegen. Man muss sie schützen. Und manchmal fallen sie runter und machen ein lautes Geräusch.\"", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}, {"prose": "\"Bücher fallen leiser als Server.\"\n\n\"Das ist nicht der Punkt.\"\n\n\"Was ist der Punkt?\"\n\n\"Der Punkt ist, dass ich mit Menschen arbeiten wollte, die etwas lernen wollen. Und IT-Azubis sind wie leere Festplatten. Man kann sie mit allem füllen.\"\n\n\"Das ist ein seltsames Kompliment.\"\n\n\"Es ist kein Kompliment. Es ist eine Beobachtung.\"\n\nEines Nachmittags blieb ich länger im Büro.\n\nIch arbeitete an einem Projekt. Einem kleinen Netzwerk für einen Freund von Frau Schmidt. Sie hatte mich empfohlen. \"Er ist gut,\" hatte sie gesagt. \"Nicht gut gut. Aber besser als vor einem Monat.\"\n\nHerr Weber kam um 18 Uhr in mein Büro.\n\n\"Du arbeitest noch.\"\n\n\"Ich bin fast fertig.\"\n\n\"Du bist nicht fast fertig. Du bist erst bei der Hälfte.\"\n\n\"Woher wissen Sie das?\"\n\n\"Weil ich deinen Bildschirm sehen kann.\"\n\n\"Spionieren Sie mich an?\"\n\n\"Ich beobachte. Das ist ein Unterschied.\"\n\nEr setzte sich auf den Stuhl neben mir. Nahm meine Maus. Klickte hier. Klickte dort. Das Projekt sah besser aus. Nicht perfekt. Aber besser.\n\n\"Kein Dank. Nächste Woche machst du es alleine.\"\n\n\"Was ist, wenn ich es falsch mache?\"\n\n\"Dann korrigiere ich es. Und du machst es noch einmal. Und dann noch einmal. Bis du es richtig machst.\"\n\n\"Das klingt anstrengend.\"\n\n\"Das ist Ausbildung. Dasselbe.\"\n\nAm Freitag der dritten Woche passierte etwas Unerwartetes.\n\nHerr Weber lächelte. Nicht sein halbes Lächeln. Ein echtes Lächeln. Ich hatte ihn noch nie lächeln sehen.\n\n\"Was ist los?\" fragte ich.\n\n\"Ich lächle manchmal.\"\n\n**\"Dann warst du nicht da, wenn ich gelächelt habe.\"\n\n\"Ich bin immer da.\"\n\n\"Dann warst du blind.\"\n\nEr stand auf. Ging zum Fenster. Die Sonne schien. Es war selten in Berlin.\n\n\"Ihr Freund war heute hier,\" sagte er.\n\n\"Ja. Er hat mir Kaffee gebracht. Und einen Kuchen. Selbst gebacken.\"\n\n\"Matei backt nicht.\"\n\n\"Dann hat er ihn gekauft. Aber die Geste zählt.\"\n\n\"Was hat er gesagt?\"\n\n\"Er hat gesagt, dass Sie stolz auf Sie sind. Dass Sie härter arbeiten als jeder andere. Dass Sie manchmal nervig sind, aber dass er Sie liebt.\"\n\n\"Das hat er gesagt?\"\n\n\"Nicht mit diesen Worten. Er ist Rumäne. Rumänen sagen Dinge anders. Aber ja. Das war die Bedeutung.\"\n\nIch wusste nicht, was ich sagen sollte. Also sagte ich nichts. Ich trank meinen Kaffee. Er trank seinen Kaffee. Die Heizung klickte.\n\n\"Warum sind Sie Ausbilder geworden? Wirklich?\"\n\nEr war einen Moment still. Dann sagte er: \"Weil ich einmal ein Azubi war. Und mein Ausbilder war schrecklich. Er hat mich angeschrien. Er hat mich gedemütigt. Er hat mir gesagt, ich wäre zu dumm für diesen Job.\"\n\n\"Das ist schrecklich.\"\n\n\"Ja. Und ich wollte nie so sein. Ich wollte der Ausbilder sein, den ich gebraucht hätte.\"\n\n\"Sie sind ein guter Ausbilder.\"\n\n\"Ich bin ein okay Ausbilder. Aber ich versuche es.\"\n\n\"Das ist genug.\"", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}, {"prose": "\"Das hoffe ich.\"\n\nIn der vierten Woche hatte ich meinen ersten richtigen Erfolg.\n\nEin Kunde hatte ein Problem mit seinem Netzwerk. Ein kleines Problem. Ein Problem, das ich lösen konnte. Allein.\n\n\"Bist du sicher?\" fragte Herr Weber.\n\nIch machte es. Es dauerte zwanzig Minuten. Meine Hände zitterten. Meine Stirn war nass. Aber ich machte es. Das Problem war weg.\n\n\"Gut,\" sagte Herr Weber.\n\nNur \"Gut\". Aber es fühlte sich an wie \"Fantastisch\".\n\n\"Du hast es selbst gemacht. Dank dir selbst.\"\n\n\"Ich danke Ihnen fürs Zuschauen.\"\n\n\"Das war kein Zuschauen. Das war Vertrauen. Das ist ein Unterschied.\"\n\n\"Gibt es einen?\"\n\n\"Ja. Zuschauen ist passiv. Vertrauen ist aktiv. Du hast mein Vertrauen verdient.\"\n\nEr klopfte mir auf die Schulter. Einmal. Kurz. Dann ging er zurück an seinen Schreibtisch.\n\nAn dem Abend erzählte ich Matei alles.\n\n\"Er hat dir auf die Schulter geklopft?\" fragte Matei.\n\n\"Das ist eine große Sache.\"\n\n\"Es ist nur eine Schulterklopfen.\"\n\n\"Von Herrn Weber? Das ist wie eine Umarmung von einem normalen Menschen. Oder ein Kuss. Oder ein Heiratsantrag.\"\n\n\"Du übertreibst.\"\n\n\"Ich übertreibe nicht. Ich übersetze. Das ist ein Unterschied.\"\n\n\"Gibt es einen?\"\n\n\"Nein. Aber du verstehst, was ich meine.\"\n\n\"Ich verstehe. Ich habe sein Vertrauen verdient.\"\n\n\"Du hast sein Vertrauen vor Wochen verdient. Er hat nur gebraucht, um es dir zu zeigen.\"\n\n\"Woher weißt du das?\"\n\n\"Weil ich ihn beobachtet habe. Als ich ihm den Kuchen gebracht habe. Er hat über dich gesprochen. Die ganze Zeit.\"\n\n\"Was hat er gesagt?\"\n\n\"Er hat gesagt, dass du schneller lernst als jeder andere Azubi. Dass du Fehler machst, aber dass du daraus lernst. Dass du nervig bist, aber auf eine gute Weise.\"\n\n\"Das hat er gesagt?\"\n\n\"Nicht mit diesen Worten. Aber ja.\"\n\nIch lächelte. Matei lächelte zurück. Das echte Lächeln.\n\n\"Du stinkst nach Schweiß,\" sagte er.\n\n\"Ich hatte einen langen Tag.\"\n\n\"Dann geh duschen. Danach gibt es Pasta.\"\n\n\"Ich versuche es. Deine Großmutter hat mir das Rezept gegeben. Per E-Mail.\"\n\n\"Meine Großmutter hat kein E-Mail.\"\n\n\"Dann hat sie es mir per Brieftaube geschickt. Ich weiß nicht. Die Pasta ist gut. Das ist wichtig.\"\n\nNicht perfekt. Aber gut. Besser als letzte Woche.\n\n\"Du wirst besser,\" sagte ich.\n\n\"Ich lerne. Von dir.\"\n\n\"Das ist traurig. Du bist kein guter Lehrer.\"\n\n\"Dann bist du ein schlechter Schüler.\"\n\nWir aßen. Wir tranken Wein. Die schlechte Sorte. Die aus dem Karton.\n\n\"Danke. Dass du zu Herrn Weber gegangen bist.\"\n\n\"Ich bin nicht für ihn gegangen. Ich bin für dich gegangen.\"\n\n\"Das ist dasselbe.\"", "choices": ["Notice the silence between them", "Focus on what is being said"]}, {"prose": "\"Nein. Für ihn gehen wäre komisch. Für dich gehen ist normal. Das ist ein Unterschied.\"\n\n\"Gibt es einen?\"\n\n\"Ja. Und du weißt es.\"\n\nEr hatte recht. Ich wusste es.\n\nAm nächsten Morgen kam ich früh ins Büro.\n\nHerr Weber war schon da. Er trank Kaffee. Seine Tasse sagte I'm silently judging you.\n\n\"Guten Morgen,\" sagte ich.\n\n\"Guten Morgen. Setz dich. Wir lernen heute etwas Neues.\"\n\n\"Wie man einen Server von Grund auf aufbaut. Keine Vorlage. Keine Hilfe. Nur du und Gisela.\"\n\n\"Gisela ist eine Tastatur.\"\n\n\"Gisela ist Ihre Partnerin. Behandeln Sie sie mit Respekt.\"\n\nIch setzte mich. Ich tippte. Ich machte Fehler. Ich korrigierte sie. Ich machte mehr Fehler. Ich korrigierte sie wieder.\n\nAm Ende des Tages funktionierte der Server.\n\n\"Gut,\" sagte Herr Weber.\n\nAber es fühlte sich an wie \"Fantastisch\".\n\nder Ausbilder trainer/supervisor masculine (review)\n\ndie Tastatur keyboard feminine\n\nempfindlich sensitive adjective\n\nvernachlässigt neglected adjective\n\nder Wahnsinn madness masculine\n\ndie Hingabe dedication feminine\n\nwiederherstellen to restore separable verb\n\ndas Backup backup neuter (loan)\n\ndie Festplatte hard drive feminine\n\nder Bildschirm screen masculine\n\nbeobachten to observe verb\n\ndie Geste gesture feminine (review)\n\ndemütigen to humiliate verb\n\ndas Vertrauen trust neuter (review)\n\nder Schweiß sweat masculine\n\ndie Brieftaube carrier pigeon feminine\n\nFrom this chapter: \"Du wirst besser\" (You're becoming better) — werden as a full verb vs. Du wirst lernen (You will learn) as future tense.\n\nYou have seen werden in two ways:\n\n1. As a full verb meaning \"to become\":\n\nYou are becoming better. Du wirst besser.\n\nHe became an IT specialist. Er wurde Fachinformatiker.\n\nIt's getting dark. Es wird dunkel.\n\n2. As an auxiliary verb for future tense (with infinitive at the end):\n\nYou will learn. Du wirst lernen.\n\nHe will become an IT specialist. Er wird Fachinformatiker werden.\n\nIt will get dark. Es wird dunkel werden.\n\nExamples from this chapter (adapted):\n\nYou are becoming better (now). Du wirst besser.\n\nYou will become better (in the future). Du wirst besser werden.\n\nWhy this matters: Context tells you which meaning is intended. If werden is alone (no infinitive at the end), it means \"to become.\" If there's another infinitive at the end, it's future tense.\n\nTip from the method: When you see wird, werden, wirst, check the end of the sentence. Another verb? Future tense. No other verb? Werden as \"become.\"", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}], "gate": {"clue": "What is the German word for \"homesickness\"?", "answer": "heimweh", "hint": "das Heimweh"}, "vocab": [{"german": "der Ausbilder", "english": "trainer/supervisor"}, {"german": "
