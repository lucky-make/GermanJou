ktion. Dass Liebe kein Wettbewerb ist. Dass manchmal die beste Antwort 'dasselbe' ist.\"\n\n\"Das sind drei Dinge.\"\n\n\"Ich bin ein guter Schüler.\"\n\n\"Du bist ein nerviger Schüler.\"\n\nUnd bald, vielleicht, sehr bald, würde ein Kind dazukommen.\n\n\"Ich kann es kaum erwarten.\"\n\n\"Auch wenn es schwer wird?\"\n\n\"Besonders dann.\"\n\n\"Das ist Liebe. Dasselbe.\"\n\ndie Adoption adoption feminine\n\nder Salzstreuer salt shaker masculine\n\neinschüchternd intimidating adjective\n\ndas Jugendamt youth welfare office neuter\n\ndie Finanzierung financing feminine\n\ntraumatisiert traumatized adjective\n\ndie Behinderung disability feminine\n\nder Antrag application masculine\n\nder Kompromiss compromise masculine\n\nder Erziehungsratgeber parenting guide masculine\n\ndie Grundlage foundation/basis feminine\n\nFrom this chapter: Not explicit, but useful for expressing proportional relationships — like \"The more we wait, the more excited we get.\"\n\nJe...desto connects two clauses to show that one thing increases as another increases.\n\nje + comparative, desto + comparative the more..., the more... Je länger wir warten, desto aufgeregter sind wir.\n\nExamples from this chapter (adapted):\n\nThe longer we wait, the more excited we get. Je länger wir warten, desto aufgeregter sind wir.\n\nThe more we learn, the better parents we become. Je mehr wir lernen, desto bessere Eltern werden wir.\n\nThe more chaos, the more love. Je mehr Chaos, desto mehr Liebe.\n\nWhy this matters: Je...desto is common in spoken German when talking about growing feelings, expectations, or frustrations — like waiting for an adoption decision.\n\nTip from the method: The first clause (je) sets up the condition. The second clause (desto) gives the result. Both use comparative adjectives (mehr, länger, besser).", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}], "gate": {"clue": "What is the German word for \"final exam\"?", "answer": "abschlusspruefung", rman": "die Brücke", "english": "bridge"}, {"german": "überleben", "english": "to survive"}, {"german": "träumen", "english": "to dream"}, {"german": "groß", "english": "big / tall"}, {"german": "sitzen", "english": "to sit"}, {"german": "lächeln", "english": "to smile"}, {"german": "träumen", "english": "to dream"}, {"german": "nächste", "english": "next"}, {"german": "die Großmutter", "english": "grandmother"}, {"german": "früh", "english": "early"}, {"german": "ändern", "english": "to change"}, {"german": "sitzen", "english": "to sit"}, {"german": "das Gespräch", "english": "conversation"}, {"german": "die Angst", "english": "fear / anxiety"}, {"german": "das Gespräch", "english": "conversation"}, {"german": "siebenunddreißig", "english": "thirty-seven"}, {"german": "groß", "english": "big / tall"}, {"german": "nächste", "english": "next"}, {"german": "der Schoß", "english": "lap"}, {"german": "der Schüler", "english": "pupil / student"}, {"german": "lang", "english": "long"}, {"german": "wissen / weiß", "english": "to know / white"}, {"german": "der Kalenderspruch", "english": "calendar quote"}, {"german": "heißen", "english": "to be called"}, {"german": "der Künstlername", "english": "artist name"}, {"german": "die Familienaktivität", "english": "family activity"}, {"german": "haben", "english": "to have (subj.)"}, {"german": "schön", "english": "more beautiful"}, {"german": "zählen", "english": "to count"}, {"german": "schlafen", "english": "to sleep"}, {"german": "würde", "english": "would (subjunctive)"}, {"german": "alt", "english": "older"}, {"german": "der Grund", "english": "reason"}, {"german": "wissen", "english": "to know"}, {"german": "sein (subj.)", "english": "would be"}, {"german": "hinhören", "english": "to listen"}, {"german": "überleben", "english": "to survive"}, {"german": "träumen", "english": "to dream"}, {"german": "groß", "english": "big / tall"}, {"german": "sitzen", "english": "to sit"}, {"german": "lächeln", "english": "to smile"}, {"german": "träumen", "english": "to dream"}, {"german": "nächste", "english": "next"}, {"german": "sitzen", "english": "to sit"}, {"german": "die Angst", "english": "fears / anxieties"}, {"german": "das Gespräch", "english": "conversation"}, {"german": "groß", "english": "big / tall"}, {"german": "nächste", "english": "next"}, {"german": "lang", "english": "longer"}], "shadow": ["Official form and bureaucracy German:", "Bitte fuellen Sie das Formular vollstaendig aus. — Please fill in the form completely.", "Welche Unterlagen werden benoetigt? — What documents are required?", "Wann koennen wir mit einer Antwort rechnen? — When can we expect an answer?", "Wir freuen uns auf diesen neuen Schritt. — We are looking forward to this new step.", "Wir freuen uns — we are looking forward to / we are glad about. It is used for everything from interviews to weddings to adoptions. It contains genuine anticipation. Use it when you mean it."]}, {"id": 34, "title": "Die Abschlussprüfung", "scenes": [{"prose": "Die Abschlussprüfung war kein Monster.\n\nSie war schlimmer. Sie war ein Papierstapel. Sechzig Seiten. Fünf Stunden. Keine Pause. Nur ich, der Stift, und das Gefühl, dass mein Gehirn gleich aus meinen Ohren kriechen würde.\n\n\"Du siehst aus wie ein Geist,\" sagte Mira am Morgen der Prüfung.\n\n\"Ich fühle mich wie ein Geist.\"\n\n\"Geister bestehen keine Prüfungen.\"\n\n\"Dann bin ich ein sehr gut ausgebildeter Geist.\"\n\nSie gab mir einen Kaffee. Schwarz. Kein Zucker. Keine Milch. Fast perfekt. Nur fast, weil er nicht von Matei war.\n\n\"Wo ist dein Mann?\"\n\n\"Er arbeitet. Er kann nicht jeden Morgen Kaffee bringen.\"\n\n\"Doch. Er könnte. Er will nur nicht.\"\n\n\"Das ist nicht wahr.\"\n\n\"Doch. Männer sind so.\"\n\n\"Du bist auch ein Mann.\"\n\n\"Ich bin eine Frau. Mit einem männlichen Geist.\"\n\n\"Das ist nicht, wie das funktioniert.\"\n\n\"Heute ist Prüfung. Alles funktioniert anders.\"\n\nDie Prüfung fand in der Berufsschule statt.\n\nIn demselben Raum, in dem ich vor zwei Jahren meinen ersten Test verpasst hatte. Der Raum roch noch genauso. Nach Kaffee, Schweiß und leichter Verzweiflung.\n\n\"Setzen Sie sich,\" sagte Herr Dr. Schmidt. \"Handys aus. Taschen unter den Tisch. Kein Sprechen. Kein Cheating. Cheating ist doof.\"\n\n\"Sie haben 'doof' gesagt.\"\n\n\"Ich bin Lehrer. Ich darf 'doof' sagen. Es steht in meinem Vertrag.\"\n\n\"Das ist nicht wahr.\"\n\n\"Doch. Kleingedrucktes. Seite 7.\"\n\n\"Sie erfinden Seiten.\"\n\n\"Ich erfinde Motivation. Dasselbe.\"\n\nFrage eins: Was ist ein Subnetz? Einfach. Ich schrieb die Antwort.\n\nFrage zwei: Erklären Sie den Unterschied zwischen TCP und UDP. Ich wusste es. Ich schrieb.\n\nFrage drei bis zwanzig: Router, Firewalls, DNS, DHCP. Alles gelernt. Alles geübt. Alles mit Matei am Küchentisch, Abend für Abend.\n\n\"Du schreibst schnell,\" flüsterte Mira von nebenan.\n\n\"Du flüsterst laut.\"\n\n\"Flüstern ist nie laut.\"\n\n\"Doch. Dein Flüstern ist laut.\"\n\n\"Dann ist mein Flüstern ein Brüllen im Herzen.\"\n\n\"Das ist nicht hilfreich.\"\n\n\"Ich bin nicht hilfreich. Ich bin eine Prüfungsbegleitung. Dasselbe.\"\n\nFrage einundzwanzig: Beschreiben Sie den Ablauf einer Drei-Wege-Handshake im TCP-Protokoll.\n\nIch schrieb. SYN, SYN-ACK, ACK. Meine Hand schmerzte. Der Stift war voller Tinte. Meine Finger waren blau.\n\nFrage zweiunddreißig: Was ist ein VLAN und wozu dient es?\n\nIch schrieb. Virtuelles lokales Netzwerk. Trennung von Datenverkehr. Sicherheit. Performance.\n\n\"Gut,\" sagte Herr Dr. Schmidt, der zwischen den Reihen ging. \"Weiter so.\"\n\n\"Sie dürfen während der Prüfung nicht sprechen.\"\n\n\"Ich bin der Lehrer. Ich darf sprechen. Es steht in meinem Vertrag.\"\n\n\"Sie haben keinen Vertrag.\"\n\n\"Doch. Kleingedrucktes. Seite 12.\"\n\nFrage vierzig: Sie haben einen Server mit Windows Server 2019. Ein Benutzer kann sich nicht anmelden. Was tun Sie?\n\nIch schrieb: Passwort zurücksetzen. Account prüfen. Active Directory prüfen. DNS prüfen. Wenn alles nicht hilft, Server neustarten.\n\n\"Neustarten ist keine Lösung,\" hatte Herr Weber immer gesagt.\n\n\"Neustarten ist die erste Lösung,\" hatte ich immer geantwortet.\n\n\"Neustarten ist die Lösung für Leute, die keine Ahnung haben.\"\n\n\"Ich habe keine Ahnung. Deshalb neustarte ich.\"\n\n\"Du wirst kein guter ITler.\"\n\n\"Ich werde ein guter Problemlöser. Dasselbe.\"\n\nFrage fünfundvierzig. Die fünfundvierzigste Frage.\n\nSie war anders. Sie war keine technische Frage. Sie war eine Fallstudie.\n\nSie sind der IT-Administrator eines kleinen Unternehmens. Die Geschäftsführerin bittet Sie um Zugriff auf die E-Mails eines Mitarbeiters, der krankgeschrieben ist. Sie hat keinen richterlichen Beschluss. Was tun Sie?\n\nIch starrte auf die Frage.\n\nIch wusste die Antwort nicht.\n\nNicht technisch. Nicht juristisch. Nicht eindeutig.\n\n\"Was machst du?\" flüsterte Mira.\n\n\"Ich denke nach.\"\n\n\"Du denkst zu lange.\"\n\n\"Das ist eine schwere Frage.\"\n\n\"Antworte einfach.\"\n\n\"Ich kann nicht einfach antworten.\"\n\n\"Dann rate. C ist immer richtig.\"\n\n\"C ist nicht immer richtig.\"\n\nIch dachte an Matei. An seine Art, schwierige Dinge zu sagen. An seine Geduld. An seine Ehrlichkeit.\n\nIch würde der Geschäftsführerin erklären, dass der Zugriff auf private E-Mails ohne richterlichen Beschluss illegal ist. Ich würde ihr alternative Lösungen vorschlagen: betriebliche Anweisungen, Datenschutzbeauftragten einschalten, rechtliche Prüfung. Ich würde nicht einfach Zugriff geben. Auch wenn sie die Chefin ist. Auch wenn es einfacher wäre.\n\nEthik ist wichtiger als Effizienz.\n\n\"Das ist sehr moralisch,\" flüsterte Mira.\n\n\"Das ist sehr deutsch.\"\n\nFrage sechsundvierzig bis sechzig gingen schneller.\n\nMeine Hand schmerzte. Mein Kopf schmerzte. Meine Augen brannten.", "choices": ["Notice the silence between them", "Focus on what is being said"]}, {"prose": "Am Ende der fünf Stunden legte ich den Stift hin.\n\n\"Fertig,\" sagte ich.\n\n\"Ruhe,\" sagte Herr Dr. Schmidt.\n\n\"Ich bin ruhig.\"\n\n\"Sie sind nicht ruhig. Sie sind fertig. Das ist ein Unterschied.\"\n\n\"Gibt es einen?\"\n\n\"Nein. Aber Sie dürfen gehen.\"\n\nDie Sonne schien. Berlin war grau, aber die Sonne schien. Ein Widerspruch. Wie mein Leben.\n\n\"Wie war's?\" fragte Mira, die mir folgte.\n\n\"Schwer schwer oder normal schwer?\"\n\n\"Schwer schwer.\"\n\n\"Hast du die letzte Frage verstanden?\"\n\n\"Die mit der Chefin und den E-Mails?\"\n\n\"Was hast du geschrieben?\"\n\n\"Ich würde die Chefin ignorieren und dem Mitarbeiter helfen.\"\n\n\"Das ist illegal.\"\n\n\"Das ist moralisch. Dasselbe.\"\n\n\"Du wirst durchfallen.\"\n\n\"Vielleicht ist gut.\"\n\n\"Vielleicht ist genug.\"\n\nFriedrich war da. Paddelte. Schwamm im Kreis.\n\n\"Friedrich, ich habe die Prüfung geschrieben.\"\n\n\"Eine Frage wusste ich nicht.\"\n\n\"Du hast recht. Eine Frage ist nichts. Es gibt sechzig Fragen.\"\n\nFriedrich quakte ein drittes Mal.\n\n\"Ich weiß nicht, ob ich bestanden habe.\"\n\nFriedrich quakte. Ich interpretierte das als du wirst sehen.\n\nMatei: Wie war die Prüfung?\n\nIch weiß nicht. Eine Frage war komisch.\n\nEthik. Chefin will E-Mails sehen. Mitarbeiter ist krank.\n\nDass es illegal ist. Dass ich nicht einfach Zugriff gebe.\n\nDas ist die richtige Antwort.\n\nWeil du immer die richtige Antwort findest. Auch wenn es dauert.\n\nDoch. Komm nach Hause. Ich koche.\n\nPasta. Deine Großmutter hat mir ein neues Rezept geschickt.\n\nPer E-Mail. Sie hat ihren Computer gefunden.\n\nSie spielt jetzt Schach. Sie ist sehr gut.\n\nMeine Großmutter spielt Schach?\n\nJa. Sie hat die Nachbarin besiegt. Die Nachbarin hat geweint.\n\nDas ist deine Familie. Dasselbe.\n\nDie Treppe war siebenunddreißig Stufen. Der Schlüssel klemmte nicht mehr.\n\nMatei stand in der Küche. Die Pasta kochte. Die Soße bubbelte.\n\n\"Du siehst müde aus.\"\n\n\"Hast du geweint?\"\n\n\"Ich weine nie.\"\n\n\"Du weinst bei Prüfungen.\"\n\n\"Das war einmal.\"\n\n\"Das war heute.\"\n\n\"Du zählst meine Tränen?\"\n\n\"Ich zähle alles. Das weißt du.\"\n\nWir sprachen nicht über die Prüfung. Wir sprachen über Miez, die heute eine tote Maus ins Wohnzimmer gebracht hatte. Über die Tomaten, die endlich reif waren. Über die neue Nachbarin, die Gitarre spielte und sehr schlecht war.\n\n\"Sie spielt 'Wonderwall',\" sagte Matei. \"Jeden Abend.\"\n\n\"Das ist ein Klassiker.\"\n\n\"Es ist Folter.\"\n\n\"Dann schreib ihr einen Brief.\"\n\n\"Ich bin Rumäne. Ich beschwere mich persönlich. Mit Gesten.\"\n\n\"Du bist unmöglich.\"\n\n\"Du liebst mich.\"\n\nNach dem Essen saßen wir im Garten.\n\nMiez lag auf meinem Schoß. Matei Jr. stand auf dem Fensterbrett. Friedrich war nicht da. Friedrich war an der Brücke. Aber in Gedanken war er bei uns.\n\n\"Was, wenn ich durchfalle?\"\n\n\"Dann wiederholst du die Prüfung.\"\n\n\"Das ist ein Jahr warten.\"\n\n\"Ein Jahr ist kurz.\"\n\n\"Ein Jahr ist lang.\"\n\n\"Ein Jahr ist genau richtig, um dich vorzubereiten.\"\n\n\"Das ist nicht beruhigend.\"\n\n\"Das ist ehrlich. Dasselbe.\"\n\n\"Weißt du, was ich bei der einen Frage geschrieben habe?\"\n\n\"Die mit der Chefin?\"\n\n\"Ja. Ich habe geschrieben: 'Ethik ist wichtiger als Effizienz.'\"\n\n\"Das ist idealistisch.\"\n\n\"Idealisten gewinnen am Ende.\"", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}, {"prose": "\"Woher weißt du das?\"\n\n\"Weil ich dich gewonnen habe.\"\n\n\"Das ist kitschig.\"\n\n\"Ich bin kitschig. Das ist mein Charme.\"\n\nDie nächsten drei Tage waren die Hölle.\n\nNicht wirklich. Aber ein bisschen. Ich checkte meine E-Mails alle fünf Minuten. Ich trank zu viel Kaffee. Ich sprach mit Friedrich. Ich putzte die Wohnung. Zweimal.\n\n\"Du putzt schon wieder,\" sagte Matei.\n\n\"Ich bin nervös.\"\n\n\"Das ist kein Grund zu putzen.\"\n\n\"Doch. Putzen beruhigt.\"\n\n\"Putzen ist eine Vermeidungsstrategie.\"\n\n\"Nein. Vermeidung ist, wenn du vor etwas wegläufst. Putzen ist, wenn du vor etwas wegläufst und dabei einen Lappen schwingst.\"\n\n\"Das ist sehr analytisch.\"\n\n\"Ich bin sehr analytisch. Ich habe eine Freundin in Ohio.\"\n\n\"Gisela ist eine Tastatur.\"\n\n\"Weiß ich nicht. Aber sie existiert.\"\n\n\"Du erfindest Menschen.\"\n\n\"Ich erfinde Trost. Dasselbe.\"\n\nAm dritten Tag, um 14:37 Uhr, kam die E-Mail.\n\nBetreff: Ihre Abschlussprüfung — Ergebnis\n\n\"Oh,\" sagte ich.\n\n\"Was?\" fragte Matei. Er stand hinter mir. Sein Kinn ruhte auf meiner Schulter.\n\n\"Die E-Mail ist da.\"\n\n\"Ich kann nicht.\"\n\n\"Doch. Du kannst.\"\n\n\"Was, wenn ich durchgefallen bin?\"\n\n\"Dann öffnen wir eine Flasche Wein. Und dann wiederholst du die Prüfung.\"\n\n\"Was, wenn ich bestanden habe?\"\n\n\"Dann öffnen wir eine Flasche Wein. Und dann feiern wir.\"\n\n\"Also Wein in beiden Fällen.\"\n\n\"Wein ist immer die Lösung.\"\n\n\"Das ist nicht gesund.\"\n\n\"Das ist rumänisch. Dasselbe.\"\n\nwir freuen uns, Ihnen mitteilen zu können, dass Sie Ihre Abschlussprüfung erfolgreich bestanden haben.\n\nIhre Punktzahl: 89 von 100.\n\nSie sind nun offiziell Fachinformatiker.\n\n\"Ich habe bestanden.\"\n\n\"Das ist sehr gut.\"\n\n\"Du hast 'sehr gut' gesagt. Das sagst du nie.\"\n\n\"Heute ist ein besonderer Tag.\"\n\n\"Weil ich bestanden habe?\"\n\n\"Weil du bestanden hast. Und weil ich stolz auf dich bin.\"\n\n\"Du bist nie stolz.\"\n\n\"Heute schon. Einmal. Verschwende es nicht.\"\n\n\"Ich werde es nicht verschwenden.\"\n\nIch las die E-Mail noch einmal. Und noch einmal.\n\n\"89 Punkte. Ich habe nur einen Punkt bei der Ethik-Frage verloren.\"\n\n\"Was war deine Punktzahl bei der Ethik-Frage?\"\n\n\"4 von 5. Der Prüfer schrieb: 'Gute ethische Argumentation, aber etwas zu idealistisch für die Praxis. Trotzdem richtig.'\"\n\n\"Trotzdem richtig ist gut.\"\n\n\"Trotzdem richtig ist perfekt.\"\n\nDen guten. Den mit dem Korken. Den, den Matei für diesen Moment aufgehoben hatte.\n\n\"Du hast den Wein für diesen Moment aufgehoben?\"\n\n\"Seit zwei Jahren.\"\n\n\"Du wusstest, dass ich bestehen würde?\"\n\n\"Ich habe gehofft.\"\n\n\"Hoffen ist nicht wissen.\"\n\n\"Hoffen ist genug.\"\n\nWir prosteten. Die Gläser klingten.\n\n\"Prost, Fachinformatiker.\"\n\n\"Prost, Ehemann.\"\n\n\"Prost, zukünftiger Vater.\"\n\n\"Das ist noch nicht sicher.\"\n\n\"Doch. Ich habe ein gutes Gefühl.\"\n\n\"Dein gutes Gefühl ist manchmal falsch.\"\n\n\"Heute nicht. Heute ist alles richtig.\"\n\nAm Abend rief ich meine Großmutter an.\n\n\"Lucky. Es ist spät.\"\n\n\"In Lagos ist es früh.\"\n\n\"Ich bin alt. Ich schlafe nicht mehr. Was ist los?\"\n\n\"Ich habe die Prüfung bestanden.\"\n\n\"Welche Prüfung?\"\n\n\"Die Abschlussprüfung. Ich bin jetzt Fachinformatiker.\"", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}, {"prose": "\"Gut ist genug. Du weißt das.\"\n\n\"Bist du jetzt zufrieden?\"\n\n\"Dann bin ich auch zufrieden. Schick mir ein Foto von deinem Zeugnis.\"\n\n\"Mein Zeugnis kommt per Post.\"\n\n\"Dann schick mir das Foto, wenn es da ist.\"\n\n\"Ich bin stolz auf dich.\"\n\n\"Das hast du noch nie gesagt.\"\n\n\"Ich spare mir die wichtigen Dinge für später auf.\"\n\n\"Später ist jetzt.\"\n\n\"Dann ist es jetzt.\"\n\nIch starrte auf das Telefon.\n\n\"Sie hat gesagt, sie ist stolz.\"\n\n\"Das ist ein Wunder.\"\n\n\"Wunder passieren.\"\n\n\"Doch. Heute schon.\"\n\nMiez kam. Legte sich auf meinen Schoß. Der Rosmarin duftete. Der Basilikum war immer noch tot.\n\n\"Was machen wir jetzt?\"\n\n\"Jetzt? Wir arbeiten. Wir sparen. Wir adoptieren ein Kind. Wir werden alt.\"\n\n\"Das ist ein guter Plan.\"\n\n\"Das ist ein langweiliger Plan.\"\n\n\"Langweilig ist sicher.\"\n\n\"Sicher ist gut.\"\n\nDie Sterne waren schwach. Berlin war hell. Aber ein paar Sterne waren da.\n\n\"Erinnerst du dich an den ersten Tag? Am Flughafen?\"\n\n\"Du warst spät dran.\"\n\n\"Das Flugzeug war früh.\"\n\n\"Du warst trotzdem spät.\"\n\n\"Ich war verwirrt.\"\n\n\"Du warst verloren.\"\n\n\"Nein. Verloren ist, wenn du nicht weißt, wo du bist. Verwirrt ist, wenn du nicht weißt, was du tust. Du warst beides.\"\n\n\"Jetzt weißt du, wo du bist. Und du weißt, was du tust.\"\n\n\"Das ist genug.\"\n\nDie Ringe waren warm. Der Schlüssel war in meiner Tasche. Die Ente war an der Brücke. Das Kind war nicht da. Aber es würde kommen.\n\n\"Dass du mich damals angesprochen hast. Am Flughafen.\"\n\n\"Du hast mich angesehen. Ich musste reagieren.\"\n\n\"Ich habe dich nicht angesehen.\"\n\n\"Doch. Du hast mich angesehen. Du hast so getan, als würdest du mich nicht sehen, aber du hast mich gesehen.\"\n\n\"Das ist creepy.\"\n\n\"Das ist Liebe. Dasselbe.\"\n\nDie Nacht war still. Die Stadt schlief. Miez schnurrte. Matei Jr. wuchs.\n\n\"Ich bin froh, dass du geblieben bist.\"\n\n\"Ich bin auch froh.\"\n\n\"Auch wenn es schwer war.\"\n\n\"Besonders dann.\"\n\n\"Was kommt jetzt?\"\n\n\"Jetzt? Jetzt schlafen wir. Morgen arbeitest du. Ich arbeite. Wir kaufen ein. Wir kochen. Wir streiten. Wir lachen.\"\n\n\"Das klingt wie jeden Tag.\"\n\n\"Das ist das Leben.\"\n\n\"Das ist perfekt.\"\n\n\"Nein. Es ist nicht perfekt. Aber es ist unser.\"\n\n\"Das ist besser.\"\n\ndie Abschlussprüfung final exam feminine\n\nder Papierstapel stack of paper masculine\n\nder Schweiß sweat masculine\n\ndie Verzweiflung despair feminine\n\ndie Fallstudie case study feminine\n\nder Datenschutzbeauftragte data protection officer masculine\n\ndie Effizienz efficiency feminine\n\nder Idealismus idealism masculine\n\ndas Zeugnis certificate neuter\n\nFrom this chapter: Not explicit, but useful for explaining how Yves achieved success — Indem er nicht aufgab (by not giving up).\n\nIndem expresses the means or method by which something is achieved. It sends the verb to the end.\n\nConjunction Meaning Example\n\nindem by (doing something) Er bestand die Prüfung, indem er viel lernte.\n\nExamples from this chapter (adapted):\n\nHe passed the exam by studying a lot. Er bestand die Prüfung, indem er viel lernte.\n\nBy staying, he found a home. Indem er blieb, fand er ein Zuhause.\n\nShe helped him by being patient. Sie half ihm, indem sie geduldig war.\n\nWhy this matters: Indem is common in written German and more formal speech. It allows you to explain how something happened.\n\nTip from the method: Indem always connects two clauses, and the verb in the indem clause goes to the end. The subject is usually the same in both clauses.", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}], "gate": {"clue": "What is the German word for \"life\"?", "answer": "leben", "hint": "das Leben"}, "vocab": [{"german": "die Abschlussprüfung", "english": "final exam"}, {"german": "der Papierstapel", "english": "stack of paper"}, {"german": "der Geist", "english": "ghost"}, {"german": "der Schweiß", "english": "sweat"}, {"german": "die Verzweiflung", "english": "despair"}, {"german": "das Subnetz", "english": "subnet"}, {"german": "die Fallstudie", "english": "case study"}, {"german": "der Datenschutzbeauftragte", "english": "data protection officer"}, {"german": "die Ethik", "english": "ethics"}, {"german": "die Effizienz", "english": "efficiency"}, {"german": "der Idealismus", "english": "idealism"}, {"german": "das Zeugnis", "english": "certificate"}, {"german": "der Morgen", "english": "morning"}, {"german": "sehr", "english": "very"}, {"german": "gut", "english": "good"}, {"german": "perfekt", "english": "perfect"}, {"german": "weil", "english": "because"}, {"german": "auch", "english": "also / too"}, {"german": "heute", "english": "today"}, {"german": "noch", "english": "still / yet"}, {"german": "sich", "english": "(reflexive pronoun)"}, {"german": "die Frage", "english": "question"}, {"german": "einfach", "english": "simple / just"}, {"german": "wenn", "english": "when / if"}, {"german": "immer", "english": "always"}, {"german": "ruhig", "english": "quiet / calm"}, {"german": "aber", "english": "but"}, {"german": "oder", "english": "or"}, {"german": "vielleicht", "english": "maybe / perhaps"}, {"german": "die Frage", "english": "question"}, {"german": "jetzt", "english": "now"}, {"german": "der Schlüssel", "german": "zählen", "english": "to count"}, {"german": "wissen", "english": "to know"}, {"german": "sitzen", "english": "to sit"}, {"german": "nächste", "english": "next"}, {"german": "weglaufen", "english": "to run away"}, {"german": "das Glas", "english": "glass"}, {"german": "zukünftig", "english": "future (adj.)"}, {"german": "würde", "english": "would (subjunctive)"}], "shadow": ["Final exam German — technical and procedural:", "Die Pruefung besteht aus einem schriftlichen und einem muendlichen Teil. — The exam consists of a written and an oral part.", "Ich erklaere das anhand eines Beispiels. — I will explain that using an example.", "Zusammenfassend laesst sich sagen, dass... — In summary, it can be said that...", "Haben Sie noch weitere Fragen? — Do you have any further questions?", "Ich erklaere das anhand eines Beispiels is the sentence that rescues you when you know the answer but can't find the abstract words. Move to concrete. Always move to concrete."]}, {"id": 35, "title": "Das Leben", "scenes": [{"prose": "Der Morgen begann wie jeder andere.\n\nUm 5:45 klingelte der Wecker. Ich schlug ihn aus. Nicht aus Wut. Aus Gewohnheit.\n\n\"Du hasst deinen Wecker,\" sagte Matei. Er lag neben mir. Seine Augen waren noch zu.\n\n\"Ich hasse das Aufwachen. Nicht den Wecker.\"\n\n\"Nein. Der Wecker ist das Werkzeug. Das Aufwachen ist die Strafe.\"\n\n\"Du bist philosophisch heute Morgen.\"\n\n\"Ich bin müde. Dasselbe.\"\n\nDie Wohnung war ruhig. Miez schlief auf dem Sofa. Matei Jr. stand auf dem Fensterbrett. Er hatte neue Blätter. Drei. Winzig. Grün.\n\n\"Guten Morgen, Matei Jr.,\" sagte ich.\n\nDie Pflanze antwortete nicht.\n\n\"Du wirst auch nicht besser zuhören.\"\n\nIch machte Kaffee. Schwarz. Kein Zucker. Keine Milch. Perfekt.\n\nIch trank ihn im Garten. Die Tomaten waren rot. Der Rosmarin duftete. Der Basilikum war wieder tot. Ich hatte aufgegeben.\n\n\"Basilikum ist eine Dramaqueen,\" sagte ich zu Miez, die aus dem Fenster sprang und sich zu mir setzte.\n\n\"Du hast recht. Kein Drama mehr. Nur Tomaten.\"\n\nZum Café. Mein Café. Seit zwei Jahren.\n\nDie Treppe war siebenunddreißig Stufen. Ich zählte nicht mehr. Aber ich wusste es. Der Schlüssel klemmte nicht. Frau Schmidt hatte ihn ölen lassen. Vor langer Zeit.\n\nIch schloss auf. Machte die Lichter an. Begrüßte die Espressomaschine.\n\n\"Guten Morgen, Gisela.\"\n\nDie Maschine zischte. Ich interpretierte das als guten Morgen, Chef.\n\nDer erste Kunde kam um 7:15.\n\nEin alter Mann. Mit Zeitung. Mit Limp. Ohne Namen. Er bestellte immer dasselbe. Einen schwarzen Kaffee. Kein Zucker. Keine Milch. Perfekt.\n\n\"Guten Morgen,\" sagte er.\n\nEr setzte sich an seinen Tisch. Den mit dem geschnitzten Herzen.\n\nT + M war noch da. Aber daneben, etwas kleiner, stand Y + M.\n\nIch wusste nicht, wer es gemacht hatte. Frau Schmidt sagte, sie war es nicht. Matei sagte, er war es nicht. Ada sagte, vielleicht war es ein Gast. Vielleicht ein Kind. Vielleicht Friedrich.\n\n\"Enten können nicht schnitzen,\" hatte ich gesagt.\n\n\"Diese Ente schon,\" hatte Ada geantwortet. \"Sie hat eine Krone.\"\n\nEr brachte Pasteten. Die Aprikosen. Die guten.\n\n\"Du musst nicht jeden Tag Pasteten bringen.\"\n\n\"Weil du sie isst. Und weil ich dich gern essen sehe.\"\n\n\"Das ist seltsam.\"\n\n\"Das ist Liebe. Dasselbe.\"\n\nEr küsste mich. Vor dem ersten Kunden. Vor dem zweiten. Vor allen.\n\n\"Du bist unmöglich.\"\n\n\"Du liebst mich.\"\n\nSie arbeitete jetzt in einer Anwaltskanzlei. Sie trug Anzüge. Sie sah aus wie eine, die wusste, was sie tat. Sie wusste es nicht. Aber sie sah so aus.\n\n\"Kaffee,\" sagte sie. \"Schwarz. Kein Zucker. Keine Milch. Perfekt.\"\n\n\"Du trinkst deinen Kaffee jetzt wie Matei.\"\n\n\"Matei hat recht. Schwarz ist besser.\"\n\n\"Das ist nicht wahr.\"\n\n\"Doch. Aber ich vermisse die Milch.\"\n\n\"Dann trink Milch.\"\n\n\"Nein. Ich bin jetzt erwachsen.\"\n\n\"Erwachsene trinken, was sie wollen.\"\n\n\"Erwachsene trinken, was sie sollen.\"\n\n\"Das ist nicht wahr.\"\n\n\"Doch. "\n\n\"In Zeitungspapier.\"\n\n\"Das ist traditionell.\"\n\n\"Das ist unhygienisch.\"\n\n\"Das ist rumänisch. Dasselbe.\"\n\nSie setzte sich zu Frau Schmidt. Die beiden redeten über alte Zeiten. Über Matei als Kind. Über Andreeas neue Arbeit. Über den Hund Schnitzel, der immer noch nicht zurückgekommen war.\n\n\"Schnitzel ist tot,\" sagte Andreea.\n\n\"Woher weißt du das?\" fragte Frau Schmidt.\n\n\"Weil alle Hunde sterben. Irgendwann.\"\n\n\"Das ist pessimistisch.\"\n\n\"Das ist realistisch. Dasselbe.\"\n\nUm 13:00 war das Café leer.\n\nIch setzte mich an den Tisch mit dem Herzen. Matei setzte sich neben mich.\n\n\"Müde?\" fragte er.\n\n\"Gute Müdigkeit?\"\n\n\"Ja. Die beste.\"\n\n\"Weil es meine Müdigkeit ist. In meinem Café. Mit meinem Mann.\"\n\n\"Das ist sehr romantisch.\"\n\n\"Ich bin sehr romantisch. Ich habe eine Ente.\"\n\n\"Friedrich lebt noch?\"\n\n\"Friedrich lebt für immer. Enten sind unsterblich.\"\n\n\"Das ist nicht wahr.\"\n\n\"Doch. In Berlin schon.\"\n\nUm 14:00 kam ein Mann mit einem Fotoapparat.\n\nEr machte Fotos für eine Zeitung. Eine kleine Zeitung. Über Cafés in Neukölln.\n\n\"Lächeln Sie,\" sagte er.\n\n\"Ich lächle nie für Fotos.\"\n\n\"Dann lächeln Sie für Ihre Kunden.\"\n\n\"Meine Kunden sind nicht hier.\"\n\n\"Dann lächeln Sie für Ihren Mann.\"\n\nIch lächelte. Matei lächelte auch.\n\n\"Perfekt,\" sagte er.\n\n\"Wir sind nicht perfekt.\"\n\n\"Das Foto ist perfekt. Das ist ein Unterschied.\"\n\n\"Gibt es einen?\"\n\n\"Nein. Aber das Foto hängt trotzdem in der Zeitung.\"\n\nUm 15:00 ging Matei nach Hause.\n\nEr musste nicht. Aber er wollte. Er wollte Miez füttern. Und Matei Jr. gießen. Und vielleicht ein Nickerchen machen.\n\n\"Du machst ein Nickerchen?\"\n\n\"Ich bin alt. Alte Menschen machen Nickerchen.\"\n\n\"Du bist nicht alt.\"\n\n\"Ich bin dreiunddreißig. Das ist alt für Rumänen.\"\n\n\"Das ist nicht wahr.\"\n\n\"Doch. Frag meine Mutter.\"\n\n\"Deine Mutter ist tot.\"\n\n\"Dann frag meinen Vater.\"\n\n\"Dein Vater ist auch tot.\"\n\n   // ── VOCAB LOOKUP ──────────────────────────────────────────────────
  function buildLookup(vocab){
    const map = new Map();
    const arts = ['der','die','das','ein','eine','einen','einem','einer','des','dem','den'];

    // German inflection suffixes to strip when building stem index
    const suffixes = ['ungsgesprächs','ungsgespräch','ungsbegleitung','igkeit','schaft','keit',
      'ungen','enden','ender','endes','endem','enden','esten','ester','estes','estem',
      'isten','isten','ierte','ierten','ierte','iert','ieren','iere','iere',
      'ten','test','tet','tem','ten','ter','tes','nen','ner','nes','nem',
      'ssen','sst','ßen','ßt','ße','ßen','end','est','ern','ere','eres','erem',
      'st','en','em','es','er','et','te','gt','ht','lt','nt','rt','ft',
      'ge','be','ver','zer','ent','emp','hin','her','weg','vor','mit','auf',
      'e','s','n','t'];

    function stems(word){
      const w = word.toLowerCase().replace(/[^a-zäöüß]/g,'');
      const result = new Set([w]);
      for(const sfx of suffixes){
        if(w.endsWith(sfx) && w.length - sfx.length >= 3){
          result.add(w.slice(0, w.length - sfx.length));
        }
      }
      return result;
    }

    // Build stem index from vocab entries
    const stemIndex = new Map(); // stem -> entry (first registered wins)
    for(const v of vocab){
      const parts = v.german.split(/\s+/);
      // Use the main word (last part, or only part)
      const mainWord = parts[parts.length - 1];
      for(const s of stems(mainWord)){
        if(!stemIndex.has(s)) stemIndex.set(s, v);
      }
    }

    for(const v of vocab){
      const full = v.german.toLowerCase();
      map.set(full, v);
      const parts = v.german.split(/\s+/);
      if(parts.length > 1){
        const last = parts[parts.length-1].toLowerCase();
        if(!map.has(last)) map.set(last, v);
        if(arts.includes(parts[0].toLowerCase())){
          const noArt = parts.slice(1).join(' ').toLowerCase();
          if(!map.has(noArt)) map.set(noArt, v);
        }
      }
    }

    // Now try to match any word in prose via its stem
    // We expose the stemIndex so renderProse can use it as fallback
    map._stemIndex = stemIndex;
    map._stems = stems;
    return map;
  }

  // ── TTS ───────────────────────────────────────────────────────────
  function getGermanVoice(){
    const voices = window.speechSynthesis.getVoices();
    // Prefer de-DE, fall back to any de-* voice
    return voices.find(v=>v.lang==='de-DE')
        || voices.find(v=>v.lang.startsWith('de'))
        || null;
  }

  function doSpeak(text, lang, rate, onEnd){
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = rate;
    const voice = getGermanVoice();
    if(voice) u.voice = voice;
    if(onEnd){ u.onend=onEnd; u.onerror=onEnd; }
    window.speechSynthesis.speak(u);
  }

  function speak(text, lang='de-DE', rate=0.82, onEnd){
    if(!window.speechSynthesis){ onEnd&&onEnd(); return; }
    // Voices may not be loaded yet on mobile Safari — wait if needed
    const voices = window.speechSynthesis.getVoices();
    if(voices.length > 0){
      doSpeak(text, lang, rate, onEnd);
    } else {
      window.speechSynthesis.onvoiceschanged = ()=>{
        window.speechSynthesis.onvoiceschanged = null;
        doSpeak(text, lang, rate, onEnd);
      };
      // Fallback: some browsers never fire onvoiceschanged, try after short delay
      setTimeout(()=>{
        if(window.speechSynthesis.getVoices().length > 0) doSpeak(text, lang, rate, onEnd);
      }, 200);
    }
  }

  function makeGermanWord(rawWord, entry){
    const wrap = document.createElement('span');
    wrap.className='gw';
    wrap.textContent = rawWord;
    wrap.setAttribute('tabindex','0');
    wrap.setAttribute('role','button');
    wrap.setAttribute('aria-label', rawWord+': '+entry.english);

    function toggle(e){
      e.stopPropagation();
      if(openTip && wrap.contains(openTip)){ closeTip(); return; }
      closeTip();
      const tip = document.createElement('span');
      tip.className='tooltip';
      tip.innerHTML=`<span class="tt-word">${entry.german}</span>
        <span class="tt-tr">${entry.english}</span>
        <button class="tt-btn" aria-label="Pronounce">▶ Hear it</button>
        <button class="tt-close" aria-label="Close">×</button>`;
      tip.querySelector('.tt-btn').onclick=(ev)=>{ ev.stopPropagation(); speak(entry.german); };
      tip.querySelector('.tt-close').onclick=(ev)=>{ ev.stopPropagation(); closeTip(); };
      wrap.appendChild(tip);
      openTip=tip;
    }
    wrap.addEventListener('click', toggle);
    wrap.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' ') toggle(e); });
    return wrap;
  }

  document.addEventListener('click', ()=>closeTip());

  // ── PROSE RENDERER ────────────────────────────────────────────────
  function renderProse(text, lookup){
    const div = document.createElement('div');
    div.className='prose-body';
    const paras = text.split(/\n\n+/).filter(p=>p.trim());
    for(const para of paras){
      const p = document.createElement('p');
      p.className='prose-para';
      const wordRe = /([A-Za-zäöüÄÖÜß]+)/g;
      let last=0, m;
      while((m=wordRe.exec(para))!==null){
        if(m.index>last) p.appendChild(document.createTextNode(para.slice(last,m.index)));
        const raw=m[1];
        const lower=raw.toLowerCase();
        let entry=lookup.get(lower);
        if(!entry && lookup._stemIndex && lookup._stems){
          for(const s of lookup._stems(lower)){
            if(lookup._stemIndex.has(s)){ entry=lookup._stemIndex.get(s); break; }
          }
        }
        if(entry) p.appendChild(makeGermanWord(raw, entry));
        else p.appendChild(document.createTextNode(raw));
        last=m.index+raw.length;
      }
      if(last<para.length) p.appendChild(document.createTextNode(para.slice(last)));
      div.appendChild(p);
    }
    return div;
  }

  // ── CHAPTER MAP ───────────────────────────────────────────────────
  function buildMapDots(){
    const container = document.getElementById('chDots');
    container.innerHTML='';
    for(const ch of CHAPTERS){
      const btn=document.createElement('button');
      btn.className='ch-dot';
      const isCompleted=P.completed.includes(ch.id);
      const isAccessible=P.accessible.includes(ch.id);
      const isCurrent=P.ch===ch.id;
      if(isCurrent) btn.classList.add('current');
      else if(isCompleted) btn.classList.add('completed');
      else if(isAccessible) btn.classList.add('accessible');
      else btn.classList.add('locked');
      btn.textContent = isCompleted ? '✓' : ch.id;
      btn.title=ch.id+'. '+ch.title;
      btn.disabled=!isAccessible;
      btn.setAttribute('aria-label','Chapter '+ch.id+': '+ch.title);
      if(isAccessible){
        btn.onclick=()=>{ selectChapter(ch.id); closeMap(); };
      }
      container.appendChild(btn);
    }
  }

  function openMap(){ buildMapDots(); document.getElementById('mapOverlay').style.display='flex'; }
  function closeMap(){ document.getElementById('mapOverlay').style.display='none'; }

  // ── VOCAB PANEL ───────────────────────────────────────────────────
  function buildVocabPanel(vocab){
    const ul=document.getElementById('vocabList');
    ul.innerHTML='';
    for(const v of vocab){
      const li=document.createElement('li');
      li.className='vocab-item';
      const playBtn=document.createElement('button');
      playBtn.className='voc-play'; playBtn.textContent='▶';
      playBtn.onclick=()=>{ playBtn.textContent='◼'; speak(v.german,'de-DE',.82,()=>playBtn.textContent='▶'); };
      const de=document.createElement('span'); de.className='voc-de'; de.textContent=v.german;
      const sep=document.createElement('span'); sep.className='voc-sep'; sep.textContent='—';
      const en=document.createElement('span'); en.className='voc-en'; en.textContent=v.english;
      li.append(playBtn,de,sep,en);
      ul.appendChild(li);
    }
  }

  function openVocab(){ buildVocabPanel(currentCh().vocab); document.getElementById('vocabPanel').style.display='flex'; }
  function closeVocab(){ document.getElementById('vocabPanel').style.display='none'; }

  // ── SHADOWING ─────────────────────────────────────────────────────
  let shAutoOn=false, shActiveIdx=null, shPlayingWord=null;

  function buildShadowing(ch){
    document.getElementById('shTitle').textContent=ch.title;
    const script=document.getElementById('shScript');
    script.innerHTML='';
    shActiveIdx=null; shAutoOn=false;
    const autoBtn=document.getElementById('shAutoBtn');
    const repBtn=document.getElementById('shRepeatBtn');
    autoBtn.className='sh-auto'; autoBtn.textContent='▶ Auto-play';
    repBtn.disabled=true;

    for(let i=0;i<ch.shadow.length;i++){
      const line=ch.shadow[i];
      const dlgMatch=line.match(/^(Matei|Yves|Both|Narrator):\s*"?(.+?)"?\s*$/i);
      const isNote=/^(Read|Practise|Focus|Notice|That single|Say it)/i.test(line);

      if(dlgMatch){
        const div=document.createElement('div');
        div.className='sh-line sh-dialogue';
        div.dataset.idx=i;
        div.innerHTML=`<span class="sh-speaker">${dlgMatch[1]}</span>
          <span class="sh-text">"${dlgMatch[2]}"</span>
          <span class="sh-icon">▶</span>`;
        div.onclick=()=>{ if(!shAutoOn) shPlayLine(i); };
        script.appendChild(div);
      } else if(isNote){
        const div=document.createElement('div');
        div.className='sh-line sh-note';
        div.textContent=line;
        script.appendChild(div);
      }
    }
  }

  function shPlayLine(idx, thenNext=false){
    const ch=currentCh();
    const line=ch.shadow[idx];
    if(!line) return;
    shActiveIdx=idx;
    document.getElementById('shRepeatBtn').disabled=false;

    // Highlight active
    document.querySelectorAll('#shScript .sh-dialogue').forEach(el=>{
      el.classList.toggle('active', parseInt(el.dataset.idx)===idx);
      el.querySelector('.sh-icon').textContent = parseInt(el.dataset.idx)===idx ? '◼' : '▶';
    });

    const dlgMatch=line.match(/^(?:Matei|Yves|Both|Narrator):\s*"?(.+?)"?\s*$/i);
    const text = dlgMatch ? dlgMatch[1] : line;
    speak(text,'de-DE',0.75,()=>{
      document.querySelectorAll('#shScript .sh-dialogue').forEach(el=>{
        el.querySelector('.sh-icon').textContent='▶';
      });
      if(thenNext && shAutoOn){
        // find next dialogue index
        const allDlg=[...document.querySelectorAll('#shScript .sh-dialogue')].map(el=>parseInt(el.dataset.idx));
        const pos=allDlg.indexOf(idx);
        if(pos>=0 && pos<allDlg.length-1){
          setTimeout(()=>shPlayLine(allDlg[pos+1],true),900);
        } else {
          shAutoOn=false;
          const ab=document.getElementById('shAutoBtn');
          ab.className='sh-auto'; ab.textContent='▶ Auto-play';
        }
      }
    });
  }

  function toggleShAuto(){
    const ab=document.getElementById('shAutoBtn');
    if(shAutoOn){
      shAutoOn=false; window.speechSynthesis&&window.speechSynthesis.cancel();
      ab.className='sh-auto'; ab.textContent='▶ Auto-play';
    } else {
      shAutoOn=true;
      ab.className='sh-auto on'; ab.textContent='⏹ Stop';
      const allDlg=[...document.querySelectorAll('#shScript .sh-dialogue')].map(el=>parseInt(el.dataset.idx));
      const startIdx = (shActiveIdx!==null && allDlg.includes(shActiveIdx)) ? shActiveIdx : allDlg[0];
      if(startIdx!==undefined) shPlayLine(startIdx,true);
    }
  }

  function openShadowing(){ buildShadowing(currentCh()); document.getElementById('shadowSheet').style.display='flex'; }
  function closeShadowing(){ document.getElementById('shadowSheet').style.display='none'; shAutoOn=false; window.speechSynthesis&&window.speechSynthesis.cancel(); }

  // ── GATE VIEW ─────────────────────────────────────────────────────
  function renderGate(ch){
    const main=document.getElementById('main');
    main.innerHTML='';
    let attempts=0;

    const gate=ch.gate;
    const div=document.createElement('div');
    div.className='gate';
    div.innerHTML=`
      <div class="gate-icon">🔐</div>
      <div class="gate-title">${ch.title}</div>
      <div class="gate-sub">One word unlocks the next chapter.</div>
      <div class="gate-clue">${gate.clue}</div>
      <div class="gate-hint" id="gateHint" style="display:none">Hint: <em>${gate.hint}</em></div>
      <div class="gate-row" id="gateRow">
        <input class="gate-input" id="gateInput" type="text" placeholder="type the German word…" autocomplete="off" spellcheck="false" autofocus>
        <button class="gate-submit" id="gateSubmit">Unlock</button>
      </div>
      <div class="gate-tries" id="gateTries"></div>
    `;
    main.appendChild(div);

    const input=document.getElementById('gateInput');
    const submit=document.getElementById('gateSubmit');
    const row=document.getElementById('gateRow');
    const triesEl=document.getElementById('gateTries');
    const hintEl=document.getElementById('gateHint');

    function norm(s){ return s.toLowerCase().trim().replace(/[^a-zäöüß]/g,''); }

    function check(){
      const val=norm(input.value);
      const ans=norm(gate.answer);
      if(!val) return;
      if(val===ans){
        input.className='gate-input ok';
        submit.disabled=true;
        setTimeout(()=>{
          P.cleared.push(ch.id);
          saveProg(P);
          renderChapter();
        },800);
      } else {
        attempts++;
        row.classList.add('shake');
        setTimeout(()=>row.classList.remove('shake'),500);
        input.value='';
        input.focus();
        if(attempts>=2) hintEl.style.display='';
        triesEl.textContent=attempts+' wrong '+(attempts===1?'attempt':'attempts')+' — keep going';
      }
    }

    submit.onclick=check;
    input.addEventListener('keydown',e=>{ if(e.key==='Enter') check(); });
    document.getElementById('footInfo').textContent='🔐 Vocab gate';
    updateFooterBtns();
  }

  // ── SCENE VIEW ────────────────────────────────────────────────────
  function renderScene(){
    const ch=currentCh();
    const scene=ch.scenes[Math.min(P.scene, ch.scenes.length-1)];
    const isLast=P.scene>=ch.scenes.length-1;
    const lookup=buildLookup(ch.vocab);
    const main=document.getElementById('main');
    main.innerHTML='';

    const article=document.createElement('div');
    article.className='chapter-article';

    // Pips
    const pips=document.createElement('div');
    pips.className='scene-pips';
    for(let i=0;i<ch.scenes.length;i++){
      const pip=document.createElement('div');
      pip.className='pip'+(i===P.scene?' active':i<P.scene?' done':'');
      pips.appendChild(pip);
    }
    article.appendChild(pips);

    // Prose
    const wrap=document.createElement('div');
    wrap.className='scene-wrap';
    const proseDom=renderProse(scene.prose, lookup);
    wrap.appendChild(proseDom);

    // Choices
    const choicesDiv=document.createElement('div');
    choicesDiv.className='choices';
    let chosen=false;

    function makeChoice(text,isFin){
      const btn=document.createElement('button');
      btn.className='choice-btn'+(isFin?' finish-btn':'');
      btn.innerHTML=`<span class="choice-arrow">${isFin?'✓':'›'}</span>${text}`;
      btn.onclick=()=>{
        if(chosen) return;
        chosen=true;
        btn.classList.add('selected');
        choicesDiv.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
        setTimeout(()=>{
          if(isLast){
            // Complete chapter
            if(!P.completed.includes(ch.id)) P.completed.push(ch.id);
            const nextId=ch.id+1;
            if(!P.accessible.includes(nextId) && nextId<=35) P.accessible.push(nextId);
            saveProg(P);
            const nextCh=CHAPTERS.find(c=>c.id===nextId);
            if(nextCh){ selectChapter(nextId); }
            else { updateUI(); }
          } else {
            P.scene=Math.min(P.scene+1, ch.scenes.length-1);
            saveProg(P);
            renderScene();
          }
        },400);
      };
      return btn;
    }

    for(const c of scene.choices){
      choicesDiv.appendChild(makeChoice(c,false));
    }
    if(isLast){
      choicesDiv.appendChild(makeChoice('Complete this chapter',true));
    }

    wrap.appendChild(choicesDiv);
    article.appendChild(wrap);
    main.appendChild(article);

    requestAnimationFrame(()=>requestAnimationFrame(()=>wrap.classList.add('visible')));

    document.getElementById('footInfo').textContent=`Scene ${P.scene+1}/${ch.scenes.length}`;
    updateFooterBtns();
  }

  // ── CHAPTER SELECTION ─────────────────────────────────────────────
  function selectChapter(id){
    P.ch=id; P.scene=0; saveProg(P);
    renderChapter();
  }

  function renderChapter(){
    const ch=currentCh();
    document.getElementById('chapterLabel').textContent='Ch. '+ch.id+' — '+ch.title;
    document.getElementById('progressBadge').textContent=P.completed.length+'/35';
    if(P.cleared.includes(ch.id)) renderScene();
    else renderGate(ch);
    updateFooterBtns();
  }

  function updateFooterBtns(){
    const ch=currentCh();
    const prevBtn=document.getElementById('prevBtn');
    const nextBtn=document.getElementById('nextBtn');
    prevBtn.disabled=ch.id<=1;
    prevBtn.onclick=()=>{ if(ch.id>1){ const prev=CHAPTERS.find(c=>c.id===ch.id-1); if(prev&&P.accessible.includes(prev.id)) selectChapter(prev.id); } };
    const nextId=ch.id+1;
    nextBtn.disabled=nextId>35||!P.accessible.includes(nextId);
    nextBtn.onclick=()=>{ if(P.accessible.includes(nextId)) selectChapter(nextId); };
  }

  function updateUI(){ renderChapter(); }

  // ── EVENT LISTENERS ───────────────────────────────────────────────
  document.getElementById('mapBtn').onclick=openMap;
  document.getElementById('mapClose').onclick=closeMap;
  document.getElementById('mapOverlay').onclick=(e)=>{ if(e.target===document.getElementById('mapOverlay')) closeMap(); };

  document.getElementById('vocabBtn').onclick=openVocab;
  document.getElementById('vocabClose').onclick=closeVocab;

  document.getElementById('shadowBtn').onclick=openShadowing;
  document.getElementById('shadowClose').onclick=closeShadowing;
  document.getElementById('shAutoBtn').onclick=toggleShAuto;
  document.getElementById('shRepeatBtn').onclick=()=>{ if(shActiveIdx!==null) shPlayLine(shActiveIdx); };

  // Close panels on Escape
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      closeMap(); closeVocab(); closeShadowing();
    }
  });

  // ── INIT ──────────────────────────────────────────────────────────
  renderChapter();

  })();
  </script>
  </body>
  </html>
