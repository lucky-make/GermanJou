e would want?\"\n\n\"She talks about you. Both of you. You're the 'coffee boys.'\"\n\nI looked at Matei. \"Coffee boys?\"\n\n\"I'm going to kill her.\"\n\n\"She's unconscious.\"\n\n\"After she wakes up.\"\n\nI got in the ambulance. Matei stayed behind to lock the Café.\n\n\"I'll meet you there.\"\n\n\"Don't take a book this time. Use money.\"\n\n\"I know how money works.\"\n\n\"You paid a Taxi driver with a first edition.\"\n\n\"It was a good first edition.\"\n\nThe doors closed. The Sirenen started. I held Frau Schmidt's hand and tried not to cry. Her hand was warm. Her nails were painted — a soft pink, slightly chipped.\n\n\"Your nail polish is chipped,\" I told her unconscious body. \"Matei is going to make fun of you.\"\n\nShe didn't respond. But her hand twitched. I chose to interpret this as I don't care.\n\nThe hospital was white and loud and smelled like Antiseptikum.\n\nThey took Frau Schmidt to a room. A doctor spoke to me in English. Her English was better than my German, but not by much.\n\n\"She had a Schlaganfall. Small. We caught it early.\"\n\n\"Is she going to be okay?\"\n\n\"She will need Rehabilitation. Therapy. She cannot work for several weeks. Maybe months.\"\n\n\"The brain needs time to heal. Like a muscle.\"\n\n\"The brain isn't a muscle.\"\n\n\"It's like a muscle. Metaphorically.\"\n\n\"That's not how metaphors work.\"\n\nShe smiled. \"You must be Yves.\"\n\n\"How did you know?\"\n\n\"Frau Schmidt talks about you. The 'coffee boy who asks too many questions.'\"\n\n\"I'm going to kill her.\"\n\n\"After she wakes up.\"\n\n\"That's what Matei said.\"\n\nShe left. I sat in the waiting room. The chairs were plastic. Uncomfortable. The same plastic as Matei's chair at home. The one no one sat in.\n\nThe plastic chair of shame, I called it in my head.\n\nMatei arrived an hour later.\n\nHe had closed the Café, turned off the lights, locked the door. He had also called the bakery down the street and told them to cancel the morning pastry delivery.\n\n\"You called the bakery?\"\n\n\"Someone had to.\"\n\n\"You spoke German on the phone?\"\n\n\"I speak German every day.\"\n\n\"To me. You speak slow German to me. Like I'm a toddler.\"\n\n\"You are a toddler. Emotionally.\"\n\nHe sat down next to me. His hand found mine.\n\n\"Schlaganfall. Small. They say she'll recover, but it will take time.\"\n\n\"How much time?\"\n\n\"Weeks. Months. The doctor was vague. She used a bad metaphor about muscles.\"", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}, {"prose": "\"Doctors are like that.\"\n\n\"That's not a metaphor. That's just a statement.\"\n\nWe sat there for a moment. The waiting room was quiet. A vending machine hummed in the corner. It sold coffee that probably tasted like Spülwasser.\n\n\"The Café,\" I said. \"She can't work. For months.\"\n\n\"She doesn't have anyone. No family. Just the Café.\"\n\nHe looked at me. His grey eyes were steady.\n\n\"You know how to make the coffee. You know the customers. You know the Routine.\"\n\n\"I dropped four cups last week.\"\n\n\"You dropped three. Frau Schmidt told me.\"\n\n\"That's not better.\"\n\n\"It's better.\" He squeezed my hand. \"I'll help in the mornings. Before work. And I know people. We can find someone to cover the afternoons.\"\n\n\"Matei, I can't run a Café. I can barely order food in German. Last week I asked for 'a glass of cow.' The waitress brought me milk.\"\n\n\"You asked for a glass of cow?\"\n\n\"Milch** means milk. I said Kuh. Cow. It was one letter off.\"**\n\n\"That's four letters off.\"\n\n\"You don't have to run it alone. You just have to keep it alive. Until she comes back.\"\n\n\"What if I burn it down?\"\n\n\"What if I forget to order supplies and we run out of coffee?\"\n\n\"Then we sell tea.\"\n\n\"What if I accidentally poison someone?\"\n\n\"Then we learn to make poison taste better.\"\n\n\"That's not comforting.\"\n\nI looked at him — this man who had given me a key and a job and a reason to stay — and I thought about Frau Schmidt on the floor, reaching for her phone, alone.\n\n\"Okay. I'll do it. But if the Café burns down, it's your fault.\"\n\n\"How is it my fault?\"\n\n\"You encouraged me.\"\n\n\"That's not how responsibility works.\"\n\n\"It's how my responsibility works.\"\n\nHe kissed my forehead. Right there in the hospital waiting room, with Leuchtstoffröhren and the smell of Antiseptikum and a vending machine that hummed like it was judging us.\n\n\"Good. Because I already told the bakery you would be there at 6 AM tomorrow.\"\n\n\"You're insane.\"\n\n\"That's not mutually exclusive.\"\n\nI leaned my head on his shoulder. He put his arm around me.\n\nWe sat like that until a nurse came to tell us Frau Schmidt was awake.\n\nShe looked smaller in the hospital bed.\n\nThe fluorescent light made her grey hair look white. Her eyes were open, though. They were still sharp. Still slightly judgmental.\n\n\"You're here,\" she said. Her voice was weak.\n\n\"Where else would we be?\" Matei sat in the chair next to her bed. I stood behind him.\n\n\"The Café. I didn't open.\"\n\n\"We took care of it,\" I said. \"It's closed. The pastries are canceled. The lights are off. Also, Matei paid a Taxi driver with a book.\"\n\n\"A first edition,\" he said.\n\n\"The Trial. Kafka.\"\n\n\"That's a good book.\"\n\n\"That's what I said.\"\n\n\"The driver was happy.\"\n\n\"The driver doesn't know what a first edition is worth.\"\n\n\"Ignorance is bliss.\"\n\n\"Ignorance is expensive.\"\n\nI looked between them. \"Are you two negotiating right now? She's in a hospital bed.\"\n\nFrau Schmidt smiled. A small smile. Tired. Real.\n\n\"The Café,\" she said. \"It's my life. If it closes...\"\n\n\"It won't close,\" Matei said.\n\n\"We'll keep it open,\" I said. \"Until you come back.\"\n\nShe looked at me. Really looked.\n\n\"You can't. You don't speak German. You asked for a glass of cow.\"\n\n\"How did you know about that?\"\n\n\"The waitress is my neighbor.\"\n\n\"Everyone in this city knows each other.\"\n\n\"It's a small city.\"\n\n\"It's not. It's huge. You just all have a gossip network.\"\n\nShe laughed. Then coughed. Then laughed again.\n\n\"You're ridiculous,\" she said.\n\n\"I'm practical. There's a Unterschied.\"\n\n\"That's my line.\"\n\n\"You taught me well.\"\n\nShe reached out. Her hand found mine. Her fingers were cold.\n\n\"The keys are in the drawer. Behind the counter. There's a blue notebook. The Passwörter. The supplier numbers. Everything.\"\n\n\"The espresso machine hates you. Be firm with it.\"\n\n\"I'm always firm.\"", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}, {"prose": "\"You're not. You're gentle. That's why it hisses at you.\"\n\n\"It hisses at everyone.\"\n\n\"It doesn't hiss at me.\"\n\n\"Because it's afraid of you.\"\n\n\"That's how you get results.\"\n\nFrau Schmidt looked at him. \"You. Take care of him. He asks too many questions and he's bad at German.\"\n\n\"Also, he eats all the apricot pastries.\"\n\n\"I noticed that too.\"\n\nI threw my hands up. \"I'm right here. I can hear you.\"\n\n\"Good,\" Frau Schmidt said. \"Then you know what we expect.\"\n\nThat night, we sat on the Sofa.\n\nThe Lampe was on. The Heizung clicked. Matei Jr. sat on the windowsill, still alive, still thriving, somehow.\n\n\"You're scared,\" Matei said.\n\n\"Good. Terror means you care.\"\n\n\"Or it means I'm about to ruin someone's life.\"\n\n\"Frau Schmidt trusted you. Do you know why?\"\n\n\"Because you vouched for me?\"\n\n\"No. Because you stayed. When she gave you a chance, you didn't leave. You came back the next day. And the next. And the next.\" He put his hand on my knee. \"That's not nothing, Yves. That's everything.\"\n\n\"What if I fail?\"\n\n\"Then you fail. And you try again.\" He squeezed my knee. \"That's what staying means.\"\n\n\"What if I set the Café on fire?\"\n\n\"Then we open a Café called Burnt. It will be ironic. People will love it.\"\n\n\"You're ridiculous.\"\n\n\"I'm supportive.\"\n\n\"You're going to be fine.\"\n\n\"You don't know that.\"\n\n\"That's not the same.\"\n\n\"It's enough to start.\"\n\nI leaned into him. His arm went around my shoulders.\n\n\"I'm glad you're here.\"\n\n\"I'm not going anywhere.\"\n\n\"Even if I burn down the Café?\"\n\n\"Especially then. Someone has to identify the bodies.\"\n\nWe sat like that until the Lampe flickered and the street went quiet.\n\nTomorrow, I would open the Café at 5:45 AM. I would make coffee. I would drop cups. I would apologize to the floor. I would learn the German words for supplier and invoice and please pay within thirty days or I will find you.\n\nBut tonight, I was just here.\n\nAnd for now, that was enough.\n\nperfekt perfect adjective (review)\n\ndie Arbeit work feminine (review)\n\ndie Richtung direction feminine\n\nverwirrt confused adjective\n\ndie Routine routine feminine\n\nnicht abgeschlossen unlocked phrase\n\nbewusstlos unconscious adjective\n\ndas Zittern trembling neuter\n\n112 emergency number number\n\nder Sanitäter paramedic masculine\n\ndie Trage stretcher feminine\n\ndas Antiseptikum antiseptic neuter\n\nder Schlaganfall stroke masculine\n\ndie Rehabilitation rehabilitation feminine\n\ndas Passwort password neuter\n\nFrom this chapter: \"If it closes, she would lose more than money\" — implied hypothetical.\n\nThe Konjunktiv II is used for:\n\n· Hypothetical situations (If I were rich...)\n\n· Polite requests (Would you help me?)\n\n· Wishes (I wish I had more time)\n\nThe three most important forms for B2:\n\nEnglish German Konjunktiv II\n\nI would (do something) ich würde + infinitive\n\nExamples from the story (adapted):\n\nShe would lose more than money. Sie würde mehr als Geld verlieren.\n\nIf I had a key, I would stay. Wenn ich einen Schlüssel hätte, würde ich bleiben.\n\nIf he were here, he would help. Wenn er hier wäre, würde er helfen.\n\nKey pattern for würde: würde + infinitive at the end. The main verb doesn't change — würde does all the work.\n\nWhy this matters: Starting now, you will see würde, hätte, and wäre in every chapter. Recognizing them means you understand when something is hypothetical, not real. Also, Matei uses them to make dark jokes about burning down the Café. Pay attention.", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}], "gate": {"clue": "What is the German word for \"the first day\"?", "answer": "erste tag", "hint": "der erste Tag"}, "vocab": [{"german": "perfekt", "english": "perfect"}, {"german": "die Arbeit", "english": "work"}, {"german": "die Richtung", "english": "direction"}, {"german": "verwirrt", "english": "confused"}, {"german": "die Routine", "english": "routine"}, {"german": "das Taxi", "english": "taxi"}, {"german": "die Gasse", "english": "alley"}, {"german": "nicht", "english": "abgeschlossen unlocked"}, {"german": "bewusstlos", "english": "unconscious"}, {"german": "der Puls", "english": "pulse"}, {"german": "das Zittern", "english": "trembling"}, {"german": "112", "english": "emergency number number"}, {"german": "der Sanitäter", "english": "paramedic"}, {"german": "die Trage", "english": "stretcher"}, {"german": "die Sirene", "english": "siren"}, {"german": "das Antiseptikum", "english": "antiseptic"}, {"german": "der Schlaganfall", "english": "stroke"}, {"german": "die Rehabilitation", "english": "rehabilitation"}, {"german": "fähig", "english": "capable"}, {"german": "das Passwort", "english": "password"}, {"german": "die Wohnung", "english": "apartment"}, {"german": "das Sofa", "english": "sofa / couch"}, {"german": "die Lampe", "english": "lamp"}, {"german": "die Heizung", "english": "radiator / heating"}, {"german": "wenn", "english": "when / if"}, {"german": "der Schlüssel", "english": "key"}, {"german": "das Spülwasser", "english": "dishwater"}, {"german": "die Leuchtstoffröhre", "english": "fluorescent tube"}, {"german": "das Passwort", "english": "password"}, {"german": "würden", "english": "would (subjunctive)"}, {"german": "haben", "english": "to have (subjunctive)"}, {"german": "sein", "english": "to be (subjunctive)"}, {"german": "die Leuchtstoffröhre", "english": "fluorescent tube"}, {"german": "das Passwort", "english": "password"}, {"german": "würde", "english": "would (subjunctive)"}, {"german": "haben", "english": "to have (subj.)"}, {"german": "sein (subj.)", "english": "would be"}], "shadow": ["Formal phone German. Read aloud and memorise:", "Hallo, hier ist Yves. — Hello, this is Yves.", "Kann ich bitte mit [Name] sprechen? — Can I please speak with [Name]?", "Ich rufe wegen [Thema] an. — I am calling about [topic].", "Danke fuer Ihren Rueckruf. — Thank you for returning my call.", "These four phrases will cover 80% of professional phone calls in your Ausbildung. Say them until they are automatic."]}, {"id": 11, "title": "The First Day", "scenes": [{"prose": "I opened the Café at 5:45 AM.\n\nThat's not a Tippfehler. Five forty-five. In the morning. Before the sun. Before the birds. Before any vernünftiger Mensch should be allowed to operate heavy machinery like an espresso machine that hissed like it wanted to kill me.\n\n\"You and me,\" I told the espresso machine, \"we're going to have a conversation. And by conversation, I mean you will work, or I will throw you into the Kanal.\"\n\nThe espresso machine hissed.\n\n\"That's what I thought.\"\n\nThe blue notebook was exactly where Frau Schmidt said it would be. Behind the counter, in the drawer, next to a bag of spare change and a photograph of a man I didn't recognize. Her husband, probably. The one who had packed a bag three times. He looked tired. I understood.\n\nThe notebook had everything. Passwörter. Supplier numbers. Instructions for the espresso machine written in a mix of German and English that made my eyes cross. Turn the red knob. Wait for the green light. Do not overfill the filter or you will bereuen it.\n\nThe first espresso shot was pure Holzkohle. I dumped it. The second was slightly less burnt. I dumped that too. By the fifth attempt, I had something that resembled coffee and not liquid asphalt.\n\n\"Progress,\" I told Matei Jr., who was not there. I had left him at home. Talking to a plant in public felt like a step too far. Even for me.\n\nAt 6:15, I unlocked the front door.\n\nThe green awning rolled out with a sound like a dying accordion. The chalkboard sign said Heute geöffnet in Frau Schmidt's handwriting. I didn't have the heart to change it. Also, my handwriting looked like a spider had fallen into an inkwell and had a seizure.\n\nThe first customer arrived at 6:30.\n\nAn old man with a newspaper and a Limp. He ordered something in German. I understood the word Kaffee and nothing else.\n\n\"Black?\" I asked.\n\nHe looked at me like I had grown a second head.\n\n\"Schwarz?\" I tried.\n\nHe nodded. I made him a black coffee. He took a sip. Made a face that said this is terrible but I am too polite to say so. Drank it anyway.\n\n\"Danke,\" he said, and left a two-Euro tip.\n\n\"Thank you,\" I said. \"Come back tomorrow. I'll be better. Probably. Maybe.\"\n\nHe walked out. I put the tip in my pocket. Frau Schmidt had said tips were for the Personal. I was the staff. I was also the manager, the dishwasher, and the person who had almost cried four times before 7 AM.\n\nBy 8 AM, I had made sixteen coffees, dropped one cup, and learned the German word for receipt — Quittung — from a woman who yelled it at me three times before I understood.\n\n\"Quittung,\" I repeated.\n\n\"That's a terrible word. It sounds like something you cough up.\"\n\nShe did not laugh. She took her receipt and left.\n\n\"Tough crowd,\" I told the espresso machine.\n\nThe espresso machine hissed.\n\nHe was supposed to be at the bookstore. Instead, he was standing in the doorway, holding a bag of pastries from the bakery down the street. He was also wearing a shirt that said I'm silently judging you in German. I didn't know he owned that shirt. I didn't know that shirt existed.\n\n\"You look terrible,\" he said.\n\n\"I feel terrible.\"\n\n\"How many cups?\"\n\n\"I also burned my hand on the Dampfstab.\"\n\nHe walked behind the counter. Took my hand. Examined the burn. It was small. A red mark on my thumb. He kissed it.\n\n\"That doesn't help.\"\n\n\"You're not the one who is burned.\"\n\n\"Emotionally, I am.\"\n\nHe put the pastries in the display case. Took over the espresso machine while I handled the register. Together, we got through the morning rush. It was still Chaos. But it was shared Chaos.\n\nAt 9:30, the Café emptied. I collapsed into a chair. Matei sat across from me.\n\n\"You're not at work.\"\n\n\"I called in sick.\"\n\n\"You're not sick.\"\n\n\"I'm emotionally sick. Watching you struggle is exhausting.\"\n\nI threw a sugar packet at him. He caught it without looking.\n\n\"I've been doing this longer than you.\"\n\n\"That's not a flex. That's just sad.\"\n\nHe almost smiled. Almost. Then the bell above the door chimed, and a woman walked in.\n\nShe was young. Maybe thirty. Dark hair. A red coat that looked expensive. She carried a leather bag and walked like she owned the room. Also like she had never dropped a single cup of coffee in her entire privileged life.\n\n\"Guten Morgen,\" she said. Then she looked at me. Her eyes narrowed.", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}, {"prose": "\"Do I know you?\" I asked.\n\nShe smiled. It was a strange smile. Not warm. Not cold. Something in between. Like she knew something I didn't. Which was annoying, because I was already having a bad day.\n\n\"You don't remember me. That's okay. It was a long time ago.\" She walked to the counter. \"I'll have a latte. Hafermilch. Extra hot.\"\n\nMatei made the latte. I stood there, trying to place her face. The dark hair. The sharp cheekbones. The way she said my name like she had a right to it.\n\nShe paid. Took her latte. Sat at a table by the window. She did not sit at the table with the carved heart. She sat at the table next to it. The one with the wobbly leg.\n\n\"Who was that?\" Matei asked quietly.\n\n\"She knew your name.\"\n\n\"She also knew you worked here.\"\n\n\"I noticed that too.\"\n\n\"Do you want me to go ask her?\"\n\n\"And say what? 'Excuse me, strange woman, why do you know my boyfriend's name?' That's not creepy at all.\"\n\n\"I can be charming.\"\n\n\"You're Romanian. That's not the same thing.\"\n\nHe made a face. I watched the woman from behind the counter. She wasn't looking at me. She was looking at her phone, typing something, smiling at the screen.\n\nUnknown number: You look good, Yves. Berlin suits you.\n\nI looked at the woman. She looked at me. She smiled again.\n\n\"Who is she?\" Matei asked.\n\n\"I told you. I don't know.\"\n\n\"She just texted you.\"\n\n\"Are you going to respond?\"\n\n\"And say what? 'Thanks, stranger who knows my name and my location'? That's how you get murdered.\"\n\n\"You're not going to get murdered.\"\n\n\"You don't know that.\"\n\n\"I know you. You're too annoying to murder. No one would want to listen to you that long.\"\n\n\"That's romantic.\"\n\n\"I'm a romantic person.\"\n\nI did not respond to the text. I put my phone away. Made another coffee for a customer who wasn't there. The woman finished her latte, stood up, walked to the counter.\n\n\"Same time tomorrow?\" she asked.\n\n\"I don't even know your name.\"\n\n\"No. You don't.\"\n\nShe left. The bell chimed. The door closed.\n\n\"That was seltsam,\" Matei said.\n\n\"Do you have any idea who she is?\"\n\nI thought about it. The dark hair. The sharp cheekbones. The way she said my name.\n\n\"No. But I think she knows me.\"\n\n\"That's not comforting.\"\n\n\"Welcome to my life.\"\n\nThe rest of the day was a blur.\n\nMore customers. More coffee. More dropped cups — two more, because my hands were shaking and I couldn't stop thinking about the woman in the red coat.\n\n\"That's three cups today,\" Matei said.\n\n\"That's a record.\"\n\n\"Thank you for keeping track.\"\n\n\"Someone has to.\"\n\nAt 3 PM, Matei left for his shift at the bookstore. He kissed my forehead and told me to lock the door behind me.\n\n\"Text me if she comes back.\"\n\n\"How do you know?\"\n\n\"Because she said 'same time tomorrow.' That means she's planen something. People who are planning something don't come back the same day. They wait. It's dramatic.\"", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}, {"prose": "\"You know a lot about dramatic people.\"\n\n\"I live with one.\"\n\n\"You live with me.\"\n\nHe left. I locked the door. Cleaned the counters. Counted the register. Turned off the lights. The espresso machine hissed one last time, like it was saying goodbye.\n\n\"See you tomorrow,\" I told it. \"Don't be a jerk.\"\n\nIt hissed. I chose to interpret this as no promises.\n\nThe streets were grey. The duck wasn't at the bridge. I didn't care. I was too busy thinking about the woman in the red coat. The way she had said my name. The way she had smiled. The way she had texted me like she had a right to my Aufmerksamkeit.\n\nUnknown number: You're wondering who I am. That's cute. See you tomorrow, Yves.\n\nI did not respond. I blocked the number.\n\nThen I unblocked it. Because if she was going to be weird, I wanted to know about it.\n\n\"This is how people get murdered,\" I told myself.\n\nMyself did not respond. Myself was busy being annoyed.\n\nMatei was already home when I got there.\n\nHe was sitting on the Sofa, his laptop open, not typing. Just staring at the screen. The screen was blank.\n\n\"You're home early,\" I said.\n\n\"The bookstore was slow.\"\n\n\"I'm worried.\" He closed the laptop. \"Who was that woman?\"\n\n\"You don't know, or you don't want to tell me?\"\n\nI sat on the wooden chair. The plastic one was still empty. It was always empty. I was starting to feel bad for it.\n\n\"I don't know. I have never seen her before. But she knew my name. And she knew I was in Berlin. And she knew I worked at the Café.\"\n\n\"That's not nothing.\"\n\n\"Yves.\" He leaned forward. \"Did you leave behind something in Nigeria? Someone? A situation?\"\n\nI thought about it. My Großmutter. My coworkers. The friends who had stopped calling. The people I had ghosted because I couldn't handle their questions about why I was leaving.\n\n\"No. Nothing like that.\"\n\n\"Then why is she here?\"\n\n\"Did you maybe... I don't know... accidentally become famous and not tell me?\"\n\n\"I'm a barista who once asked for a glass of cow. I'm not famous.\"\n\n\"You're famous in my heart.\"\n\n\"That's not helpful right now.\"\n\n\"It's always helpful to know you're famous in my heart.\"\n\nHe stood up. Walked to the window. Stared out at the street.\n\n\"I don't like this.\"\n\n\"What are we going to do?\"\n\nI stood up. Walked to him. Put my hand on his back.\n\n\"We're going to open the Café tomorrow. And if she comes back, we're going to ask her who she is and what she wants.\"\n\n\"And if she doesn't tell us?\"\n\n\"Then we call the Polizei.\"\n\n\"And say what? 'A woman knows my boyfriend's name'? That's not a crime.\"\n\n\"I'll write to my congressman.\"\n\n\"You don't have a congressman. You're Romanian.\"\n\n\"I'll write to someone.\"\n\nHe turned. His face was close to mine.\n\n\"You're taking this very calmly.\"\n\n\"I'm not calm. I'm pretending to be calm. There's a Unterschied.\"\n\n\"You've said that before.\"\n\n\"It's still true.\"\n\nHe kissed me. Hard. Brief.", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}, {"prose": "\"Okay. Tomorrow. We figure it out.\"\n\n\"And if she tries to kidnap me, you have to do something heroic.\"\n\n\"I don't know. You're creative.\"\n\n\"I'll throw a book at her.\"\n\n\"A first edition.\"\n\n\"Not the Kafka.\"\n\n\"The Kafka is mine. I'll throw something else.\"\n\n\"You're ridiculous.\"\n\nThat night, I didn't sleep.\n\nI lay in bed, staring at the ceiling, listening to Matei breathe. His arm was around my waist. His chest was warm against my back.\n\nI thought about the woman in the red coat. The way she had said my name. The way she had smiled. The way she had texted me like she had a right to my Aufmerksamkeit.\n\nI had spent my whole life running from people who knew me. People who wanted things from me. People who reminded me of who I used to be.\n\nBut I didn't know who I used to be anymore. I was Yves. Berlin. Coffee. Matei.\n\nThat was supposed to be enough.\n\nMy phone buzzed. I had forgotten to block the number again.\n\nUnknown number: I know you blocked me. That's fine. I'll see you tomorrow anyway. Sleep well, Yves.\n\n\"Creepy,\" I said.\n\n\"What's creepy?\" Matei murmured.\n\n\"Nothing. Go back to sleep.\"\n\n\"You're thinking too loud.\"\n\n\"Don't be sorry. Just sleep.\"\n\nBut somewhere in the city, a woman in a red coat was walking through the dark, and she knew my name, and she wasn't finished with me yet.\n\n\"If I get murdered,\" I whispered, \"you have to avenge me.\"\n\n\"I'll throw a book at her.\"\n\n\"I love you too. Now sleep.\"\n\nder Tippfehler typo masculine\n\nvernünftig reasonable adjective\n\ndie Holzkohle charcoal feminine\n\nder Limp limp masculine (loan)\n\ndie Quittung receipt feminine\n\nder Dampfstab steam wand masculine\n\nemotional emotional adjective (loan)\n\ndie Hafermilch oat milk feminine\n\ndie Aufmerksamkeit attention feminine\n\ndie Polizei police feminine\n\nder Unterschied difference masculine (review)\n\nder Angeber show-off masculine (review)\n\ndie Großmutter grandmother feminine (review)\n\nFrom this chapter: \"Sei still\" (Be quiet) — but more relevant: \"Sei vorsichtig\" (Be careful) and the implied \"Werd nicht wütend\" (Don't become angry).\n\nYou have already seen sei (be) in Chapter Seven. The imperative of sein is irregular:\n\ndu (informal singular) sei\n\nihr (informal plural) seid\n\nMore imperatives you will see soon:\n\nExamples from future chapters: \"Bleib hier\" (Stay here) or \"Werd nicht wütend\" (Don't become angry).\n\nWhy this matters: Imperatives are everywhere in spoken German — giving directions, warnings, advice. Recognizing them helps you understand urgency and tone. Also, Matei uses them to tell Yves not to do stupid things. Which is often.", "choices": ["Notice the silence between them", "Focus on what is being said"]}], "gate": {"clue": "What is the German word for \"luck / happiness\"?", "answer": "glueck", "hint": "das Glueck"}, "vocab": [{"german": "der Tippfehler", "english": "typo"}, {"german": "vernünftig", "english": "reasonable"}, {"german": "bereuen", "english": "to regret"}, {"german": "die Holzkohle", "english": "charcoal"}, {"german": "der Limp", "english": "limp"}, {"german": "das Personal", "english": "staff"}, {"german": "die Quittung", "english": "receipt"}, {"german": "der Dampfstab", "english": "steam wand"}, {"german": "das Chaos", "english": "chaos"}, {"german": "emotional", "english": "emotional"}, {"german": "die Hafermilch", "english": "oat milk"}, {"german": "seltsam", "english": "strange"}, {"german": "planen", "english": "to plan"}, {"german": "die Aufmerksamkeit", "english": "attention"}, {"german": "die Polizei", "english": "police"}, {"german": "der Unterschied", "english": "difference"}, {"german": "der Angeber", "english": "show-off"}, {"german": "die Großmutter", "english": "grandmother"}, {"german": "heute", "english": "today"}, {"german": "danke", "english": "thank you"}, {"german": "gut", "english": "good"}, {"german": "der Morgen", "english": "morning"}, {"german": "das Sofa", "english": "sofa / couch"}, {"german": "vernünftig", "english": "reasonable / sensible"}, {"german": "das Passwort", "english": "password"}, {"german": "öffnen", "english": "to open"}, {"german": "wütend", "english": "angry / furious"}, {"german": "vernünftig", "english": "more reasonable"}, {"german": "das Passwort", "english": "password"}, {"german": "öffnen", "english": "to open"}], "shadow": ["Formal email register — read and practise. This is the template for every professional email you will write during your Ausbildung:", "Sehr geehrte/r [Name], — Dear [Name],", "Ich schreibe Ihnen bezueglich [Thema]. — I am writing to you regarding [topic].", "Koennen Sie mir bitte [Bitte] mitteilen? — Could you please let me know [request]?", "Fuer Ihre Unterstuetzung bedanke ich mich im Voraus. — Thank you in advance for your support.", "Mit freundlichen Gruessen, — Kind regards,", "Yves [Nachname] — Yves [Surname]", "This structure is not optional in German professional life. It is expected. Learn it once, use it always."]}, {"id": 12, "title": "Lucky", "scenes": [{"prose": "She came back the next day.\n\nSame red coat. Same leather bag. Same Lächeln that wasn't warm or cold but somewhere in between — the kind of smile that said I know something you don't, and I'm going to enjoy watching you figure it out.\n\nShe ordered the same thing — latte, Hafermilch, extra hot — and paid with the same crisp Euro. The bills were so new they crackled.\n\nI made her drink. My hands were steady. I was proud of that.\n\n\"You didn't sleep well,\" she said. Not a question.\n\n\"How would you know?\"\n\n\"Your eyes. They're tired. Also, you have a stain on your shirt. Coffee, I think. From yesterday.\"\n\nI looked down. There was a stain. Right over my heart. Of course.\n\n\"That's not coffee. That's my soul. It leaks.\"\n\nShe laughed. It was a vertrautes laugh. Something from a long time ago, buried under years of forgetting.\n\n\"You always had a comeback. Even when you were little. Your Großmutter would yell at you, and you would just stand there with your arms crossed, waiting for her to finish so you could say something smart.\"\n\n\"I don't remember that.\"\n\n\"I do. I remember everything.\"\n\n\"Great. Another person who remembers everything. That's not annoying at all.\"\n\n\"Who's the other person?\"\n\n\"My boyfriend. He's a human calendar. It's exhausting.\"\n\nShe tilted her head. \"Boyfriend?\"\n\n\"Matei. The one who made your latte yesterday. The one you ignored.\"\n\n\"I didn't ignore him. I was observing.\"\n\n\"That's what I say.\"\n\n\"Or creepy minds.\"\n\nShe took a sip of her latte. Her eyes didn't leave mine.\n\n\"You've changed,\" she said.\n\n\"That's what happens when you leave home and start a new life. You change.\"\n\n\"Not everyone changes. Some people just get older.\"\n\n\"That's profound. Did you read that on a candle?\"\n\nShe laughed again. \"You're still funny.\"\n\n\"I'm still alive. That's the same thing for me.\"\n\nShe set her cup down. Looked at me. Really looked. The way you look at someone when you're trying to decide if they're worth the trouble.\n\n\"You don't recognize me, do you?\"\n\n\"I told you. No.\"\n\n\"Not even a little?\"\n\nShe leaned forward. Her face was close to mine. Close enough that I could see the small scar on her eyebrow. Close enough that I could smell her perfume — something floral, expensive, the kind of thing you buy when you have money and want everyone to know it.\n\n\"Adaeze,\" she said. \"But you knew me as Ada.\"\n\nThe name hit me like a door slamming.\n\nAda. Ada with the braids. Ada who lived down the street. Ada who used to sneak me food from her mother's kitchen when my Großmutter forgot to cook. Ada who I had kissed once, behind the church, just to see what it felt like.\n\nAda who I had stopped talking to when I realized I was kissing boys in secret and couldn't look her in the eye anymore.\n\n\"Ada had braids. And she was shorter. And she —\"\n\n\"I grew. People do that. It's called aging.\"\n\n\"I know what aging is. I just didn't expect you to —\"\n\n\"To what? Exist? In Berlin? In your Café? With a better haircut?\"\n\n\"Your haircut is fine.\"\n\n\"That wasn't a compliment.\"\n\n\"I'm taking it as one.\"\n\n\"Why are you here, Ada?\"", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}, {"prose": "\"I live here now. Moved to Berlin last month. For work.\" She took another sip. \"I saw you through the window. I couldn't believe it. Lucky, in Berlin, making coffee. I had to come in.\"\n\n\"Don't call me that.\"\n\n\"Call you what?\"\n\n\"Lucky. That's not my name anymore.\"\n\n\"What is your name now?\"\n\n\"Yves.\" She said it slowly, like she was tasting it. \"French. Fancy. You always wanted to be somewhere else.\"\n\n\"I wanted to be somewhere I wasn't known.\"\n\n\"And now I'm here. So much for that.\"\n\n\"You're here. For now. You could leave.\"\n\n\"I could. But I won't.\"\n\n\"Because I want to see what happens.\"\n\n\"Nothing is going to happen.\"\n\n\"Something is always happening, Lucky. That's the problem.\"\n\nShe smiled. The warm kind this time. The kind that reminded me of sitting on her porch, sharing a mango, pretending we had nowhere to be.\n\n\"You kissed me once,\" she said.\n\n\"I was nine. I thought about that kiss for years.\"\n\n\"That's concerning.\"\n\n\"It's not concerning. It's honest.\"\n\n\"Honest is overrated.\"\n\n\"That's what someone who is bad at honesty would say.\"\n\nThe bell chimed. Matei walked in.\n\nHe was wearing his grey coat. His hair was messy. His eyes went straight to Ada, then to me, then back to Ada. His expression didn't change. But his jaw tightened. Just a little. The kind of thing you wouldn't notice unless you were watching for it.\n\nI was always watching for it.\n\n\"Yves,\" he said. \"Who's this?\"\n\nThis was the moment. I could introduce her as Ada, an old friend from Nigeria. I could tell the truth — that she was someone I had kissed once, someone who knew me before I knew myself. I could be honest, the way Matei had asked me to be.\n\nBut I was scared. Scared of what Matei would think. Scared of the questions he would ask. Scared of the boy I used to be, the one who kissed girls behind churches and pretended he was normal.\n\n\"An old friend,\" I said. \"Ada.\"\n\nMatei looked at her. Then at me.\n\n\"Nice to meet you,\" he said. His voice was flat. The same flat he used when a customer asked a stupid question. \"I'm Matei.\"\n\n\"The boyfriend,\" Ada said.\n\n\"The roommate,\" I said.\n\nI had said it. I had actually said it.\n\nMatei's expression didn't change. But his hands — his hands curled into fists at his sides.\n\n\"Roommate,\" he repeated.\n\n\"That's what I said.\"\n\n\"That's what you said.\"\n\nHe walked behind the counter. Didn't touch me. Didn't look at me. Started cleaning the espresso machine. The brass one that hissed. It hissed at him. He didn't flinch.\n\nAda finished her latte. Stood up. Sling her bag over her shoulder.\n\n\"I'll be around, Lucky. We should catch up properly. Maybe dinner?\"\n\n\"Maybe,\" I said.\n\n\"Bring your roommate.\"\n\nShe left. The bell chimed. The door closed.\n\nMatei didn't look up from the espresso machine.\n\n\"Roommate,\" he said again.\n\n\"Roommate. That's what I am. A roommate.\"", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}, {"prose": "\"You don't understand.\"\n\n\"Then explain it to me.\"\n\nI walked to him. Put my hand on his arm. He didn't pull away, but he didn't lean in either.\n\n\"That's Ada. I knew her when I was a kid. In Nigeria. She called me Lucky. That was my name before Yves.\"\n\n\"I don't care what your name was.\"\n\n\"I kissed her once. Behind a church. I was eight. She was nine. I didn't know what I was doing.\"\n\n\"I don't care about that either.\"\n\n\"Then what do you care about?\"\n\nHe finally looked at me. His grey eyes were hard.\n\n\"I care that you introduced me as your roommate. I care that you lied. I care that you're still hiding.\"\n\n\"I'm not hiding.\"\n\n\"You just hid me.\"\n\nThe words hit like a punch.\n\n\"Of her. Of what she would think. Of what she would say. She knew me before. Before I knew myself. She thought I was straight. She thought — she thought I was going to grow up and marry her or someone like her. And I couldn't — I couldn't just —\"\n\n\"You couldn't tell her the truth.\"\n\n\"Because I'm still scared, okay? I'm still scared of people knowing. I'm still scared of what they'll think. I'm still the same person who ran away from Nigeria because I couldn't handle being seen. I haven't magically become brave just because I have a boyfriend who makes good coffee.\"\n\n\"I make excellent coffee.\"\n\n\"That's not the point.\"\n\n\"It's part of the point.\"\n\nHe pulled his arm away. Walked to the window. Stared out at the street.\n\n\"I'm not asking you to come out to everyone. I'm asking you not to hide me.\"\n\n\"I wasn't hiding you.\"\n\n\"You called me your roommate. In my own Wohnung. The Wohnung where you sleep in my bed. Where you named my plant after me. Where you keep a list of my almost-smiles in your Notizbuch.\"\n\n\"How do you know about the list?\"\n\n\"You left it on the table. Page nineteen.\"\n\n\"You read my Notizbuch?\"\n\n\"It was open. The duck was wearing a crown.\"\n\n\"That's an invasion of privacy.\"\n\n\"That's called being in a relationship. People read each other's notebooks. It's in the contract.\"\n\n\"There's no contract.\"\n\n\"There should be.\"\n\n\"You're impossible.\"\n\n\"I'm Romanian. Same thing.\"\n\nI laughed. I couldn't help it.\n\n\"You're not funny.\"\n\n\"I'm hilarious. You're just stressed.\"\n\n\"I am stressed. A strange woman from my past just showed up at my Café, and I introduced you as my roommate, and now you're angry, and I don't know how to fix it.\"\n\n\"I'm not angry.\"\n\n\"You look angry.\"\n\n\"I look Romanian. There's a Unterschied.\"\n\n\"No. But I'm working on it.\"\n\nHe walked back to me. Put his hands on my shoulders. His thumbs pressed into the tense muscles of my neck.\n\n\"I'm not angry, Yves. I'm tired. I'm tired of being hidden. I'm tired of being the secret. I'm tired of being the roommate when I'm the person who loves you.\"\n\n\"I love you too.\"\n\n\"Then act like it.\"", "choices": ["Notice the silence between them", "Focus on what is being said"]}, {"prose": "\"Next time, introduce me as your boyfriend. Or your partner. Or your annoying Romanian who steals your pastries. I don't care what you call me. Just don't call me your roommate.\"\n\n\"What if I call you my emotional support Eastern European?\"\n\n\"What if I call you my personal coffee artist?\"\n\n\"That's not a thing.\"\n\n\"What about der Freund? Just der Freund.\"\n\nHe was quiet for a moment. Then: \"That works.\"\n\n\"Okay. Next time. Der Freund.\"\n\n\"I'll do better.\"\n\n\"Also, I ate your apricot pastries again.\"\n\n\"I know. I saw the crumbs.\"\n\n\"You're not going to yell at me?\"\n\n\"I'm saving it for later. For when you really mess up.\"\n\n\"That's ominous.\"\n\nHe kissed my forehead. Soft. Brief.\n\n\"Now call Ada. Invite her to dinner. And this time, introduce me properly.\"\n\n\"What if she doesn't like you?\"\n\n\"Everyone likes me.\"\n\n\"That's not true.\"\n\n\"It's true enough.\"\n\n\"You're impossible.\"\n\n\"Unfortunately.\"\n\nHe kissed me again. This time on the mouth. The espresso machine hissed. I chose to interpret this as approval.\n\nvertraut familiar adjective\n\ndie Großmutter grandmother feminine (review)\n\nder Freund friend / boyfriend masculine\n\ndie Wohnung apartment feminine (review)\n\ndas Notizbuch notebook neuter (review)\n\nder Unterschied difference masculine (review)\n\nemotional emotional adjective (review)\n\nder Ex ex masculine (review)\n\ndie Vergangenheit past feminine (implied)\n\nehrlich honest adjective (implied)\n\ndie Angst fear feminine (review)\n\ndas Geheimnis secret neuter (implied)\n\nFrom this chapter: \"my Notizbuch\" → mein Notizbuch, \"your boyfriend\" → dein Freund, \"his apartment\" → seine Wohnung.\n\nPossessive pronouns change endings based on the gender/case of the noun they modify.\n\nThe base forms (nominative, masculine, no ending):\n\nyou (ihr) euer your (plural)\n\nthey / Sie ihr / Ihr their / your (formal)\n\nExample endings you have seen:\n\n· meiner Großmutter (dative feminine → -er)\n\n· seine Hand (nominative feminine → -e)\n\n· deinen Namen (accusative masculine → -en)\n\nWhy this matters: Possessives appear constantly. Instead of memorizing the case ending table, notice the patterns as you read. The most common endings are -e (nominative feminine/plural), -en (accusative masculine / dative plural), and -er (dative feminine).\n\nPractical tip: When you see mein, look at the noun after it. If the noun has an ending like -e or -en, the possessive will match. Your brain will absorb this naturally. Also, Matei uses possessives to claim things. Mein Kaffee. Mein Yves. Mein Notizbuch. It's cute. Annoying. But cute.", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}], "gate": {"clue": "What is the German word for \"dinner\"?", "answer": "abendessen", "hint": "das Abendessen"}, "vocab": [{"german": "das Lächeln", "english": "smile"}, {"german": "vertraut", "english": "familiar"}, {"german": "die Großmutter", "english": "grandmother"}, {"german": "normal", "english": "normal"}, {"german": "der Freund", "english": "friend / boyfriend"}, {"german": "die Wohnung", "english": "apartment"}, {"german": "das Notizbuch", "english": "notebook"}, {"german": "der Unterschied", "english": "difference"}, {"german": "emotional", "english": "emotional"}, {"german": "der Ex", "english": "ex"}, {"german": "die Vergangenheit", "english": "past"}, {"german": "ehrlich", "english": "honest"}, {"german": "die Angst", "english": "fear"}, {"german": "das Geheimnis", "english": "secret"}], "shadow": ["Introductions in German — formal and informal. Read both versions aloud.", "Informal: Das ist Matei. Er wohnt hier. Wir... kennen uns. — This is Matei. He lives here. We... know each other.", "Formal: Darf ich vorstellen — das ist Matei. — May I introduce — this is Matei.", "Notice the ellipsis in the informal version. Wir kennen uns is technically 'we know each other' but Yves uses it because he doesn't have a better word yet. By the end of this book, he will."]}, {"id": 13, "title": "The Dinner", "scenes": [{"prose": "Ada picked a Restaurant in Neukölln.\n\nSomething trendy with exposed brick and candles in wine bottles and a Speisekarte written in German that I couldn't read. The kind of place where the portions were small and the prices were large and the waiters looked like they had never dropped a single cup of coffee in their entire perfect lives.\n\n\"This place looks expensive,\" I said.\n\n\"It is,\" Ada said.\n\n\"Why did you pick an expensive place?\"\n\n\"Because you owe me. Twelve years of silence. Interest has accrued.\"\n\n\"That's not how friendship works.\"\n\n\"It's how my friendship works.\"\n\nShe was already there when we arrived, sitting at a table by the window, her red coat draped over the back of her chair like a superhero cape. She had changed into a black dress. She looked like she was about to close a business deal or attend a funeral. Possibly both.\n\n\"You look nice,\" I said.\n\n\"That was supposed to be a compliment.\"\n\n\"I took it as one.\"\n\nShe stood up. Hugged me. Held on too long.\n\n\"You came,\" she said.\n\n\"I said I would.\"\n\n\"You also said you'd write me when you left Nigeria. You didn't.\"\n\n\"I'm not good at goodbyes.\"\n\n\"You never were.\"\n\nShe pulled back. Looked at Matei. He was standing behind me, hands in his coat pockets, face neutral. He had changed into a clean shirt. The one without the coffee stain. I had ironed it for him. He had complained that I was ironing wrong. I had threatened to iron his face. We had compromised.\n\n\"You brought your roommate,\" Ada said.\n\nMatei's jaw tightened. Just a little.\n\n\"He's not my roommate.\"\n\nAda raised an eyebrow. \"No?\"\n\nI took a breath. Matei's hand found the small of my back. A touch. A reminder.\n\n\"This is Matei. He's my Freund.\"\n\nThe word hung in the air. Freund. I had never said it out loud before. Not about anyone. Not about him. It felt strange in my mouth. Foreign. Like speaking a language I had only just learned.\n\nAda's expression didn't change. She looked at Matei. Then at me. Then back at Matei.\n\n\"The boyfriend,\" she said.\n\n\"The boyfriend,\" I confirmed.\n\n\"Not the roommate.\"\n\n\"Not the roommate.\"\n\n\"The one who makes your coffee.\"\n\n\"Among other things.\"\n\n\"What other things?\"\n\n\"That's private.\"\n\n\"And I'm not answering.\"\n\nShe smiled. \"Okay.\"\n\n\"Okay.\" She sat back down. Picked up her wine glass. \"Sit. I ordered for us already. I hope you still like spicy food.\"\n\n\"What if I don't?\"\n\n\"Then you should have written me back.\"\n\nMatei pulled out my chair. I blinked at him.\n\n\"What are you doing?\"\n\n\"You're never polite.\"\n\n\"I'm always polite. I'm Romanian.\"\n\n\"You said that last time. It's not a get-out-of-jail-free card.\"\n\n\"It's working so far.\"\n\nAda watched us with the expression of someone who was enjoying herself way too much.\n\n\"You two are weird,\" she said.\n\n\"We're in love,\" Matei said.\n\n\"That's what I keep telling him.\"\n\n\"You're not helping,\" I said.\n\n\"I'm not trying to help. I'm trying to be charming.\"\n\n\"You're failing.\"\n\n\"I'm Romanian. Failing at charm is our national pastime.\"\n\nAda laughed. It was the same laugh from twelve years ago, the one that used to make me feel safe. It still worked.\n\nIt was good. Spicy, like Ada remembered. Rice. Vegetables. Some kind of chicken that made my eyes water. I ate without tasting. I was too busy watching Matei and Ada watch each other.\n\n\"So,\" Ada said, twirling noodles around her fork. \"Freund.\"\n\n\"A few weeks. But we've known each other longer.\"\n\n\"How much longer?\"", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}, {"prose": "\"Two years. Online.\"\n\nShe nodded slowly. \"And you moved to Berlin for him?\"\n\n\"I moved to Berlin because I needed to leave. He was part of it. Not all of it.\"\n\n\"What was the rest of it?\"\n\n\"I'm a vague person.\"\n\n\"You're not. You're specific. You just pretend to be vague so people don't ask questions.\"\n\n\"That's not true.\"\n\n\"It's exactly true. You've been doing it since you were eight. I'd ask what you were thinking, and you'd say 'nothing,' and then you'd go write it in your notebook.\"\n\n\"You remember my notebook?\"\n\n\"You had a notebook. You wrote everything in it. You wrote about your Großmutter. You wrote about the boys you liked but couldn't name. You wrote about wanting to be somewhere else.\" She set her fork down. \"I read it once. You left it open on the porch.\"\n\nI stared at her. \"You read my notebook?\"\n\n\"That's an invasion of privacy.\"\n\n\"That's what friends do. They invade each other's privacy.\"\n\n\"It's a little bit true,\" Matei said.\n\n\"Stay out of this.\"\n\n\"I'm just saying. You left your notebook open on the table. Page nineteen. The duck with the crown.\"\n\n\"You're both terrible.\"\n\n\"We're honest,\" Ada said.\n\n\"Same thing,\" Matei said.\n\n\"I hate both of you.\"\n\n\"No, you don't,\" they said together.\n\nI threw my napkin at Matei. He caught it without looking. Angeber.\n\nAda put her fork down. Looked at me.\n\n\"You kissed me once.\"\n\n\"You were eight. I was nine. I thought about that kiss for years.\"\n\n\"That's concerning.\"\n\n\"It's not concerning. It's honest.\"\n\n\"Honest is overrated.\"\n\n\"You said that already. At the Café.\"\n\n\"It's still true.\"\n\n\"I thought you liked me.\"\n\n\"I did like you.\"\n\n\"Not the way I liked you.\"\n\nI didn't know what to say. Matei's hand found mine under the table. His fingers laced through mine.\n\n\"Ada. I didn't know who I was back then. I barely know now.\"\n\n\"So you kissed me to figure it out?\"\n\n\"I kissed you because I was trying to be someone I wasn't.\"\n\nShe was quiet for a long moment. The restaurant was loud around us — people laughing, glasses clinking, a waitress shouting orders in rapid German. I caught the word Rechnung and felt a small surge of pride. Then I realized she was yelling at a customer who hadn't paid. So maybe not the best context.\n\n\"I'm not angry,\" Ada said finally. \"I was. For a long time. When you stopped talking to me, I thought I had done something wrong. I thought you hated me.\"\n\n\"I didn't hate you.\"\n\n\"I know that now.\" She looked at Matei. \"You're lucky. He's handsome. In a quiet, judgmental way.\"\n\n\"Thank you,\" Matei said.\n\n\"That wasn't a compliment.\"\n\n\"I'm taking it as one.\"\n\n\"You two really are the same person.\"\n\n\"We're not,\" we said together.\n\nShe laughed. \"See?\"\n\nThe rest of dinner was easier.\n\nAda asked Matei questions. Real ones. Not the polite kind. The kind that made him pause before answering.\n\n\"What do you do?\"\n\n\"I work at a bookstore.\"\n\n\"Do you like it?\"\n\n\"I like books. Customers are optional.\"\n\n\"Do you want to work there forever?\"\n\n\"No. I want to write.\"\n\n\"What do you write?\"\n\n\"Poetry. Bad poetry. I throw most of it away.\"\n\n\"Can I read some?\"\n\n\"Because it's bad. And because Yves would make fun of me.\"", "choices": ["Notice the silence between them", "Focus on what is being said"]}, {"prose": "\"I would not,\" I said.\n\n\"I would only make fun of you a little.\"\n\n\"That's what I said.\"\n\nAda looked between us. \"You're disgusting.\"\n\nShe turned back to Matei. \"Do you love him?\"\n\nHe looked at me. His grey eyes were soft. The kind of soft he only let me see.\n\n\"Because he's the first person who didn't run away when I was quiet. Because he talks to plants. Because he drops cups and apologizes to the floor. Because he made me pasta on the third day and it was the best meal I had had in months.\" He paused. \"Because he's trying. Every day. Even when it's hard.\"\n\nAda stared at him. Then at me.\n\n\"He's a keeper.\"\n\n\"Don't mess it up.\"\n\n\"I'm trying not to.\"\n\nAfter dinner, we walked Ada to the U-Bahn station.\n\nThe streets were dark. The Straßenlaternen cast orange light on the pavement. A man played guitar on the corner. He was bad. Really bad. But he was having a great time.\n\n\"I'm glad you found someone,\" Ada said, hugging me.\n\n\"I'm glad you found Berlin.\"\n\n\"I'm not going anywhere.\" She pulled back. Looked at Matei. \"You too. Don't let him run.\"\n\n\"And don't let him eat all the pastries.\"\n\n\"Then hide them better.\"\n\nShe waved. Walked down the stairs. Disappeared into the station.\n\nThe bad guitarist switched to a song I almost recognized. He was still bad. But he was committed.\n\n\"That wasn't so bad,\" Matei said.\n\n\"I thought she was going to cry.\"\n\n\"She almost did.\"\n\n\"You cry at everything.\"\n\n\"You cried at the duck last week. The duck was just sitting there.\"\n\n\"He looked lonely.\"\n\n\"He's a duck. He doesn't have feelings.\"\n\n\"You don't know that.\"\n\n\"I know a lot of things.\"\n\n\"You know everything. It's exhausting.\"\n\nHe put his arm around my shoulders.\n\n\"I introduced you as my boyfriend.\"\n\n\"Out loud. In front of another person.\"\n\n\"I know. I'm just... processing.\"\n\n\"Take your time.\"\n\n\"I love you too.\"\n\n\"Even though I'm a mess.\"\n\n\"Especially because you're a mess. It's more interesting.\"\n\n\"That's not romantic.\"\n\n\"It's honest. Same thing.\"\n\nWe walked home through the dark streets.\n\nThe Kanal was black. The duck was asleep somewhere, probably dreaming of bread. The U-Bahn rumbled beneath us. The city hummed. Berlin at night was different. Quieter. Less judgmental.\n\n\"Thank you for coming.\"\n\n\"Where else would I be?\"\n\n\"I don't know. Somewhere else. Angry.\"\n\n\"I'm not angry.\"\n\n\"No. I'm tired. There's a Unterschied.\"\n\n\"No. But I'm working on it.\"\n\nHe squeezed my hand. I squeezed back.\n\n\"Also, I ate the rest of the apricot pastries. While you were in the bathroom.\"\n\n\"I know. I saw the crumbs on your shirt.\"\n\n\"That's why you're not angry?\"\n\n\"That's why I'm saving it for later.\"\n\n\"You're impossible.\"\n\n\"Unfortunately.\"\n\nThe next morning, I opened the Café at 6 AM.\n\nI didn't drop any cups. I didn't burn the milk. I made sixteen coffees and remembered to smile at every customer. The espresso machine hissed. I hissed back. It shut up.\n\nAt 9 AM, Matei showed up with pastries. The good kind. The apricot ones. He kissed me behind the counter. A customer whistled. I flipped them off. Matei laughed.\n\n\"You're getting comfortable,\" he said.", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}, {"prose": "\"I'm getting tired.\"\n\nHe helped me through the morning rush. At 11, the Café emptied, and we sat at the table with the heart carved into it. T + M. Not us. Someone else. But maybe one day.\n\n\"Frau Schmidt called,\" I said.\n\n\"Better. She wants to come back next week. Just for a few hours. To help.\"\n\n\"She also said I'm not allowed to quit.\"\n\n\"Are you going to?\"\n\nI looked around the Café. The green awning. The chalkboard sign. The espresso machine that hissed like a cat. The blue notebook with all the Passwörter.\n\n\"No. I think I'm going to stay.\"\n\n\"Good. Because I already told the landlord you're taking over the lease.\"\n\n\"You're insane.\"\n\n\"What if I'd said no?\"\n\n\"What if I burn it down?\"\n\n\"Then we open a Café called Burnt. I told you this.\"\n\n\"You're ridiculous.\"\n\n\"I'm supportive.\"\n\nI kissed him. In the Café. In the morning light. With the bell above the door silent and the street outside waking up.\n\n\"You're not running anymore.\"\n\n\"Good. Because I'm out of pastries to bribe you with.\"\n\n\"You still have the plant.\"\n\n\"Matei Jr. is not a bargaining chip.\"\n\n\"Leave the plant out of this.\"\n\nI laughed. He kissed my forehead.\n\n\"Now make me a coffee. Black. No sugar. No milk.\"\n\n\"You know how to make coffee.\"\n\n\"Yours is better.\"\n\n\"It's a compliment. Take it.\"\n\nI made him a coffee. It was perfect. I hated that it was perfect.\n\n\"You're getting good at this,\" he said.\n\n\"I'm getting good at a lot of things.\"\n\nThen he drank his coffee, and I drank mine, and we sat at the table with the carved heart, and the morning light came through the window, and the city woke up around us.\n\nAnd for the first time, I didn't feel like I was pretending.\n\ndas Restaurant restaurant neuter\n\nNeukölln Neukölln (Berlin district) proper noun\n\ndie Speisekarte menu feminine\n\nder Freund friend / boyfriend masculine (context determines meaning)\n\ndie U-Bahn subway feminine\n\nder Angeber show-off masculine (review)\n\ndie Großmutter grandmother feminine (review)\n\ndie Rechnung bill / receipt feminine (review)\n\nder Unterschied difference masculine (review)\n\nder Kanal canal masculine (review)\n\ndas Passwort password neuter (review)\n\nperfekt perfect adjective (review)\n\ndas Licht light neuter (review)\n\ndie Vergangenheit past feminine (implied)\n\nehrlich honest adjective (implied)\n\nFrom this chapter: \"I ate because I was hungry\" — in German: Ich aß, weil ich hungrig war.\n\nYou have seen subordinate conjunctions like weil (because) and dass (that). They send the verb to the end.\n\nExamples from this chapter (adapted into German):\n\nI ate because I was hungry. Ich aß, weil ich hungrig war.\n\nShe said that she wasn't angry. Sie sagte, dass sie nicht wütend sei.\n\nI think that we're good. Ich glaube, dass wir gut sind.\n\nKey pattern: Main clause + conjunction + subject + ... + verb at the end.\n\nOther common conjunctions that send the verb to the end:\n\nWhy this matters: In high-density German (80%+), you will see these structures constantly. Train your eye to look for the verb at the end after weil, dass, wenn.\n\nTip from the method: Don't memorize the rule. Just notice it every time it appears. After 50+ examples, your brain will expect the verb at the end. Also, Matei uses weil to explain why he's right. Which is always.", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}], "gate": {"clue": "What is the German word for \"ex-partner\"?", "answer": "ex", "hint": "der Ex"}, "vocab": [{"german": "das Restaurant", "english": "restaurant"}, {"german": "Neukölln", "english": "Neukölln (Berlin district) proper"}, {"german": "die Speisekarte", "english": "menu"}, {"german": "der Freund", "english": "friend / boyfriend"}, {"german": "die U-Bahn", "english": "subway"}, {"german": "der Angeber", "english": "show-off"}, {"german": "die Großmutter", "english": "grandmother"}, {"german": "die Rechnung", "english": "bill / receipt"}, {"german": "der Unterschied", "english": "difference"}, {"german": "der Kanal", "english": "canal"}, {"german": "das Passwort", "english": "password"}, {"german": "perfekt", "english": "perfect"}, {"german": "das Licht", "english": "light"}, {"german": "die Vergangenheit", "english": "past"}, {"german": "ehrlich", "english": "honest"}, {"german": "weil", "english": "because"}, {"german": "gut", "english": "good"}, {"german": "wenn", "english": "when / if"}, {"german": "die Straßenlaterne", "english": "streetlight"}, {"german": "das Passwort", "english": "password"}, {"german": "wütend", "english": "angry / furious"}, {"german": "die Straßenlaterne", "english": "streetlight"}, {"german": "das Passwort", "english": "password"}], "shadow": ["Café German — customer service phrases. Read aloud, memorise, use:", "Was darf es sein? — What can I get you?", "Einen Moment bitte. — One moment please.", "Das macht [Betrag] Euro, bitte. — That comes to [amount] euros, please.", "Moechten Sie eine Quittung? — Would you like a receipt?", "Danke und auf Wiedersehen! — Thank you and goodbye!", "Yves says all of these in this chapter. Find them. Say them with his voice — slightly uncertain, but trying."]}, {"id": 14, "title": "The Ex", "scenes": [{"prose": "Things were fein for exactly one week.\n\nI was closing the Café. Wiping down the counter. Counting the register. The usual Routine. Frau Schmidt had come by earlier that morning — her first day back, just for two hours, just to sit at the table and drink coffee and tell customers she was fein. She wasn't fine. Her left hand shook when she held the cup. But she was here. That was something.\n\nAlso, she had brought her own mug. It said World's Okayest Boss. I had bought it for her as a joke. She had cried. Then she had threatened to fire me. Then she had cried again.\n\n\"It's fine,\" she had said. \"I'm just emotional.\"\n\n\"You're never emotional.\"\n\n\"I'm old. Old people get emotional about mugs.\"\n\n\"That's not a thing.\"\n\nThe bell above the door chimed.\n\n\"Wir haben geschlossen,\" I said without turning around. It was my new phrase. I had practiced it in the mirror. My pronunciation was still terrible, but I was committed.\n\n\"Then why is the door open?\"\n\nA man was standing in the doorway. Tall. Blonde. Expensive coat. The kind of Lächeln that said he knew he was handsome and had been told so many times that it had become a personality trait. He looked like he had never dropped a cup of coffee in his life. He probably had people for that.\n\n\"We're closed,\" I said.\n\n\"I can see that.\"\n\n\"Then why are you here?\"\n\n\"I'm looking for Matei.\"\n\n\"He's not here.\"\n\n\"I know. His Wohnung was empty. I tried there first.\"\n\n\"You tried his Wohnung? At 7 PM? Without calling first?\"\n\n\"I don't have his number anymore.\"\n\n\"That's not a coincidence.\"\n\nHe smiled. It was a nice smile. Annoyingly nice. The kind of smile that made you want to punch someone, but also maybe buy them a drink so you could figure out what was wrong with them.\n\n\"You must be Yves.\"\n\n\"And you must be the guy who leaves without saying goodbye.\"\n\nHis smile faltered. Just a little. Good.\n\n\"Matei told you about me.\"\n\n\"He mentioned you. Once. Briefly. In the context of 'my ex left and took the Frank Ocean album.'\"\n\n\"It was a limited edition.\"\n\n\"It was a gift. From him. To you. And you took it when you left. That's not just breaking up. That's theft with emotional damage.\"\n\n\"I'm not funny. I'm angry on behalf of my boyfriend. There's a Unterschied.\"\n\n\"He's your boyfriend now?\"\n\n\"He's been my boyfriend. He's my boyfriend. He will continue to be my boyfriend. Possibly forever. We're thinking about matching sweaters.\"\n\n\"Matei doesn't wear matching sweaters.\"\n\n\"Matei will do a lot of things he doesn't do because he loves me. Including matching sweaters. Including learning to like apricot pastries. Including not murdering me when I eat his.\"\n\nSebastian laughed. It was a beautiful laugh. I hated that it was beautiful.\n\n\"You're different than I expected.\"\n\n\"What did you expect?\"\n\n\"Someone... quieter.\"\n\n\"I'm quiet. When I want to be. Right now I don't want to be.\"\n\n\"I can see that.\"\n\nHe walked inside. Looked around the Café like he was bewertete it. His eyes landed on the blue notebook, the espresso machine, the heart carved into the table. T + M. Not them. Someone else.\n\n\"This place is cute.\"\n\n\"It's not cute. It's functional.\"\n\n\"You and Matei really are similar.\"\n\n\"You finish each other's sentences?\"\n\n\"You argue about semantics?\"\n\n\"That's not arguing. That's clarifying.\"\n\n\"You're impossible.\"\n\n\"I'm an architect. Same thing.\"\n\nHe walked to the counter. Leaned on it. Close enough that I could smell his Parfüm — expensive, too strong, the kind that announced itself before you did.\n\n\"What do you want?\" I asked.\n\n\"To talk to Matei. I've been trying to reach him for weeks. He won't answer my calls. He won't reply to my texts.\"\n\n\"Maybe there's a reason for that.\"\n\n\"Maybe. Or maybe he's just being dramatisch. He was always dramatic.\"\n\n\"He's not dramatic. He's Romanian. There's a Unterschied.\"\n\n\"No. But I'm working on it.\"\n\nSebastian laughed again. \"I like you.\"\n\n\"You should. I'm very likable.\"\n\n\"You left your boyfriend with a seven-word note and took his favorite album. You're not likable. You're a cautionary tale.\"\n\nHis smile finally disappeared.\n\n\"You don't know the whole story.\"\n\n\"It's not your story to know.\"\n\n\"Then leave. And don't come back.\"\n\n\"Can't or won't?\"\n\nHe pulled a card out of his pocket — a business card, white with black text — and set it on the counter.", "choices": ["Notice the silence between them", "Focus on what is being said"]}, {"prose": "Sebastian Bauer. Architekt.\n\n\"Tell him I stopped by.\"\n\n\"I'll think about it.\"\n\n\"No, you won't.\"\n\n\"You're right. I won't. I'll tell him tonight. Over dinner. Which I will cook. Because I'm good at things.\"\n\n\"Like pasta. Like coffee. Like not leaving people without explanation.\"\n\nHe looked at me for a long moment. Then he smiled again. The annoying one.\n\n\"You're good for him.\"\n\n\"Don't mess it up.\"\n\n\"I'm trying not to.\"\n\nHe walked to the door. Stopped. Turned.\n\n\"You're different than I expected.\"\n\n\"You said that already.\"\n\n\"I meant it more the second time.\"\n\n\"That's not how words work.\"\n\n\"It's how my words work.\"\n\nHe left. The bell chimed. The door closed.\n\nI stood there for a long time, staring at the business card.\n\nSebastian Bauer. Architekt.\n\n\"Architect of what?\" I muttered. \"Bad decisions?\"\n\nThe espresso machine hissed. I chose to interpret this as obviously.\n\nYou were supposed to close an hour ago.\n\nI know. A customer came in.\n\nHe said the door was open.\n\nMaybe. I'm bad at locking doors. It's a character flaw.\n\nI stared at the screen. I could lie. I could say no one or a man who wanted directions or someone who thought we were open for dinner. But I was tired of lying. Tired of hiding. Tired of being the person who always said the easy thing instead of the true thing.\n\nA long pause. Three dots appeared. Then disappeared. Then appeared again.\n\nI'll be home in twenty minutes.\n\nYou'll make more. From scratch. With your hands.\n\nI don't know how to make pastries.\n\nThen you'll learn. It's in the relationship contract.\n\nThere should be. I'll draft one.\n\nI locked the Café. Double-checked. Triple-checked. Walked home.\n\nThe stairs were siebenunddreißig steps. The Schlüssel stuck. The Wohnung was dark.\n\nMatei was on the Sofa. His laptop was open. He wasn't typing. He was staring at the screen. The screen was blank.\n\n\"You're home,\" I said.\n\n\"Are you angry?\"\n\n\"I'm processing.\"\n\n\"That's not an answer.\"\n\n\"It's the only answer I have.\"\n\nI sat next to him. Didn't touch him. The plastic chair was empty. It was always empty. I was starting to think it had feelings.\n\n\"What did he want?\" Matei asked.\n\n\"To talk to you. He said you won't answer his calls.\"\n\n\"He said he's been trying for weeks.\"\n\n\"He said you're being dramatic.\"\n\n\"I'm not dramatic. I'm Romanian.\"\n\n\"That's what I told him.\"\n\n\"I also told him he's a cautionary tale.\"\n\nMatei looked at me. His grey eyes were tired. But there was something else there. Something that looked like relief.\n\n\"You said that?\"\n\n\"I said a lot of things. I told him we're thinking about matching sweaters.\"\n\n\"He doesn't know that.\"\n\n\"You're terrible.\"\n\n\"I'm protective. There's a Unterschied.\"\n\n\"No. But I'm working on it.\"\n\n\"What else did you say?\"\n\n\"I told him you wouldn't murder me when I eat your pastries.\"\n\n\"That's not true. I would definitely murder you.\"\n\n\"You would not.\"\n\n\"I would think about it. For a long time. While making new pastries. That you wouldn't be allowed to eat.\"\n\nHe leaned back into the Sofa. I leaned into him. His arm went around my shoulders.\n\n\"He asked if there was a chance,\" Matei said quietly.\n\n\"A chance for what?\"\n\n\"For us. For him and me. He said he made a mistake. He said he's sorry. He said he's been thinking about me for years.\"", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}, {"prose": "\"What did you say?\"\n\n\"I said no. And then I hung up.\"\n\n\"You hung up on him?\"\n\n\"I hung up on him.\"\n\n\"That's what happens when you leave someone with a seven-word note and take their favorite album.\"\n\n\"The Frank Ocean one?\"\n\n\"The Frank Ocean one.\"\n\n\"That's unforgivable.\"\n\n\"That's what I said.\"\n\nI kissed his cheek. His jaw was rough with Stoppeln. He hadn't shaved. He always shaved when he was stressed.\n\n\"Are you okay?\" I asked.\n\n\"That's not an answer.\"\n\n\"It's the only answer I have.\"\n\n\"You already used that line.\"\n\n\"It's a good line.\"\n\n\"It's an okay line.\"\n\n\"You liked it the first time.\"\n\n\"I was being polite.\"\n\n\"You're never polite.\"\n\n\"I'm always polite. I'm Nigerian.\"\n\n\"That's not a thing.\"\n\nHe laughed. A real laugh. Short. Tired. Real.\n\n\"I love you,\" he said.\n\n\"I love you too.\"\n\n\"Even though I'm a mess.\"\n\n\"Especially because you're a mess. It's more interesting.\"\n\n\"That's my line.\"\n\n\"I'm borrowing it.\"\n\n\"Make me pasta. The good kind. With the expensive cheese.\"\n\n\"You bought the cheese?\"\n\n\"Yesterday. Before all of this.\"\n\n\"You planned ahead.\"\n\n\"I'm always planning ahead.\"\n\n\"You forgot to buy groceries last week.\"\n\n\"That was different. I was distracted.\"\n\n\"By you. You were singing in the shower. Badly. It was adorable.\"\n\n\"I don't sing badly.\"\n\n\"You sing like a dying cat. It's charming.\"\n\n\"That's not a compliment.\"\n\n\"It is from me.\"\n\nHe chopped the onions. I cried. Not from the onions. The Soße came together the way it always did — slow, steady, familiar. The kitchen got hot. The windows fogged up. The whole Wohnung smelled like garlic and something else. Something that felt like home.\n\n\"Are you going to be okay? With Sebastian being back?\"\n\n\"That's honest.\"\n\n\"I'm trying to be.\"\n\nHe stirred the sauce. Didn't look at me.\n\n\"He asked if we could be friends. I said I would think about it.\"\n\n\"I don't know. Maybe. In a year. In five years. Not now.\"\n\n\"You're allowed to take time. You're allowed to be angry. You're allowed to not know.\"\n\n\"That's a lot of permission.\"\n\n\"You have it. All of it. Unlimited.\"\n\nHe finally looked at me. His eyes were wet.\n\n\"You're too good for me.\"\n\n\"Probably. But I'm keeping you anyway.\"\n\nHe kissed me. Right there in the kitchen, with the sauce bubbling and the pasta water boiling and the whole world outside not mattering at all.\n\n\"The pasta is burning,\" I said.\n\n\"That's expensive cheese.\"\n\n\"I'll buy more.\"\n\n\"You said that yesterday.\"\n\n\"I'll say it again tomorrow.\"\n\n\"You're ridiculous.\"\n\n\"I'm in love. Same thing.\"\n\nWe ate at the table. The two mismatched chairs — me on the wooden one, him on the plastic one. The Lampe cast a yellow circle of light over our Teller. The pasta was good. Not great. The sauce had simmered a little too long. But it was ours.\n\n\"For being there. For not running. For eating all my pastries so I have a reason to make more.\"\n\n\"You're welcome.\"", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}, {"prose": "\"Also, you have flour in your hair.\"\n\n\"I always have flour in my hair.\"\n\n\"I know. It's cute.\"\n\n\"That's not a compliment.\"\n\n\"It is from me.\"\n\nI laughed. He almost smiled.\n\nThen we cleaned the kitchen, and he held my hand, and the Heizung clicked, and the street was quiet, and the plant on the windowsill — Matei Jr. — was still alive.\n\n\"I'm glad you didn't say yes to him.\"\n\n\"I'm glad you chose me.\"\n\n\"I didn't choose you. I kept choosing you. Every day. There's a difference.\"\n\n\"No. But I'm working on it.\"\n\nHe kissed my forehead. Soft. Brief.\n\n\"Gute Nacht, Yves.\"\n\n\"Gute Nacht, Matei.\"\n\nWe went to bed. He held me. I didn't sleep.\n\nI stared at the ceiling and thought about Sebastian's smile, his expensive coat, the way he had said \"You're good for him\" like he was giving me permission.\n\nHe wasn't. He didn't get to give permission. He had given up that right when he left.\n\nI turned over. Pressed my face into Matei's back.\n\n\"I love you,\" I whispered.\n\n\"I know,\" he said. \"Now sleep. You have to open the Café tomorrow.\"\n\n\"What if I burn it down?\"\n\n\"Then we open Burnt. I told you this.\"\n\n\"What if I forget to order coffee?\"\n\n\"Then we sell tea.\"\n\n\"What if I accidentally poison someone?\"\n\n\"Then we learn to make poison taste better.\"\n\n\"You're not taking this seriously.\"\n\n\"I'm taking you seriously. That's enough.\"\n\nHe was warm. He was here. He was staying.\n\nfein fine / okay adjective (review)\n\nder Ex ex (ex-partner) masculine\n\nwir haben geschlossen we are closed phrase\n\ndie Routine routine feminine (review)\n\ndas Lächeln smile neuter (review)\n\ndie Wohnung apartment feminine (review)\n\nder Unterschied difference masculine (review)\n\nbewerten (bewertete) to evaluate / appraise verb\n\ndas Parfüm perfume / cologne neuter\n\ndramatisch dramatic adjective\n\nder Architekt architect masculine\n\ndie Vergangenheit past feminine (implied)\n\ndie Soße sauce feminine (review)\n\nder Teller plate masculine (review)\n\ndie Heizung radiator feminine (review)\n\ndie Stoppeln stubble plural (review)\n\ndie Lampe lamp feminine (review)\n\nder Schlossschlüssel lock key masculine (review)\n\nFrom this chapter: Not directly, but Sebastian is described as handsome — implied comparative: \"You're different than I expected. Someone... quieter\" — the comparative would be leiser (quieter).\n\nComparative adjectives in German are formed by adding -er to the base adjective. Some take an umlaut (a → ä, o → ö, u → ü).\n\nCommon comparatives you will need:\n\nPositive Comparative English\n\nhübsch hübscher pretty → prettier\n\ngroß größer big → bigger (umlaut)\n\nklein kleiner small → smaller (no umlaut)\n\ngut besser good → better (irregular)\n\ngern lieber gladly → rather\n\nviel mehr much/many → more\n\nleise leiser quiet → quieter\n\nExample from this chapter: \"You're different than I expected. Someone... quieter.\" → Du bist anders, als ich erwartet habe. Jemand... leiser.\n\nUsing als for than: Mein Kaffee ist besser als deiner. (My coffee is better than yours.)\n\nWhy this matters: As you read more German, you will need to compare things. The comparative -er is regular for most adjectives, and you will recognize it easily once you have seen it a few times. Also, Matei uses comparatives to compliment Yves. Dein Kaffee ist besser als meiner. It's cute. Annoying. Cute.", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}], "gate": {"clue": "What is the German word for \"decision\"?", "answer": "entscheidung", "hint": "die Entscheidung"}, "vocab": [{"german": "fein", "english": "fine / okay"}, {"german": "der Ex", "english": "ex (ex-partner)"}, {"german": "wir", "english": "haben geschlossen we are closed"}, {"german": "die Routine", "english": "routine"}, {"german": "das Lächeln", "english": "smile"}, {"german": "die Wohnung", "english": "apartment"}, {"german": "der Unterschied", "english": "difference"}, {"german": "bewerten", "english": "(bewertete) to evaluate / appraise"}, {"german": "das Parfüm", "english": "perfume / cologne"}, {"german": "dramatisch", "english": "dramatic"}, {"german": "der Architekt", "english": "architect"}, {"german": "die Vergangenheit", "english": "past"}, {"german": "die Soße", "english": "sauce"}, {"german": "der Teller", "english": "plate"}, {"german": "die Heizung", "english": "radiator"}, {"german": "die Stoppeln", "english": "stubble"}, {"german": "die Lampe", "english": "lamp"}, {"german": "der Schlossschlüssel", "english": "lock key"}, {"german": "der Schlüssel", "english": "key"}, {"german": "das Sofa", "english": "sofa / couch"}, {"german": "gut", "english": "good"}, {"german": "die Nacht", "english": "night"}, {"german": "klein", "english": "small"}, {"german": "siebenunddreißig", "english": "thirty-seven"}, {"german": "hübsch", "english": "pretty"}, {"german": "hübsch", "english": "pretty"}, {"german": "groß", "english": "big / tall"}, {"german": "groß", "english": "big / tall"}, {"german": "hübsch", "english": "pretty"}, {"german": "groß", "english": "bigger"}], "shadow": ["Practise these two lines — one formal, one emotional. The contrast is the point.", "Sebastian: \"Es tut mir leid.\" — I'm sorry.", "Matei: \"Ich weiss.\" — I know.", "Es tut mir leid is the formal, complete apology. Matei's response — Ich weiss — accepts it without offering absolution. Four words total. Enormous weight. Say both lines without rushing.", "---", "Review — Part Two: Roots (Chapters 8-14)", "Part Two is finished. The past has arrived in Berlin — Sebastian, Ada, the first real tests. Everything that was easy is now complicated. Everything that is complicated is becoming real.", "What You Have Learned", "New vocabulary that should now feel familiar: das Vertrauen (trust), die Eifersucht (jealousy), der Verrat (betrayal), die Zukunft (future, review), das Gestaendnis (confession), erklaeren (to explain), trotzdem (nevertheless).", "New grammar: genitive case in formal writing (des, der), reported speech with dass-clauses, modal verbs deepening (mussen, konnen, wollen, sollen in context).", "Production Challenge", "Write a short paragraph in German about what has happened between Yves and Matei since the kiss. Five sentences. Use at least three new words from Part Two.", "Or: Write the text Yves should have sent Matei about Lukas — the honest version. In German. Max three sentences.", "Formal Register Check", "You have now seen formal German appearing in café receipts, job listings, and Frau Schmidt's notes. Translate these without help:", "1. Sehr geehrte Damen und Herren,", "2. Mit freundlichen Gruessen", "3. Ich bewerbe mich um die Stelle als...", "4. Fuer Ihre Unterstuetzung bedanke ich mich im Voraus.", "Translations: 1. Dear Sir or Madam, 2. Kind regards, 3. I am applying for the position as... 4. I thank you in advance for your support.", "If these feel natural, your formal register is developing. If they feel strange, re-read the shadowing scripts from Chapters 10 and 11.", "Recall Challenge", "From memory:", "1. What seven-word note did Sebastian leave when he left?", "2. Where does Ada come from?", "3. What is the name of Matei's plant?", "4. What does Lukas do for work?", "5. What was Frau Schmidt's diagnosis?", "Answers: 1. The master prompt says seven words — the book leaves you to wonder what they were. 2. Lagos — she and Yves grew up together. 3. Matei Jr. 4. He works at the bookstore with Matei. 5. A small stroke, caught early — she will recover.", "Part Three is 70-85% German. The story carries you. Trust it.", "---"]}, {"id": 15, "title": "The Decision", "scenes": [{"prose": "Four months in Berlin. That was the number I couldn't stop thinking about.\n\nFour months of waking up in Matei's bed. Four months of burning milk and dropping cups and apologizing to the floor. Four months of Frau Schmidt's sharp eyes and Ada's weekly visits and the duck at the bridge — the duck who was definitely judging me, I didn't care what Matei said.\n\nFour months of not running.\n\nAnd still, every morning, I woke up wondering when it would end.\n\n\"You're thinking too loud,\" Matei said. He was in the kitchen, making coffee. His back was to me. His shoulders were relaxed. He was wearing the shirt that said I'm silently judging you in German. It was 7 AM. He had been awake for an hour.\n\n\"I'm always thinking too loud.\"\n\n\"This morning is louder than usual.\"\n\n\"That's not a thing.\"\n\n\"It is now. I invented it. You're thinking about the Ausbildung.\"\n\nI sat up. The Laken fell to my waist. \"How do you know?\"\n\n\"Because you've been thinking about it for four months. You think about it in your sleep. Last night you said 'I need more Lebenslauf' in your sleep. In German.\"\n\n\"I don't speak German in my sleep.\"\n\n\"You do now. It's adorable. Also concerning.\"\n\nHe walked over with two mugs. Handed me one. Black. No sugar. No milk. Perfekt.\n\n\"You're avoiding the topic,\" he said.\n\n\"I'm not avoiding. I'm delaying.\"\n\n\"No, delaying is strategic. Avoiding is cowardly. There's a Unterschied.\"\n\n\"No. But I'm working on it.\"\n\nHe sat on the edge of the bed. The mattress dipped. I spilled coffee on my hand. Didn't care.\n\n\"Yves. Talk to me.\"\n\n\"What if I'm not good enough?\"\n\n\"For the Ausbildung. For Germany. For you. For any of this.\"\n\nHe took my coffee. Set it on the table. Took his coffee. Set it next to mine. Then he took my face in his hands. His palms were warm. His thumbs traced my cheekbones.\n\n\"Listen to me. You are the most stubborn person I have ever met. You arrived in Berlin with one suitcase and a key. You didn't speak the language. You dropped cups. You cried at a duck.\"\n\n\"I did not cry at the duck.\"\n\n\"You teared up. It counts. You said 'he looks lonely.'\"\n\n\"He did look lonely.\"\n\n\"He's a duck. Ducks don't have feelings.\"\n\n\"You don't know that.\"\n\n\"I know a lot of things.\"\n\n\"You know everything. It's exhausting.\"\n\n\"You're going to be fine. You're going to apply. You're going to get rejected. You're going to apply again. And then you're going to get in. And then you're going to be an Azubi. And then you're going to be a Fachinformatiker. And then you're going to buy me a house with a garden.\"\n\n\"That's a lot of pressure.\"\n\n\"That's a lot of confidence. There's a Unterschied.\"\n\n\"No. But I'm working on it.\"\n\nThe Ausbildung conversation had started three months ago, when Frau Schmidt was still in the hospital.\n\n\"What do you actually want?\" she had asked. Not what do you want to do or what are your plans — just what do you actually want.\n\n\"I don't know,\" I had said.\n\n\"Then find out. Before you waste more time.\"\n\n\"That's honest. There's a Unterschied.\"\n\n\"Everyone keeps saying that.\"\n\n\"Because it's true.\"\n\nI had thought about it for weeks. Lying in bed. Walk
