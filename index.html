ing to work. Sitting on the bridge, watching the duck paddle in circles. What did I actually want?\n\nNot the café. Not forever. I loved Frau Schmidt and the espresso machine and the regulars who pretended my German was getting better. But the café wasn't mine. It would never be mine. It was hers.\n\nNot the bookstore. Not Matei's world. I loved watching him recommend books to strangers, loved the way his face lit up when someone asked for something unexpected. But I didn't belong behind that counter.\n\n\"IT,\" I had said one night, out of nowhere.\n\nMatei looked up from his book. \"What?\"\n\n\"IT. Computers. Cybersecurity. That's what I want.\"\n\n\"That's it? Just 'okay'?\"\n\n\"What do you want me to say?\"\n\n\"I don't know. Something supportive. Something like 'Yves, that's a great idea, you're very smart, you'll be amazing, let me make you a celebratory coffee.'\"\n\n\"You're very smart. You'll be amazing. Make your own coffee. I'm reading.\"\n\n\"You're impossible.\"\n\n\"I'm supportive. Same thing.\"\n\nHe had gone back to his book. But the next morning, there was a notebook on the table. A new one. Black. On the first page, in his small, neat handwriting:\n\nIT Ausbildung in Berlin — Resources\n\n· Bundesagentur für Arbeit website\n\n· IHK Berlin — Ausbildung listings\n\n· German IT vocabulary list (I'll help)\n\n· Practice interviews (I'll be the mean interviewer)\n\n· Frau Schmidt knows someone at a Betrieb in Wedding\n\nI had stared at the list for a long time.\n\n\"You made me a list,\" I said.\n\n\"You made me a list about my future.\"\n\n\"I make lists about everything. The plant has a list. Water on Mondays. Sunlight. Don't let Yves talk to it too much.\"\n\n\"You made a list for the plant?\"\n\n\"Matei Jr. has needs.\"\n\n\"You're insane.\"\n\n\"I'm organized. Same thing.\"\n\nNow, four months in, I was still staring at that list.\n\nIt was on the kitchen table, tucked under the sugar bowl. The sugar bowl was empty. We kept forgetting to buy sugar. Neither of us used it. But it felt wrong to throw it away.\n\n\"You're staring at the list again,\" Matei said.\n\n\"I'm not staring. I'm contemplating.\"\n\n\"No, contemplating is deeper. There's more eye contact with the paper.\"\n\n\"You're ridiculous.\"\n\n\"Unfortunately.\"\n\nHe sat across from me. The plastic chair. It was still empty most days. But today he sat in it. I blinked.\n\n\"You're sitting in the plastic chair.\"\n\n\"It's a chair. Chairs are for sitting.\"\n\n\"You never sit in that chair.\"\n\n\"I'm sitting in it now. Don't make it weird.\"", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}, {"prose": "\"You're making it weird by sitting in it.\"\n\n\"You're making it weird by commenting on it.\"\n\n\"This is a stupid conversation.\"\n\n\"This is a necessary conversation. You're avoiding the list.\"\n\n\"I'm not avoiding. I'm —\"\n\n\"If you say 'delaying,' I'm going to throw this sugar bowl at you. It's empty. It won't hurt. But it will be embarrassing for both of us.\"\n\nBundesagentur für Arbeit website. I had visited it. Twelve times. The German was too hard. I had cried. Not a lot. A little.\n\nIHK Berlin — Ausbildung listings. I had found three possible programs. I had bookmarked them. I had not applied.\n\nGerman IT vocabulary list. Matei had made flashcards. I had used them twice. The flashcards were now being used as coasters.\n\nPractice interviews. We had done one. I had said \"Ich bin gut mit Computern\" and Matei had said \"That's not a sentence, that's a cry for help\" and I had thrown a pillow at him.\n\nFrau Schmidt knows someone. She did. His name was Herr Köhler. He owned a small IT Betrieb in Wedding. He was looking for Azubis. He had asked for my Lebenslauf. I had not sent it.\n\n\"I'm scared,\" I said.\n\n\"What if I'm not good enough?\"\n\n\"Then you get better. That's what Ausbildung is for.\"\n\n\"What if my German is too bad?\"\n\n\"Then you learn more. That's what living here is for.\"\n\n\"What if they laugh at me?\"\n\n\"Then they're idiots. And I will write them a strongly worded letter. In Romanian. They won't understand it. But they'll know they're being judged.\"\n\n\"You'd do that?\"\n\n\"I'd do worse. I'd send them a copy of my poetry.\"\n\n\"I'm protective. Same thing.\"\n\n\"Okay. Today. I'm going to do it.\"\n\n\"Send my Lebenslauf to Herr Köhler. Apply for the Ausbildung. Stop being a coward.\"\n\n\"You're not a coward.\"\n\n\"I've been avoiding this for four months.\"\n\n\"You've been preparing. There's a Unterschied.\"\n\n\"No. But I'm proud of you anyway.\"\n\nHe stood up. Walked to the kitchen. Came back with a pen. The good pen. The one he used for his poetry. The one he said had \"creative energy.\" I thought it was just a pen. He thought it was magic.\n\n\"Here. Use this.\"\n\n\"It's a creative pen. It has energy.\"\n\n\"Pens don't have energy.\"\n\n\"This one does. I wrote a poem about you with it.\"\n\n\"I'm not telling you.\"\n\n\"Because it's bad. And because you'll make fun of me.\"\n\n\"I would only make fun of you a little.\"\n\n\"That's what I said.\"\n\nI took the pen. It was warm from his hand. Or maybe that was the creative energy. Or maybe pens just got warm when you held them. I didn't know. I wasn't a pen scientist.\n\n\"Okay. Here goes nothing.\"\n\nI wrote an email. In German. Bad German. Matei stood behind me, reading over my shoulder.\n\n\"That's not how you spell Bewerbung.\"\n\n\"It has two 'b's. And an 'u'. And no 'e' after the 'w'.\"\n\n\"German spelling is stupid.\"\n\n\"German spelling is logical. You're just bad at it.\"\n\n\"You're not helping.\"\n\n\"I'm helping by correcting you. That's what help looks like.\"\n\n\"Help looks like encouragement. Not criticism.\"\n\n\"Encouragement is just criticism with a smile. Now fix the spelling.\"\n\nI fixed the spelling. I wrote the email. I attached my Lebenslauf. The one Matei had helped me write. The one Frau Schmidt had corrected. The one Ada had read and said \"This makes you sound like a robot. Add something about your personality.\" I had added \"I make good pasta.\" She had said \"That's not a qualification.\" I had said \"It should be.\"\n\nMy finger hovered over the send button.\n\n\"Do it,\" Matei said.\n\n\"What if I regret it?\"\n\n\"Then you regret it. And you try something else. That's what life is.\"\n\n\"That's very philosophical for 8 AM.\"\n\n\"I'm a very philosophical person. Now press the button.\"\n\n\"Oh no,\" I said.\n\n\"Oh yes,\" he said.\n\n\"I just sent my Lebenslauf to a stranger.\"\n\n\"You sent your Lebenslauf to a potential employer. There's a Unterschied.\"\n\n\"Yes. One is terrifying. The other is also terrifying. But one might lead to a job.\"\n\n\"You're not helping.\"\n\n\"I'm making coffee. That's helping.\"\n\nHe made coffee. I stared at the screen. The email was gone. Sent. Irreversible.\n\n\"I need to sit down.\"\n\n\"You're already sitting down.\"\n\n\"I need to lie down.\"\n\n\"You're dramatic.\"\n\nThree days later, Herr Köhler replied.\n\nI was at the Café. Frau Schmidt was at her table, drinking tea, pretending not to watch me refresh my email every thirty seconds.\n\n\"You're going to break the computer,\" she said.\n\n\"Computers don't break from refreshing.\"\n\n\"This one might. It's from 2008.\"\n\n\"Then it's your fault for not upgrading.\"\n\n\"It's my fault for hiring someone who refreshes his email like a teenager waiting for a text back.\"\n\n\"You are. It's fine. It's cute. Annoying, but cute.\"\n\nThere it was. An email from Herr Köhler. In German. Formal German. The kind that made my eyes cross.\n\nVielen Dank für Ihre Bewerbung. Ich würde Sie gerne zu einem Vorstellungsgespräch einladen. Können Sie nächsten Donnerstag um 14 Uhr?\n\n\"Oh no,\" I said.\n\n\"What?\" Frau Schmidt asked.\n\n\"He wants an interview.\"\n\n\"That's terrifying.\"\n\n\"That's the same thing. Now call Matei. He's probably waiting.\"", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}, {"prose": "\"You got the email,\" he said.\n\n\"How do you know?\"\n\n\"Because you called me. You only call when something happens. You text when nothing happens. It's a pattern. I noticed.\"\n\n\"You notice everything.\"\n\n\"I know. It's a curse. What did he say?\"\n\n\"He wants an interview. Next Thursday. At 2 PM.\"\n\n\"That's six days.\"\n\n\"That's enough time to prepare.\"\n\n\"That's not enough time to learn German.\"\n\n\"You don't need to learn German. You need to learn interview German. It's a different language. Smaller vocabulary. More sweating.\"\n\n\"You're not helping.\"\n\n\"I'm going to help you practice. Every night. For six days. You're going to be sick of me by the end.\"\n\n\"I'm already sick of you.\"\n\n\"Good. Then you'll be prepared.\"\n\nThe next six days were a blur of flashcards and fake interviews and Matei being the meanest interviewer in the history of interviews.\n\n\"Tell me about yourself,\" he said, for the thirtieth time.\n\n\"My name is Yves. I am from Nigeria. I live in Berlin. I like coffee and ducks and —\"\n\n\"Stop. That's terrible.\"\n\n\"You told me to tell you about myself.\"\n\n\"Not like that. Like a professional. 'Ich bin Yves, ich komme aus Nigeria, ich lebe seit vier Monaten in Berlin. Ich habe Erfahrung im Kundenservice und interessiere mich für IT und Cybersecurity.' Say it.\"\n\n\"That's too many words.\"\n\n\"That's six words more than you just said. You can do it.\"\n\n\"Ich bin Yves, ich komme aus Nigeria, ich lebe seit vier Monaten in Berlin. Ich habe Erfahrung im Kundenservice und interessiere mich für IT und Cybersecurity.\"\n\n\"Good. Now say it without sounding like a robot.\"\n\n\"That's how I sound.\"\n\n\"Then sound like a different robot. A friendly one. One that drinks coffee and has emotions.\"\n\n\"Robots don't have emotions.\"\n\n\"This one does. Now say it again.\"\n\nBy the fifth night, I could say it in my sleep. By the sixth night, I was dreaming in German. Bad German. German where the verbs were in the wrong place and the nouns had the wrong gender. But German.\n\n\"You're ready,\" Matei said, the night before the interview.\n\n\"I'm not ready.\"\n\n\"What if I freeze?\"\n\n\"Then you freeze. And then you unfreeze. And then you keep going. That's what staying means.\"\n\n\"That's very philosophical for 11 PM.\"\n\n\"I'm a very philosophical person. Now sleep. You have a big day tomorrow.\"\n\n\"What if I oversleep?\"\n\n\"I'll wake you.\"\n\n\"What if I forget how to speak German?\"\n\n\"You'll remember. Your brain knows more than you think.\"\n\n\"What if I accidentally say something stupid?\"\n\n\"Then you say something stupid. And then you move on. Everyone says stupid things. I said stupid things. Yesterday I told a customer that the book they wanted was 'in the back, probably under something.' I don't even know what's in the back.\"\n\n\"That's not stupid. That's just vague.\"\n\n\"Now sleep. Or I'll tell Matei Jr. to keep you awake.\"\n\n\"The plant doesn't have that power.\"\n\n\"The plant has many powers. You just don't know them yet.\"\n\nThe next morning, I woke up before my Wecker. I put on my best shirt. The one without the coffee stain. I drank coffee. Black. No sugar. No milk. I kissed Matei goodbye.\n\n\"Break a leg,\" he said.\n\n\"That's for actors.\"\n\n\"Then break a keyboard. Or a router. Something IT-related.\"\n\n\"That's not a thing.\"\n\n\"It is now. I invented it. Now go.\"\n\nThe interview was in Wedding. The building was grey. The office was small. Herr Köhler had a beard and glasses and a poster of a server rack on his wall. He asked me questions in German. I answered. Sometimes correctly. Sometimes not. But I kept going.\n\n\"Why do you want this Ausbildung?\" he asked.\n\nI thought about it. About Matei. About the duck. About the key in my pocket. About four months of not running.\n\n\"Because I want to stay,\" I said. \"In Berlin. In Germany. And I need something to stay for. Something that's mine.\"\n\nHerr Köhler looked at me for a long moment.\n\n\"That's a good answer,\" he said.\n\n\"Your German is bad.\"\n\n\"But it's better than it was four months ago.\"\n\n\"How do you know that?\"\n\n\"Frau Schmidt told me. She also told me you drop cups and talk to plants.\"\n\n\"She talks too much.\"\n\n\"She talks the right amount. You'll hear back from us in two weeks.\"\n\nI stood up. Shook his hand.\n\n\"Thank you for your time.\"\n\n\"Thank you for not crying. Frau Schmidt said you might.\"\n\n\"I save my crying for ducks.\"\n\nI walked to the bridge. The duck was there. Paddling in circles. Looking lonely. Or maybe not. Maybe he was just paddling. Maybe ducks didn't have feelings. Maybe Matei was right.\n\n\"I don't know if I got the job,\" I told the duck.\n\n\"That's not helpful.\"\n\nI sat on the Geländer. Pulled out my phone.\n\nI don't know. He said my German is bad.\n\nHe said it's better than it was four months ago.\n\nHe also said Frau Schmidt warned him I might cry.\n\nNo. I saved it for the duck.\n\nLonely. Or maybe just wet. I can't tell.\n\nCome home. I bought pastries.\n\nThe apricot ones. And I hid half of them.\n\nIf I told you, they wouldn't be hidden.\n\nI walked home. The stairs were siebenunddreißig steps. The Schlüssel stuck. The door opened.\n\nMatei was on the Sofa. The pastries were on the table. Half of them. The other half were somewhere else. I didn't ask where.", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}, {"prose": "\"Well?\" he said.\n\n\"How do you feel?\"\n\n\"Terrified. Hopeful. Nauseous. Hungry.\"\n\n\"That's four things.\"\n\n\"I'm a complex person.\"\n\n\"You're a simple person who uses big words to seem complex.\"\n\n\"That's accurate.\"\n\nHe handed me a pastry. I ate it. It was perfect. I hated that it was perfect.\n\n\"For making me do the scary thing.\"\n\n\"I didn't make you. You chose. There's a Unterschied.\"\n\n\"No. But I'm proud of you anyway.\"\n\nHe kissed me. Pastry crumbs and all.\n\n\"Now eat another pastry. You earned it.\"\n\n\"What if I get rejected?\"\n\n\"Then we try again. That's what staying means.\"\n\n\"What if I get accepted?\"\n\n\"Then we celebrate. And then you start the Ausbildung. And then you become a Fachinformatiker. And then you buy me that house with the garden.\"\n\n\"You're really committed to this garden thing.\"\n\n\"I want to grow tomatoes. And herbs. And maybe a tree.\"\n\n\"You've never gardened in your life.\"\n\n\"I'll learn. That's what staying means.\"\n\nI laughed. He almost smiled.\n\nThen we ate the rest of the pastries, and he told me about his day, and I told him about the interview, and the Heizung clicked, and the street was quiet, and the plant on the windowsill — Matei Jr. — was still alive.\n\nTwo weeks later, the email came.\n\nWir freuen uns, Ihnen mitteilen zu können, dass wir Sie für die Ausbildung zum Fachinformatiker ausgewählt haben.\n\n\"How do you know?\"\n\n\"Because you called. You only call when something happens.\"\n\n\"I got the Ausbildung.\"\n\n\"Aren't you going to say something?\"\n\n\"I bought champagne. It's in the fridge. It's been there for two weeks.\"\n\n\"You bought champagne before I got the answer?\"\n\n\"I'm optimistic. There's a Unterschied.\"\n\n\"No. But I was right. Now come home. We're celebrating.\"\n\n\"What if I had been rejected?\"\n\n\"Then we would have drunk the champagne anyway. To your courage. To trying. To staying.\"\n\n\"You're ridiculous.\"\n\n\"I'm in love. Same thing.\"\n\nI walked home. The stairs were siebenunddreißig steps. The Schlüssel stuck. The door opened.\n\nMatei was standing in the kitchen. Two glasses. Champagne. The good kind. The expensive kind. The kind he had bought with his book money.\n\n\"To staying,\" he said, handing me a glass.\n\n\"To staying,\" I said.\n\nIt was cold. Bubbly. Perfect.\n\nI hated that it was perfect.\n\nBut I didn't hate anything else.\n\ndie Ausbildung apprenticeship/training feminine\n\nder Lebenslauf CV/resume masculine\n\nder Unterschied difference masculine (review)\n\nder Azubi trainee/apprentice masculine (slang)\n\nder Fachinformatiker IT specialist masculine\n\nder Betrieb company/firm masculine\n\ndie Bewerbung application feminine\n\ndas Vorstellungsgespräch job interview neuter\n\nsehr geehrter Dear (formal) phrase\n\nsich freuen to be glad/pleased reflexive verb\n\nauswählen to select separable verb\n\nder Wecker alarm clock masculine (review)\n\ndas Laken sheet (bedding) neuter (review)\n\nder Kaffee coffee masculine (review)\n\ndie Heizung radiator feminine (review)\n\ndas Geländer railing neuter (review)\n\ndie Pastete pastry feminine (dialect/playful)\n\noptimistisch optimistic adjective (review)\n\nder Champagner champagne masculine\n\ndie Kühlschrank refrigerator masculine (review)\n\nFrom this chapter: \"I couldn't stop thinking about\" → Ich konnte nicht aufhören zu denken.\n\nYou have seen modal verbs in present tense (kann, muss, will, darf, soll, mag). In past tense (imperfect/preterite), they are even more common in written German.\n\nThe six modal verbs in simple past:\n\nInfinitive Meaning Simple Past (ich)\n\nkönnen can, to be able to ich konnte\n\nmüssen must, to have to ich musste\n\nwollen to want to ich wollte\n\ndürfen may, to be allowed to ich durfte\n\nsollen should, to be supposed to ich sollte\n\nExamples from this chapter (adapted):\n\nI couldn't stop thinking. Ich konnte nicht aufhören zu denken.\n\nI wanted to stay. Ich wollte bleiben.\n\nHe was supposed to help. Er sollte helfen.\n\nWhy this matters: In narratives (like this novel), the simple past of modals appears constantly. Recognizing konnte, musste, wollte helps you understand what characters could, had to, or wanted to do. Also, Matei uses wollte a lot when talking about Yves. Ich wollte dich nicht verlieren. (I didn't want to lose you.) Romantic. Annoying. Romantic.", "choices": ["Notice the silence between them", "Focus on what is being said"]}], "gate": {"clue": "What is the German word for \"cover letter\"?", "answer": "anschreiben", "hint": "das Anschreiben"}, "vocab": [{"german": "die Ausbildung", "english": "apprenticeship/training"}, {"german": "der Lebenslauf", "english": "CV/resume"}, {"german": "der Unterschied", "english": "difference"}, {"german": "der Azubi", "english": "trainee/apprentice"}, {"german": "der Fachinformatiker", "english": "IT specialist"}, {"german": "der Betrieb", "english": "company/firm"}, {"german": "die Bewerbung", "english": "application"}, {"german": "das Vorstellungsgespräch", "english": "job interview"}, {"german": "sehr", "english": "geehrter Dear (formal)"}, {"german": "sich", "english": "freuen to be glad/pleased"}, {"german": "auswählen", "english": "to select"}, {"german": "der Wecker", "english": "alarm clock"}, {"german": "das Laken", "english": "sheet (bedding)"}, {"german": "der Kaffee", "english": "coffee"}, {"german": "die Heizung", "english": "radiator"}, {"german": "das Geländer", "english": "railing"}, {"german": "die Pastete", "english": "pastry"}, {"german": "optimistisch", "english": "optimistic"}, {"german": "der Champagner", "english": "champagne"}, {"german": "die Kühlschrank", "english": "refrigerator"}, {"german": "die Tür", "english": "door"}, {"german": "perfekt", "english": "perfect"}, {"german": "gut", "english": "good"}, {"german": "der Schlüssel", "english": "key"}, {"german": "das Sofa", "english": "sofa / couch"}, {"german": "für", "english": "for"}, {"german": "Herr Köhler", "english": "Mr Köhler"}, {"german": "würden", "english": "would (subjunctive)"}, {"german": "können", "english": "to be able to / can"}, {"german": "nächste", "english": "next"}, {"german": "siebenunddreißig", "english": "thirty-seven"}, {"german": "auswählen", "english": "to select"}, {"german": "aufhören", "english": "to stop / quit"}, {"german": "müssen", "english": "must / to have to"}, {"german": "dürfen", "english": "to be allowed to"}, {"german": "würde", "english": "would (subjunctive)"}, {"german": "nächste", "english": "next"}, {"german": "auswählen", "english": "to select"}], "shadow": ["IT vocabulary — say these aloud until they are easy:", "die Informationstechnologie — information technology", "der Fachinformatiker — IT specialist", "die Anwendungsentwicklung — application development", "die Systemintegration — systems integration", "das Rechenzentrum — data centre", "In your Ausbildung exams, you will need to write and say these without hesitation. Start now."]}, {"id": 16, "title": "Die Bewerbung", "scenes": [{"prose": "The champagne was empty. The celebration was over. Now came the hard part: actually applying.\n\n\"You already applied,\" Matei said. We were sitting at the kitchen table. The laptop was open. The screen was bright. It was 7 PM. We had been at this for two hours.\n\n\"I applied to one place. Herr Köhler. He said yes. That's one.\"\n\n\"That's the only one you need.\"\n\n\"What if I fail the Ausbildung? What if I hate it? What if Herr Köhler turns out to be a secret villain who locks me in the server room?\"\n\n\"Why would he lock you in the server room?\"\n\n\"I don't know. Villains do things like that. It's in the handbook.\"\n\n\"There's no handbook.\"\n\n\"There should be. I'll write one. Chapter one: 'How to Avoid Being Locked in Server Rooms by Potential Employers.'\"\n\n\"You're ridiculous.\"\n\n\"I'm prepared. Same thing.\"\n\nHe closed the laptop. I reached for it. He moved it out of reach.\n\n\"We're taking a break.\"\n\n\"We just took a break. You ate a pastry. I watched you eat a pastry. It was very stressful for me.\"\n\n\"You're stressed by watching me eat?\"\n\n\"You eat aggressively. It's concerning.\"\n\n\"I eat with passion. There's a Unterschied.\"\n\n\"No. But I'm working on it.\"\n\nThe truth was, I had already sent out four applications. Four. To four different Betriebe. Three had said no. One — Herr Köhler — had said yes. But Matei kept insisting I should apply to more.\n\n\"Options are good,\" he said.\n\n\"Options are stressful.\"\n\n\"Options are security. If one falls through, you have another.\"\n\n\"That's very German of you.\"\n\n\"I'm Romanian. We're also practical. Just with more complaining.\"\n\n\"You don't complain.\"\n\n\"I complain internally. It's more efficient.\"\n\nHe opened the laptop again. Pulled up the IHK website. The one with all the Ausbildung listings. The one that made my eyes cross and my hands sweat.\n\n\"Here,\" he said. \"This one. In Neukölln. Small Betrieb. They specialize in cybersecurity.\"\n\n\"Cybersecurity is hard.\"\n\n\"That's why it pays well.\"\n\n\"I don't care about pay. I care about not embarrassing myself.\"\n\n\"You're going to embarrass yourself. That's part of learning. The question is whether you keep going after you embarrass yourself.\"\n\n\"That's very philosophical for 7 PM.\"\n\n\"I'm a very philosophical person. Now write.\"\n\nWe worked on the Bewerbung for three evenings.\n\nThe first evening, I wrote a draft. It was terrible. Matei read it in silence. His face did not change. That was how I knew it was bad.\n\n\"Say something,\" I said.\n\n\"I'm processing.\"\n\n\"Your face isn't moving.\"\n\n\"My face is thinking.\"\n\n\"Faces don't think.\"\n\n\"My face does. It's a very smart face.\"\n\n\"Just tell me. Is it bad?\"\n\n\"I'm being polite. There's a Unterschied.\"\n\n\"No. It's terrible. But we can fix it.\"\n\nHe took the laptop. Started typing. His fingers moved fast. He deleted whole paragraphs. Rewrote sentences. Changed words I didn't know.\n\n\"What are you doing?\"\n\n\"Making it better.\"", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}, {"prose": "\"You're changing everything.\"\n\n\"I'm improving everything. There's a Unterschied.\"\n\n\"You keep saying that.\"\n\n\"Because it keeps being true.\"\n\nWhen he was done, he turned the laptop back to me. The screen was different. The words were better. They sounded like me — but a more professional me. A me who knew what he was doing. A me who had never dropped a cup of coffee in his life.\n\n\"This isn't me,\" I said.\n\n\"It's you. Just with better grammar.\"\n\n\"I don't talk like this.\"\n\n\"You will. In interviews. On paper. The rest of the time, you can talk like a normal person who says 'glass of cow.'\"\n\n\"I'm never going to live that down, am I?\"\n\n\"No. It's my favorite story. I tell it at parties.\"\n\n\"We don't go to parties.\"\n\n\"When we do, I'll tell it then.\"\n\nThe second evening, we worked on the Lebenslauf.\n\nMatei had opinions. Strong opinions. About fonts.\n\n\"Times New Roman is for essays and funerals,\" he said.\n\n\"It's a classic font.\"\n\n\"It's a boring font. Use something else. Something with personality.\"\n\n\"My resume doesn't need personality. It needs to get me a job.\"\n\n\"Personality gets you the job. Boring gets you ignored.\"\n\n\"What font do you use?\"\n\n\"Garamond. It's elegant. It says 'I read books and I have feelings.'\"\n\n\"Resumes don't have feelings.\"\n\n\"This one will. Now change it.\"\n\nI changed it. Garamond. It looked the same as Times New Roman. I did not say this out loud. Matei could sense font indifference. It was one of his many talents.\n\n\"Now the photo,\" he said.\n\n\"I don't have a photo.\"\n\n\"I don't smile on command.\"\n\n\"Smile like you just ate the last apricot pastry and I don't know about it.\"\n\n\"That's a very specific direction.\"\n\n\"I'm a very specific person.\"\n\nI smiled. He took the photo with his phone. He looked at it. Nodded.\n\n\"Good. You look mischievous. Employers like that.\"\n\n\"They will. Trust me.\"\n\n\"I trust you. But I also think you're making this up.\"\n\n\"I'm not making it up. I'm intuiting. There's a Unterschied.\"\n\n\"No. But the photo is staying.\"\n\nThe third evening, we worked on the Anschreiben — the cover letter.\n\nThis was the worst part. The part where you had to explain why you wanted the job without sounding desperate. Why you were qualified without sounding arrogant. Why they should pick you without sounding like you were begging.\n\n\"I hate this,\" I said.\n\n\"Everyone hates this.\"\n\n\"How do people do this?\"\n\n\"They lie. A little. They make themselves sound better than they are. It's expected.\"\n\n\"I'm not good at lying.\"\n\n\"You're excellent at lying. You told me you were 'fine' for three weeks when you first arrived. You were not fine. You were a disaster.\"\n\n\"A charming disaster.\"\n\n\"A disaster. The charming part came later.\"\n\n\"That's honest. Now write. 'Dear Herr Köhler, I am writing to apply for the IT Ausbildung position at your company.'\"", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}, {"prose": "\"That's how you start?\"\n\n\"That's how everyone starts. It's boring. But it's safe.\"\n\n\"What if I start with something interesting? Like 'I once asked for a glass of cow, but I promise my IT skills are better than my German.'\"\n\n\"That's a terrible idea.\"\n\n\"It's memorable.\"\n\n\"It's memorable for the wrong reasons. Don't.\"\n\n\"You're no fun.\"\n\n\"I'm practical. There's a Unterschied.\"\n\n\"You're just saying that now.\"\n\n\"I'm always saying it. You're not listening.\"\n\nI wrote the boring opening. Then I wrote the middle. Then I wrote the end. Matei read it. Made a face. Made changes. Read it again. Made more changes. Read it a third time.\n\n\"It's good,\" he said.\n\n\"I'm not. It's good. Not great. But good. And good is enough.\"\n\n\"Good is not enough. Good gets you ignored.\"\n\n\"Good gets you an interview. Great gets you the job. You'll be great in the interview. The letter just needs to open the door.\"\n\n\"That's a lot of pressure on the interview.\"\n\n\"That's why we're going to practice. Every night. Until you're sick of me.\"\n\n\"I'm already sick of you.\"\n\n\"Good. Then you'll be prepared.\"\n\n\"You just sent it.\"\n\n\"Without asking me?\"\n\n\"You would have said no.\"\n\n\"Because I'm not ready!\"\n\n\"You're ready. You've been ready. You're just scared.\"\n\n\"I'm not scared. I'm —\"\n\n\"If you say 'delaying,' I'm going to throw this pen at you. It's the creative pen. It has energy. It might hurt.\"\n\n\"Pens don't hurt.\"\n\n\"This one does. I wrote sad poetry with it. It's full of emotion.\"\n\n\"That's not how physics works.\"\n\n\"That's how my physics works. Now stop arguing. The email is sent. It's done. You're going to be fine.\"\n\nI stared at the screen. The email was gone. Sent. Irreversible.\n\n\"I need to lie down.\"\n\n\"You're dramatic.\"\n\nThe next morning, there was a reply.\n\nNot from Herr Köhler — from a different Betrieb. One I had applied to days ago. The one that had said no. They had changed their mind? No. They had a different position. One that opened up suddenly. Someone had quit. Or been fired. Or locked in a server room. I didn't ask.\n\nWir haben Ihre Bewerbung erhalten und möchten Sie gerne zu einem Vorstellungsgespräch einladen.\n\n\"Oh no,\" I said.\n\n\"What?\" Matei asked. He was in the kitchen. Making coffee. His back was to me.\n\n\"Another interview.\"\n\n\"That's options.\"\n\n\"That's stressful.\"\n\n\"That's life. Now drink your coffee. You have applications to write.\"\n\n\"I already wrote them.\"\n\n\"You have more to write. Options, remember?\"\n\nHe handed me my coffee. Black. No sugar. No milk. Perfekt.\n\n\"For making me do the thing.\"\n\n\"You did the thing. I just watched.\"\n\n\"You watched and judged and corrected my font.\"", "choices": ["Notice the silence between them", "Focus on what is being said"]}, {"prose": "\"Someone had to. You were going to use Times New Roman. That's a crime against typography.\"\n\n\"You're ridiculous.\"\n\n\"I'm supportive. Same thing.\"\n\n\"Now drink your coffee. You have interviews to prepare for. And I have a list of questions to ask you. And I'm going to be mean. Really mean. The meanest interviewer you've ever met.\"\n\n\"Worse than Herr Köhler?\"\n\n\"Worse than anyone. I'm going to ask you questions in German so fast you won't understand them. I'm going to interrupt you. I'm going to frown at your answers. I'm going to make you sweat.\"\n\n\"That sounds terrible.\"\n\n\"That's preparation. There's a Unterschied.\"\n\n\"No. But you're going to be ready.\"\n\nHe was right. I wasn't ready. But I was going to be.\n\nI drank my coffee. He made his list. The plant sat on the windowsill, watching, judging, surviving.\n\nMatei Jr. didn't say anything.\n\nBut I knew what he was thinking.\n\ndie Bewerbung application feminine (review)\n\ndie Ausbildung apprenticeship feminine (review)\n\nder Betrieb company/firm masculine (review)\n\nder Unterschied difference masculine (review)\n\ndas Anschreiben cover letter neuter\n\nder Lebenslauf CV/resume masculine (review)\n\ndas Vorstellungsgespräch job interview neuter (review)\n\ndie IHK Chamber of Commerce abbreviation\n\ndie Garamond Garamond (font) feminine\n\npraktisch practical adjective\n\noptimistisch optimistic adjective (review)\n\nkreativ creative adjective\n\ndie Emotion emotion feminine\n\ndie Physik physics feminine\n\nder Serverraum server room masculine\n\nder Villain villain masculine (English loan)\n\ndas Handbuch handbook neuter\n\ndie Vorbereitung preparation feminine\n\nFrom this chapter: Not explicitly, but let's introduce the genitive because it appears in formal German — like in Bewerbungen and official letters.\n\nThe genitive case shows possession. It answers \"whose?\" In English, we use 's or of. In German, the article changes.\n\nDefinite article declension (genitive):\n\nmasculine des das Haus des Mannes (the man's house)\n\nneuter des das Buch des Kindes (the child's book)\n\nfeminine der die Farbe der Blume (the flower's color)\n\nplural der die Arbeit der Leute (the people's work)\n\nCommon genitive prepositions you will see:\n\nExamples from the IT world (relevant for your Ausbildung):\n\nthe company's server der Server des Betriebs\n\nthe applicant's qualifications die Qualifikationen des Bewerbers\n\nduring the interview während des Vorstellungsgesprächs\n\nWhy this matters: In everyday conversation, Germans often use von + dative instead of genitive (das Haus von dem Mann). But in formal writing — emails, letters, applications — the genitive is expected. You need to recognize it, even if you don't fully produce it.\n\nTip from the method: Don't memorize the table. Just notice that des appears before masculine/neuter nouns, and the noun often adds -s or -es. Your brain will absorb the pattern.", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}], "gate": {"clue": "What is the German word for \"rejection\"?", "answer": "ablehnung", "hint": "die Ablehnung"}, "vocab": [{"german": "die Bewerbung", "english": "application"}, {"german": "die Ausbildung", "english": "apprenticeship"}, {"german": "der Betrieb", "english": "company/firm"}, {"german": "der Unterschied", "english": "difference"}, {"german": "das Anschreiben", "english": "cover letter"}, {"german": "der Lebenslauf", "english": "CV/resume"}, {"german": "das Vorstellungsgespräch", "english": "job interview"}, {"german": "die IHK", "english": "Chamber of Commerce abbreviation"}, {"german": "die Garamond", "english": "Garamond (font)"}, {"german": "typisch", "english": "typical"}, {"german": "ehrlich", "english": "honest"}, {"german": "praktisch", "english": "practical"}, {"german": "optimistisch", "english": "optimistic"}, {"german": "kreativ", "english": "creative"}, {"german": "die Emotion", "english": "emotion"}, {"german": "die Physik", "english": "physics"}, {"german": "der Serverraum", "english": "server room"}, {"german": "der Villain", "english": "villain"}, {"german": "das Handbuch", "english": "handbook"}, {"german": "die Vorbereitung", "english": "preparation"}, {"german": "perfekt", "english": "perfect"}, {"german": "Herr Köhler", "english": "Mr Köhler"}, {"german": "Neukölln", "english": "Neukölln (Berlin district)"}, {"german": "möchten", "english": "would like to"}, {"german": "während", "english": "during / while"}, {"german": "das Vorstellungsgespräch", "english": "job interview"}, {"german": "das Vorstellungsgespräch", "english": "job interview"}], "shadow": ["Formal written German — practise the opening and closing of a professional letter:", "Sehr geehrte Damen und Herren, — Dear Sir or Madam,", "Hiermit bewerbe ich mich um die ausgeschriebene Ausbildungsstelle als Fachinformatiker. — I hereby apply for the advertised apprenticeship position as an IT specialist.", "Ich freue mich auf ein persoenliches Gespraech. — I look forward to a personal meeting.", "Mit freundlichen Gruessen — Kind regards", "Hiermit (hereby) and Mit freundlichen Gruessen (kind regards) are not optional in formal German. They signal that you know the register. Use them."]}, {"id": 17, "title": "Die Ablehnung", "scenes": [{"prose": "The first rejection arrived on a Tuesday.\n\nI was at the Café. Frau Schmidt was at her table. The espresso machine was hissing. The morning rush was over. I was wiping the counter, thinking about nothing, when my phone buzzed.\n\nBetreff: Ihre Bewerbung bei IT-Solutions Berlin\n\nI didn't recognize the name. I had applied to so many Betriebe that they had started to blur together. This one was in Kreuzberg. Small. Specialized in network security. The interview had gone okay. Not great. Okay.\n\nVielen Dank für Ihre Bewerbung und Ihr Interesse an einer Ausbildung bei IT-Solutions Berlin.\n\nLeider müssen wir Ihnen mitteilen, dass wir uns für einen anderen Kandidaten entschieden haben.\n\nWir wünschen Ihnen für Ihre weitere Suche viel Erfolg.\n\nFrau Schmidt looked up. \"What?\"\n\n\"You said 'oh.' That's not nothing.\"\n\n\"It's a small thing.\"\n\n\"Your face says otherwise.\"\n\n\"My face is fine.\"\n\n\"Your face looks like someone ate your pastries.\"\n\n\"Someone did. Matei. Yesterday. He didn't even apologize.\"\n\n\"That's not why you're upset.\"\n\n\"It's part of it.\"\n\nI handed her my phone. She read the email. Her face didn't change. She handed it back.\n\n\"That's one,\" she said.\n\n\"That's one rejection.\"\n\n\"That's one Ablehnung. There will be more. And then there will be an acceptance. That's how this works.\"\n\n\"What if there aren't more acceptances?\"\n\n\"Then you try again. Next year. Or you find a different path. That's how life works.\"\n\n\"That's very philosophical for 11 AM.\"\n\n\"I'm a very philosophical person. Now stop moping. The bathroom needs cleaning.\"\n\n\"The bathroom always needs cleaning.\"\n\n\"That's because you do a bad job. Clean it better this time.\"\n\nThen I sat on the toilet lid and stared at the wall and thought about the word Ablehnung. Rejection. It sounded like what it was. Sharp. Final. The kind of word that didn't leave room for argument.\n\nYou said \"fine.\" You only say \"fine\" when something is wrong. When things are actually fine, you say \"it's okay\" or \"not terrible\" or \"I only dropped one cup.\"\n\nTheir office is ugly anyway.\n\nYou've never been to their office.\n\nI don't need to. I can tell from their website. It's beige. Beige is the color of people who don't have personalities.\n\nIt is now. I invented it. Come home early. I bought pastries.\n\nThe apricot ones. And I'm not hiding them. You can have as many as you want.\n\nI'm always nice. I'm Romanian.\n\nIt's not an excuse. It's an explanation.\n\nI left work early. Frau Schmidt waved me out the door.\n\n\"Go. Eat pastries. Feel sorry for yourself. Tomorrow you try again.\"\n\n\"What if I don't want to try again?\"\n\n\"Then you don't. And you find something else. But you do it tomorrow. Not today. Today you eat.\"\n\n\"You're a good boss.\"\n\n\"I know. Now go before I change my mind and make you clean the bathroom again.\"\n\nMatei was on the Sofa when I got home.\n\nThe pastries were on the table. All of them. Six. Apricot. Glazed. Perfect.\n\n\"You didn't hide any,\" I said.\n\n\"I told you. I'm being nice.\"\n\n\"Because you got rejected. And rejection sucks. And pastries help. Scientifically proven.\"\n\n\"By me. I'm a scientist. Of pastries.\"\n\n\"That's not a real job.\"\n\n\"It could be. I'll write a book about it. The Pastry Scientist: How Baked Goods Heal Emotional Wounds.\"\n\n\"That's the worst title I've ever heard.\"\n\n\"That's the best title you've ever heard. You're just jealous.\"\n\nI sat next to him. Ate a pastry. Then another.\n\n\"I'm going to eat all of these,\" I said.\n\n\"And I'm not going to feel bad about it.\"\n\n\"And tomorrow I'm going to apply to more places.\"\n\n\"And I'm going to get rejected again.\"\n\n\"And then I'm going to apply again.\"\n\n\"You're not saying much.\"\n\n\"I'm listening. There's a Unterschied.\"", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}, {"prose": "\"Yes. Listening means I hear you. Saying means I interrupt you. I'm trying not to interrupt.\"\n\n\"That's very mature of you.\"\n\n\"I'm a very mature person. Now eat another pastry. You're still sad. I can tell.\"\n\n\"How can you tell?\"\n\n\"You're eating aggressively again. It's your sad-eating face.\"\n\n\"I have a sad-eating face?\"\n\n\"You have many faces. It's one of them.\"\n\nWe sat in silence for a while. The Heizung clicked. The Lampe buzzed. The plant sat on the windowsill, alive, judging, surviving.\n\n\"What if I never get an Ausbildung?\"\n\n\"Then you do something else.\"\n\n\"I don't know. You're creative. You'll figure it out.\"\n\n\"What if I don't figure it out?\"\n\n\"Then I'll help you.\"\n\n\"What if you can't help me?\"\n\n\"Then we'll both be confused together. That's better than being confused alone.\"\n\n\"That's very romantic.\"\n\n\"I'm a very romantic person.\"\n\n\"You're not. You're just saying that because I'm sad.\"\n\n\"I'm saying it because it's true. Now eat another pastry.\"\n\n\"I can't. I'm full.\"\n\n\"That's never stopped you before.\"\n\n\"I'm also feeling sick. From the rejection. And the pastries.\"\n\n\"That's called a sugar crash. Drink water.\"\n\nHe handed me water. I drank it.\n\n\"For not saying 'I told you so.'\"\n\n\"I told you so.\"\n\n\"You just said it.\"\n\n\"I know. I waited until after you thanked me. It's polite. There's a Unterschied.\"\n\n\"No. But I feel better.\"\n\n\"You're impossible.\"\n\n\"Unfortunately.\"\n\nThe next morning, I woke up early.\n\nMatei was still asleep. His breathing was slow. His face was soft. He looked younger when he slept. Less like a person who remembered everything and more like a person who forgot things sometimes — like groceries, and birthdays, and the fact that he had promised to fix the crack in the ceiling.\n\nI got up quietly. Made coffee. Black. No sugar. No milk. Made a second cup for him. Left it on the table.\n\nThe IHK website. The Ausbildung listings. The same ones that had made me cry two weeks ago. I scrolled through them. Found a new one. In Wedding. Close to Herr Köhler's office. Different specialty — more systems administration, less cybersecurity.\n\n\"You're up early,\" Matei said. He was standing in the doorway. His hair was a mess. His eyes were half-closed. He was wearing the shirt that said I'm silently judging you in German.\n\n\"I couldn't sleep.\"\n\n\"Nightmares about rejections?\"\n\n\"No. I was thinking.\"\n\n\"About applying again.\"\n\n\"To this one.\" I turned the laptop toward him. He read the listing. Nodded.\n\n\"You don't know anything about it.\"\n\n\"I know it's in Wedding. I know you can walk there. I know the name sounds reliable. 'SecureNet Systems.' That's a good name. It says 'we know what we're doing.'\"\n\n\"That's not how company names work.\"\n\n\"It is now. I'm a naming expert.\"\n\n\"You're a bookseller.\"\n\n\"Booksellers know names. We sell things with names on them.\"\n\n\"Are you going to argue with me, or are you going to write the Bewerbung?\"\n\nIt was better this time. Faster. Less crying. Fewer typos. I still spelled Bewerbung wrong twice, but Matei caught it. He was reading over my shoulder. His breath was warm on my neck.\n\n\"That's not how you spell 'qualifications.'\"\n\n\"It has two 'f's. And no 'c'.\"\n\n\"German spelling is —\"\n\n\"If you say 'stupid,' I'm going to delete this entire email and make you start over.\"\n\nI attached my Lebenslauf. The one with the Garamond font. The one with the mischievous photo. The one that Matei had said was \"full of personality\" and Frau Schmidt had said was \"fine, I guess\" and Ada had said was \"very you, whatever that means.\"\n\nI wrote the subject line: Bewerbung als Azubi — Yves\n\n\"That's boring,\" Matei said.\n\n\"Subject lines are supposed to be boring.\"\n\n\"No, they're supposed to be clear. Boring is fine. Clear is better. Yours is both. Good job.\"\n\n\"Was that a compliment?\"", "choices": ["Notice the silence between them", "Focus on what is being said"]}, {"prose": "\"It was an observation. Don't get used to it.\"\n\n\"Do it,\" he said.\n\n\"What if they reject me?\"\n\n\"Then they reject you. And you try again.\"\n\n\"What if I run out of places to try?\"\n\n\"Then you move to a different city. Or a different country. Or you start your own IT company. Or you become a professional pastry eater. I don't know. But you don't give up. That's not who you are.\"\n\n\"That's exactly who I am. I'm a runner. I run from things.\"\n\n\"You used to run. Now you stay. There's a Unterschied.\"\n\n\"Yes. You're still here. You're still trying. You're still eating my pastries. That's not running. That's being annoying. And I love you for it.\"\n\n\"That's not romantic.\"\n\n\"It's honest. Same thing.\"\n\nThe reply came four days later.\n\nI was at the bridge. The duck was there. Paddling. Judging. Being a duck.\n\nBetreff: Ihre Bewerbung bei SecureNet Systems\n\nVielen Dank für Ihre Bewerbung.\n\nWir würden Sie gerne zu einem Vorstellungsgespräch einladen.\n\n\"I got an interview.\"\n\n\"That's not helpful, but I appreciate the enthusiasm.\"\n\n\"I got an interview.\"\n\n\"How do you know?\"\n\n\"Because you called. You only call when something happens.\"\n\n\"It's with SecureNet Systems. The one in Wedding.\"\n\n\"The one with the reliable name.\"\n\n\"The one with the reliable name.\"\n\n\"Next Thursday. At 10 AM.\"\n\n\"That's seven days.\"\n\n\"That's enough time to prepare.\"\n\n\"I'm going to be mean again. Really mean. The meanest interviewer you've ever met.\"\n\n\"You said that last time.\"\n\n\"I meant it last time. I mean it more this time.\"\n\n\"That's not how intensity works.\"\n\n\"It is now. I invented it. Now come home. We're celebrating.\"\n\n\"What are we celebrating? I haven't gotten the job yet.\"\n\n\"We're celebrating the interview. And the fact that you didn't give up. And the fact that you only cried a little.\"\n\n\"You teared up. At the bridge. The duck saw you.\"\n\n\"The duck doesn't have feelings.\"\n\n\"The duck has feelings. You taught him.\"\n\nI walked home. The stairs were siebenunddreißig steps. The Schlüssel stuck. The door opened.\n\nMatei was in the kitchen. Not making coffee. Making something else. Something that smelled like garlic and tomatoes and home.\n\n\"What are you making?\"\n\n\"Pasta. Your grandmother's recipe.\"\n\n\"You learned it?\"\n\n\"I watched you make it. Fifty times. Maybe more.\"\n\n\"That's creepy.\"\n\n\"That's love. Same thing.\"\n\nHe handed me a fork. I tasted the sauce. It was perfect. I hated that it was perfect.\n\n\"You're getting good at this.\"\n\n\"I'm getting good at a lot of things.\"\n\n\"Like staying. Like being patient. Like not murdering you when you eat my pastries.\"\n\n\"That's three things.\"\n\n\"I'm a complex person.\"\n\n\"You're a simple person who uses big words to seem complex.\"\n\n\"That's my line.\"\n\n\"I'm borrowing it.\"\n\n\"Help me with the interview prep. Be mean. Really mean. Make me sweat.\"\n\n\"I can do that.\"\n\n\"I know. That's why I keep you around.\"\n\nWe ate pasta. Drank wine. The cheap kind. The one that came in a box. Matei said it was \"vintage.\" I said it was \"box wine.\" He said \"same thing.\"\n\nAfter dinner, we sat on the Sofa. The Lampe buzzed. The Heizung clicked. The plant sat on the windowsill. Alive. Thriving. Judging.", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}, {"prose": "\"What if I get this job?\"\n\n\"Then you start the Ausbildung. And you learn. And you struggle. And you get better. And then you're a Fachinformatiker.\"\n\n\"And then you buy me that house with the garden.\"\n\n\"You're really committed to this garden thing.\"\n\n\"I want to grow tomatoes. And maybe a duck.\"\n\n\"You can't grow a duck.\"\n\n\"You can grow anything if you try hard enough.\"\n\n\"That's not how biology works.\"\n\n\"That's how my biology works.\"\n\n\"You're impossible.\"\n\n\"Unfortunately.\"\n\n\"You're going to be fine.\"\n\n\"You don't know that.\"\n\n\"I know you. That's enough.\"\n\nI leaned into him. His arm went around my shoulders.\n\n\"Thank you. For not letting me give up.\"\n\n\"You didn't give up. You just paused. There's a Unterschied.\"\n\n\"No. But I'm proud of you anyway.\"\n\nWe sat like that until the Lampe flickered and the street went quiet.\n\nTomorrow, I would prepare for the interview. I would practice with Matei. I would sweat. I would stumble. I would get better.\n\nBut tonight, I was just here.\n\nAnd for now, that was enough.\n\ndie Ablehnung rejection feminine\n\ndie Bewerbung application feminine (review)\n\nder Betrieb company/firm masculine (review)\n\ndie Ausbildung apprenticeship feminine (review)\n\nder Kandidat candidate masculine\n\nder Erfolg success masculine\n\nfreundlich friendly adjective\n\ndie Sicherheit security feminine\n\nder Server server masculine\n\ndie Netzwerktechnik network technology feminine\n\ndie Systems Administration systems administration feminine (loan)\n\nder Azubi trainee/apprentice masculine (slang, review)\n\nder Fachinformatiker IT specialist masculine (review)\n\ndie Garamond Garamond font feminine (review)\n\nder Held hero masculine (implied)\n\ndie Biologie biology feminine\n\ndas Schicksal fate neuter (implied)\n\ndie Vorbereitung preparation feminine (review)\n\ndie Panik panic feminine (implied)\n\nFrom this chapter: \"Trotz der Ablehnung\" (Despite the rejection) — trotz takes the genitive.\n\nCommon genitive prepositions you will see in formal writing and interviews:\n\nPreposition Meaning Example\n\nwegen because of wegen der Ablehnung (because of the rejection)\n\ntrotz despite trotz des Fehlers (despite the mistake)\n\nwährend during während des Vorstellungsgesprächs (during the interview)\n\nanstatt instead of anstatt einer Pause (instead of a break)\n\naußerhalb outside of außerhalb der Arbeitszeit (outside of work hours)\n\ninnerhalb inside of innerhalb einer Woche (within a week)\n\nExamples from this chapter (adapted):\n\nBecause of the rejection, I was sad. Wegen der Ablehnung war ich traurig.\n\nDespite the rejection, I applied again. Trotz der Ablehnung habe ich mich wieder beworben.\n\nDuring the interview, I was nervous. Während des Vorstellungsgesprächs war ich nervös.\n\nWhy this matters: In everyday conversation, many Germans use von + dative instead (wegen von der Ablehnung). But in written German — emails, applications, formal letters — the genitive is correct. You need to recognize it, especially when reading emails from potential employers.\n\nTip from the method: Don't memorize the prepositions. Just notice that after wegen, trotz, während, the following article often changes (der → des for masculine/neuter, die → der for feminine/plural). Your brain will absorb the pattern.", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}], "gate": {"clue": "What is the German word for \"architect (here: the person who designed something)\"?", "answer": "architekt", "hint": "der Architekt"}, "vocab": [{"german": "die Ablehnung", "english": "rejection"}, {"german": "die Bewerbung", "english": "application"}, {"german": "der Betrieb", "english": "company/firm"}, {"german": "die Ausbildung", "english": "apprenticeship"}, {"german": "der Kandidat", "english": "candidate"}, {"german": "die Suche", "english": "search"}, {"german": "der Erfolg", "english": "success"}, {"german": "freundlich", "english": "friendly"}, {"german": "die Sicherheit", "english": "security"}, {"german": "der Server", "english": "server"}, {"german": "die Netzwerktechnik", "english": "network technology"}, {"german": "die Systems", "english": "Administration systems administration"}, {"german": "der Azubi", "english": "trainee/apprentice"}, {"german": "der Fachinformatiker", "english": "IT specialist"}, {"german": "die Garamond", "english": "Garamond font"}, {"german": "der Held", "english": "hero"}, {"german": "die Biologie", "english": "biology"}, {"german": "das Schicksal", "english": "fate"}, {"german": "die Vorbereitung", "english": "preparation"}, {"german": "die Panik", "english": "panic"}, {"german": "das Sofa", "english": "sofa / couch"}, {"german": "die Heizung", "english": "radiator / heating"}, {"german": "die Lampe", "english": "lamp"}, {"german": "der Schlüssel", "english": "key"}, {"german": "nervös", "english": "nervous"}, {"german": "für", "english": "for"}, {"german": "müssen", "english": "must / to have to"}, {"german": "wünschen", "english": "to wish"}, {"german": "Herr Köhler", "english": "Mr Köhler"}, {"german": "würden", "english": "would (subjunctive)"}, {"german": "das Vorstellungsgespräch", "english": "job interview"}, {"german": "siebenunddreißig", "english": "thirty-seven"}, {"german": "während", "english": "during / while"}, {"german": "das Vorstellungsgespräch", "english": "job interview"}, {"german": "außerhalb", "english": "outside of"}, {"german": "das Vorstellungsgespräch", "english": "job interview"}], "shadow": ["Rejection and persistence vocabulary — say these with conviction:", "Vielen Dank fuer Ihre Rueckmeldung. — Thank you very much for your response.", "Ich werde meine Bewerbungsunterlagen ueberarbeiten. — I will revise my application documents.", "Ich bleibe an diesem Thema dran. — I will keep working on this.", "Trotzdem — nevertheless / anyway", "Trotzdem is one of the most useful words in the German language. It means: I know what you said, and I am continuing anyway. Use it."]}, {"id": 18, "title": "The Architect", "scenes": [{"prose": "Sebastian came back three days after my interview with SecureNet Systems.\n\nI was closing the Café. Wiping the counter. Counting the register. The usual Routine. Frau Schmidt had gone home early. Her hand was shaking again. She didn't say anything, but I saw her hide it in her pocket.\n\n\"You're staring,\" she had said.\n\n\"I'm observing.\"\n\n\"You're worried. It's fine. I'm old. Old people shake.\"\n\n\"That's not a thing.\"\n\n\"It is now. I invented it.\"\n\n\"That's my line.\"\n\n\"I'm borrowing it. Pay me back by not burning down my Café.\"\n\nI had promised not to burn down the Café. She had looked at me like she didn't believe me. Fair.\n\nThe bell above the door chimed.\n\n\"Wir haben geschlossen,\" I said without turning around. My pronunciation was getting better. Almost intelligible.\n\nSebastian. Same blonde hair. Same expensive coat. Same smile that made me want to punch something. He was holding a bouquet of flowers. Sunflowers. The kind you buy when you want to say I'm sorry without actually saying I'm sorry.\n\n\"What are those for?\" I asked.\n\n\"They're for Matei.\"\n\n\"Matei is allergic to sunflowers.\"\n\n\"He is now. I invented it. He breaks out in hives. It's very dramatic. He cries.\"\n\n\"Matei doesn't cry.\"\n\n\"He cries at commercials. The ones with dogs. And soldiers coming home. It's very moving. You should see it.\"\n\n\"I'm protecting. There's a Unterschied.\"\n\n\"No. But the flowers are staying outside.\"\n\nI took the flowers. Walked to the door. Set them on the sidewalk. Came back inside.\n\n\"That was rude,\" he said.\n\n\"That was boundary-setting. There's a Unterschied.\"\n\n\"You keep saying that.\"\n\n\"Because you keep crossing boundaries. Now what do you want?\"\n\nHe walked to the table with the carved heart. Sat down. The chair creaked. He crossed his legs. Looked around the Café like he was appraising real estate.\n\n\"I wanted to see him. To apologize. Properly. Not over the phone.\"\n\n\"You already apologized. Over the phone. He told me. He said it was 'fine.' That's Matei for 'I'm still angry but I don't want to talk about it.'\"\n\n\"Then why are you here?\"\n\n\"Because I want to try again. Not with him. With being... not a terrible person.\"\n\n\"That's a low bar.\"\n\n\"You're not helping your case.\"\n\nI stared at him. He stared at me. The espresso machine hissed. I chose to interpret this as get on with it.\n\n\"Matei isn't here. He's at work. The bookstore. He'll be there until six.\"\n\n\"Then go there.\"\n\n\"Because he told me not to. He said he needs space. He said he'll call me when he's ready.\"\n\n\"I'm tired of waiting.\"\n\n\"That's too bad. Waiting is what you do when you hurt someone. You wait. You don't show up with flowers and expect forgiveness.\"\n\n\"I don't expect forgiveness.\"\n\n\"Then what do you expect?\"\n\nHe was quiet for a long moment. The Lampe buzzed. The Heizung clicked. Somewhere downstairs, the bakery was closing.\n\n\"I expect nothing. I just wanted to see if he was okay.\"\n\n\"He's okay. He's better than okay. He's happy. Annoyingly happy. He smiles now. Real smiles. Not the almost ones.\"\n\n\"The almost smiles.\" Sebastian's voice was soft. \"I remember those.\"\n\n\"Good for you. He doesn't almost smile anymore. He smiles. Because of me. Because I make him coffee and eat his pastries and talk to his plant.\"\n\n\"You talk to his plant?\"\n\n\"Matei Jr. is a very good listener.\"\n\n\"You named the plant Matei Jr.?\"\n\n\"It was either that or 'The Green One.' He chose Matei Jr.\"\n\n\"He didn't choose.\"\n\n\"He didn't say no. That's consent.\"\n\nSebastian laughed. It was a sad laugh. The kind that said I miss this without saying it.\n\n\"You're good for him.\"\n\n\"He deserves someone good.\"\n\n\"I wasn't good.\"", "choices": ["Notice the silence between them", "Focus on what is being said"]}, {"prose": "\"You say that a lot.\"\n\n\"Because it keeps being true.\"\n\nHe stood up. Walked to the counter. Pulled out his wallet.\n\n\"I'll take a coffee. Black. No sugar. No milk.\"\n\n\"That's Matei's order.\"\n\n\"You're copying him.\"\n\n\"I'm remembering him. There's a Unterschied.\"\n\n\"No. But I'm trying.\"\n\nI made him the coffee. Black. No sugar. No milk. My hands were steady. I was proud of that.\n\nHe took a sip. Made a face.\n\n\"You look surprised.\"\n\n\"I am. Matei said you were bad at coffee.\"\n\n\"Matei is a liar. I'm excellent at coffee. I'm excellent at a lot of things.\"\n\n\"Like staying. Like not leaving seven-word notes. Like not stealing limited-edition Frank Ocean albums.\"\n\n\"You're not going to let that go, are you?\"\n\n\"No. It's my favorite story. I tell it at parties.\"\n\n\"You don't go to parties.\"\n\n\"When I do, I'll tell it then.\"\n\nHe finished his coffee. Set the cup down. Looked at me.\n\n\"Tell Matei I stopped by.\"\n\n\"Because I'm going to tell him. Tonight. Over dinner. Which I will cook. Because I'm good at things.\"\n\n\"You said that already.\"\n\n\"It's still true.\"\n\nHe walked to the door. Stopped. Turned.\n\n\"Thank you. For taking care of him.\"\n\n\"I'm not taking care of him. I'm loving him. There's a Unterschied.\"\n\n\"Yes. One is a job. The other is a choice. I choose him. Every day. Even when he's annoying. Even when he corrects my German. Even when he steals the last pastry and pretends he didn't.\"\n\n\"He's a monster. A lovable monster. But a monster.\"\n\nSebastian smiled. A real smile. Sad. Tired. Real.\n\n\"Goodbye, Yves.\"\n\n\"Goodbye, Sebastian.\"\n\nHe left. The bell chimed. The door closed.\n\nI stood there for a long time, staring at the empty cup.\n\nWe were on the Sofa. The Lampe was on. The Heizung clicked. Matei Jr. sat on the windowsill, alive, thriving, judging.\n\n\"Sebastian came to the Café today.\"\n\nMatei didn't look up from his book.\n\n\"How do you know?\"\n\n\"Because you have that look. The look of someone who had a conversation they didn't want to have.\"\n\n\"That's not a thing.\"\n\n\"It is now. I invented it. What did he want?\"\n\n\"To apologize. To see if you were okay. To drink your coffee order and pretend it was his.\"\n\n\"Did you give him coffee?\"\n\n\"I gave him coffee. Black. No sugar. No milk. He said it was good.\"\n\n\"I know. I made it.\"\n\n\"You're getting good at things.\"\n\n\"I'm getting good at a lot of things.\"\n\n\"Like staying. Like not running. Like not punching your ex in the face even though he deserves it.\"\n\n\"He doesn't deserve it.\"\n\n\"He does. A little.\"\n\n\"Maybe a little.\"\n\nMatei closed his book. Set it on the table. Turned to look at me.\n\n\"What else did he say?\"\n\n\"He said he wants to try again. Not with you. With being a better person.\"\n\n\"Yes. People should try to be better. Even people who hurt you.\"\n\n\"That's very forgiving of you.\"\n\n\"I'm not forgiving him. I'm acknowledging that people change. There's a Unterschied.\"", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}, {"prose": "\"Yes. Forgiving means letting go. Acknowledging means I see it but I don't have to do anything about it.\"\n\n\"That's very philosophical for 9 PM.\"\n\n\"I'm a very philosophical person. Now eat your pastry. You're stress-eating with your face again.\"\n\n\"I don't have a stress-eating face.\"\n\n\"You do. It's the same as your sad-eating face. But with more intensity.\"\n\n\"You're impossible.\"\n\n\"Unfortunately.\"\n\nWe ate pastries. Drank coffee. Sat in silence. The good kind. The kind that didn't need words.\n\n\"That's not an answer.\"\n\n\"It's the only answer I have.\"\n\n\"You used that line already.\"\n\n\"It's a good line.\"\n\n\"It's an okay line.\"\n\n\"You liked it the first time.\"\n\n\"I was being polite.\"\n\n\"You're never polite.\"\n\n\"I'm always polite. I'm Nigerian.\"\n\n\"That's not a thing.\"\n\n\"It is now. I invented it.\"\n\n\"I love you,\" he said.\n\n\"I love you too.\"\n\n\"Even though I'm a mess.\"\n\n\"Especially because you're a mess. It's more interesting.\"\n\n\"That's my line.\"\n\n\"I'm borrowing it.\"\n\n\"Make me pasta. The good kind. With the expensive cheese.\"\n\n\"You bought the cheese?\"\n\n\"Yesterday. Before all of this.\"\n\n\"You planned ahead.\"\n\n\"I'm always planning ahead.\"\n\n\"You forgot to buy groceries last week.\"\n\n\"That was different. I was distracted.\"\n\n\"By you. You were practicing interview questions in the shower. In German. You said 'Ich bin gut mit Computern' seventeen times. It was adorable.\"\n\n\"I said it seventeen times?\"\n\n\"That's creepy.\"\n\n\"That's love. Same thing.\"\n\nWe made pasta. He chopped the onions. I cried. Not from the onions. The Soße came together. The kitchen got hot. The windows fogged up.\n\n\"Are you going to see him? Sebastian? When he calls?\"\n\n\"I don't know. Maybe. Someday. Not now.\"\n\n\"You're allowed to take time. You're allowed to be angry. You're allowed to not know.\"\n\n\"That's a lot of permission.\"\n\n\"You have it. All of it. Unlimited.\"\n\nHe looked at me. His eyes were wet.\n\n\"You're too good for me.\"\n\n\"Probably. But I'm keeping you anyway.\"\n\nHe kissed me. Right there in the kitchen, with the sauce bubbling and the pasta water boiling and the whole world outside not mattering at all.\n\n\"The pasta is burning,\" I said.\n\n\"That's expensive cheese.\"\n\n\"I'll buy more.\"\n\n\"You said that yesterday.\"\n\n\"I'll say it again tomorrow.\"\n\n\"You're ridiculous.\"\n\n\"I'm in love. Same thing.\"\n\nAfter dinner, we sat on the Sofa. The Lampe buzzed. The Heizung clicked. The plant sat on the windowsill. Alive. Thriving. Judging.\n\n\"For not running. For staying. For being here.\"\n\n\"I'm not going anywhere.\"", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}, {"prose": "\"You say that a lot.\"\n\n\"Because you need to hear it.\"\n\nHe kissed my forehead. Soft. Brief.\n\n\"Gute Nacht, Yves.\"\n\n\"Gute Nacht, Matei.\"\n\nWe went to bed. He held me. I didn't sleep.\n\nI stared at the ceiling and thought about Sebastian's flowers, his sad smile, the way he had said \"You're good for him\" like he was giving me permission.\n\nHe wasn't. He didn't get to give permission. That wasn't how love worked.\n\nLove was choosing. Every day. Even when it was hard. Even when your ex showed up with sunflowers and apologies.\n\nI turned over. Pressed my face into Matei's back.\n\n\"I love you,\" I whispered.\n\n\"I know,\" he said. \"Now sleep. You have to open the Café tomorrow.\"\n\n\"What if Sebastian comes back?\"\n\n\"Then you give him coffee. Black. No sugar. No milk. And you tell him I'm busy.\"\n\n\"What if he brings more flowers?\"\n\n\"Then you put them outside. With the others.\"\n\n\"What if he asks about the plant?\"\n\n\"Tell him Matei Jr. is allergic to architects.\"\n\n\"That's not a thing.\"\n\n\"It is now. I invented it.\"\n\n\"You're impossible.\"\n\n\"Unfortunately.\"\n\nHe was warm. He was here. He was staying.\n\ndie Routine routine feminine (review)\n\ndie Grenze boundary feminine\n\nsich entschuldigen to apologize reflexive verb (review)\n\ndie Vergebung forgiveness feminine\n\ndas Vertrauen trust neuter (review)\n\ndie Sonnenblume sunflower feminine\n\ndie Allergie allergy feminine\n\ndie Biene bee feminine (implied)\n\nder Architekt architect masculine (review)\n\ndie Vergangenheit past feminine (review)\n\ndie Gegenwart present feminine\n\ndie Zukunft future feminine (review)\n\nbleiben to stay verb (review)\n\nakzeptieren to accept verb\n\nverzeihen to forgive verb (+ dative)\n\nehrlich honest adjective (review)\n\npraktisch practical adjective (review)\n\nFrom this chapter: \"He was warm. He was here. He was staying.\" — In German: Er war warm. Er war hier. Er blieb.\n\nYou have seen the present tense of sein (to be) and haben (to have). In written German — especially narratives — the simple past (imperfect/preterite) is used instead of the present perfect.\n\nSimple past of sein (to be):\n\ner/sie/es war he/she/it was\n\nihr wart you (plural) were\n\nsie/Sie waren they/you (formal) were\n\nSimple past of haben (to have):\n\ner/sie/es hatte he/she/it had\n\nihr hattet you (plural) had\n\nsie/Sie hatten they/you (formal) had\n\nExamples from this chapter (adapted):\n\nHe was tired. Er war müde.\n\nShe had a key. Sie hatte einen Schlüssel.\n\nWe were happy. Wir waren glücklich.\n\nThey had coffee. Sie hatten Kaffee.\n\nWhy this matters: In spoken German, you will hear ich bin gewesen (present perfect) more often. But in written German — novels, emails, formal writing — the simple past is standard. Recognizing war and hatte will help you read faster. Also, Matei uses war when talking about the past. Früher war ich anders. (I was different before.) It's sad. But honest.", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}], "gate": {"clue": "What is the German word for \"sister\"?", "answer": "schwester", "hint": "die Schwester"}, "vocab": [{"german": "die Routine", "english": "routine"}, {"german": "die Grenze", "english": "boundary"}, {"german": "sich", "english": "entschuldigen to apologize"}, {"german": "die Vergebung", "english": "forgiveness"}, {"german": "das Vertrauen", "english": "trust"}, {"german": "die Sonnenblume", "english": "sunflower"}, {"german": "die Allergie", "english": "allergy"}, {"german": "die Biene", "english": "bee"}, {"german": "der Architekt", "english": "architect"}, {"german": "die Vergangenheit", "english": "past"}, {"german": "die Gegenwart", "english": "present"}, {"german": "die Zukunft", "english": "future"}, {"german": "wählen", "english": "to choose"}, {"german": "bleiben", "english": "to stay"}, {"german": "akzeptieren", "english": "to accept"}, {"german": "verzeihen", "english": "to forgive"}, {"german": "ehrlich", "english": "honest"}, {"german": "praktisch", "english": "practical"}, {"german": "die Lampe", "english": "lamp"}, {"german": "die Heizung", "english": "radiator / heating"}, {"german": "das Sofa", "english": "sofa / couch"}, {"german": "gut", "english": "good"}, {"german": "gut", "english": "good"}, {"german": "die Nacht", "english": "night"}, {"german": "sich entschuldigen", "english": "to apologize"}, {"german": "müde", "english": "tired"}, {"german": "der Schlüssel", "english": "key"}, {"german": "die Soße", "english": "sauce"}, {"german": "glücklich", "english": "happy / lucky"}, {"german": "früher", "english": "earlier / before"}], "shadow": ["IT workplace German — say these aloud until natural:", "Ich habe das Problem identifiziert. — I have identified the problem.", "Das System muss neu gestartet werden. — The system needs to be restarted.", "Ich schicke Ihnen die Dokumentation. — I will send you the documentation.", "Koennen Sie das kurz erklaeren? — Can you explain that briefly?", "Koennen Sie das kurz erklaeren is the sentence that will save you more times than any other in your first year. Say it without embarrassment. Asking for clarification is professional."]}, {"id": 19, "title": "Die Schwester", "scenes": [{"prose": "The woman walked into the Café on a Thursday.\n\nNot Ada. Not Sebastian. Someone new. Dark hair, tired eyes, a coat that had seen better winters. She looked like she had been traveling for days. She looked like she hadn't slept in years.\n\n\"Guten Morgen,\" I said. My German was getting better. Almost confident.\n\n\"Sprechen Sie Englisch?\" she asked.\n\n\"Yes. Unfortunately.\"\n\nShe almost smiled. Almost.\n\n\"I'm looking for Matei.\"\n\n\"Everyone is looking for Matei.\"\n\n\"I'm his sister.\"\n\nI stopped wiping the counter.\n\n\"He mentioned you. Once. Briefly. In the context of 'my sister told me to come home after Sebastian left and I didn't.'\"\n\n\"That's not how it happened.\"\n\n\"That's how he told it.\"\n\n\"He left out the part where I was trying to protect him.\"\n\n\"Protection feels different on the receiving end.\"\n\nShe looked at me for a long moment. Then she sat down at the table with the carved heart. The chair creaked. She didn't seem to notice.\n\n\"He talks about you.\"\n\n\"Everyone says that.\"\n\n\"He doesn't talk about anyone. That's how I know you're important.\"\n\n\"I'm not important. I'm just loud.\"\n\nI made her a tea. Chamomile. She held the cup with both hands. Her fingers were cold. The Café was warm, but she was shivering.\n\n\"How long have you been in Berlin?\" I asked.\n\n\"Three days? And you're just now coming to the Café?\"\n\n\"I was waiting. For courage.\"\n\n\"It takes courage to see your brother?\"\n\n\"It takes courage to face someone you failed.\"\n\nI didn't know what to say to that. So I made her another tea. And another pastry. The apricot ones. Matei would be angry. I didn't care.\n\n\"He's at work. The bookstore. He'll be there until six.\"\n\n\"Then go there.\"\n\n\"Because he won't see me. He's been ignoring my calls for years. My emails. My letters. Everything.\"\n\n\"That's a long time to ignore someone.\"\n\n\"What did you do?\"\n\nShe was quiet for a moment. The Lampe buzzed. The espresso machine hissed.\n\n\"I told him to come home. After Sebastian left. I said, 'Berlin isn't your home. Romania is. Come back. Start over. Forget him.'\"\n\n\"That's not terrible advice.\"\n\n\"It's not the advice that was terrible. It's that I didn't listen when he said no.\"\n\n\"He said, 'This is my home now. I'm not leaving.' And I said, 'Then you're making a mistake.' And he hung up. And he didn't call back. For years.\"\n\n\"That's a long time to be angry.\"\n\n\"He's not angry. He's hurt. There's a Unterschied.\"\n\n\"Yes. Anger passes. Hurt stays. Until someone apologizes.\"\n\n\"Did you apologize?\"\n\n\"I tried. He wouldn't listen.\"\n\n\"Maybe he wasn't ready.\"\n\n\"Maybe. But I'm here now. And I'm not leaving until he talks to me.\"\n\nWe sat in silence. The Café was empty. The morning rush was over. The afternoon rush hadn't started. It was just us and the hissing espresso machine and the ghost of Frau Schmidt's judgment from her table in the corner.\n\n\"He's happy,\" I said.\n\n\"Matei. He's happy. Annoyingly happy. He smiles now. Real smiles. Not the almost ones.\"\n\n\"The almost smiles,\" she said. \"I remember those.\"\n\n\"Everyone remembers those. It's a thing. He almost-smiled at me for weeks before he actually smiled. I counted. It was forty-three almost-smiles before the first real one.\"\n\n\"I keep a list. In my notebook. Page nineteen.\"\n\n\"You're strange.\"\n\n\"I'm in love. Same thing.\"\n\nShe laughed. It was a small laugh. Tired. Hopeful.\n\n\"You're good for him.\"\n\n\"Don't mess it up.\"", "choices": ["A memory surfaces — let it", "Stay present in the moment"]}, {"prose": "\"I'm trying not to.\"\n\nAt 5 PM, I closed the Café early.\n\nFrau Schmidt would have been angry. But Frau Schmidt was at home, recovering, her shaky hand wrapped around a mug that said World's Okayest Boss. She would understand. Probably. Maybe. I'd bring her pastries tomorrow.\n\n\"Where are we going?\" Andreea asked.\n\n\"To the bookstore. To see Matei.\"\n\n\"I told you. He won't see me.\"\n\n\"He'll see me. And I'll make him see you. That's what boyfriends are for.\"\n\n\"That's exactly what boyfriends are for. Now come on. You're buying me coffee. The bookstore coffee is terrible, but it's free for employees.\"\n\n\"I'm not an employee.\"\n\n\"You're Matei's sister. That's close enough.\"\n\nA poetry reading in the back room. Someone with a loud voice and a guitar that was slightly out of tune. The front was quieter. A few customers browsing. A woman at the counter buying a stack of children's books.\n\nMatei was behind the counter.\n\nHe was helping a customer. An older man with a beard and a question about something in the science fiction section. Matei was explaining. Patient. Precise. The way he did everything.\n\nHe saw me. Then he saw Andreea.\n\nHis face didn't change. But his hands — his hands stopped moving.\n\n\"Yves,\" he said.\n\n\"What is she doing here?\"\n\n\"She came to see you. She's been in Berlin for three days. She's been staying at a Pension in Prenzlauer Berg. She's been waiting for courage.\"\n\n\"Courage for what?\"\n\n\"To apologize. To explain. To see her brother.\"\n\n\"I didn't ask for an apology.\"\n\n\"That's not the point.\"\n\n\"What's the point?\"\n\n\"The point is that she's here. And she's not leaving until you talk to her. And I'm not leaving until you talk to her. And the customers are starting to stare.\"\n\nThey were. The woman with the children's books was watching. The man with the science fiction question was watching. Even the poet in the back room had paused mid-stanza.\n\n\"Fine,\" Matei said. \"We'll talk. But not here.\"\n\n\"The Café. After closing. Just us.\"\n\n\"And me?\" I asked.\n\n\"You'll be there. You're always there.\"\n\n\"That's not an answer.\"\n\n\"It's the only answer I have.\"\n\nWe closed the Café at 8 PM.\n\nAndreea sat at the table with the carved heart. Matei sat across from her. I stood behind the counter, pretending to clean the espresso machine. Not listening. Definitely listening.\n\n\"I'm sorry,\" Andreea said.\n\n\"I should have listened. When you said Berlin was your home. I should have trusted you.\"\n\n\"I was scared. After Sebastian left, I thought you were going to fall apart. I thought coming home would fix you. I thought I could fix you.\"\n\n\"I don't need fixing.\"\n\n\"I know that now.\"\n\n\"You changed. You stopped answering my calls. You stopped writing. You disappeared into your life here. And I realized that I was the one who needed fixing. Not you.\"\n\nMatei was quiet for a long moment. The Lampe buzzed. The Heizung clicked.\n\n\"I was angry,\" he said. \"For a long time. Not at you. At myself. For not being enough. For not being worth staying for.\"\n\n\"You were enough. Sebastian was the problem. Not you.\"\n\n\"I know that now.\"\n\n\"He did.\" Matei looked at me. \"He showed up with one suitcase and a key. And he stayed. Even when it was hard. Even when I was quiet. Even when I forgot to buy groceries.\"\n\n\"You still forget to buy groceries,\" I said.\n\n\"I'm working on it.\"\n\n\"I'm working on working on it.\"\n\nAndreea laughed. It was a real laugh. Wet. Hopeful.\n\n\"You're annoying,\" she said.\n\n\"I'm in love. Same thing.\"\n\nAbout Romania. About their parents. About the father who drank and the mother who pretended everything was fine. About the years they raised each other. About the silence that had grown between them.\n\nI stayed behind the counter. Made coffee. Drank coffee. Pretended not to listen.\n\nAt 11 PM, Andreea stood up.\n\n\"I should go. My Pension closes at midnight.\"\n\n\"Stay,\" Matei said.", "choices": ["Stay in your thoughts a moment longer", "Turn your attention outward"]}, {"prose": "\"Stay. With us. The Sofa is uncomfortable, but it's better than a Pension.\"\n\n\"The Sofa is terrible,\" I said. \"I slept on it for two weeks. My back still hurts.\"\n\n\"You're not helping.\"\n\n\"I'm being honest. There's a Unterschied.\"\n\n\"No. But she should still stay.\"\n\nAndreea looked at me. Then at Matei.\n\n\"I'm sure,\" he said.\n\n\"I don't want to intrude.\"\n\n\"You're not intruding. You're family. There's a Unterschied.\"\n\n\"Yes. Family doesn't need an invitation. Family just shows up.\"\n\nShe hugged him. He hugged her back. It was awkward. Stiff. The way people hug when they're not used to hugging.\n\n\"I'll take the Sofa,\" she said.\n\n\"No, you won't. You'll take the bed. Yves and I will take the Sofa.\"\n\n\"The Sofa is not big enough for two people.\"\n\n\"You'll be uncomfortable.\"\n\n\"We're always uncomfortable. It's fine.\"\n\nThe streets were dark. The Straßenlaternen cast orange light on the pavement. Andreea walked between us. Her hand brushed mine.\n\n\"Thank you,\" she whispered.\n\n\"For bringing me to him.\"\n\n\"I didn't bring you. You came. I just opened the door.\"\n\n\"That's the same thing.\"\n\n\"No, opening the door is passive. Coming is active. There's a Unterschied.\"\n\n\"You sound like him.\"\n\n\"I live with him. It's contagious.\"\n\nShe laughed. Matei almost smiled.\n\nThe stairs were siebenunddreißig steps. The Schlüssel stuck. The door opened.\n\nThe Wohnung was small. Smaller than it had ever felt. One bed. One Sofa. One plant on the windowsill.\n\n\"Matei Jr., meet Andreea,\" I said.\n\n\"You named the plant Matei Jr.?\"\n\n\"He named it after himself. It's a whole thing.\"\n\n\"It's not a thing,\" Matei said.\n\n\"It's a thing. You talk to it.\"\n\n\"I water it. That's not talking.\"\n\n\"You told it about your day yesterday. I heard you.\"\n\n\"You were supposed to be asleep.\"\n\n\"I was pretending. I'm good at pretending.\"\n\nAndreea looked between us.\n\n\"You're both insane.\"\n\nShe took the bed. We took the Sofa.\n\nIt was too small. My legs hung off the end. Matei's elbow was in my ribs. The cushion was lumpy. The fabric was scratchy.\n\n\"This is terrible,\" I said.\n\n\"You slept on this for two weeks.\"\n\n\"I know. I complained every day.\"\n\n\"You complained every hour.\"\n\nHe shifted. His arm went around me. His chest was warm against my back.\n\n\"That's not an answer.\"\n\n\"It's the only answer I have.\"\n\n\"You used that line already.\"\n\n\"It's a good line.\"\n\n\"It's an okay line.\"\n\n\"You liked it the first time.\"\n\n\"I was being polite.\"\n\n\"You're never polite.\"\n\n\"I'm always polite. I'm Nigerian.\"\n\n\"That's not a thing.\"", "choices": ["Proceed carefully, word by word", "Step forward — trust your instincts"]}, {"prose": "\"It is now. I invented it.\"\n\nHe kissed my forehead. Soft. Brief.\n\n\"For bringing her. For not asking permission. For being annoying.\"\n\n\"The last one wasn't a compliment.\"\n\n\"It was from me.\"\n\nIn the other room, Andreea was breathing. Slow. Steady. Asleep.\n\nThe plant sat on the windowsill. Alive. Thriving. Judging.\n\n\"I'm glad you talked to her.\"\n\n\"I'm glad she came.\"\n\n\"Now we figure it out. Slowly. One day at a time.\"\n\n\"That's very optimistic for 1 AM.\"\n\n\"I'm an optimistic person.\"\n\n\"You're not. You're a realist who sometimes pretends to be optimistic.\"\n\n\"That's the same thing.\"\n\n\"It is now. I invented it. Now sleep. You have to open the Café tomorrow.\"\n\n\"What if Andreea steals the pastries?\"\n\n\"Then you steal them back. That's what family does.\"\n\nThe Sofa was terrible. My back would hurt tomorrow. My neck would hurt tomorrow. Everything would hurt tomorrow.\n\nBut Matei was warm. Andreea was here. The plant was alive.\n\nAnd for the first time in weeks, I didn't feel like running.\n\ndie Schwester sister feminine\n\ndie Pension guesthouse feminine\n\nder Mut courage masculine (review)\n\ndie Vergangenheit past feminine (review)\n\ndie Gegenwart present feminine\n\ndie Zukunft future feminine (review)\n\nverzeihen to forgive verb (+ dative, review)\n\nvertrauen to trust verb (+ dative, review)\n\nbleiben to stay verb (review)\n\nankommen to arrive separable verb (review)\n\nweggehen to go away separable verb (implied)\n\ndie Erinnerung memory feminine\n\ndie Hoffnung hope feminine\n\nder Frieden peace masculine\n\ndie Versöhnung reconciliation feminine\n\nehrlich honest adjective (review)\n\ngeduldig patient adjective\n\nhoffnungsvoll hopeful adjective\n\nFrom this chapter: \"I remember those\" → Ich erinnere mich daran. (sich erinnern an)\n\nMany reflexive verbs in German are paired with specific prepositions. The preposition determines the case (usually accusative).\n\nCommon reflexive verb + preposition combinations:\n\nVerb Preposition Case Example\n\nsich erinne
